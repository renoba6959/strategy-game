  var labels = [['INF','歩兵'],['UV','非装車'],['AV','装車'],['US','非装艦'],['AS','装艦'],['HE','ヘリ'],['AC','航空'],['SUB','対潜']];
  var html = '';
  // 凡例
  html += '<div style="font-size:11px; margin-bottom:10px; padding:8px 12px; background:#f5f4f0; border-radius:4px;">';
  html += '<b>色分け:</b> ';
  html += '<span style="color:#222; margin-right:12px;">■ 確定</span>';
  html += '<span style="color:#BA7517; margin-right:12px;">■ 仮値(要調整)</span>';
  html += '<span style="color:#185FA5;">■ 未実装(案)</span>';
  html += '</div>';

  // テーブルレンダリング関数 (1サブグループ分)
  function renderTable(unitKeys, sectionLabel){
    if(unitKeys.length === 0) return '';
    var h = '';
    if(sectionLabel){
      h += '<div style="font-weight:600; font-size:13px; margin:10px 0 4px 0; color:#444; padding-left:4px; border-left:3px solid #BA7517;">' + sectionLabel + '</div>';
    }
    h += '<div style="overflow-x:auto;"><table style="border-collapse:collapse; font-size:11px; width:100%; min-width:700px;">';
    h += '<thead><tr style="background:#e8e5dd;">';
    h += '<th style="text-align:left; padding:5px 6px; min-width:100px;">ユニット</th>';
    h += '<th style="padding:5px 4px;">分類</th>';
    h += '<th style="padding:5px 4px;">装甲</th>';
    h += '<th style="padding:5px 4px;">移動</th>';
    h += '<th style="padding:5px 4px;">視界</th>';
    h += '<th style="padding:5px 4px;">燃料</th>';
    h += '<th style="text-align:left; padding:5px 6px; min-width:70px;">武器</th>';
    h += '<th style="padding:5px 4px;">射程</th>';
    h += '<th style="padding:5px 4px;">弾</th>';
    h += '<th style="padding:5px 4px;">種別</th>';
    for(var l=0; l<labels.length; l++){
      h += '<th style="padding:5px 4px; min-width:32px;">' + labels[l][1] + '</th>';
    }
    h += '<th style="padding:5px 4px; min-width:32px; background:#FFE4C4;">対施設</th>';
    h += '</tr></thead><tbody>';
    for(var i=0; i<unitKeys.length; i++){
      var key = unitKeys[i];
      var t = TYPE[key];
      if(!t) continue;
      var isPlanned = t.planned;
      var weaponCount = Math.max(1, t.weapons.length);
      var armorColor = getStatusColor(key, 'armor');
      var moveColor = getStatusColor(key, 'move');
      var sightColor = getStatusColor(key, 'sight');
      var rowBg = isPlanned ? '#f4f6fa' : ((i % 2 === 0) ? '#f9f7f0' : '#fff');
      var nameColor = isPlanned ? '#185FA5' : '#222';
      // 装甲バッジ (装甲クラス AV のみ表示)
      var armorBadge = '';
      if(t.armorClass === 'AV' || t.armorClass === 'AS'){
        armorBadge = ' <span style="display:inline-block; font-size:9px; background:#7E6F5C; color:#fff; padding:1px 5px; border-radius:7px; vertical-align:middle; margin-left:2px;">装甲</span>';
      }

      if(t.weapons.length === 0){
        h += '<tr style="border-bottom:1px solid #e0e0e0; background:' + rowBg + ';">';
        h += '<td style="padding:6px; vertical-align:middle; border-right:1px solid #e0e0e0;">';
        h += '<div style="display:flex; align-items:center; gap:5px;">';
        h += '<span style="display:inline-block;width:18px;height:18px;color:#444;flex-shrink:0;">' + (ICONS[key] || '') + '</span>';
        h += '<b style="font-size:11px;color:' + nameColor + ';">' + t.name + '</b>';
        if(t.price !== undefined && t.prodTurns !== undefined){
          h += ' <span style="font-size:10px;color:#888;">' + t.price + '/' + t.prodTurns + 'T</span>';
        }
        h += armorBadge + '</div>';
        if(t.note) h += '<div style="font-size:10px;color:#888;padding-left:24px;">' + t.note + '</div>';
        h += '</td>';
        h += '<td style="padding:6px 4px; text-align:center; vertical-align:middle; font-size:10px;">' + ARMOR_LABELS[t.armorClass] + '</td>';
        h += '<td style="padding:6px 4px; text-align:center; vertical-align:middle; color:' + armorColor + ';">' + t.armor + '</td>';
        h += '<td style="padding:6px 4px; text-align:center; vertical-align:middle; color:' + moveColor + ';">' + t.move + '</td>';
        h += '<td style="padding:6px 4px; text-align:center; vertical-align:middle; color:' + sightColor + ';">' + (t.sight || 2) + '</td>';
        h += '<td style="padding:6px 4px; text-align:center; vertical-align:middle;">' + (t.fuelMax || '−') + '</td>';
        // 武装なし: 各セルを「-」で埋める (武器名・射程・弾・種別・8カテゴリ = 11セル)
        var dashStyle = 'padding:5px 4px; text-align:center; color:#ccc;';
        h += '<td style="' + dashStyle + '">−</td>'; // 武器名
        h += '<td style="' + dashStyle + '">−</td>'; // 射程
        h += '<td style="' + dashStyle + '">−</td>'; // 弾数
        h += '<td style="' + dashStyle + '">−</td>'; // 種別
        for(var dl=0; dl<8; dl++){
          h += '<td style="' + dashStyle + '">−</td>'; // 8カテゴリ
        }
        h += '<td style="' + dashStyle + '">−</td>'; // 対施設
        h += '</tr>';
        continue;
      }

      for(var j=0; j<t.weapons.length; j++){
        var w = t.weapons[j];
        var r = w.range[0]===w.range[1] ? w.range[0] : w.range[0]+'-'+w.range[1];
        var tp = w.indirect ? '間接' : '直接';
        var typeColor = w.indirect ? '#A32D2D' : '#0F6E56';
        if(isPlanned) typeColor = '#185FA5';
        h += '<tr style="border-bottom:1px solid #e0e0e0; background:' + rowBg + ';">';
        if(j === 0){
          h += '<td rowspan="' + weaponCount + '" style="padding:6px; vertical-align:middle; border-right:1px solid #e0e0e0;">';
          h += '<div style="display:flex; align-items:center; gap:5px;">';
          h += '<span style="display:inline-block;width:18px;height:18px;color:#444;flex-shrink:0;">' + (ICONS[key] || '') + '</span>';
          h += '<b style="font-size:11px;color:' + nameColor + ';">' + t.name + '</b>';
          if(t.price !== undefined && t.prodTurns !== undefined){
            h += ' <span style="font-size:10px;color:#888;">' + t.price + '/' + t.prodTurns + 'T</span>';
          }
          h += armorBadge + '</div>';
          if(t.note) h += '<div style="font-size:10px;color:#888;padding-left:24px;">' + t.note + '</div>';
          h += '</td>';
          h += '<td rowspan="' + weaponCount + '" style="padding:6px 4px; text-align:center; vertical-align:middle; font-size:10px;">' + ARMOR_LABELS[t.armorClass] + '</td>';
          h += '<td rowspan="' + weaponCount + '" style="padding:6px 4px; text-align:center; vertical-align:middle; color:' + armorColor + '; font-weight:500;">' + t.armor + '</td>';
          h += '<td rowspan="' + weaponCount + '" style="padding:6px 4px; text-align:center; vertical-align:middle; color:' + moveColor + '; font-weight:500;">' + t.move + '</td>';
          h += '<td rowspan="' + weaponCount + '" style="padding:6px 4px; text-align:center; vertical-align:middle; color:' + sightColor + '; font-weight:500;">' + (t.sight || 2) + '</td>';
          h += '<td rowspan="' + weaponCount + '" style="padding:6px 4px; text-align:center; vertical-align:middle; font-weight:500;">' + (t.fuelMax || '−') + '</td>';
        }
        h += '<td style="padding:5px 6px; font-weight:500; color:' + (isPlanned ? '#185FA5' : '#222') + ';">' + w.name + '</td>';
        h += '<td style="padding:5px 4px; text-align:center;">' + r + '</td>';
        // 弾数セル
        var ammoCellStr;
        if(w.infiniteAmmo) ammoCellStr = '<span style="color:#888;">∞</span>';
        else if(w.ammo !== undefined) ammoCellStr = w.ammo;
        else ammoCellStr = '−';
        h += '<td style="padding:5px 4px; text-align:center;">' + ammoCellStr + '</td>';
        h += '<td style="padding:5px 4px; text-align:center; color:' + typeColor + ';">' + tp + '</td>';
        for(var l=0; l<labels.length; l++){
          var v = w.atk[labels[l][0]] || 0;
          var atkColor = getStatusColor(key, 'atk', j, labels[l][0]);
          var bg = '';
          if(v >= 10) bg = 'background:#ffd5a8;';
          else if(v >= 7) bg = 'background:#ffe8c8;';
          else if(v >= 4) bg = 'background:#fff5e0;';
          h += '<td style="padding:5px 4px; text-align:center; ' + bg + '">' + (v > 0 ? '<b style="color:' + atkColor + ';">' + v + '</b>' : '<span style="color:#ccc;">−</span>') + '</td>';
        }
        // 対施設セル
        var vf = w.vsFacility || 0;
        var vfBg = '';
        if(vf >= 12) vfBg = 'background:#ffd5a8;';
        else if(vf >= 8) vfBg = 'background:#ffe8c8;';
        else if(vf > 0) vfBg = 'background:#fff5e0;';
        h += '<td style="padding:5px 4px; text-align:center; ' + vfBg + '">' + (vf > 0 ? '<b>' + vf + '</b>' : '<span style="color:#ccc;">−</span>') + '</td>';
        h += '</tr>';
      }
    }
    h += '</tbody></table></div>';
    return h;
  }

  // 陸: サブグループ別に表示
  html += '<div style="margin-bottom:20px;">';
  html += '<div style="font-weight:600; font-size:14px; margin-bottom:6px;">陸</div>';
  for(var sg=0; sg<landSubGroups.length; sg++){
    var sub = landSubGroups[sg];
    var subKeys = [];
    for(var i=0; i<groups['陸'].length; i++){
      var key = groups['陸'][i];
      var t = TYPE[key];
      if(t && sub.filter(t)) subKeys.push(key);
    }
    html += renderTable(subKeys, sub.label);
  }
  html += '</div>';

  // 海: サブグループ別に表示
  html += '<div style="margin-bottom:20px;">';
  html += '<div style="font-weight:600; font-size:14px; margin-bottom:6px;">海</div>';
  for(var sg=0; sg<seaSubGroups.length; sg++){
    var sub = seaSubGroups[sg];
    var subKeys = sub.keys.filter(function(k){ return TYPE[k]; });
    html += renderTable(subKeys, sub.label);
  }
  html += '</div>';

  // 空: サブグループ別に表示
  html += '<div style="margin-bottom:20px;">';
  html += '<div style="font-weight:600; font-size:14px; margin-bottom:6px;">空</div>';
  for(var sg=0; sg<airSubGroups.length; sg++){
    var sub = airSubGroups[sg];
    var subKeys = sub.keys.filter(function(k){ return TYPE[k]; });
    html += renderTable(subKeys, sub.label);
  }
  html += '</div>';

  html += '<div style="font-size:11px; color:#888; margin-top:8px; line-height:1.5;">表中の数値は基礎火力。実効火力 = round(基礎 × 現在HP/100)。<br>「種別」の<span style="color:#A32D2D;">間接</span>は移動後攻撃不可。<span style="color:#0F6E56;">直接</span>は移動後も攻撃可。<b>反撃は射程内なら直接・間接どちらでも発生</b>(被攻撃側に射程内の有効武器があれば反撃)。</div>';
  return html;
}

var currentTab = 'units';
function showTab(tab){
  currentTab = tab;
  var btns = document.querySelectorAll('.tab-btn');
  for(var i=0; i<btns.length; i++){
    var b = btns[i];
    var active = b.dataset.tab === tab;
    b.style.borderBottomColor = active ? '#185FA5' : 'transparent';
    b.style.color = active ? '#185FA5' : 'inherit';
    b.style.fontWeight = active ? '600' : 'normal';
  }
  var body = document.getElementById('modal-body');
  if(tab === 'units') body.innerHTML = renderUnitsTab();
  else if(tab === 'terrain') body.innerHTML = renderTerrainTab();
  else if(tab === 'facilities') body.innerHTML = renderFacilitiesTab();
  else if(tab === 'supply') body.innerHTML = renderSupplyTab();
  else if(tab === 'rules') body.innerHTML = renderRulesTab();
  else if(tab === 'ai') body.innerHTML = renderAITab();
  else if(tab === 'todo') body.innerHTML = renderTodoTab();
}
function openSpec(){ document.getElementById('modal-overlay').style.display = 'flex'; showTab(currentTab); }

// 生産メニュー
var prodFacilityX = -1, prodFacilityY = -1;

function openProductionMenu(x, y, focus){
  prodFacilityX = x;
  prodFacilityY = y;
  var ter = TER[M[y][x]];
  var capObj = captures[x+','+y];
  // アップグレード中はスロット使用不可
  var slots = (capObj && capObj.upgrading) ? 0 : (ter.slots || 0);
  // 既存の生産中ユニット数を確認
  var ongoing = 0;
  for(var i=0; i<production.length; i++){
    if(production[i].x === x && production[i].y === y) ongoing++;
  }
  // 収容中のユニット数
  var stored = (capObj && capObj.cargo) ? capObj.cargo.length : 0;
  var used = ongoing + stored;
  var available = slots - used;

  document.getElementById('prod-title').textContent = ter.name + ' (スロット ' + used + '/' + slots + ')';
  var body = document.getElementById('prod-body');
  var html = '';
  html += '<div style="font-size:12px; color:#666; margin-bottom:8px;">資金: <b style="color:#185FA5;">' + funds.P.toLocaleString() + 'G</b></div>';
  // 備蓄 (段階2)
  if(capObj){
    var pmSt = facilityStock(capObj, M[y][x]);
    if(pmSt.spec){
      html += '<div style="font-size:12px; color:#666; margin-bottom:8px;">📦 備蓄: 燃料 <b>' + pmSt.fuel + '/' + pmSt.spec.fuelMax + '</b> ・ 弾薬 <b>' + pmSt.ammo + '/' + pmSt.spec.ammoMax + '</b>'
        + ((pmSt.spec.fuelGain > 0 || pmSt.spec.ammoGain > 0)
            ? ' <span style="color:#0F6E56;">(毎ターン +' + pmSt.spec.fuelGain + '/+' + pmSt.spec.ammoGain + ')</span>'
            : ' <span style="color:#888;">(この施設では生産しません)</span>')
        + '</div>';
    }
  }

  // 生産中・完成済みのリスト
  if(ongoing > 0){
    html += '<div style="font-size:12px; font-weight:600; margin:10px 0 4px;">生産中 / 完成待ち</div>';
    for(var i=0; i<production.length; i++){
      var p = production[i];
      if(p.x !== x || p.y !== y || p.owner !== 'P') continue;
      var t = TYPE[p.type];
      html += '<div style="display:flex; align-items:center; gap:8px; padding:6px 10px; background:#f5f4f0; border-radius:4px; margin-bottom:4px;">';
      html += '<span style="display:inline-block; width:18px; height:18px;">'+ICONS[p.type]+'</span>';
      html += '<span style="flex:1;">'+t.name+'</span>';
      if(p.ready){
        html += '<span style="color:#0F6E56; font-weight:600;">完成</span>';
        html += '<button onclick="takeOutProduction('+i+')" style="font-size:11px;">取り出す</button>';
      } else {

      // 旧仕様 storedTurn は文字なので、roundNumber === turn の比較は事実上常に false
      var sameRound = false;
      if(typeof cg.storedRound === 'number'){
        sameRound = (cg.storedRound === roundNumber);
      } else if(cg.storedTurn !== undefined){
        // 旧仕様の救済: storedTurn が記録されているなら 1 ラウンドだけ待たせて済ませる

        sameRound = (cg.storedTurn === turn);

  // 生産可能ユニット一覧
  if(ter.slots){

      html += '<div style="font-size:12px; font-weight:600; margin:10px 0 4px;">生産可能(空き'+available+')</div>';
      html += '<div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:4px;">';

  var bonus = (ter && ter.prodTurnBonus) ? ter.prodTurnBonus : 0;
  var turns = Math.max(1, t.prodTurns + bonus);
  // 空きスロット判定 (openProductionMenu と同じ計算)
  var slots = (capObj && capObj.upgrading) ? 0 : (ter.slots || 0);
  var ongoing = 0;
  for(var i=0; i<production.length; i++){
    if(production[i].x === prodFacilityX && production[i].y === prodFacilityY) ongoing++;
  }
  var stored = (capObj && capObj.cargo) ? capObj.cargo.length : 0;
  var available = slots - (ongoing + stored);

  // 生産できない理由 (あれば)
  var reason = null;
  if(capObj && capObj.upgrading) reason = 'アップグレード中は生産できません';
  else if(available <= 0) reason = 'スロットに空きがありません';
  else if(funds.P < t.price) reason = '資金が足りません (不足 ' + (t.price - funds.P).toLocaleString() + 'G)';

  var html = '';
  html += '<button onclick="openProductionMenu('+prodFacilityX+','+prodFacilityY+')" style="font-size:11px; margin-bottom:10px;">← 一覧に戻る</button>';

  // 見出し (名前・価格・製造ターン)
  html += '<div style="display:flex; align-items:center; gap:10px; padding:10px 12px; background:#f5f4f0; border-radius:4px;">';
  html += '<span style="display:inline-block; width:28px; height:28px; flex-shrink:0;">'+(ICONS[unitType]||'')+'</span>';
  html += '<div style="flex:1; line-height:1.4;">';
  html += '<div style="font-size:15px; font-weight:600;">'+t.name+'</div>';
  html += '<div style="font-size:11px; color:#666;">'+t.price.toLocaleString()+'G / '+turns+'ターン';
  if(bonus < 0) html += ' <span style="color:#0F6E56;">(施設ボーナス '+bonus+'ターン)</span>';
  html += '</div></div></div>';

  // 基本性能
  html += '<div style="margin-top:10px; font-size:12px; line-height:1.7;">';
  html += '<div>分類: <b>'+(ARMOR_LABELS[t.armorClass]||t.armorClass)+'</b> ・ '+catName(t.cat)+'</div>';
  html += '<div>移動 <b>'+t.move+'</b> ・ 視界 <b>'+(t.sight||2)+'</b> ・ 装甲 <b>'+(t.armor||0)+'</b> ・ 燃料 <b>'+(t.fuelMax||99)+'</b></div>';
  // 特性
  var traits = [];
  if(t.canCapture) traits.push('拠点を占領できる');
  if(t.canSubmerge) traits.push('潜航できる');
  if(t.canStealth) traits.push('ステルスあり');
  if(t.quickDeploy) traits.push('降車後すぐ行動できる');
  if(t.isMountainTroop) traits.push('山岳戦に強い');
  if(t.capacity) traits.push('輸送 '+t.capacity+'ユニット');
  if(t.isSupply){
    var sup = [];
    if(typeof t.supplyFuelMax === 'number') sup.push('燃料庫'+t.supplyFuelMax);
    if(typeof t.supplyAmmoMax === 'number') sup.push('弾薬庫'+t.supplyAmmoMax);
    traits.push('補給ユニット'+(sup.length?'('+sup.join('/')+')':''));
  }
  if(t.carrierHeal) traits.push('搭載機を毎ターン+'+t.carrierHeal+'回復');
  if(traits.length) html += '<div>特性: '+traits.join(' ・ ')+'</div>';
  if(t.note) html += '<div style="color:#666; font-size:11px; margin-top:2px;">'+t.note+'</div>';
  html += '</div>';

  // 武器
  if(t.weapons && t.weapons.length > 0){
    html += '<div style="font-size:12px; font-weight:600; margin:12px 0 4px;">武器</div>';
    for(var wi=0; wi<t.weapons.length; wi++){
      var w = t.weapons[wi];
      var rmin = w.range ? w.range[0] : 1, rmax = w.range ? w.range[1] : 1;
      var rangeText = (rmin === rmax) ? ('射程'+rmin) : ('射程'+rmin+'〜'+rmax);
      var ammoText = w.infiniteAmmo ? '弾数無限' : ('弾'+(w.ammo !== undefined ? w.ammo : 6));
      html += '<div style="padding:6px 10px; background:#f5f4f0; border-radius:4px; margin-bottom:4px; font-size:11px; line-height:1.6;">';
      html += '<div><b>'+w.name+'</b> ・ '+rangeText+' ・ '+(w.indirect?'間接':'直接')+' ・ '+ammoText;
      if(w.vsFacility) html += ' ・ 対拠点'+w.vsFacility;
      html += '</div>';
      // 相手の分類ごとの攻撃力 (0 は表示しない)
      var atkParts = [];

  } else {

  // 確定ボタン

  } else {
    html += '<button onclick="startProduction(\''+unitType+'\')" style="padding:8px 14px; font-size:13px; background:#0F6E56; color:white; border:none; border-radius:4px; cursor:pointer;">この兵器を生産 ('+t.price.toLocaleString()+'G)</button>';
  }
  html += '<button onclick="openProductionMenu('+prodFacilityX+','+prodFacilityY+')" style="padding:8px 14px; font-size:13px;">戻る</button>';
  html += '</div>';
  html += '<div style="font-size:11px; color:#666; margin-top:8px;">資金: <b style="color:#185FA5;">'+funds.P.toLocaleString()+'G</b></div>';

  body.innerHTML = html;
  document.getElementById('prod-overlay').style.display = 'flex';
  // 情報パネルの「⬆ アップグレード」から開いたときは、その位置まで送る
  if(focus === 'upgrade'){
    var anchor = document.getElementById('prod-upgrade-anchor');
    if(anchor && anchor.scrollIntoView) anchor.scrollIntoView({ block: 'start' });
  } else {
    body.scrollTop = 0;
  }
}

  document.getElementById('prod-overlay').style.display = 'none';
  prodFacilityX = -1;
  prodFacilityY = -1;
}

function startProduction(unitType){
  var t = TYPE[unitType];
  if(!t || funds.P < t.price) return;
  funds.P -= t.price;
  // 兵器廠など prodTurnBonus を持つ施設は生産ターン-1 (最低1)
  var prodTer = TER[M[prodFacilityY][prodFacilityX]];
  var bonus = (prodTer && prodTer.prodTurnBonus) ? prodTer.prodTurnBonus : 0;
  var actualTurns = Math.max(1, t.prodTurns + bonus);
  if(window.plog) plog('生産開始 ' + (prodTer?prodTer.name:'?') + '@('+prodFacilityX+','+prodFacilityY+') で ' + t.name + ' ('+t.price+'G, '+actualTurns+'T)');
  production.push({
    x: prodFacilityX,
    y: prodFacilityY,
    type: unitType,
    owner: 'P',
    remaining: actualTurns,
    ready: false
  });
  // メニューを更新
  openProductionMenu(prodFacilityX, prodFacilityY);
  render();
}

function startUpgrade(targetTerKey){
  var capObj = captures[prodFacilityX+','+prodFacilityY];
  if(!capObj) return;
  var currentTer = M[prodFacilityY][prodFacilityX];
  var cost = UPGRADE_COST[currentTer] || 0;
  var turns = UPGRADE_TURNS[currentTer] || 3;
  if(funds.P < cost) return;
  // アップグレード中フラグ
  capObj.upgrading = { target: targetTerKey, remaining: turns, cost: cost };
  funds.P -= cost;
  if(window.plog){
    var fromName = TER[currentTer] ? TER[currentTer].name : '?';
    var toName = TER[targetTerKey] ? TER[targetTerKey].name : '?';
    plog('アップグレード ' + fromName + '@('+prodFacilityX+','+prodFacilityY+') → ' + toName + ' ('+cost+'G, '+turns+'T)');
  }
  openProductionMenu(prodFacilityX, prodFacilityY);
  render();
}

function cancelUpgrade(){
  var capObj = captures[prodFacilityX+','+prodFacilityY];
  if(!capObj || !capObj.upgrading) return;
  if(!confirm('アップグレードを中止しますか?(コスト半額返却)')) return;
  funds.P += Math.floor(capObj.upgrading.cost / 2);
  delete capObj.upgrading;
  openProductionMenu(prodFacilityX, prodFacilityY);
  render();
}

function cancelProduction(idx){
  if(!confirm('生産を中止しますか?(資金は半額返却)')) return;
  var p = production[idx];
  if(!p) return;
  var t = TYPE[p.type];
  funds.P += Math.floor(t.price / 2);
  production.splice(idx, 1);
  openProductionMenu(prodFacilityX, prodFacilityY);
  render();
}

function takeOutProduction(idx){
  var p = production[idx];
  if(!p || !p.ready) return;
  var spawnX = p.x, spawnY = p.y;
  var occupier = unitAt(p.x, p.y);
  if(occupier){
    // 敵が乗っている → 取り出せない
    if(!isAlly(occupier.owner, p.owner)){
      alert('施設マスに敵ユニットがいます。撃破してから取り出してください。');
      return;
    }
    // 自軍ユニットが乗っている → 仮ユニットの移動範囲から空きマスを探して展開
    var tmpUnit = makeUnit(p.type, p.owner, p.x, p.y);
    tmpUnit.id = -1;
    var spawnMovable = computeMovable(tmpUnit);
    var bestSpawn = null, bestSpawnD = Infinity;
    for(var smk in spawnMovable){
      var smxy = smk.split(',');
      var smx = parseInt(smxy[0]), smy = parseInt(smxy[1]);
      if(smx === p.x && smy === p.y) continue;
      if(unitAt(smx, smy)) continue;
      var sd = manhattan(smx, smy, p.x, p.y);
      if(sd < bestSpawnD){ bestSpawnD = sd; bestSpawn = { x: smx, y: smy }; }
    }
    if(!bestSpawn){
      alert('展開できる空きマスがありません。先に周囲のユニットを動かしてください。');
      return;
    }
    spawnX = bestSpawn.x; spawnY = bestSpawn.y;
  }
  // 新ユニットとして配置 (取り出した時点で動ける)
  var newU = makeUnit(p.type, p.owner, spawnX, spawnY);
  newU.acted = false;
  newU.moved = false;
  units.push(newU);
  production.splice(idx, 1);
  openProductionMenu(prodFacilityX, prodFacilityY);
  render();
  updateInfoPanel();
}

function takeOutFromFacility(idx){
  var capObj = captures[prodFacilityX+','+prodFacilityY];
  if(!capObj || !capObj.cargo) return;
  var cg = capObj.cargo[idx];
  if(!cg) return;
  // 格納された当ラウンド中は取り出せない (修理に時間がかかる)
  var sameRound = false;
  if(typeof cg.storedRound === 'number'){
    sameRound = (cg.storedRound === roundNumber);
  } else if(cg.storedTurn !== undefined){
    sameRound = (cg.storedTurn === turn);
  }
  if(sameRound){
    alert('このラウンドに収容されたユニットは取り出せません。次のラウンドまでお待ちください。');
    return;
  }
  // 施設マスにユニットがいれば不可
  if(unitAt(prodFacilityX, prodFacilityY)){
    alert('施設マスに既にユニットがいます。先に動かしてください。');
    return;
  }
  // 新ユニットとして配置(HP保持、取り出した時点で動ける)
  var newU = makeUnit(cg.type, cg.owner, prodFacilityX, prodFacilityY);
  newU.hp = cg.hp;
  newU.acted = false;
  newU.moved = false;
  // 段階2: 取り出し時の燃料・弾薬の補給は施設の備蓄から払う
  payTakeOutSupply(newU, cg, prodFacilityX, prodFacilityY);
  if(cg.cargo && cg.cargo.length > 0) newU.cargo = cg.cargo.slice();
  units.push(newU);
  capObj.cargo.splice(idx, 1);
  openProductionMenu(prodFacilityX, prodFacilityY);
  render();
  updateInfoPanel();
}

  W: 14, H: 9,
  cells: [],          // [y][x] = 'PLAIN' など
  weather: [],        // [y][x] = 'CLOUD' | 'RAIN' | null (天候オーバーレイ)
  units: [],          // {type, owner, x, y}
  caps: {},           // 'x,y': 'P' | 'E' | 'N'
  name: '無題のマップ',
  desc: '',
  tool: 'terrain',    // 'terrain' | 'unit' | 'erase' | 'bucket' | 'rect' | 'weather'
  selectedTerrain: 'PLAIN',
  selectedUnit: 'INFANTRY',
  selectedOwner: 'P',
  selectedCapOwner: 'N',
  selectedWeather: 'CLOUD', // 'CLOUD' | 'RAIN' | null (null=消去)
  isDrawing: false,
  // 矩形塗り用
  rectStart: null,
  rectEnd: null,
  // Undo/Redo 履歴
  history: [],
  historyIdx: -1,
  // ステージ設定
  fow: false,
  dayNightCycle: false,
  dayLength: 2,
  startPhase: 'day', // 'day' or 'night'
  weatherDrift: 'random', // 'random' | 'wind'
  windDirection: 'east',  // 'east' | 'west' | 'north' | 'south' (wind モード時の初期風向き)
  windStrength: 1,        // 0-3 (wind モード時の初期風量)
  // 陣営チーム設定 (null = デフォルト・全陣営独立)
  // 値が設定されている場合 { P:'A', E:'B', C:'B', D:'B' } のように各陣営にチームを割り当て
  teams: null
};

// 現在の状態のスナップショットを履歴に追加
function edSnapshot(){
  var snap = {
    cells: ed.cells.map(function(row){ return row.slice(); }),
    weather: ed.weather.map(function(row){ return row.slice(); }),
    units: ed.units.map(function(u){ return { type:u.type, owner:u.owner, x:u.x, y:u.y }; }),
    caps: JSON.parse(JSON.stringify(ed.caps))
  };
  // 現在位置より先の履歴を捨てる (Redo無効化)
  ed.history = ed.history.slice(0, ed.historyIdx + 1);
  ed.history.push(snap);
  // 30件超えたら古いのを捨てる
  if(ed.history.length > 30){
    ed.history.shift();
  } else {
    ed.historyIdx++;
  }
  edUpdateUndoButtons();
}

// 履歴から復元
function edRestore(snap){
  ed.cells = snap.cells.map(function(row){ return row.slice(); });
  ed.weather = (snap.weather || []).map(function(row){ return row.slice(); });
  // weather が無いスナップショットや、cells とサイズが合わないケースで補正
  while(ed.weather.length < ed.H){
    var row = [];
    for(var x=0; x<ed.W; x++) row.push(null);
    ed.weather.push(row);
  }
  for(var y=0; y<ed.weather.length; y++){
    while(ed.weather[y].length < ed.W) ed.weather[y].push(null);
  }
  ed.units = snap.units.map(function(u){ return { type:u.type, owner:u.owner, x:u.x, y:u.y }; });
  ed.caps = JSON.parse(JSON.stringify(snap.caps));
  edRenderBoard();
}

function edUndo(){
  if(ed.historyIdx <= 0) return;
  ed.historyIdx--;
  edRestore(ed.history[ed.historyIdx]);
  edUpdateUndoButtons();
}

function edRedo(){
  if(ed.historyIdx >= ed.history.length - 1) return;
  ed.historyIdx++;
  edRestore(ed.history[ed.historyIdx]);
  edUpdateUndoButtons();
}

function edUpdateUndoButtons(){
  var ub = document.getElementById('ed-undo');
  var rb = document.getElementById('ed-redo');
  if(ub) ub.disabled = ed.historyIdx <= 0;
  if(rb) rb.disabled = ed.historyIdx >= ed.history.length - 1;
}

// 履歴を完全リセット (新規作成時など)
function edHistoryReset(){
  ed.history = [];
  ed.historyIdx = -1;
  edSnapshot();
}


function edInit(){
  ed.W = parseInt(document.getElementById('ed-w').value) || 14;
  ed.H = parseInt(document.getElementById('ed-h').value) || 9;

    ed.cells.push(row);
    ed.weather.push(wRow);
  }
  ed.units = [];
  ed.caps = {};
  ed.name = '無題のマップ';
  ed.desc = '';
  ed.fow = false;
  ed.dayNightCycle = false;
  ed.dayLength = 2;
  ed.startPhase = 'day';
  ed.weatherDrift = 'random';
  ed.windDirection = 'east';

function edResize(){
  var w = parseInt(document.getElementById('ed-w').value) || 14;
  var h = parseInt(document.getElementById('ed-h').value) || 9;
  if(w<5) w=5; if(w>25) w=25;
  if(h<5) h=5; if(h>20) h=20;
  // 既存セルを保持しつつリサイズ
  var newCells = [];
  var newWeather = [];
  for(var y=0; y<h; y++){
    var row = [];
    var wRow = [];
    for(var x=0; x<w; x++){
      row.push((ed.cells[y] && ed.cells[y][x]) || 'PLAIN');
      wRow.push((ed.weather[y] && ed.weather[y][x]) || null);
    }
    newCells.push(row);
    newWeather.push(wRow);
  }
  ed.cells = newCells;
  ed.weather = newWeather;
  ed.W = w; ed.H = h;
  // 範囲外のユニット・拠点を除外
  ed.units = ed.units.filter(function(u){ return u.x < w && u.y < h; });
  var newCaps = {};
  for(var k in ed.caps){
    var xy = k.split(',');
    var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
    if(cx < w && cy < h && ed.cells[cy][cx]){
      var t = ed.cells[cy][cx];
      if(t === 'CITY' || t === 'FACTORY' || t === 'AIRPORT' || t === 'PORT'){
        newCaps[k] = ed.caps[k];
      }
    }
  }
  ed.caps = newCaps;
  edRenderBoard();
}

function edRenderBoard(){
  var board = document.getElementById('ed-board');
  board.style.gridTemplateColumns = 'repeat(' + ed.W + ', 36px)';
  board.style.gridTemplateRows = 'repeat(' + ed.H + ', 36px)';
  board.innerHTML = '';
  for(var y=0; y<ed.H; y++){
    for(var x=0; x<ed.W; x++){
      var cell = document.createElement('div');
      var t = ed.cells[y][x];
      var ter = TER[t] || TER.PLAIN;
      cell.style.cssText = 'width:36px;height:36px;background:'+ter.color+';position:relative;cursor:crosshair;box-sizing:border-box;border:0.5px solid #aaa;';
      // 地形デコ
      if(t === 'ROAD') cell.innerHTML += edRoadSVG(x, y);
      else if(TER[t] && TER[t].isRail) cell.innerHTML += edRailSVG(x, y);
      else if(TERRAIN_DECO[t]) cell.innerHTML += TERRAIN_DECO[t];
      // 天候オーバーレイ
      var wkey = ed.weather[y] && ed.weather[y][x];
      if(wkey && WEATHER_DECO[wkey]) cell.innerHTML += WEATHER_DECO[wkey];
      // 拠点バッジ
      var capKey = x+','+y;
      if(ed.caps[capKey] && ed.caps[capKey] !== 'N'){
        var col = FACTION_COLORS[ed.caps[capKey]] || '#888';
        cell.innerHTML += '<div style="position:absolute;top:1px;left:1px;width:7px;height:9px;background:'+col+';border-radius:1px;"></div>';
      }
      // ユニット
      var u = edUnitAt(x, y);
      if(u){
        var col = FACTION_COLORS[u.owner] || '#A32D2D';
        var bgC = FACTION_BG_COLORS[u.owner] || '#FCEBEB';
        cell.innerHTML += '<div style="position:absolute;left:4px;top:4px;width:28px;height:28px;background:'+bgC+';border:1.5px solid '+col+';border-radius:5px;display:flex;align-items:center;justify-content:center;color:'+col+';"><div style="width:22px;height:22px;">'+ICONS[u.type]+'</div></div>';
      }
      // 矩形プレビュー (ドラッグ中)
      if(ed.tool === 'rect' && ed.rectStart && ed.rectEnd){
        var minX = Math.min(ed.rectStart.x, ed.rectEnd.x);
        var maxX = Math.max(ed.rectStart.x, ed.rectEnd.x);
        var minY = Math.min(ed.rectStart.y, ed.rectEnd.y);
        var maxY = Math.max(ed.rectStart.y, ed.rectEnd.y);
        if(x >= minX && x <= maxX && y >= minY && y <= maxY){
          cell.innerHTML += '<div style="position:absolute;inset:0;background:rgba(255,200,80,0.45);border:1.5px solid #BA7517;pointer-events:none;"></div>';
        }
      }
      (function(xx, yy){
        cell.addEventListener('mousedown', function(e){
          if(ed.tool === 'bucket'){
            edApplyTool(xx, yy);
            edSnapshot();
          } else if(ed.tool === 'rect'){
            ed.rectStart = { x: xx, y: yy };
            ed.rectEnd = { x: xx, y: yy };
            ed.isDrawing = true;
            edRenderBoard();
          } else {
            ed.isDrawing = true;
            edApplyTool(xx, yy);
          }
          e.preventDefault();
        });
        cell.addEventListener('mouseenter', function(){
          if(ed.tool === 'rect' && ed.isDrawing){
            ed.rectEnd = { x: xx, y: yy };
            edRenderBoard();
          } else if(ed.isDrawing && ed.tool !== 'bucket' && ed.tool !== 'rect'){
            edApplyTool(xx, yy);
          }
        });
      })(x, y);
      board.appendChild(cell);
    }
  }
}

document.addEventListener('mouseup', function(){
  if(!ed.isDrawing) return;
  if(ed.tool === 'rect' && ed.rectStart && ed.rectEnd){
    edApplyRect(ed.rectStart.x, ed.rectStart.y, ed.rectEnd.x, ed.rectEnd.y);
    ed.rectStart = null;
    ed.rectEnd = null;
    edSnapshot();
  } else if(ed.tool === 'terrain' || ed.tool === 'unit' || ed.tool === 'erase'){
    // 通常ドラッグ系: 履歴に1スナップショット
    edSnapshot();
  }
  ed.isDrawing = false;
});

// エディタ盤面の線路描画 (ed.map を見る点だけ本編の railSVG と違う)
// エディタ盤面の線路描画 (ed.cells を見る点だけ本編と違う)
function edRailSVG(x, y){
  function isRailish(tx, ty){
    if(tx < 0 || tx >= ed.W || ty < 0 || ty >= ed.H) return false;
    var t = TER[ed.cells[ty][tx]];
    return !!(t && (t.isRail || t.slots || t.group === 'city' || t.group === 'capital'));
  }
  var tk = TER[ed.cells[y][x]] || {};
  return railTilesSVG(isRailish(x, y-1), isRailish(x, y+1), isRailish(x+1, y), isRailish(x-1, y),
                      (ed.cells[y][x] === 'RAIL_BRIDGE' || ed.cells[y][x] === 'RAIL_BRIDGE_RUINED' || !!tk.isSeaRail),
                      !!tk.isRailRuined, !!tk.isSeaRail, !!tk.isDrawBridge);
}

function edRoadSVG(x, y){
  function ok(tx, ty){
    if(tx<0||tx>=ed.W||ty<0||ty>=ed.H) return false;
    var t = ed.cells[ty][tx];
    return !!ROAD_CONNECT_TILES[t];
  }
  var n=ok(x,y-1), s=ok(x,y+1), e=ok(x+1,y), w=ok(x-1,y);
  var parts = ['<rect x="11" y="11" width="10" height="10" fill="#6e6354" opacity="0.85"/>'];
  if(n) parts.push('<rect x="11" y="0" width="10" height="11" fill="#6e6354" opacity="0.85"/>');
  if(s) parts.push('<rect x="11" y="21" width="10" height="11" fill="#6e6354" opacity="0.85"/>');
  if(e) parts.push('<rect x="21" y="11" width="11" height="10" fill="#6e6354" opacity="0.85"/>');
  if(w) parts.push('<rect x="0" y="11" width="11" height="10" fill="#6e6354" opacity="0.85"/>');
  if(!n&&!s&&!e&&!w){
    parts.push('<line x1="13" y1="16" x2="19" y2="16" stroke="#e8d8a0" stroke-width="0.8"/>');
    parts.push('<line x1="16" y1="13" x2="16" y2="19" stroke="#e8d8a0" stroke-width="0.8"/>');
  }
  return '<svg viewBox="0 0 32 32" width="100%" height="100%" style="position:absolute;inset:0;pointer-events:none;">'+parts.join('')+'</svg>';
}

function edUnitAt(x, y){
  for(var i=0; i<ed.units.length; i++){
    if(ed.units[i].x===x && ed.units[i].y===y) return ed.units[i];
  }
  return null;
}

function edApplyTool(x, y){
  if(ed.tool === 'terrain'){
    ed.cells[y][x] = ed.selectedTerrain;
    // 拠点を塗ったら所有者を設定
    if(TER[ed.selectedTerrain] && TER[ed.selectedTerrain].capturable){
      ed.caps[x+','+y] = ed.selectedCapOwner;
    } else {
      delete ed.caps[x+','+y];
    }
    // 地形が変わったらユニット配置を再検証 (cost が無限なら除去)
    var u = edUnitAt(x, y);
    if(u){
      var c = moveCost(u.type, ed.selectedTerrain);
      if(c === Infinity){
        ed.units = ed.units.filter(function(uu){ return !(uu.x===x && uu.y===y); });
      }
    }
  } else if(ed.tool === 'unit'){
    // 既存ユニットを除去
    ed.units = ed.units.filter(function(u){ return !(u.x===x && u.y===y); });
    // 配置可能か確認
    var t = ed.cells[y][x];
    var c = moveCost(ed.selectedUnit, t);
    if(c !== Infinity){
      ed.units.push({ type: ed.selectedUnit, owner: ed.selectedOwner, x: x, y: y });
    } else {
      document.getElementById('ed-status').textContent = TYPE[ed.selectedUnit].name + 'は'+TER[t].name+'に配置できません';
    }
  } else if(ed.tool === 'weather'){
    // 天候を塗る (selectedWeather が null なら消去)
    if(!ed.weather[y]) ed.weather[y] = [];
    ed.weather[y][x] = ed.selectedWeather;
  } else if(ed.tool === 'erase'){
    // 優先度: ユニット → 天候 → 地形を平地に戻す
    var u = edUnitAt(x, y);
    if(u){
      ed.units = ed.units.filter(function(uu){ return !(uu.x===x && uu.y===y); });
    } else if(ed.weather[y] && ed.weather[y][x]){
      ed.weather[y][x] = null;
    } else {
      ed.cells[y][x] = 'PLAIN';
      delete ed.caps[x+','+y];
    }
  } else if(ed.tool === 'bucket'){
    // バケツ塗り: 4方向 flood fill で同じ地形の連続領域を塗り替え
    var origTer = ed.cells[y][x];
    if(origTer === ed.selectedTerrain) return; // 同じ地形なら何もしない
    var stack = [[x, y]];
    var visited = {};
    while(stack.length > 0){
      var p = stack.pop();
      var px = p[0], py = p[1];
      var key = px+','+py;
      if(visited[key]) continue;
      if(px < 0 || px >= ed.W || py < 0 || py >= ed.H) continue;
      if(ed.cells[py][px] !== origTer) continue;
      visited[key] = true;
      ed.cells[py][px] = ed.selectedTerrain;
      // 拠点処理
      if(TER[ed.selectedTerrain] && TER[ed.selectedTerrain].capturable){
        ed.caps[key] = ed.selectedCapOwner;
      } else {
        delete ed.caps[key];
      }
      // ユニット再検証
      var uu = edUnitAt(px, py);
      if(uu){
        var cc = moveCost(uu.type, ed.selectedTerrain);
        if(cc === Infinity){
          ed.units = ed.units.filter(function(z){ return !(z.x===px && z.y===py); });
        }
      }
      stack.push([px+1, py]);
      stack.push([px-1, py]);
      stack.push([px, py+1]);
      stack.push([px, py-1]);
    }
  }
  edRenderBoard();
}

// ランダムマップ生成: 地形クラスター + 施設左右対称配置
function edRandomGenerate(){
  var W = ed.W, H = ed.H;
  // ステップ1: 全マスをPLAINで初期化
  ed.cells = [];
  for(var y=0; y<H; y++){
    var row = [];
    for(var x=0; x<W; x++) row.push('PLAIN');
    ed.cells.push(row);
  }
  ed.units = [];
  ed.caps = {};

  // ステップ2: 地形クラスター生成 (シード地点から flood fill 風に広げる)
  // 各地形のクラスター数とサイズ
  var clusters = [
    { ter: 'SEA',      count: Math.max(1, Math.floor(W*H/40)), size: 8 },
    { ter: 'MOUNTAIN', count: Math.max(1, Math.floor(W*H/30)), size: 4 },
    { ter: 'FOREST',   count: Math.max(2, Math.floor(W*H/20)), size: 5 },
    { ter: 'RIVER',    count: 1, size: Math.max(W, H) }
  ];
  function placeCluster(ter, size){
    // ランダムなシード位置 (左右対称になるよう、左半分のみシード)
    var sx = Math.floor(Math.random() * Math.ceil(W/2));
    var sy = Math.floor(Math.random() * H);
    var queue = [[sx, sy]];
    var visited = {};
    var placed = 0;
    while(queue.length > 0 && placed < size){
      // ランダムに取り出してクラスターっぽくする
      var idx = Math.floor(Math.random() * Math.min(3, queue.length));
      var p = queue.splice(idx, 1)[0];
      var px = p[0], py = p[1];
      var key = px+','+py;
      if(visited[key]) continue;
      if(px < 0 || px >= W || py < 0 || py >= H) continue;
      visited[key] = true;
      // 既に他のクラスター地形があれば上書きしない (PLAINだけ書き換え)
      if(ed.cells[py][px] === 'PLAIN'){
        ed.cells[py][px] = ter;
        // 左右対称: 反対側のマスも同じ地形に
        var mirrorX = W - 1 - px;
        if(mirrorX !== px && ed.cells[py][mirrorX] === 'PLAIN'){
          ed.cells[py][mirrorX] = ter;
        }
        placed++;
      }
      // 隣接マスを候補に
      queue.push([px+1, py]);
      queue.push([px-1, py]);
      queue.push([px, py+1]);
      queue.push([px, py-1]);
    }
  }
  for(var c=0; c<clusters.length; c++){
    var cl = clusters[c];
    for(var n=0; n<cl.count; n++){
      placeCluster(cl.ter, cl.size + Math.floor(Math.random()*4));
    }
  }

  // ステップ3: 施設を左右対称に配置
  // プレイヤー側 (左半分) に首都1+工場1+空港1+都市2を配置、敵側 (右半分) に対称配置
  function tryPlaceFacility(ter, owner, mirror){
    var attempts = 50;
    while(attempts-- > 0){
      var px, py;
      if(mirror === 'left'){
        px = Math.floor(Math.random() * Math.floor(W/2));
      } else if(mirror === 'right'){
        px = Math.floor(Math.random() * Math.floor(W/2)) + Math.ceil(W/2);
      } else {
        px = Math.floor(Math.random() * W);
      }
      py = Math.floor(Math.random() * H);
      // 既に施設や山・海など特殊地形があれば避ける
      var current = ed.cells[py][px];
      if(current !== 'PLAIN' && current !== 'FOREST') continue;
      // 周囲に既に施設がないか (隣接禁止で密集を防ぐ)
      var conflict = false;
      for(var dy=-1; dy<=1; dy++){
        for(var dx=-1; dx<=1; dx++){
          var nx = px+dx, ny = py+dy;
          if(nx<0||nx>=W||ny<0||ny>=H) continue;
          var t = ed.cells[ny][nx];
          if(t==='CITY'||t==='CAPITAL'||t==='FACTORY'||t==='AIRPORT'||t==='PORT'){
            conflict = true; break;
          }
        }
        if(conflict) break;
      }
      if(conflict) continue;
      // 配置
      ed.cells[py][px] = ter;
      ed.caps[px+','+py] = owner;
      return { x: px, y: py };
    }
    return null;
  }
  // P側 (左) に配置 → 対称に E側 (右) も配置
  var pCapital = tryPlaceFacility('CAPITAL', 'P', 'left');
  if(pCapital){
    var ex = W - 1 - pCapital.x;
    var ey = pCapital.y;
    if(ed.cells[ey][ex] === 'PLAIN' || ed.cells[ey][ex] === 'FOREST'){
      ed.cells[ey][ex] = 'CAPITAL';
      ed.caps[ex+','+ey] = 'E';
    }
  }
  // 工場・空港・都市2を P側に、それぞれ対称に E側に
  var facilities = [['FACTORY', 1], ['AIRPORT', 1], ['CITY', 2]];
  for(var i=0; i<facilities.length; i++){
    var ter = facilities[i][0];
    var num = facilities[i][1];
    for(var k=0; k<num; k++){
      var p = tryPlaceFacility(ter, 'P', 'left');
      if(p){
        var ex = W - 1 - p.x;
        var ey = p.y;
        if(ed.cells[ey][ex] === 'PLAIN' || ed.cells[ey][ex] === 'FOREST'){
          ed.cells[ey][ex] = ter;
          ed.caps[ex+','+ey] = 'E';
        }
      }
    }
  }

  // 履歴リセット
  edHistoryReset();
  edRenderBoard();
  document.getElementById('ed-status').textContent = 'ランダムマップを生成しました';
}

function edApplyRect(x1, y1, x2, y2){
  var minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
  var minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
  for(var y=minY; y<=maxY; y++){
    for(var x=minX; x<=maxX; x++){
      if(x<0||x>=ed.W||y<0||y>=ed.H) continue;
      ed.cells[y][x] = ed.selectedTerrain;
      var key = x+','+y;
      if(TER[ed.selectedTerrain] && TER[ed.selectedTerrain].capturable){
        ed.caps[key] = ed.selectedCapOwner;
      } else {
        delete ed.caps[key];
      }
      var uu = edUnitAt(x, y);
      if(uu){
        var cc = moveCost(uu.type, ed.selectedTerrain);
        if(cc === Infinity){
          ed.units = ed.units.filter(function(z){ return !(z.x===x && z.y===y); });
        }
      }
    }
  }
  edRenderBoard();
}

// エディタのチーム設定 UI をレンダリング
function edRenderTeams(){
  var body = document.getElementById('ed-teams-body');
  if(!body) return;
  // 現在の ed.teams から表示するチーム値を取得 (null なら全部独立)
  var getCur = function(fac){
    if(ed.teams && ed.teams[fac]) return ed.teams[fac];
    return 'T' + fac;
  };
  var teamOptions = ['A', 'B', 'C', 'D'];
  var html = '';
  var facs = ['P', 'E', 'C', 'D'];
  for(var i=0; i<facs.length; i++){
    var fac = facs[i];
    var col = FACTION_COLORS[fac] || '#888';
    var cur = getCur(fac);
    html += '<div style="display:flex; align-items:center; gap:6px; margin-bottom:3px;">';
    html += '<span style="display:inline-block;width:10px;height:10px;background:'+col+';border-radius:2px;"></span>';
    html += '<span style="flex:1;">'+(FACTION_NAMES[fac] || fac)+' ('+fac+')</span>';
    html += '<select id="ed-team-sel-'+fac+'" style="font-size:11px;padding:1px 4px;">';
    for(var ti=0; ti<teamOptions.length; ti++){
      var to = teamOptions[ti];
      var selected = (cur === to) ? ' selected' : '';
      html += '<option value="'+to+'"'+selected+'>チーム '+to+'</option>';
    }
    var indKey = 'T' + fac;
    var indSelected = (cur === indKey) ? ' selected' : '';
    html += '<option value="'+indKey+'"'+indSelected+'>独立</option>';
    html += '</select>';
    html += '</div>';
  }
  body.innerHTML = html;

  for(var i=0; i<facs.length; i++){
    (function(fac){
      var sel = document.getElementById('ed-team-sel-' + fac);
      if(!sel) return;
      sel.onchange = function(){ edApplyTeamsFromUI(); };
    })(facs[i]);
  }
}

// セレクトボックスから ed.teams を更新
function edApplyTeamsFromUI(){
  var facs = ['P', 'E', 'C', 'D'];
  var teams = {};
  var allIndependent = true;
  for(var i=0; i<facs.length; i++){
    var fac = facs[i];
    var sel = document.getElementById('ed-team-sel-' + fac);
    if(!sel) continue;
    teams[fac] = sel.value;
    if(sel.value !== 'T' + fac) allIndependent = false;
  }
  // 全独立なら null にする (シリアライズ時に省略される)
  ed.teams = allIndependent ? null : teams;
}

function edSerialize(){
  // ed の現在状態をJSONシリアライズ可能なオブジェクトに
  // map文字列を構築
  var map = [];
  // CHARS の逆引きを動的に作る (1箇所で管理)
  var charMap = {};
  for(var ch in CHARS) charMap[CHARS[ch]] = ch;
  for(var y=0; y<ed.H; y++){
    var row = '';
    for(var x=0; x<ed.W; x++) row += charMap[ed.cells[y][x]] || '.';
    map.push(row);
  }
  var capOwners = {};
  for(var k in ed.caps){
    if(ed.caps[k] !== 'N') capOwners[k] = ed.caps[k];
  }
  // 陣営別ユニット配列を作成
  var P = ed.units.filter(function(u){ return u.owner==='P'; }).map(function(u){ return [u.type, u.x, u.y]; });
  var E = ed.units.filter(function(u){ return u.owner==='E'; }).map(function(u){ return [u.type, u.x, u.y]; });
  var C = ed.units.filter(function(u){ return u.owner==='C'; }).map(function(u){ return [u.type, u.x, u.y]; });
  var D = ed.units.filter(function(u){ return u.owner==='D'; }).map(function(u){ return [u.type, u.x, u.y]; });
  // 活性陣営の自動判定: 配置済みユニット or 初期所有拠点がある陣営
  var activeFlags = { P:false, E:false, C:false, D:false };
  if(P.length > 0) activeFlags.P = true;
  if(E.length > 0) activeFlags.E = true;
  if(C.length > 0) activeFlags.C = true;
  if(D.length > 0) activeFlags.D = true;
  for(var k in capOwners){
    if(activeFlags[capOwners[k]] !== undefined) activeFlags[capOwners[k]] = true;
  }
  // P と E は最低でも活性扱い (互換のため)
  activeFlags.P = true;
  activeFlags.E = true;
  var factions = [];
  if(activeFlags.P) factions.push('P');
  if(activeFlags.E) factions.push('E');
  if(activeFlags.C) factions.push('C');
  if(activeFlags.D) factions.push('D');
  var data = {
    name: document.getElementById('ed-name').value || '無題',
    desc: document.getElementById('ed-desc').value || '',
    W: ed.W, H: ed.H,
    map: map,
    capOwners: capOwners,
    factions: factions,
    P: P, E: E
  };
  if(C.length > 0 || activeFlags.C) data.C = C;
  if(D.length > 0 || activeFlags.D) data.D = D;
  // ステージ設定 (FoW・昼夜サイクル) を保存
  if(ed.fow) data.fow = true;
  if(ed.dayNightCycle){
    data.dayNightCycle = true;
    data.dayLength = ed.dayLength || 2;
    data.startPhase = ed.startPhase || 'day';
  }
  // 天候 (雲・雨雲) を保存 (空でなければ)
  var hasWeather = false;
  var weatherData = [];
  for(var y=0; y<ed.H; y++){
    var row = '';
    for(var x=0; x<ed.W; x++){
      var w = (ed.weather[y] && ed.weather[y][x]) || null;
      if(w === 'CLOUD'){ row += 'c'; hasWeather = true; }
      else if(w === 'RAIN'){ row += 'r'; hasWeather = true; }
      else row += '.';
    }
    weatherData.push(row);
  }
  if(hasWeather) data.weather = weatherData;
  // 天候の流れ方 (デフォルト random は省略、wind のときのみ保存)
  if(ed.weatherDrift === 'wind'){
    data.weatherDrift = 'wind';
    data.windDirection = ed.windDirection || 'east';
    data.windStrength  = (typeof ed.windStrength === 'number') ? ed.windStrength : 1;
  }
  // チーム設定 (デフォルト独立は省略、設定があれば保存)
  if(ed.teams){
    data.teams = {};
    for(var fac in ed.teams){
      // 独立 (Tx) はデフォルトなので省略
      if(ed.teams[fac] !== 'T' + fac){
        data.teams[fac] = ed.teams[fac];
      }
    }
    // teamsが空ならフィールドごと省略
    if(Object.keys(data.teams).length === 0) delete data.teams;
  }
  return data;
}

function edDeserialize(data){
  ed.W = data.W; ed.H = data.H;
  document.getElementById('ed-w').value = ed.W;
  document.getElementById('ed-h').value = ed.H;
  document.getElementById('ed-name').value = data.name || '';
  document.getElementById('ed-desc').value = data.desc || '';
  ed.cells = [];
  for(var y=0; y<ed.H; y++){
    var row = [];
    var src = data.map[y] || '';
    for(var x=0; x<ed.W; x++){
      row.push(CHARS[src.charAt(x)] || 'PLAIN');
    }
    ed.cells.push(row);
  }
  ed.caps = {};
  for(var k in (data.capOwners||{})) ed.caps[k] = data.capOwners[k];
  // 天候の復元 (data.weather は ['c..r..', '......'] のような文字列配列)
  ed.weather = [];
  for(var y=0; y<ed.H; y++){
    var wRow = [];
    var wsrc = (data.weather && data.weather[y]) || '';
    for(var x=0; x<ed.W; x++){
      var ch = wsrc.charAt(x);
      if(ch === 'c') wRow.push('CLOUD');
      else if(ch === 'r') wRow.push('RAIN');
      else wRow.push(null);
    }
    ed.weather.push(wRow);
  }
  ed.units = [];
  (data.P||[]).forEach(function(a){ ed.units.push({ type:a[0], owner:'P', x:a[1], y:a[2] }); });
  (data.E||[]).forEach(function(a){ ed.units.push({ type:a[0], owner:'E', x:a[1], y:a[2] }); });
  (data.C||[]).forEach(function(a){ ed.units.push({ type:a[0], owner:'C', x:a[1], y:a[2] }); });
  (data.D||[]).forEach(function(a){ ed.units.push({ type:a[0], owner:'D', x:a[1], y:a[2] }); });
  // ステージ設定の復元
  ed.fow = !!data.fow;
  ed.dayNightCycle = !!data.dayNightCycle;
  ed.dayLength = data.dayLength || 2;
  ed.startPhase = data.startPhase || 'day';
  ed.weatherDrift = (data.weatherDrift === 'wind') ? 'wind' : 'random';
  ed.windDirection = data.windDirection || 'east';
  ed.windStrength = (typeof data.windStrength === 'number') ? Math.max(0, Math.min(3, data.windStrength)) : 1;
  // チーム設定の読み込み (data.teams があれば反映、なければ独立)
  if(data.teams && Object.keys(data.teams).length > 0){
    ed.teams = {};
    var facs = ['P', 'E', 'C', 'D'];
    for(var i=0; i<facs.length; i++){
      var fac = facs[i];
      ed.teams[fac] = data.teams[fac] || ('T' + fac);
    }
  } else {
    ed.teams = null;
  }
  edUpdateStageSettings();
  edRenderTeams();
  edRenderBoard();
}

function edSave(){
  var data = edSerialize();
  // localStorage
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('mb_user_maps') || '{}'); } catch(e){ saved = {}; }
  var id = data.name || ('map_' + Date.now());
  saved[id] = data;
  try {
    localStorage.setItem('mb_user_maps', JSON.stringify(saved));
    document.getElementById('ed-status').textContent = '「' + id + '」を保存しました';
  } catch(e){
    document.getElementById('ed-status').textContent = '保存失敗: ブラウザがlocalStorageを使えません (JSONエクスポートで代用してください)';
  }
  edRenderSavedList();
}

  }

  document.querySelectorAll('.ed-load').forEach(function(b){
    b.onclick = function(){
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem('mb_user_maps') || '{}'); } catch(e){ return; }
      var d = saved[b.dataset.key];
      if(d){ edDeserialize(d); document.getElementById('ed-status').textContent = '「'+b.dataset.key+'」を読み込みました'; }
    };
  });
  document.querySelectorAll('.ed-del').forEach(function(b){
    b.onclick = function(){
      if(!confirm('「'+b.dataset.key+'」を削除しますか?')) return;
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem('mb_user_maps') || '{}'); } catch(e){ return; }
      delete saved[b.dataset.key];
      try { localStorage.setItem('mb_user_maps', JSON.stringify(saved)); } catch(e){}
      edRenderSavedList();
      updateStageButtons();
    };
  });
}

function edExport(){
  var data = edSerialize();
  document.getElementById('ed-json').value = JSON.stringify(data, null, 2);
  document.getElementById('ed-status').textContent = 'JSONを出力しました。コピーして保管してください';
}

function edImport(){
  var raw = document.getElementById('ed-json').value;
  if(!raw.trim()){ alert('JSONを貼り付けてください'); return; }
  try {
    var data = JSON.parse(raw);
    edDeserialize(data);
    document.getElementById('ed-status').textContent = '「'+(data.name||'無題')+'」を読み込みました';
  } catch(e){
    alert('JSONの解析に失敗しました: ' + e.message);
  }
}

// チーム設定ダイアログ: 各陣営をどのチームに配属するか選択
// 現在ロード中のステージの陣営に対して設定。チーム適用は次にステージをロードするときに反映される
function openTeamConfig(){
  // モーダルがなければ作成
  var modal = document.getElementById('team-config-modal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'team-config-modal';
    modal.style.cssText = 'display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;';
    modal.innerHTML = '<div style="background:#fff;padding:20px;border-radius:8px;min-width:380px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,0.3);">'
      + '<h3 style="margin-top:0;">🤝 チーム設定</h3>'
      + '<p style="font-size:12px;color:#666;margin:0 0 12px 0;">同じチームの陣営は同盟関係になります (攻撃しない・視界共有・ZOC無視)。<br>設定変更後、ステージをロードし直すか「適用してリセット」を押すと反映されます。</p>'
      + '<div id="team-config-body"></div>'
      + '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">'
      + '<button id="team-config-cancel">キャンセル</button>'
      + '<button id="team-config-apply" style="background:#185FA5;color:#fff;border:1px solid #185FA5;padding:6px 14px;border-radius:4px;cursor:pointer;">適用してリセット</button>'
      + '</div></div>';
    document.body.appendChild(modal);
    document.getElementById('team-config-cancel').onclick = function(){ modal.style.display = 'none'; };
    document.getElementById('team-config-apply').onclick = function(){
      // 入力されたチーム設定を取得
      var newTeams = {};
      var allIndependent = true; // 全部独立 (Tx) なら永続設定をクリア
      for(var i=0; i<activeFactions.length; i++){
        var fac = activeFactions[i];
        var sel = document.getElementById('team-config-sel-' + fac);
        if(sel){
          newTeams[fac] = sel.value;
          if(sel.value !== 'T' + fac) allIndependent = false;
        }
      }
      // ステージリロード時に適用するためにペンディングに保存
      window._pendingFactionTeams = newTeams;
      // 全独立ならpersistent もクリア (デフォルトに戻す)
      if(allIndependent) persistentFactionTeams = null;
      modal.style.display = 'none';
      // 即座にステージをリロード
      loadStage(currentStage);
      render();
      setStatus('チーム設定を適用しました');
    };
  }
  // bodyを構築
  var body = document.getElementById('team-config-body');
  var html = '<table style="border-collapse:collapse;width:100%;font-size:13px;">';
  html += '<tr style="background:#f5f5f5;"><th style="padding:6px 10px;text-align:left;border:1px solid #ddd;">陣営</th><th style="padding:6px 10px;text-align:left;border:1px solid #ddd;">チーム</th></tr>';
  var teamOptions = ['A', 'B', 'C', 'D'];
  for(var i=0; i<activeFactions.length; i++){
    var fac = activeFactions[i];
    var curTeam = (factionTeams[fac] || 'T' + fac);
    // 表示名: "A" "B" など。現在のチーム値が "TP" のような独立形式ならデフォルトの A/B/C/D に対応
    // (UIではシンプルに A〜D の4チームから選ぶ)
    var displayCurrent = (curTeam.length === 1 && curTeam >= 'A' && curTeam <= 'D') ? curTeam : 'T' + fac;
    var col = FACTION_COLORS[fac] || '#888';
    html += '<tr><td style="padding:6px 10px;border:1px solid #ddd;"><span style="display:inline-block;width:14px;height:14px;background:'+col+';border-radius:2px;vertical-align:middle;margin-right:6px;"></span>' + (FACTION_NAMES[fac] || fac) + ' (' + fac + ')</td>';
    html += '<td style="padding:6px 10px;border:1px solid #ddd;"><select id="team-config-sel-' + fac + '" style="padding:4px 8px;">';
    for(var ti=0; ti<teamOptions.length; ti++){
      var to = teamOptions[ti];
      var selected = (curTeam === to) ? ' selected' : '';
      html += '<option value="' + to + '"' + selected + '>チーム ' + to + '</option>';
    }
    // 独立 (各陣営別チーム)
    var indKey = 'T' + fac;
    var indSelected = (curTeam === indKey) ? ' selected' : '';
    html += '<option value="' + indKey + '"' + indSelected + '>独立 (' + fac + ' 単独)</option>';
    html += '</select></td></tr>';
  }
  html += '</table>';
  html += '<div style="margin-top:10px;font-size:11px;color:#888;">プリセット:</div>';
  html += '<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;">';
  html += '<button onclick="teamConfigPreset(\'free_for_all\')" style="font-size:11px;padding:3px 8px;">独立 (全員敵)</button>';
  html += '<button onclick="teamConfigPreset(\'1vs3\')" style="font-size:11px;padding:3px 8px;">1vs3 (P対E/C/D)</button>';
  html += '<button onclick="teamConfigPreset(\'2vs2\')" style="font-size:11px;padding:3px 8px;">2vs2 (P+E vs C+D)</button>';
  html += '<button onclick="teamConfigPreset(\'pe_vs_cd\')" style="font-size:11px;padding:3px 8px;">P+E vs C+D</button>';
  html += '<button onclick="teamConfigPreset(\'pc_vs_ed\')" style="font-size:11px;padding:3px 8px;">P+C vs E+D</button>';
  html += '</div>';
  body.innerHTML = html;
  modal.style.display = 'flex';
}

// プリセットを適用する関数 (グローバルに公開: HTML onclick から呼ばれる)
window.teamConfigPreset = function(preset){
  var setVal = function(fac, val){
    var sel = document.getElementById('team-config-sel-' + fac);
    if(sel) sel.value = val;
  };
  if(preset === 'free_for_all'){
    for(var i=0; i<activeFactions.length; i++){
      setVal(activeFactions[i], 'T' + activeFactions[i]);
    }
  } else if(preset === '1vs3'){
    setVal('P', 'A'); setVal('E', 'B'); setVal('C', 'B'); setVal('D', 'B');
  } else if(preset === '2vs2' || preset === 'pe_vs_cd'){
    setVal('P', 'A'); setVal('E', 'A'); setVal('C', 'B'); setVal('D', 'B');
  } else if(preset === 'pc_vs_ed'){
    setVal('P', 'A'); setVal('C', 'A'); setVal('E', 'B'); setVal('D', 'B');
  }
};

document.addEventListener('keydown', function(e){
  var overlay = document.getElementById('editor-overlay');

});

// ステージ設定 UI ↔ ed の同期
function edUpdateStageSettings(){
  // ed の状態を UI に反映
  document.getElementById('ed-fow').checked = !!ed.fow;
  document.getElementById('ed-daynight').checked = !!ed.dayNightCycle;
  document.getElementById('ed-daynight-options').style.display = ed.dayNightCycle ? '' : 'none';
  document.getElementById('ed-daylength').value = ed.dayLength || 2;
  var radios = document.getElementsByName('ed-startphase');
  for(var i=0; i<radios.length; i++){
    radios[i].checked = (radios[i].value === (ed.startPhase || 'day'));
  }
  document.getElementById('ed-weather-drift').value = ed.weatherDrift || 'random';
  document.getElementById('ed-wind-direction').value = ed.windDirection || 'east';
  document.getElementById('ed-wind-strength').value = String(typeof ed.windStrength === 'number' ? ed.windStrength : 1);
  document.getElementById('ed-wind-options').style.display = (ed.weatherDrift === 'wind') ? '' : 'none';
}
document.getElementById('ed-fow').addEventListener('change', function(e){
  ed.fow = e.target.checked;
});
document.getElementById('ed-daynight').addEventListener('change', function(e){
  ed.dayNightCycle = e.target.checked;
  document.getElementById('ed-daynight-options').style.display = ed.dayNightCycle ? '' : 'none';
});
document.getElementById('ed-daylength').addEventListener('input', function(e){
  ed.dayLength = parseInt(e.target.value) || 2;
});
document.getElementsByName('ed-startphase').forEach(function(r){
  r.addEventListener('change', function(){ if(r.checked) ed.startPhase = r.value; });
});
document.getElementById('ed-weather-drift').addEventListener('change', function(e){
  ed.weatherDrift = e.target.value;
  document.getElementById('ed-wind-options').style.display = (ed.weatherDrift === 'wind') ? '' : 'none';
});
document.getElementById('ed-wind-direction').addEventListener('change', function(e){
  ed.windDirection = e.target.value;
});
document.getElementById('ed-wind-strength').addEventListener('change', function(e){
  ed.windStrength = parseInt(e.target.value, 10);
  if(isNaN(ed.windStrength)) ed.windStrength = 1;
});

// updateStageButtons を拡張: 自作マップも表示
var origUpdateStageButtons = updateStageButtons;
updateStageButtons = function(){
  var wrap = document.getElementById('stage-buttons');
  wrap.innerHTML = '';
  // 組み込み
  var builtin = ['fog_test','plains','naval','river','coastal','mountain','triangle','fourway'];
  for(var i=0; i<builtin.length; i++){
    (function(k){
      var s = STAGES[k];
      if(!s) return;
      var btn = document.createElement('button');
      btn.textContent = s.name;
      btn.style.cssText = 'font-size: 13px;' + (currentStage===k?'background:#E6F1FB;border-color:#185FA5;':'');
      // FoW/昼夜サイクル付きステージは目立たせる
      if(s.fow || s.dayNightCycle){
        btn.style.cssText = 'font-size: 13px; background:' + (currentStage===k?'#FFE08A':'#FFF1C2') + '; border-color:#BA7517; font-weight:600;';
        btn.textContent = '🌙 ' + s.name;
      }
      btn.onclick = function(){ loadStage(k); };
      wrap.appendChild(btn);
    })(builtin[i]);
  }
  // ユーザーマップ
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('mb_user_maps') || '{}'); } catch(e){ saved = {}; }
  var keys = Object.keys(saved);
  if(keys.length > 0){
    var sep = document.createElement('span');
    sep.textContent = '|';
    sep.style.cssText = 'color:#aaa; margin:0 4px; align-self:center;';
    wrap.appendChild(sep);
    for(var i=0; i<keys.length; i++){
      (function(key){
        var btn = document.createElement('button');
        btn.textContent = '🗺 ' + key;
        btn.style.cssText = 'font-size: 13px;' + (currentStage===('user_'+key)?'background:#E6F1FB;border-color:#185FA5;':'');
        btn.onclick = function(){
          var saved = {};
          try { saved = JSON.parse(localStorage.getItem('mb_user_maps') || '{}'); } catch(e){ return; }
          STAGES['user_'+key] = saved[key];
          loadStage('user_'+key);
        };
        wrap.appendChild(btn);
      })(keys[i]);
    }
  }
};

updateStageButtons();
