    var xy = k.split(',');
    return { x: parseInt(xy[0]), y: parseInt(xy[1]) };
  }
  // 2) 自軍占領中の生産施設
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
    var ter = TER[M[fy][fx]];
    if(ter && ter.slots) return { x: fx, y: fy };
  }
  // 3) 自軍占領中の任意の拠点 (都市など)
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    return { x: parseInt(xy[0]), y: parseInt(xy[1]) };
  }
  // 4) 自軍最初のユニット
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner === aiFaction && u.hp > 0) return { x: u.x, y: u.y };
  }
  return null;
}

// AI戦略補助: 占領目標リスト (首都から近い順、最大3つ)
// 戻り値: [{x, y, terKey, isRuins, owner}, ...]
// - 「自軍が占領していない、もしくは占領中だが占領HPが満タンでない(占領可能)拠点」を集める
// - 廃墟マスは「工兵で再建が必要」なので別途判別できるよう isRuins:true をつける
// - 首都(自陣営)からのマンハッタン距離が近い順、最大3つを返す
// AI戦略補助: 「歩兵が通れる地続きの島」をラベリング
// 各マスにアイランド番号を振り、同じ番号なら歩兵が陸路で行き来できる
// 戻り値: 2次元配列 islandMap[y][x] = 番号 (0は通れないマス)
// aiFaction: 計算する陣営。他陣営のユニットは障害物扱い、自陣営は通れる
// 注意: あくまで「歩兵が通れる地形か」だけで判定 (UV戦車などは別)
function _aiComputeLandIslands(aiFaction){
  var islandMap = [];
  for(var y=0; y<H; y++){
    var row = [];
    for(var x=0; x<W; x++) row.push(0);
    islandMap.push(row);
  }
  // 歩兵 (INF cost) が通れる地形を「移動コスト < Infinity」で判定
  // 敵対陣営のユニットがいるマスはブロッカー扱い (自陣営・同盟・中立は通り抜け可能)
  var enemyBlockers = {};
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.hp <= 0) continue;
    if(!isAlly(u.owner, aiFaction) && u.owner !== 'N') enemyBlockers[u.x+','+u.y] = true;
  }
  function canWalk(x, y){
    if(x < 0 || y < 0 || x >= W || y >= H) return false;
    var ter = TER[M[y][x]];
    if(!ter) return false;
    var c = (COST.INF && COST.INF[M[y][x]]);
    if(c === undefined || c === Infinity) return false;
    if(enemyBlockers[x+','+y]) return false;
    return true;
  }
  var nextId = 1;
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      if(islandMap[y][x] !== 0) continue;
      if(!canWalk(x, y)) continue;
      // BFSでこの島を全部塗る
      var queue = [[x, y]];
      islandMap[y][x] = nextId;
      while(queue.length > 0){
        var p = queue.shift();
        var px = p[0], py = p[1];
        var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for(var di=0; di<dirs.length; di++){
          var nx = px + dirs[di][0], ny = py + dirs[di][1];
          if(nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          if(islandMap[ny][nx] !== 0) continue;
          if(!canWalk(nx, ny)) continue;
          islandMap[ny][nx] = nextId;
          queue.push([nx, ny]);
        }
      }
      nextId++;
    }
  }
  return islandMap;
}

// AI戦略補助: 自軍の歩兵がいる島の集合を返す
function _aiOwnInfantryIslands(aiFaction, islandMap){
  var owned = {};
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(!TYPE[u.type].canCapture) continue;
    var id = islandMap[u.y] && islandMap[u.y][u.x];
    if(id) owned[id] = true;
  }
  // 占領担当ユニットがいない場合、歩兵生産可能な拠点(自軍工場)も自陣の島とみなす
  // (将来生産する歩兵がそこから出る前提)
  if(Object.keys(owned).length === 0){
    for(var k in captures){
      var cap = captures[k];
      if(cap.owner !== aiFaction) continue;
      var xy = k.split(',');
      var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
      var ter = TER[M[cy][cx]];
      if(!ter || !ter.healCat || ter.healCat !== 'LAND') continue; // 歩兵を生産できる施設のみ
      var id = islandMap[cy] && islandMap[cy][cx];
      if(id) owned[id] = true;
    }
  }
  return owned;
}

function _aiCaptureTargets(aiFaction){
  var home = _aiHomeBase(aiFaction);
  if(!home) return [];
  // 地続き判定: 自軍歩兵がいる島から到達可能な拠点を優先
  var islandMap = _aiComputeLandIslands(aiFaction);
  var ownIslands = _aiOwnInfantryIslands(aiFaction, islandMap);
  var list = [];
  for(var k in captures){
    var cap = captures[k];
    var xy = k.split(',');
    var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
    var ter = TER[M[cy][cx]];
    if(!ter || !ter.capturable) continue;
    var maxCapHp = ter.capCaptureHp || ter.capHpMax || CAP_MAX;
    // 自軍が占領完了している拠点はスキップ
    if(cap.owner === aiFaction && (cap.captureHp || 0) >= maxCapHp) continue;
    // 同盟陣営が占領した拠点はスキップ (同盟が確保してるので攻撃する必要なし)
    if(cap.owner !== aiFaction && isAlly(cap.owner, aiFaction)) continue;
    var isRuins = !!ter.isRuins;
    // 廃墟は占領担当ユニット (歩兵等) では対象外 (工兵の再建が先)
    // ただしリストには含める (工兵用、また呼び出し側で必要に応じてフィルタする)
    // 地続き判定: この拠点が自軍歩兵の島から到達可能か?
    var capIsland = islandMap[cy] && islandMap[cy][cx];
    var reachable = !!(capIsland && ownIslands[capIsland]);
    list.push({
      x: cx, y: cy, terKey: cap.terKey || M[cy][cx],
      isRuins: isRuins, owner: cap.owner,
      reachable: reachable
    });
  }
  // ソート: 地続き優先のみ (距離は呼び出し側 = 各歩兵が自分から計算する)
  list.sort(function(a, b){
    if(a.reachable !== b.reachable) return a.reachable ? -1 : 1;
    // 完全同条件はランダム tie-break
    return Math.random() - 0.5;
  });
  if(window.AI_DEBUG){
    try{
      var debugStr = list.map(function(t){
        return '('+t.x+','+t.y+')'+(t.isRuins?'廃':'')+'r='+(t.reachable?1:0)+'o='+t.owner;
      }).join(', ');
      console.log('[_aiCaptureTargets '+aiFaction+'] total='+list.length+' all=['+debugStr+']');
    }catch(e){}
  }
  return list;
}

// AI: 損傷した自軍施設のリスト (工兵の施設修復対象)
// 仕様書セクション4 工兵総合行動順 6番目「自軍施設の修復」
// 戻り値: [{x, y, hp, maxHp}, ...] (距離計算は呼び出し側で工兵位置からおこなう)
function _aiDamagedFacilities(aiFaction){
  var list = [];
  for(var k in captures){
    var cap = captures[k];
    if(!cap || cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
    var ter = TER[M[fy][fx]];
    if(!ter || !ter.capturable) continue;
    if(ter.isRuins) continue; // 廃墟は別ロジック (aiRebuild)
    var maxHp = ter.capHpMax || CAP_MAX;
    if((cap.hp || 0) >= maxHp) continue; // 損傷なし
    list.push({ x: fx, y: fy, hp: cap.hp, maxHp: maxHp });
  }
  return list;
}

// AI: 占領予定地 (x, y) の危険判定 (仕様書セクション9 「占領予定地の危険判定」)
// 視認できる敵がマンハッタン距離 3 以内にいれば「危険」と判定
// 戻り値: { dangerous: bool, threats: [{enemy, dist}, ...] }
//   threats は危険判定された敵の配列 (戦闘ユニット支援要請の判断材料)
function _aiTargetIsDangerous(targetX, targetY, aiFaction){
  var threats = [];
  for(var i=0; i<units.length; i++){
    var e = units[i];
    if(isAlly(e.owner, aiFaction) || e.owner === 'N' || e.hp <= 0) continue;
    if(!isUnitVisibleTo(e, aiFaction)) continue;
    var d = manhattan(e.x, e.y, targetX, targetY);
    if(d <= 3) threats.push({ enemy: e, dist: d });
  }
  return { dangerous: threats.length > 0, threats: threats };
}

// AI戦略補助: 自軍の「占領担当」ユニット数を集計
// 戻り値: { infantry: 普通の歩兵系, engineer: 工兵, total: 合計 }
function _aiCountCaptureUnits(aiFaction){
  var inf = 0, eng = 0;
  function countCargoRecursive(cgList){
    if(!cgList) return;
    for(var ci=0; ci<cgList.length; ci++){
      var cg = cgList[ci];
      var t = TYPE[cg.type];
      if(t && t.canCapture){
        if(t.isEngineer) eng++;
        else inf++;
      }
      // 入れ子のcargoも再帰
      if(cg.cargo && cg.cargo.length > 0) countCargoRecursive(cg.cargo);
    }
  }
  // 既存ユニット (本体 + ユニットcargo: 輸送機・APC・輸送ヘリが運んでる歩兵)
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(TYPE[u.type].canCapture){
      if(TYPE[u.type].isEngineer) eng++;
      else inf++;
    }
    if(u.cargo && u.cargo.length > 0) countCargoRecursive(u.cargo);
  }
  // 生産中/完成済みのユニットも数える
  for(var i=0; i<production.length; i++){
    var p = production[i];
    if(p.owner !== aiFaction) continue;
    var t = TYPE[p.type];
    if(!t || !t.canCapture) continue;
    if(t.isEngineer) eng++;
    else inf++;
  }
  // 拠点ストレージ(cargo)も数える
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction || !cap.cargo) continue;
    countCargoRecursive(cap.cargo);
  }
  return { infantry: inf, engineer: eng, total: inf + eng };
}

// === AI 役割判定: ユニットタイプの武器テーブルから役割を判定 ===
// 武器の atk テーブルから、対空・対潜・対装甲・間接砲などの役割を判定する
// 戻り値: { antiAir, antiSub, antiArmor, indirect } の真偽値オブジェクト
// 閾値はだいたい「効果的に攻撃できる」ライン
function _aiUnitRoles(unitType){
  var t = TYPE[unitType];
  if(!t || !t.weapons) return { antiAir: false, antiSub: false, antiArmor: false, indirect: false };
  var antiAir = false, antiSub = false, antiArmor = false, indirect = false;
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    // 対空: AC または HE への atk が 4以上 (実用的な対空火力)
    if((w.atk.AC || 0) >= 4 || (w.atk.HE || 0) >= 4) antiAir = true;
    // 対潜: SUB への atk が 4以上
    if((w.atk.SUB || 0) >= 4) antiSub = true;
    // 対装甲: AV または AS への atk が 6以上 (装甲を抜く火力)
    if((w.atk.AV || 0) >= 6 || (w.atk.AS || 0) >= 6) antiArmor = true;
    // 間接砲: 間接武器を持つ (対空ミサイルなど特殊な間接は除外したいが、
    //         実装簡素化のため間接ならフラグ立てる。脅威評価で別途調整)
    if(w.indirect && (w.range[1] || 0) >= 2) indirect = true;
  }
  return { antiAir: antiAir, antiSub: antiSub, antiArmor: antiArmor, indirect: indirect };
}

// === AI 脅威カウント: 自軍視界の敵から、カテゴリ別の脅威を集計 ===
// 戻り値: { air, sub, armor, total } の数
function _aiCountThreats(visibleEnemies){
  var air = 0, sub = 0, armor = 0;
  for(var i=0; i<visibleEnemies.length; i++){
    var e = visibleEnemies[i];
    var et = TYPE[e.type];
    var cat = et.cat;
    var ac = et.armorClass;
    // 航空ユニット (AIR) または ヘリ (armorClass HE)
    if(cat === 'AIR' || ac === 'HE') air++;
    // 潜水艦 (armorClass SUB)
    if(ac === 'SUB') sub++;
    // 装甲ユニット (AV または AS)
    if(ac === 'AV' || ac === 'AS') armor++;
  }
  return { air: air, sub: sub, armor: armor, total: visibleEnemies.length };
}

// === AI 自軍カウンター戦力: カテゴリ別カウンターユニット数 ===
// 戻り値: { antiAir, antiSub, antiArmor, indirect } の数 (生産中も含む)
function _aiCountCounters(aiFaction){
  var antiAir = 0, antiSub = 0, antiArmor = 0, indirect = 0;
  // 生存ユニット
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    var roles = _aiUnitRoles(u.type);
    if(roles.antiAir) antiAir++;
    if(roles.antiSub) antiSub++;
    if(roles.antiArmor) antiArmor++;
    if(roles.indirect) indirect++;
  }
  // 生産中も含める
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    var roles = _aiUnitRoles(production[pi].type);
    if(roles.antiAir) antiAir++;
    if(roles.antiSub) antiSub++;
    if(roles.antiArmor) antiArmor++;
    if(roles.indirect) indirect++;
  }
  return { antiAir: antiAir, antiSub: antiSub, antiArmor: antiArmor, indirect: indirect };
}

// AI: 現在のゲームフェーズを判定 ('F1'/'F2'/'F3')
// 仕様: 中立施設・廃墟の残存率 (マップ上の占領可能施設全体に対する中立+廃墟の割合)
//  F1: 70%以上 (序盤) - 中立占領が最優先
//  F2: 40%〜69% (中盤) - 占領進み、攻撃ユニット比重増加
//  F3: 39%以下 (中盤後半〜終盤) - 攻撃ユニット中心、敵撃破フェーズ
function _aiPhase(aiFaction){
  var total = 0;            // 占領可能な全施設数
  var neutralOrRuins = 0;   // 中立 + 廃墟
  for(var k in captures){
    var cap = captures[k];
    if(!cap) continue;
    var xy = k.split(',');
    var x = parseInt(xy[0]), y = parseInt(xy[1]);
    var ter = TER[M[y][x]];
    if(!ter || !ter.capturable) continue;
    total++;
    if(ter.isRuins || cap.owner === 'N') neutralOrRuins++;
  }
  if(total === 0) return 'F3'; // 施設なし → 終盤扱い
  var ratio = neutralOrRuins / total;
  if(ratio >= 0.70) return 'F1';
  if(ratio >= 0.40) return 'F2';
  return 'F3';
}

// AI: 陸軍生産用のユニット数集計 (既存ユニット + 生産予約中)
// 仕様書の確率モデル・上限ルールで使用するカウントを返す
function _aiCountLand(aiFaction){
  // 歩兵系 (占領可能歩兵): 歩兵/対戦車歩兵/山岳猟兵/空挺降下兵/工兵
  var INF_TYPES = { INFANTRY:true, AT_INFANTRY:true, MOUNTAIN_TROOP:true, PARATROOPER:true, ENGINEER:true };
  // 重歩兵 (占領不可・歩兵カテゴリだが歩兵数にはカウントしない)
  var HEAVY_INF = { OBSERVER:true, ARTILLERY:true, HEAVY_ARTILLERY:true };
  // 偵察/APC枠
  var RECON_APC_TYPES = { SCOUT:true, APC:true, SUPPLY_TRUCK:true, OBSERVER:true };
  // 陸軍の間接砲 (観測兵の上限判定用)
  var LAND_INDIRECT = { ARTILLERY:true, HEAVY_ARTILLERY:true, SPG:true, MLRS:true };
  // 海軍の間接砲 (観測兵の上限判定用)
  var SEA_INDIRECT = { DESTROYER:true, AA_DESTROYER:true, LIGHT_CRUISER:true, HEAVY_CRUISER:true, BATTLE_CRUISER:true, BATTLESHIP:true };

  var counts = {
    infantry: 0,    // 占領可能歩兵の合計 (歩兵数)
    engineer: 0,    // 工兵
    scout: 0,       // 偵察車
    apc: 0,         // 兵員輸送車
    supplyTruck: 0, // 補給車
    observer: 0,    // 観測兵
    artilleryLand: 0,  // 陸軍間接砲
    artillerySea: 0,   // 海軍間接砲
    attackLand: 0,  // 攻撃ユニット (陸: 歩兵系/偵察APC/補給/観測兵を除いた陸上ユニット)
    perType: {}     // type別カウント (個別上限4の判定用)
  };

  function addOne(type){
    counts.perType[type] = (counts.perType[type] || 0) + 1;
    var t = TYPE[type];
    if(!t) return;
    if(INF_TYPES[type]) counts.infantry++;
    if(type === 'ENGINEER') counts.engineer++;
    if(type === 'SCOUT') counts.scout++;
    if(type === 'APC') counts.apc++;
    if(type === 'SUPPLY_TRUCK') counts.supplyTruck++;
    if(type === 'OBSERVER') counts.observer++;
    if(LAND_INDIRECT[type]) counts.artilleryLand++;
    if(SEA_INDIRECT[type]) counts.artillerySea++;
    // 攻撃ユニット (陸軍) = 陸軍ユニットから 歩兵系・偵察/APC/補給/観測兵 を除いたもの
    if(t.cat === 'LAND' && !INF_TYPES[type] && !RECON_APC_TYPES[type] && !HEAVY_INF[type]){
      counts.attackLand++;
    }
  }

  // 既存ユニット
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    addOne(u.type);
  }
  // 生産予約中
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    addOne(production[pi].type);
  }
  return counts;
}

// AI: 陸軍 第1層カテゴリ抽選 (歩兵系 / 偵察APC / 攻撃)
// phase: 'F1'/'F2'/'F3'、infCount: 現在の歩兵数 (占領可能歩兵の合計)
// 戻り値: 'infantry'/'recon_apc'/'attack'
function _aiPickLandCategory(phase, infCount){
  // 確率テーブル [歩兵系%, 偵察APC%, 攻撃%]
  var table;
  if(phase === 'F1'){
    if(infCount <= 1) table = [100, 0, 0];
    else if(infCount === 2) table = [50, 35, 15];
    else if(infCount === 3) table = [30, 50, 20];
    else table = [20, 40, 40];
  } else if(phase === 'F2'){
    if(infCount <= 1) table = [60, 30, 10];
    else if(infCount === 2) table = [40, 25, 35];
    else if(infCount === 3) table = [20, 20, 60];
    else table = [10, 15, 75];
  } else { // F3
    if(infCount <= 1) table = [60, 20, 20];
    else if(infCount === 2) table = [25, 15, 60];
    else if(infCount === 3) table = [20, 10, 70];
    else table = [10, 10, 80];
  }
  var r = Math.random() * 100;
  if(r < table[0]) return 'infantry';
  if(r < table[0] + table[1]) return 'recon_apc';
  return 'attack';
}

// AI: マップの状態を集計 (廃墟数・川存在・空港存在・港存在など) - 生産ロジックで使用
function _aiMapInfo(){
  var info = {
    ruinsCount: 0,    // マップ上の廃墟数
    hasRiver: false,  // 川マスがあるか
    hasAirport: false, // 空港系施設 (中立・自軍・同盟・敵・廃墟空港すべて)
    hasPort: false    // 港系施設 (同上)
  };
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      var key = M[y][x];
      var ter = TER[key];
      if(!ter) continue;
      if(key === 'RIVER') info.hasRiver = true;
      if(ter.isRuins){
        info.ruinsCount++;
        // 廃墟空港・廃墟港もカウント
        if(ter.group === 'airport') info.hasAirport = true;
        if(ter.group === 'port') info.hasPort = true;
      } else {
        if(ter.group === 'airport') info.hasAirport = true;
        if(ter.group === 'port') info.hasPort = true;
      }
    }
  }
  return info;
}

// AI: 陸軍 第2層A - 歩兵系の内部抽選
// facility: 生産施設の TER オブジェクト (例: FACTORY/TRACK_FACTORY/...)
// phase: 'F1'/'F2'/'F3'
// counts: _aiCountLand の戻り値
// mapInfo: _aiMapInfo の戻り値
// 戻り値: 抽選されたユニット type 文字列、または null (候補なし)
function _aiPickLandInfantry(facility, phase, counts, mapInfo){
  if(!facility || !facility.produces) return null;
  var level = facility.level || 1;
  // この施設で生産できる歩兵系候補を produces から拾う
  var INF_GROUP = ['INFANTRY', 'AT_INFANTRY', 'MOUNTAIN_TROOP', 'PARATROOPER', 'ENGINEER'];
  var candidates = [];
  for(var i=0; i<INF_GROUP.length; i++){
    if(facility.produces.indexOf(INF_GROUP[i]) >= 0) candidates.push(INF_GROUP[i]);
  }
  // 工兵候補入り条件: 廃墟または川がある & 工兵数 < ceil(残存廃墟数/4)
  // ※ 廃墟0だが川あり → 橋建設のため工兵1体までは候補に入れる (0ベースでも1体OK)
  var engineerCapBase = Math.ceil(mapInfo.ruinsCount / 4);
  var engineerCap = Math.max(1, engineerCapBase); // 0ベースでも1体まで先読みOK
  var engineerOk = (mapInfo.ruinsCount > 0 || mapInfo.hasRiver) && counts.engineer < engineerCap;
  if(!engineerOk){
    candidates = candidates.filter(function(k){ return k !== 'ENGINEER'; });
  }
  if(candidates.length === 0) return null;
  // 重み計算 (新規開放優先: F2/F3 + Lv に応じて新規ユニットは重み5)
  // 歩兵系の Lv 定義: Lv1=歩兵/対戦車歩兵/工兵, Lv2=山岳猟兵, Lv3=空挺降下兵
  var INF_LEVEL = { INFANTRY:1, AT_INFANTRY:1, ENGINEER:1, MOUNTAIN_TROOP:2, PARATROOPER:3 };
  var bonusEnabled = (phase === 'F2' || phase === 'F3');
  var weights = candidates.map(function(k){
    var unitLv = INF_LEVEL[k] || 1;
    if(bonusEnabled && unitLv === level) return 5;
    return 1;
  });
  return _aiWeightedPick(candidates, weights);
}

// AI: 陸軍 第2層B - 偵察車/APC/補給車/観測兵 の内部抽選
// 偵察車数で確率変動 + 各種上限ルール
function _aiPickLandReconAPC(facility, counts){
  if(!facility || !facility.produces) return null;
  var produces = facility.produces;
  var candidates = []; // [{ type, baseWeight }]
  // 偵察車数で確率変動 (仕様書通り)
  var sc = counts.scout;
  var probScout, probAPC, probSupply, probObs;
  if(sc === 0)      { probScout = 35; probAPC = 35; probSupply = 15; probObs = 15; }
  else if(sc === 1) { probScout = 25; probAPC = 40; probSupply = 15; probObs = 20; }
  else if(sc === 2) { probScout = 15; probAPC = 45; probSupply = 15; probObs = 25; }
  else if(sc === 3) { probScout = 10; probAPC = 45; probSupply = 15; probObs = 30; }
  else              { probScout = 0;  probAPC = 50; probSupply = 15; probObs = 35; }
  // 上限ルール: APC ≤ 歩兵数、補給車 ≤ ceil(攻撃ユニット数/5)、観測兵 ≤ ceil(間接砲数/4)
  // ※ ベース0でも1体まで先読みOK
  var apcCap = Math.max(1, counts.infantry); // 0でも1体までOK
  var supplyCap = Math.max(1, Math.ceil(counts.attackLand / 5));
  var indirectTotal = counts.artilleryLand + counts.artillerySea;
  var observerCap = Math.max(1, Math.ceil(indirectTotal / 4));
  // 各候補を produces にあるかチェック + 上限チェック
  if(produces.indexOf('SCOUT') >= 0 && probScout > 0) candidates.push({ type:'SCOUT', w: probScout });
  if(produces.indexOf('APC') >= 0 && counts.apc < apcCap) candidates.push({ type:'APC', w: probAPC });
  if(produces.indexOf('SUPPLY_TRUCK') >= 0 && counts.supplyTruck < supplyCap) candidates.push({ type:'SUPPLY_TRUCK', w: probSupply });
  if(produces.indexOf('OBSERVER') >= 0 && counts.observer < observerCap) candidates.push({ type:'OBSERVER', w: probObs });
  if(candidates.length === 0) return null;
  return _aiWeightedPick(candidates.map(function(c){return c.type;}), candidates.map(function(c){return c.w;}));
}

// AI: 陸軍 第2層C - 攻撃ユニットの内部抽選
// 仕様: 施設の produces から「攻撃ユニット」を抽選 (新規開放優先: F2/F3 + Lv に応じて重み5)
// 除外: 対空ミサイル (空港系施設がマップに一つもなければ除外)
function _aiPickLandAttack(facility, phase, counts, mapInfo){
  if(!facility || !facility.produces) return null;
  var level = facility.level || 1;
  // 攻撃ユニットの Lv 定義 (新規開放優先用)
  // Lv1: 軽戦車
  // Lv2(装輪系): 水陸両用戦車・空挺戦車
  // Lv2(戦車系): 中戦車・駆逐戦車・対空戦車・対空ミサイル・自走砲
  // Lv3(装輪系): 機動戦闘車・ロケット砲・重砲兵
  // Lv3(戦車系): 重戦車・重駆逐戦車・重砲兵
  // ※ 重砲兵は歩兵カテゴリで _aiPickLandInfantry の対象だが、produces に居ることがある
  //   ここでは「攻撃ユニット = 歩兵系/偵察APC/補給/観測兵を除いた陸ユニット」とする
  var LV_MAP = {
    LIGHT_TANK:1,
    AMPHIB_TANK:2, AIRBORNE_TANK:2,
    MEDIUM_TANK:2, TANK_DESTROYER:2, AA_TANK:2, AA_MISSILE:2, SPG:2,
    MOBILE_COMBAT:3, MLRS:3,
    HEAVY_TANK:3, HEAVY_TD:3
  };
  // 攻撃ユニットとして扱う集合
  var ATTACK_SET = {
    LIGHT_TANK:true, MEDIUM_TANK:true, HEAVY_TANK:true,
    TANK_DESTROYER:true, HEAVY_TD:true,
    AA_TANK:true, AA_MISSILE:true,
    AMPHIB_TANK:true, AIRBORNE_TANK:true,
    MOBILE_COMBAT:true,
    SPG:true, MLRS:true
  };
  var candidates = [];
  for(var i=0; i<facility.produces.length; i++){
    var key = facility.produces[i];
    if(!ATTACK_SET[key]) continue;
    // 除外ルール: 対空ミサイル (空港系施設がマップに一つもなければ除外)
    if(key === 'AA_MISSILE' && !mapInfo.hasAirport) continue;
    candidates.push(key);
  }
  if(candidates.length === 0) return null;
  // 新規開放優先 (F2/F3): 当該レベルで新規開放のユニットは重み5
  var bonusEnabled = (phase === 'F2' || phase === 'F3');
  var weights = candidates.map(function(k){
    var unitLv = LV_MAP[k] || 1;
    if(bonusEnabled && unitLv === level) return 5;
    return 1;
  });
  return _aiWeightedPick(candidates, weights);
}

// AI: 重み付きランダム抽選ヘルパー
// items: 候補配列、weights: 重み配列 (同じ長さ)
function _aiWeightedPick(items, weights){
  if(!items || items.length === 0) return null;
  var total = 0;
  for(var i=0; i<weights.length; i++) total += weights[i];
  if(total <= 0) return items[Math.floor(Math.random() * items.length)];
  var r = Math.random() * total;
  var cum = 0;
  for(var i=0; i<items.length; i++){
    cum += weights[i];
    if(r < cum) return items[i];
  }
  return items[items.length - 1];
}

// AI: 陸軍生産の統合関数
// 1施設の1スロット分の生産ユニットを抽選で決定する
// facility: 生産施設の TER オブジェクト
// aiFaction: 'E'/'A' などのプレイヤー識別子
// counts: _aiCountLand の戻り値 (この関数内では変更しない、呼び出し側で更新)
// mapInfo: _aiMapInfo の戻り値
// fundsAvailable: 現在の使用可能資金
// 戻り値: 生産するユニットの type 文字列、または null (買えない/候補なし)
function _aiPickLandUnit(facility, aiFaction, counts, mapInfo, fundsAvailable){
  if(!facility || !facility.produces || facility.produces.length === 0) return null;
  var phase = _aiPhase(aiFaction);
  // 第1層から最大3回まで再抽選
  for(var attempt = 0; attempt < 3; attempt++){
    var category = _aiPickLandCategory(phase, counts.infantry);
    var pick = null;
    if(category === 'infantry'){
      pick = _aiPickLandInfantry(facility, phase, counts, mapInfo);
    } else if(category === 'recon_apc'){
      pick = _aiPickLandReconAPC(facility, counts);
    } else {
      pick = _aiPickLandAttack(facility, phase, counts, mapInfo);
    }
    if(!pick) continue; // 候補なし → 第1層から再抽選
    var t = TYPE[pick];
    if(!t) continue;
    if(t.price <= fundsAvailable) return pick;
    // 資金不足: 同カテゴリ内で最大3回再抽選
    for(var reTry = 0; reTry < 3; reTry++){
      var reP = null;
      if(category === 'infantry') reP = _aiPickLandInfantry(facility, phase, counts, mapInfo);
      else if(category === 'recon_apc') reP = _aiPickLandReconAPC(facility, counts);
      else reP = _aiPickLandAttack(facility, phase, counts, mapInfo);
      if(reP && TYPE[reP] && TYPE[reP].price <= fundsAvailable){
        return reP;
      }
    }
  }
  return null;
}

// =====================================================================
// 海軍生産ロジック (仕様書通り)
// 海軍はフェーズ分けなし、補助艦艇数を主指標
// =====================================================================

// AI: 海軍生産用のユニット数集計 (既存ユニット + 生産予約中)
function _aiCountNavy(aiFaction){
  // 補助艦艇 (第1層の主指標): 駆潜艇/フリゲート/駆逐艦/対空駆逐艦
  var AUX_TYPES = { CHASER:true, FRIGATE:true, DESTROYER:true, AA_DESTROYER:true };
  // 海上艦艇 (給油艦・補給艦の上限分母用)
  var SEA_TYPES_ALL = {
    CHASER:true, FRIGATE:true, DESTROYER:true, AA_DESTROYER:true,
    SUBMARINE:true, LIGHT_CRUISER:true, HEAVY_CRUISER:true, BATTLE_CRUISER:true, BATTLESHIP:true,
    LIGHT_CARRIER:true, CARRIER:true, ARMORED_CARRIER:true,
    TRANSPORT_SHIP:true, OILER:true, AMMO_SHIP:true
  };

  var counts = {
    auxiliary: 0,    // 補助艦艇合計
    transportShip: 0, // 輸送船
    oiler: 0,        // 給油艦
    ammoShip: 0,     // 補給艦
    seaTotal: 0,     // 海上艦艇全合計
    seaExceptSupply: 0, // 給油艦・補給艦を除いた海上艦艇 (給油艦・補給艦の上限分母)
    landTotal: 0,    // 自軍陸上ユニット数 (輸送船上限の分母)
    airTotal: 0,     // 自軍航空ユニット数 (空母系上限の分母)
    perType: {}
  };

  function addOne(type){
    counts.perType[type] = (counts.perType[type] || 0) + 1;
    var t = TYPE[type];
    if(!t) return;
    if(AUX_TYPES[type]) counts.auxiliary++;
    if(type === 'TRANSPORT_SHIP') counts.transportShip++;
    if(type === 'OILER') counts.oiler++;
    if(type === 'AMMO_SHIP') counts.ammoShip++;
    if(SEA_TYPES_ALL[type]){
      counts.seaTotal++;
      if(type !== 'OILER' && type !== 'AMMO_SHIP') counts.seaExceptSupply++;
    }
    if(t.cat === 'LAND') counts.landTotal++;
    if(t.cat === 'AIR') counts.airTotal++;
  }

  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    addOne(u.type);
  }
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    addOne(production[pi].type);
  }
  return counts;
}

// AI: 海軍 第1層カテゴリ抽選 (輸送系 / 補助艦艇 / 主力艦 / 空母系)
// auxCount: 補助艦艇数
// 戻り値: 'transport'/'auxiliary'/'capital'/'carrier'
function _aiPickNavyCategory(auxCount){
  var table; // [輸送系%, 補助艦艇%, 主力艦%, 空母系%]
  if(auxCount <= 2)      table = [30, 60, 10, 0];
  else if(auxCount <= 4) table = [25, 55, 15, 5];
  else if(auxCount <= 6) table = [20, 50, 20, 10];
  else                   table = [15, 45, 25, 15];
  var r = Math.random() * 100;
  if(r < table[0]) return 'transport';
  if(r < table[0] + table[1]) return 'auxiliary';
  if(r < table[0] + table[1] + table[2]) return 'capital';
  return 'carrier';
}

// AI: 海軍 第2層A - 輸送系 (輸送船・給油艦・補給艦)
// 基本比率 輸送船50/給油艦25/補給艦25 + 各上限
function _aiPickNavyTransport(facility, counts){
  if(!facility || !facility.produces) return null;
  var produces = facility.produces;
  // 上限ルール (0ベースでも1体まで先読みOK)
  var transportShipCap = Math.max(1, Math.min(4, Math.ceil(counts.landTotal / 2)));
  var oilerCap = Math.max(1, Math.ceil(counts.seaExceptSupply / 4));
  var ammoShipCap = Math.max(1, Math.ceil(counts.seaExceptSupply / 4));
  var candidates = [];
  var weights = [];
  if(produces.indexOf('TRANSPORT_SHIP') >= 0 && counts.transportShip < transportShipCap){
    candidates.push('TRANSPORT_SHIP'); weights.push(50);
  }
  if(produces.indexOf('OILER') >= 0 && counts.oiler < oilerCap){
    candidates.push('OILER'); weights.push(25);
  }
  if(produces.indexOf('AMMO_SHIP') >= 0 && counts.ammoShip < ammoShipCap){
    candidates.push('AMMO_SHIP'); weights.push(25);
  }
  if(candidates.length === 0) return null;
  return _aiWeightedPick(candidates, weights);
}

// AI: 海軍 第2層B - 補助艦艇 (駆潜艇・フリゲート・駆逐艦・対空駆逐艦)
// 施設レベル別の確率
function _aiPickNavyAuxiliary(facility){
  if(!facility || !facility.produces) return null;
  var level = facility.level || 1;
  var produces = facility.produces;
  var candidates = [];
  var weights = [];
  if(level === 1){
    // Lv1 港: 駆潜艇/フリゲート/駆逐艦 33% 均等 (対空駆逐艦なし)
    if(produces.indexOf('CHASER') >= 0)    { candidates.push('CHASER'); weights.push(33); }
    if(produces.indexOf('FRIGATE') >= 0)   { candidates.push('FRIGATE'); weights.push(33); }
    if(produces.indexOf('DESTROYER') >= 0) { candidates.push('DESTROYER'); weights.push(33); }
  } else {
    // Lv2 軍港以上: 駆潜艇15/フリゲート15/駆逐艦35/対空駆逐艦35
    if(produces.indexOf('CHASER') >= 0)       { candidates.push('CHASER'); weights.push(15); }
    if(produces.indexOf('FRIGATE') >= 0)      { candidates.push('FRIGATE'); weights.push(15); }
    if(produces.indexOf('DESTROYER') >= 0)    { candidates.push('DESTROYER'); weights.push(35); }
    if(produces.indexOf('AA_DESTROYER') >= 0) { candidates.push('AA_DESTROYER'); weights.push(35); }
  }
  if(candidates.length === 0) return null;
  return _aiWeightedPick(candidates, weights);
}

// AI: 海軍 第2層C - 主力艦 (軽巡・潜水艦・重巡・巡戦・戦艦)
// 施設レベル別の確率
function _aiPickNavyCapital(facility){
  if(!facility || !facility.produces) return null;
  var level = facility.level || 1;
  var produces = facility.produces;
  var candidates = [];
  var weights = [];
  if(level === 1){
    // Lv1 港: 軽巡50/潜水艦50
    if(produces.indexOf('LIGHT_CRUISER') >= 0) { candidates.push('LIGHT_CRUISER'); weights.push(50); }
    if(produces.indexOf('SUBMARINE') >= 0)     { candidates.push('SUBMARINE'); weights.push(50); }
  } else if(level === 2){
    // Lv2 軍港: 軽巡15/潜水艦35/重巡50
    if(produces.indexOf('LIGHT_CRUISER') >= 0) { candidates.push('LIGHT_CRUISER'); weights.push(15); }
    if(produces.indexOf('SUBMARINE') >= 0)     { candidates.push('SUBMARINE'); weights.push(35); }
    if(produces.indexOf('HEAVY_CRUISER') >= 0) { candidates.push('HEAVY_CRUISER'); weights.push(50); }
  } else {
    // Lv3 海軍工廠以上: 軽巡10/潜水艦30/重巡20/巡戦20/戦艦20
    if(produces.indexOf('LIGHT_CRUISER') >= 0) { candidates.push('LIGHT_CRUISER'); weights.push(10); }
    if(produces.indexOf('SUBMARINE') >= 0)     { candidates.push('SUBMARINE'); weights.push(30); }
    if(produces.indexOf('HEAVY_CRUISER') >= 0) { candidates.push('HEAVY_CRUISER'); weights.push(20); }
    if(produces.indexOf('BATTLE_CRUISER') >= 0){ candidates.push('BATTLE_CRUISER'); weights.push(20); }
    if(produces.indexOf('BATTLESHIP') >= 0)    { candidates.push('BATTLESHIP'); weights.push(20); }
  }
  if(candidates.length === 0) return null;
  return _aiWeightedPick(candidates, weights);
}

// AI: 海軍 第2層D - 空母系 (軽空母・空母・装甲空母)
// 施設レベル別の確率 + 除外ルール (マップに空港系なし or 航空0機 → 除外)
function _aiPickNavyCarrier(facility, counts, mapInfo){
  if(!facility || !facility.produces) return null;
  // 除外: マップに空港系施設なし → 空母系除外
  if(!mapInfo.hasAirport) return null;
  // 除外: 航空0機 → 空母系除外
  if(counts.airTotal === 0) return null;
  // 上限: 空母系 ≤ 航空ユニット数/4 (切り上げ)
  var carrierTotal = (counts.perType['LIGHT_CARRIER'] || 0)
                   + (counts.perType['CARRIER'] || 0)
                   + (counts.perType['ARMORED_CARRIER'] || 0);
  var carrierCap = Math.max(1, Math.ceil(counts.airTotal / 4));
  if(carrierTotal >= carrierCap) return null;
  var level = facility.level || 1;
  var produces = facility.produces;
  var candidates = [];
  var weights = [];
  if(level === 2){
    // Lv2 軍港: 軽空母100%
    if(produces.indexOf('LIGHT_CARRIER') >= 0) { candidates.push('LIGHT_CARRIER'); weights.push(100); }
  } else if(level >= 3){
    // Lv3 海軍工廠以上: 軽空母20/空母40/装甲空母40
    if(produces.indexOf('LIGHT_CARRIER') >= 0)    { candidates.push('LIGHT_CARRIER'); weights.push(20); }
    if(produces.indexOf('CARRIER') >= 0)          { candidates.push('CARRIER'); weights.push(40); }
    if(produces.indexOf('ARMORED_CARRIER') >= 0)  { candidates.push('ARMORED_CARRIER'); weights.push(40); }
  }
  if(candidates.length === 0) return null;
  return _aiWeightedPick(candidates, weights);
}

// AI: 海軍生産の統合関数
function _aiPickNavyUnit(facility, aiFaction, counts, mapInfo, fundsAvailable){
  if(!facility || !facility.produces || facility.produces.length === 0) return null;
  // 第1層から最大3回まで再抽選
  for(var attempt = 0; attempt < 3; attempt++){
    var category = _aiPickNavyCategory(counts.auxiliary);
    var pick = null;
    if(category === 'transport') pick = _aiPickNavyTransport(facility, counts);
    else if(category === 'auxiliary') pick = _aiPickNavyAuxiliary(facility);
    else if(category === 'capital') pick = _aiPickNavyCapital(facility);
    else pick = _aiPickNavyCarrier(facility, counts, mapInfo);
    if(!pick) continue;
    var t = TYPE[pick];
    if(!t) continue;
    if(t.price <= fundsAvailable) return pick;
    // 資金不足: 同カテゴリ内で最大3回再抽選
    for(var reTry = 0; reTry < 3; reTry++){
      var reP = null;
      if(category === 'transport') reP = _aiPickNavyTransport(facility, counts);
      else if(category === 'auxiliary') reP = _aiPickNavyAuxiliary(facility);
      else if(category === 'capital') reP = _aiPickNavyCapital(facility);
      else reP = _aiPickNavyCarrier(facility, counts, mapInfo);
      if(reP && TYPE[reP] && TYPE[reP].price <= fundsAvailable){
        return reP;
      }
    }
  }
  return null;
}

// =====================================================================
// 空軍生産ロジック (仕様書通り)
// 空軍は「自軍視界内に見える敵ユニット数」を主指標
// 第1層: 偵察系 / 輸送系 / 敵対応
// 第2層C は「見えている敵のカテゴリ別比率」で対応ユニットを選ぶ
// =====================================================================

// AI: 空軍生産用のカウント (既存ユニット + 生産予約中 + 視界内の敵分布)
function _aiCountAir(aiFaction){
  // 自軍カウント
  var counts = {
    airTotal: 0,         // 自軍航空ユニット数
    transportHeli: 0,    // 輸送ヘリ
    transportPlane: 0,   // 輸送機
    aerialTanker: 0,     // 空中給油機
    infGroup: 0,         // 歩兵系(歩兵/対戦車歩兵/工兵/山岳猟兵/空挺降下兵) 合計
    transportablePlane: 0, // 輸送機の運搬対象 (歩兵系 + 観測兵 + 砲兵/重砲兵 + 装輪5種)
    perType: {},
    // 敵カウント
    enemyVisible: [],    // 見えている敵ユニット配列
    enemyCounts: {       // カテゴリ別敵数
      INF: 0, UV: 0, AV: 0, US: 0, AS: 0, AC: 0, HE: 0, SUB: 0
    },
    enemyAirCount: 0,    // 見えている敵航空 (AC+HE) の合計
    enemySubCount: 0     // 見えている敵潜水艦の合計
  };
  var INF_TYPES = { INFANTRY:true, AT_INFANTRY:true, MOUNTAIN_TROOP:true, PARATROOPER:true, ENGINEER:true };
  // 輸送機の運搬対象 = 歩兵系 + 観測兵 + 砲兵/重砲兵 + 装輪5種
  var PLANE_CARGO = {
    INFANTRY:true, AT_INFANTRY:true, MOUNTAIN_TROOP:true, PARATROOPER:true, ENGINEER:true,
    OBSERVER:true, ARTILLERY:true, HEAVY_ARTILLERY:true,
    SCOUT:true, APC:true, SUPPLY_TRUCK:true, MOBILE_COMBAT:true, AIRBORNE_TANK:true
  };

  function addOne(type){
    counts.perType[type] = (counts.perType[type] || 0) + 1;
    var t = TYPE[type];
    if(!t) return;
    if(t.cat === 'AIR') counts.airTotal++;
    if(type === 'TRANSPORT_HELI') counts.transportHeli++;
    if(type === 'TRANSPORT_PLANE') counts.transportPlane++;
    if(type === 'AERIAL_TANKER') counts.aerialTanker++;
    if(INF_TYPES[type]) counts.infGroup++;
    if(PLANE_CARGO[type]) counts.transportablePlane++;
  }

  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    addOne(u.type);
  }
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    addOne(production[pi].type);
  }

  // 見える敵を集計 (自軍視界内)
  for(var i=0; i<units.length; i++){
    var e = units[i];
    if(isAlly(e.owner, aiFaction) || e.owner === 'N' || e.hp <= 0) continue;
    if(!isUnitVisibleTo(e, aiFaction)) continue;
    counts.enemyVisible.push(e);
    var t = TYPE[e.type];
    if(!t) continue;
    // SUB カテゴリは type で判定 (armorClass='US' だが SUB として分類)
    if(e.type === 'SUBMARINE'){
      counts.enemyCounts.SUB++;
      counts.enemySubCount++;
    } else {
      var ac = t.armorClass;
      if(ac && counts.enemyCounts[ac] !== undefined) counts.enemyCounts[ac]++;
    }
    if(t.cat === 'AIR') counts.enemyAirCount++;
  }
  return counts;
}

// AI: 空軍 第1層カテゴリ抽選 (偵察系 / 輸送系 / 敵対応)
function _aiPickAirCategory(enemyCount){
  var table;
  if(enemyCount === 0)      table = [60, 35, 5];
  else if(enemyCount <= 4)  table = [50, 30, 20];
  else if(enemyCount <= 8)  table = [40, 25, 35];
  else if(enemyCount <= 12) table = [30, 20, 50];
  else                      table = [20, 15, 65];
  var r = Math.random() * 100;
  if(r < table[0]) return 'recon';
  if(r < table[0] + table[1]) return 'transport';
  return 'response';
}

// AI: 空軍 第2層A - 偵察系
function _aiPickAirRecon(facility, counts){
  if(!facility || !facility.produces) return null;
  var produces = facility.produces;
  var candidates = [];
  var weights = [];
  var hasSub = (counts.enemySubCount > 0);
  if(hasSub){
    if(produces.indexOf('RECON_PLANE') >= 0)    { candidates.push('RECON_PLANE'); weights.push(18); }
    if(produces.indexOf('SCOUT_PLANE') >= 0)    { candidates.push('SCOUT_PLANE'); weights.push(45); }
    if(produces.indexOf('OBSERVER_PLANE') >= 0) { candidates.push('OBSERVER_PLANE'); weights.push(27); }
    if(produces.indexOf('ASW_PLANE') >= 0)      { candidates.push('ASW_PLANE'); weights.push(9); }
  } else {
    if(produces.indexOf('RECON_PLANE') >= 0)    { candidates.push('RECON_PLANE'); weights.push(20); }
    if(produces.indexOf('SCOUT_PLANE') >= 0)    { candidates.push('SCOUT_PLANE'); weights.push(50); }
    if(produces.indexOf('OBSERVER_PLANE') >= 0) { candidates.push('OBSERVER_PLANE'); weights.push(30); }
  }
  if(candidates.length === 0) return null;
  return _aiWeightedPick(candidates, weights);
}

// AI: 空軍 第2層B - 輸送系
function _aiPickAirTransport(facility, counts){
  if(!facility || !facility.produces) return null;
  var produces = facility.produces;
  var heliCap = Math.max(1, Math.ceil(counts.infGroup / 2));
  var planeCap = Math.max(1, Math.ceil(counts.transportablePlane / 4));
  var tankerCap = Math.max(1, Math.ceil(counts.airTotal / 5));
  var candidates = [];
  var weights = [];
  if(produces.indexOf('TRANSPORT_HELI') >= 0 && counts.transportHeli < heliCap){
    candidates.push('TRANSPORT_HELI'); weights.push(60);
  }
  if(produces.indexOf('TRANSPORT_PLANE') >= 0 && counts.transportPlane < planeCap){
    candidates.push('TRANSPORT_PLANE'); weights.push(30);
  }
  if(produces.indexOf('AERIAL_TANKER') >= 0 && counts.aerialTanker < tankerCap){
    candidates.push('AERIAL_TANKER'); weights.push(10);
  }
  if(candidates.length === 0) return null;
  return _aiWeightedPick(candidates, weights);
}

// AI: 空軍 第2層C - 敵対応 (敵カテゴリ別比率)
function _aiPickAirResponse(facility, counts, mapInfo){
  if(!facility || !facility.produces) return null;
  var produces = facility.produces;
  // 敵カテゴリ分布 (仕様書: INF / AV+UV / US+AS / AC / HE / SUB)
  var groupCounts = {
    INF: counts.enemyCounts.INF,
    AV_UV: counts.enemyCounts.AV + counts.enemyCounts.UV,
    US_AS: counts.enemyCounts.US + counts.enemyCounts.AS,
    AC: counts.enemyCounts.AC,
    HE: counts.enemyCounts.HE,
    SUB: counts.enemyCounts.SUB
  };
  var totalGroup = groupCounts.INF + groupCounts.AV_UV + groupCounts.US_AS + groupCounts.AC + groupCounts.HE + groupCounts.SUB;
  if(totalGroup === 0) return null;

  var groups = ['INF', 'AV_UV', 'US_AS', 'AC', 'HE', 'SUB'];
  var groupWeights = [groupCounts.INF, groupCounts.AV_UV, groupCounts.US_AS, groupCounts.AC, groupCounts.HE, groupCounts.SUB];
  var pickedGroup = _aiWeightedPick(groups, groupWeights);
  if(!pickedGroup) return null;

  var unitCandidates = [];
  var unitWeights = [];

  if(pickedGroup === 'INF'){
    // 豆ヘリ5 / 攻撃ヘリ1 / 対戦車ヘリ1
    if(produces.indexOf('LIGHT_HELI') >= 0) { unitCandidates.push('LIGHT_HELI'); unitWeights.push(5); }
    if(produces.indexOf('ATK_HELI') >= 0)   { unitCandidates.push('ATK_HELI'); unitWeights.push(1); }
    if(produces.indexOf('AT_HELI') >= 0)    { unitCandidates.push('AT_HELI'); unitWeights.push(1); }
  } else if(pickedGroup === 'AV_UV'){
    // 攻撃ヘリ3 / 対戦車ヘリ4 / 近接支援機3 / 爆撃機2 / ステルス爆撃機2 / ガンシップ1
    if(produces.indexOf('ATK_HELI') >= 0)       { unitCandidates.push('ATK_HELI'); unitWeights.push(3); }
    if(produces.indexOf('AT_HELI') >= 0)        { unitCandidates.push('AT_HELI'); unitWeights.push(4); }
    if(produces.indexOf('ATTACKER') >= 0)       { unitCandidates.push('ATTACKER'); unitWeights.push(3); }
    if(produces.indexOf('BOMBER') >= 0)         { unitCandidates.push('BOMBER'); unitWeights.push(2); }
    if(produces.indexOf('STEALTH_BOMBER') >= 0) { unitCandidates.push('STEALTH_BOMBER'); unitWeights.push(2); }
    if(produces.indexOf('AC_130') >= 0)         { unitCandidates.push('AC_130'); unitWeights.push(1); }
  } else if(pickedGroup === 'US_AS'){
    // 爆撃機1 / 艦上雷撃機6 / 艦上爆撃機2 / 近接支援機1 / ステルス爆撃機2 / 対戦車ヘリ4
    if(produces.indexOf('BOMBER') >= 0)          { unitCandidates.push('BOMBER'); unitWeights.push(1); }
    if(produces.indexOf('CARRIER_TORPEDO') >= 0) { unitCandidates.push('CARRIER_TORPEDO'); unitWeights.push(6); }
    if(produces.indexOf('CARRIER_BOMBER') >= 0)  { unitCandidates.push('CARRIER_BOMBER'); unitWeights.push(2); }
    if(produces.indexOf('ATTACKER') >= 0)        { unitCandidates.push('ATTACKER'); unitWeights.push(1); }
    if(produces.indexOf('STEALTH_BOMBER') >= 0)  { unitCandidates.push('STEALTH_BOMBER'); unitWeights.push(2); }
    if(produces.indexOf('AT_HELI') >= 0)         { unitCandidates.push('AT_HELI'); unitWeights.push(4); }
  } else if(pickedGroup === 'AC'){
    // 段階別: 1-3=戦闘機1/艦上戦闘機3、4-6=1/2、7+=1/1
    var ac = counts.enemyCounts.AC;
    var fighterW, cfighterW;
    if(ac <= 3)      { fighterW = 1; cfighterW = 3; }
    else if(ac <= 6) { fighterW = 1; cfighterW = 2; }
    else             { fighterW = 1; cfighterW = 1; }
    if(produces.indexOf('FIGHTER') >= 0)         { unitCandidates.push('FIGHTER'); unitWeights.push(fighterW); }
    if(produces.indexOf('CARRIER_FIGHTER') >= 0) { unitCandidates.push('CARRIER_FIGHTER'); unitWeights.push(cfighterW); }
  } else if(pickedGroup === 'HE'){
    // 戦闘機1 / 艦上戦闘機3 / 豆ヘリ3 / 近接支援機1
    if(produces.indexOf('FIGHTER') >= 0)         { unitCandidates.push('FIGHTER'); unitWeights.push(1); }
    if(produces.indexOf('CARRIER_FIGHTER') >= 0) { unitCandidates.push('CARRIER_FIGHTER'); unitWeights.push(3); }
    if(produces.indexOf('LIGHT_HELI') >= 0)      { unitCandidates.push('LIGHT_HELI'); unitWeights.push(3); }
    if(produces.indexOf('ATTACKER') >= 0)        { unitCandidates.push('ATTACKER'); unitWeights.push(1); }
  } else if(pickedGroup === 'SUB'){
    // 段階別: 1-3=対潜1/索敵5/雷3、4-6=2/5/3、7+=3/4/3
    var sb = counts.enemyCounts.SUB;
    var aswW, scoutW, torpW;
    if(sb <= 3)      { aswW = 1; scoutW = 5; torpW = 3; }
    else if(sb <= 6) { aswW = 2; scoutW = 5; torpW = 3; }
    else             { aswW = 3; scoutW = 4; torpW = 3; }
    // 対潜哨戒機 (ASW_PLANE): マップに港系施設がなければ除外 (仕様書)
    if(mapInfo.hasPort && produces.indexOf('ASW_PLANE') >= 0){
      unitCandidates.push('ASW_PLANE'); unitWeights.push(aswW);
    }
    if(produces.indexOf('SCOUT_PLANE') >= 0)     { unitCandidates.push('SCOUT_PLANE'); unitWeights.push(scoutW); }
    if(produces.indexOf('CARRIER_TORPEDO') >= 0) { unitCandidates.push('CARRIER_TORPEDO'); unitWeights.push(torpW); }
  }

  if(unitCandidates.length === 0) return null;
  return _aiWeightedPick(unitCandidates, unitWeights);
}

// AI: 空軍生産の統合関数
function _aiPickAirUnit(facility, aiFaction, counts, mapInfo, fundsAvailable){
  if(!facility || !facility.produces || facility.produces.length === 0) return null;
  var enemyCount = counts.enemyVisible.length;
  for(var attempt = 0; attempt < 3; attempt++){
    var category = _aiPickAirCategory(enemyCount);
    var pick = null;
    if(category === 'recon') pick = _aiPickAirRecon(facility, counts);
    else if(category === 'transport') pick = _aiPickAirTransport(facility, counts);
    else pick = _aiPickAirResponse(facility, counts, mapInfo);
    if(!pick) continue;
    var t = TYPE[pick];
    if(!t) continue;
    if(t.price <= fundsAvailable) return pick;
    // 資金不足: 同カテゴリ内で最大3回再抽選
    for(var reTry = 0; reTry < 3; reTry++){
      var reP = null;
      if(category === 'recon') reP = _aiPickAirRecon(facility, counts);
      else if(category === 'transport') reP = _aiPickAirTransport(facility, counts);
      else reP = _aiPickAirResponse(facility, counts, mapInfo);
      if(reP && TYPE[reP] && TYPE[reP].price <= fundsAvailable){
        return reP;
      }
    }
  }
  return null;
}

// AI: 生産関連処理 (取り出し + 新規生産)
// phase 引数で動作を分岐:
//   'takeout' or なし(後方互換): 取り出し + 空母から発艦 のみ
//   'produce': 新規生産 のみ
//   'all' (旧仕様): 取り出し + 発艦 + 新規生産 全部 (後方互換のため残す)
// 仕様書セクション12「最後に生産」: aiTurn 冒頭で 'takeout'、行動後に 'produce' を呼ぶ
function aiProduceAndTakeOut(aiFaction, phase){
  if(!aiFaction) aiFaction = 'E'; // 互換: 引数なしなら旧仕様
  if(!phase) phase = 'all'; // 引数なしなら従来通り (全部)
  // === 取り出しフェーズ ===
  if(phase === 'takeout' || phase === 'all'){
  // 完成したユニットの取り出し (取り出した時点で動ける)
  // 生産マスにユニットがいる場合:
  //   - 敵ユニット → 取り出し不可 (スキップ)
  //   - 自軍ユニット → 仮ユニットの移動可能範囲を計算して、空きマスに展開 (空母発艦と同じ)
  for(var i=production.length-1; i>=0; i--){
    var p = production[i];
    if(p.owner !== aiFaction) continue;
    if(!p.ready) continue;
    var occupier = unitAt(p.x, p.y);
    var spawnX = p.x, spawnY = p.y;
    if(occupier){
      // 敵が乗っている場合は取り出せない
      if(!isAlly(occupier.owner, aiFaction)) continue;
      // 自軍ユニットが乗っている → 隣接の空きマスに展開
      var tmpUnit = makeUnit(p.type, aiFaction, p.x, p.y);
      tmpUnit.id = -1; // 一時 ID (units に push しない)
      var spawnMovable = computeMovable(tmpUnit);
      var bestSpawn = null;
      var bestSpawnD = Infinity;
      for(var smk in spawnMovable){
        var smxy = smk.split(',');
        var smx = parseInt(smxy[0]), smy = parseInt(smxy[1]);
        if(smx === p.x && smy === p.y) continue; // 生産マス自体はスキップ
        if(unitAt(smx, smy)) continue; // 他のユニットがいるマスはスキップ
        // 移動コスト最小を優先 (距離が近い方が良い)
        var sd = manhattan(smx, smy, p.x, p.y);
        if(sd < bestSpawnD){ bestSpawnD = sd; bestSpawn = { x: smx, y: smy }; }
      }
      if(!bestSpawn){
        if(window.AI_DEBUG) try{ console.log('  → 生産取り出し保留: '+p.type+'@('+p.x+','+p.y+') 展開先なし'); }catch(e){}
        continue; // 展開先がない → 取り出し保留
      }
      spawnX = bestSpawn.x; spawnY = bestSpawn.y;
      if(window.AI_DEBUG) try{ console.log('  → 生産取り出し展開: '+p.type+' @('+p.x+','+p.y+') → ('+spawnX+','+spawnY+') (自軍占有のため隣接展開)'); }catch(e){}
    }
    var newU = makeUnit(p.type, aiFaction, spawnX, spawnY);
    newU.acted = false;
    newU.moved = false;
    units.push(newU);
    production.splice(i, 1);
  }
  // 施設スロットに収容した修理ユニットの取り出し (HP 満タンまで回復したら戦線復帰)
  // makeUnit で作り直すため、取り出し時に燃料・弾薬も満タンになる (HP は回復後の値を保持)
  for(var rk in captures){
    var rcap = captures[rk];
    if(rcap.owner !== aiFaction) continue;
    if(!rcap.cargo || rcap.cargo.length === 0) continue;
    if(rcap.upgrading) continue; // アップグレード中はスロット停止
    var rxy = rk.split(',');
    var rfx = parseInt(rxy[0]), rfy = parseInt(rxy[1]);
    for(var rci = rcap.cargo.length - 1; rci >= 0; rci--){
      var rcg = rcap.cargo[rci];
      if(rcg.owner !== aiFaction) continue;
      // 収容した同ラウンド中は取り出せない
      if(typeof rcg.storedRound === 'number' && rcg.storedRound === roundNumber) continue;
      // HP 満タンまで回復したら取り出す (回復途中なら収容継続)
      if((rcg.hp || 0) < HP_MAX) continue;
      // 展開先: 施設マスが空いていればそこ、埋まっていれば隣接空きマス
      var rSpawnX = rfx, rSpawnY = rfy;
      if(unitAt(rfx, rfy)){
        var rTmp = makeUnit(rcg.type, aiFaction, rfx, rfy);
        rTmp.id = -1;
        var rMov = computeMovable(rTmp);
        var rBest = null, rBestD = Infinity;
        for(var rmk in rMov){
          var rmxy = rmk.split(',');
          var rmx = parseInt(rmxy[0]), rmy = parseInt(rmxy[1]);
          if(rmx === rfx && rmy === rfy) continue;
          if(unitAt(rmx, rmy)) continue;
          var rmd = manhattan(rmx, rmy, rfx, rfy);
          if(rmd < rBestD){ rBestD = rmd; rBest = { x: rmx, y: rmy }; }
        }
        if(!rBest) continue; // 展開先なし → 取り出し保留
        rSpawnX = rBest.x; rSpawnY = rBest.y;
      }
      var rOut = makeUnit(rcg.type, aiFaction, rSpawnX, rSpawnY);
      rOut.hp = rcg.hp;
      rOut.acted = false;
      rOut.moved = false;
      // 段階2: 取り出し時の燃料・弾薬の補給は施設の備蓄から払う
      payTakeOutSupply(rOut, rcg, rfx, rfy);
      if(rcg.cargo && rcg.cargo.length > 0) rOut.cargo = rcg.cargo.slice();
      units.push(rOut);
      rcap.cargo.splice(rci, 1);
      if(window.AI_DEBUG) try{ console.log('  → 施設収容から取り出し(修理完了): '+TYPE[rcg.type].name+' @('+rSpawnX+','+rSpawnY+') HP'+rcg.hp); }catch(e){}
    }
  }
  // 空母 cargo から搭載機を発艦 (補給が 50% 以上なら発艦)
  // 搭載機が空母上で休んでいるのは無意味 (空母を守るのが搭載機の役割) なので積極的に出す
  for(var ci=0; ci<units.length; ci++){
    var carrier = units[ci];
    if(carrier.owner !== aiFaction || carrier.hp <= 0) continue;
    if(TYPE[carrier.type].canCarry !== 'AIR') continue;
    if(!carrier.cargo || carrier.cargo.length === 0) continue;
    // 隣接の空きマスを探す (搭載機が侵入可能なマス)
    var deployDirs = [[1,0],[-1,0],[0,1],[0,-1]];
    // cargo を末尾から処理 (splice 安全のため)
    for(var cgi=carrier.cargo.length-1; cgi>=0; cgi--){
      var cg = carrier.cargo[cgi];
      var cgT = TYPE[cg.type];
      if(!cgT || cgT.cat !== 'AIR') continue;
      // 補給判定: 燃料 ≥ fuelMax × 50%
      var fuelOk = (cg.fuel === undefined) || (cgT.fuelMax === undefined) || (cg.fuel >= cgT.fuelMax * 0.5);
      // 弾薬判定: 全武器について有限弾の合計が maxAmmo × 50% 以上
      var ammoOk = true;
      if(cgT.weapons && cg.ammo){
        var ammoTotal = 0, ammoCurrent = 0;
        for(var wi=0; wi<cgT.weapons.length; wi++){
          var w = cgT.weapons[wi];
          if(w.infiniteAmmo) continue;
          var maxA = w.ammo || 0;
          if(maxA <= 0) continue;
          ammoTotal += maxA;
          ammoCurrent += Math.max(0, cg.ammo[wi] || 0);
        }
        if(ammoTotal > 0) ammoOk = (ammoCurrent >= ammoTotal * 0.5);
      }
      if(!fuelOk || !ammoOk){
        if(window.AI_DEBUG) try{ console.log('  → 搭載機発艦保留: '+cg.type+' @ carrier('+carrier.x+','+carrier.y+') fuel='+cg.fuel+'/'+cgT.fuelMax+' ammoOk='+ammoOk); }catch(e){}
        continue;
      }
      // 発艦位置選定: 隣接マスのうち、搭載機が侵入可能で空きマス
      var bestDeploy = null, bestDeployD = Infinity;
      for(var di=0; di<deployDirs.length; di++){
        var nx = carrier.x + deployDirs[di][0];
        var ny = carrier.y + deployDirs[di][1];
        if(!inBounds(nx, ny)) continue;
        var c = moveCost(cg.type, M[ny][nx]);
        if(c === Infinity) continue;
        if(unitAt(nx, ny)) continue;
        // 発艦は隣接マスならどこでも (距離は変わらず 1)
        bestDeploy = { x: nx, y: ny }; break;
      }
      if(!bestDeploy){
        if(window.AI_DEBUG) try{ console.log('  → 搭載機発艦保留: '+cg.type+' @ carrier('+carrier.x+','+carrier.y+') 隣接空きなし'); }catch(e){}
        continue;
      }
      // 発艦実行
      var deployedU = makeUnit(cg.type, aiFaction, bestDeploy.x, bestDeploy.y);
      deployedU.hp = cg.hp;
      if(typeof cg.fuel === 'number') deployedU.fuel = cg.fuel;
      if(cg.ammo) deployedU.ammo = cg.ammo.slice();
      deployedU.acted = false; // quickDeploy なので即行動可
      deployedU.moved = false;
      units.push(deployedU);
      carrier.cargo.splice(cgi, 1);
      if(window.AI_DEBUG) try{ console.log('  → 搭載機発艦: '+cg.type+' carrier('+carrier.x+','+carrier.y+') → ('+bestDeploy.x+','+bestDeploy.y+')'); }catch(e){}
    }
  }
  } // 取り出しフェーズ終了
  // takeout のみの場合はここで終了
  if(phase === 'takeout') return null;
  // === 新規生産フェーズ ===
  // === AI 生産戦略の事前計算 ===
  // 1) 自軍視界内に見える敵を集める
  var visibleEnemies = [];
  for(var i=0; i<units.length; i++){
    var e = units[i];
    if(isAlly(e.owner, aiFaction) || e.owner === 'N' || e.hp <= 0) continue;
    if(isUnitVisibleTo(e, aiFaction)) visibleEnemies.push(e);
  }
  // 2) 自軍ユニット数と索敵ユニット数
  var aiUnitCount = 0;
  var aiScoutCount = 0;
  var SCOUT_TYPES = { SCOUT: true, RECON_PLANE: true, ASW_PLANE: true };
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    aiUnitCount++;
    if(SCOUT_TYPES[u.type]) aiScoutCount++;
  }
  // 3) 生産モード判定
  // 占領目標を計算 (首都から近い順、最大5つ)
  // 歩兵生産は地続き目標がある時のみ意味がある (海越えは将来の輸送船実装で対応)
  var capTargetsAll = _aiCaptureTargets(aiFaction);
  var capTargets = capTargetsAll.filter(function(t){ return t.reachable; });
  var unreachableTargets = capTargetsAll.filter(function(t){ return !t.reachable; });
  var ruinsCount = 0;
  for(var ci=0; ci<capTargets.length; ci++){ if(capTargets[ci].isRuins) ruinsCount++; }
  var needInfantry = capTargets.length - ruinsCount; // 地続き廃墟以外の占領目標数
  // 地続き廃墟があれば工兵を生産。複数あれば複数体だが上限3 (生産しすぎ防止)
  var needEngineer = Math.min(ruinsCount, 3);
  // 橋建設計画: urgent (進軍ブロック状態) なら工兵需要を+1
  var bridgePlanGlobal = _aiBridgePlan(aiFaction);
  if(bridgePlanGlobal.urgent){
    needEngineer = Math.min(needEngineer + 1, 4);
    if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] bridge urgent → needEngineer+1 ('+needEngineer+'), spots='+bridgePlanGlobal.bridgeSpots.length); }catch(e){}
  }
  var capUnits = _aiCountCaptureUnits(aiFaction);
  // 歩兵不足判定: needInfantry より少ないが、歩兵上限 (4 + 輸送×2) を超えている場合は不足扱いにしない
  // (歩兵を作りたくても輸送ユニット不足で乗せられない → 輸送優先するため)
  var infantryShort = capUnits.infantry < needInfantry;
  var engineerShort = capUnits.engineer < needEngineer;

  // 渡海作戦判定: 海越え目標があり、かつ輸送ユニットを持っていない場合は輸送ユニットを生産
  // 輸送ユニットの数をカウント (本体 + 生産中) - 3種別に分けて管理
  var transportCountShip = 0; // 輸送船 (全陸ユニット運搬可)
  var transportCountHeli = 0; // 輸送ヘリ (歩兵専用)
  var transportCountPlane = 0; // 輸送機 (歩兵+装輪+砲兵系+空挺戦車)
  for(var ti=0; ti<units.length; ti++){
    var tu = units[ti];
    if(tu.owner !== aiFaction || tu.hp <= 0) continue;
    if(tu.type === 'TRANSPORT_SHIP') transportCountShip++;
    else if(tu.type === 'TRANSPORT_HELI') transportCountHeli++;
    else if(tu.type === 'TRANSPORT_PLANE') transportCountPlane++;
  }
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    var pt = production[pi].type;
    if(pt === 'TRANSPORT_SHIP') transportCountShip++;
    else if(pt === 'TRANSPORT_HELI') transportCountHeli++;
    else if(pt === 'TRANSPORT_PLANE') transportCountPlane++;
  }
  // 後方互換用カウント
  var transportCountAir = transportCountHeli + transportCountPlane;
  var transportCount = transportCountShip + transportCountAir;
  // 必要数計算: 海越え目標があれば輸送ユニットを作る (上陸済み判定は廃止)
  // 各種別の上限: 5 (それ以上作っても撃沈リスク・護衛コストで非効率)
  //  輸送船: 海越え目標数 × 2 (戦車・補給車を運ぶ、撃沈備え) 上限5
  //  輸送ヘリ: 海越え目標数 上限4 (歩兵専用)
  //  輸送機: 海越え目標数 上限4 (装輪・砲兵系・空挺戦車向け)
  var SHIP_CAP_MAX = 4;
  var HELI_CAP_MAX = 4;
  var PLANE_CAP_MAX = 4;
  var transportShipNeeded = 0;
  var transportHeliNeeded = 0;
  var transportPlaneNeeded = 0;
  if(unreachableTargets.length > 0){
    transportShipNeeded  = Math.min(unreachableTargets.length * 2, SHIP_CAP_MAX);
    transportHeliNeeded  = Math.min(unreachableTargets.length,     HELI_CAP_MAX);
    transportPlaneNeeded = Math.min(unreachableTargets.length,     PLANE_CAP_MAX);
  }
  // 後方互換用合算
  var transportAirNeeded = transportHeliNeeded + transportPlaneNeeded;
  var transportNeeded = transportShipNeeded + transportAirNeeded;
  // 不足判定: 各種別が必要数に達していなければ amphib モード
  var transportShortShip  = (transportShipNeeded  > 0 && transportCountShip  < transportShipNeeded);
  var transportShortHeli  = (transportHeliNeeded  > 0 && transportCountHeli  < transportHeliNeeded);
  var transportShortPlane = (transportPlaneNeeded > 0 && transportCountPlane < transportPlaneNeeded);
  var transportShortAir   = transportShortHeli || transportShortPlane;
  // 上限到達判定 (どれだけ余裕があっても作らない)
  var transportShipAtMax  = (transportCountShip  >= SHIP_CAP_MAX);
  var transportHeliAtMax  = (transportCountHeli  >= HELI_CAP_MAX);
  var transportPlaneAtMax = (transportCountPlane >= PLANE_CAP_MAX);
  // 歩兵系 (INFANTRY/AT_INFANTRY/MOUNTAIN_TROOP/PARATROOPER/ENGINEER) 合計上限: 8体
  // ルール: 各個別は4体まで、合計は8体まで
  var INFANTRY_GROUP_MAX = 8;
  var infantryGroupCount = capUnits.infantry + capUnits.engineer; // 歩兵 + 工兵
  var infOverflowed = (infantryGroupCount >= INFANTRY_GROUP_MAX);
  var infCap = INFANTRY_GROUP_MAX; // 後方互換用 (ログ表示)
  var infCount = infantryGroupCount; // 後方互換用
  // 歩兵が一定数以上いるのに輸送ヘリが不足 → 輸送ヘリ優先
  var infNeedsMoreHeli = (capUnits.infantry >= 4) && (transportCountHeli * 2 < capUnits.infantry) && !transportHeliAtMax;
  if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] infantry limit: total='+infantryGroupCount+'/'+INFANTRY_GROUP_MAX+' inf='+capUnits.infantry+' eng='+capUnits.engineer+' overflow='+infOverflowed+' needHeli='+infNeedsMoreHeli+' (ship/heli/plane='+transportCountShip+'/'+transportCountHeli+'/'+transportCountPlane+')'); }catch(e){}
  // 歩兵オーバーフロー時は infantryShort/engineerShort を強制 false に
  if(infOverflowed){
    infantryShort = false;
    engineerShort = false;
  }
  // === 全体ユニット数上限 60 + 個別ユニット種別上限 4 ===
  // 各 type の現在数 (本体 + 生産中) を集計
  var TOTAL_UNIT_MAX = 60;
  var PER_TYPE_MAX = 4;
  var unitTypeCount = {}; // { type: count }
  var totalUnitCount = 0;
  for(var i=0; i<units.length; i++){
    var fu = units[i];
    if(fu.owner !== aiFaction || fu.hp <= 0) continue;
    unitTypeCount[fu.type] = (unitTypeCount[fu.type] || 0) + 1;
    totalUnitCount++;
  }
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    var pt = production[pi].type;
    unitTypeCount[pt] = (unitTypeCount[pt] || 0) + 1;
    totalUnitCount++;
  }
  var totalUnitOverflowed = (totalUnitCount >= TOTAL_UNIT_MAX);
  // 歩兵系の type 集合 (合計判定用)
  var INFANTRY_TYPES = { INFANTRY:true, AT_INFANTRY:true, MOUNTAIN_TROOP:true, PARATROOPER:true, ENGINEER:true };
  if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] unit caps: total='+totalUnitCount+'/'+TOTAL_UNIT_MAX+' overflow='+totalUnitOverflowed); }catch(e){}
  // 輸送ユニットが必要か?
  // 条件A (基本): 海越え目標がある && 地続き目標がほぼ片付いている && いずれかの輸送種別が不足
  // 条件B (並行): 海越え目標が2個以上ある && いずれかの輸送種別が不足 (地続き目標があっても並行生産)
  // 条件C (歩兵過剰): 歩兵が4以上溜まっていて、輸送ヘリ不足
  var amphibBasic = (unreachableTargets.length > 0) &&
                    (capTargets.length === 0 || capUnits.total >= needInfantry + needEngineer) &&
                    (transportShortShip || transportShortHeli || transportShortPlane);
  var amphibParallel = (unreachableTargets.length >= 2) &&
                       (transportShortShip || transportShortHeli || transportShortPlane);
  var amphibOverflow = (unreachableTargets.length > 0) && infNeedsMoreHeli;
  var amphibNeeded = amphibBasic || amphibParallel || amphibOverflow;
  if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] transport needs: ship='+transportCountShip+'/'+transportShipNeeded+' heli='+transportCountHeli+'/'+transportHeliNeeded+' plane='+transportCountPlane+'/'+transportPlaneNeeded+' (unreach='+unreachableTargets.length+')'); }catch(e){}

  // === カテゴリ別脅威/カウンター集計 ===
  var threats = _aiCountThreats(visibleEnemies);
  var counters = _aiCountCounters(aiFaction);
  // 各カテゴリのニーズ判定: 脅威数 > カウンター数 ならニーズあり
  // 対空: 敵航空ユニットが1体以上居て、自軍対空ユニットが脅威数以下
  var antiAirNeeded = (threats.air >= 1 && counters.antiAir < threats.air);
  // 対潜: 敵潜水艦が1体以上居て、自軍対潜ユニットが0
  var antiSubNeeded = (threats.sub >= 1 && counters.antiSub === 0);
  // 対装甲: 敵装甲ユニットが2体以上居て、自軍対装甲ユニットが脅威数の半分以下
  var antiArmorNeeded = (threats.armor >= 2 && counters.antiArmor < Math.ceil(threats.armor / 2));
  // 間接砲: 敵が3体以上見えるのに自軍の間接砲が0、または敵総数の1/4以下
  var artilleryNeeded = (visibleEnemies.length >= 3 && counters.indirect < Math.max(1, Math.floor(visibleEnemies.length / 4)));

  // 航空優勢判定: 敵航空ユニットが多いなら、空対空戦闘機 (FIGHTER, CARRIER_FIGHTER) で制空権を取る
  // 地上対空 (対空ミサイル等) は射程が短いため、戦闘機で迎撃する方が広範囲をカバーできる
  // 自軍の戦闘機系 (FIGHTER, CARRIER_FIGHTER) の数をカウント
  var fighterCount = 0;
  for(var i=0; i<units.length; i++){
    var fu = units[i];
    if(fu.owner !== aiFaction || fu.hp <= 0) continue;
    if(fu.type === 'FIGHTER' || fu.type === 'CARRIER_FIGHTER') fighterCount++;
  }
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    var pt = production[pi].type;
    if(pt === 'FIGHTER' || pt === 'CARRIER_FIGHTER') fighterCount++;
  }
  // 敵航空ユニット2機以上 + 自軍戦闘機が脅威の半分以下 → 制空権獲得モード
  var airSuperiorityNeeded = (threats.air >= 2 && fighterCount < Math.ceil(threats.air / 2));

  // 偵察判定: 占領目標周辺が見えていない & 必要な偵察ユニットが不足
  var targetVis = _aiTargetVisibility(aiFaction);
  var scoutCounts = _aiCountScouts(aiFaction);
  // 偵察ユニット上限: 偵察車 4, 偵察機 4
  var SCOUT_GROUND_MAX = 4;
  var SCOUT_AIR_MAX = 4;
  var scoutGroundAtMax = (scoutCounts.ground >= SCOUT_GROUND_MAX);
  var scoutAirAtMax = (scoutCounts.air >= SCOUT_AIR_MAX);
  // 海越え目標が見えていないのに偵察機がない → 急務 (amphibより前に判定)
  // 上限到達済みなら急務にしない
  var scoutAirUrgent = targetVis.needAirScout && scoutCounts.air === 0 && !scoutAirAtMax;
  // 地続き目標が見えていないのに偵察車がない → 急務
  var scoutGroundUrgent = targetVis.needGroundScout && scoutCounts.ground === 0 && !scoutGroundAtMax;
  var scoutUrgent = scoutAirUrgent || scoutGroundUrgent;
  // 補給インフラ判定: 自軍航空ユニット数に対して補給容量が足りないか
  var supplyInfra = _aiNeedsSupplyInfra(aiFaction);
  var supportInfraNeeded = supplyInfra.needAirTanker || supplyInfra.needCarrier;
  if(window.AI_DEBUG && supportInfraNeeded) try{ console.log('[AI '+aiFaction+'] supply infra short: airUnits='+supplyInfra.airUnitCount+' capacity='+supplyInfra.supplyCapacity+' needAirTanker='+supplyInfra.needAirTanker+' needCarrier='+supplyInfra.needCarrier); }catch(e){}

  var prodMode;
  // 優先度: 占領担当不足 → 進軍前偵察 → 渡海作戦 → 補給インフラ → 対潜(火急) → 対空(火急) → 対装甲 → 間接砲 → 通常脅威 → 索敵 → 通常
  // (廃墟があるのに工兵がいない、空き拠点があるのに歩兵がいない、は最優先で対処)
  if(engineerShort){
    prodMode = 'engineer'; // 廃墟があり工兵が足りない → 工兵を生産
  } else if(infantryShort){
    prodMode = 'capture'; // 占領要員が足りない → 歩兵系を生産
  } else if(scoutUrgent){
    prodMode = 'scout'; // 進軍前偵察: 目標周辺が見えてないのに偵察ユニット不足 → 偵察を優先
  } else if(amphibNeeded){
    prodMode = 'amphib'; // 海越え目標があり輸送が無い → 輸送ユニット生産
  } else if(supportInfraNeeded){
    prodMode = 'support_infra'; // 航空機が多いのに補給インフラ不足 → 空中給油機・空母優先
  } else if(antiSubNeeded){
    prodMode = 'anti_sub'; // 敵潜水艦への対応 (対潜ユニットがない場合は最優先)
  } else if(airSuperiorityNeeded){
    prodMode = 'air_superiority'; // 敵航空多い & 戦闘機不足 → 戦闘機・艦上戦闘機で制空
  } else if(antiAirNeeded){
    prodMode = 'anti_air'; // 敵航空への対応
  } else if(antiArmorNeeded){
    prodMode = 'anti_armor'; // 敵装甲への対応
  } else if(artilleryNeeded){
    prodMode = 'artillery'; // 間接砲不足
  } else if(visibleEnemies.length >= 3){
    prodMode = 'threat'; // 占領要員は揃っているが敵が多い → 戦力増強
  } else if(aiUnitCount >= 5 && aiScoutCount === 0 && visibleEnemies.length <= 2){
    prodMode = 'scout'; // 索敵生産 (既存条件: 自軍が増えたのに索敵0)
  } else {
    prodMode = 'normal'; // 通常生産
  }
  if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] prodMode='+prodMode+' (reach='+capTargets.length+', unreach='+unreachableTargets.length+', infs='+capUnits.infantry+', engs='+capUnits.engineer+', transports='+transportCount+'/'+transportNeeded+', threats=air'+threats.air+'/sub'+threats.sub+'/armor'+threats.armor+', counters=AA'+counters.antiAir+'/ASW'+counters.antiSub+'/AT'+counters.antiArmor+'/IND'+counters.indirect+', scouts=G'+scoutCounts.ground+'/A'+scoutCounts.air+', unseenLand='+targetVis.unseenLandRatio.toFixed(2)+'/Sea='+targetVis.unseenSeaRatio.toFixed(2)+')'); }catch(e){}

  // 生産: 自軍占領済み生産施設で空きがあれば適当なユニットを生産
  for(var k in captures){
    var capObj = captures[k];
    if(capObj.owner !== aiFaction) continue;
    var xy = k.split(',');
    var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
    var ter = TER[M[fy][fx]];
    if(!ter.slots || !ter.produces || ter.produces.length === 0) continue;
    var ongoing = 0;
    for(var pi=0; pi<production.length; pi++){
      if(production[pi].x === fx && production[pi].y === fy) ongoing++;
    }
    var stored = (capObj.cargo || []).length;
    if(ongoing + stored >= ter.slots) continue;
    // 注: マスにユニットがいても生産予約は入れる
    var affordable = [];
    for(var pi=0; pi<ter.produces.length; pi++){
      var key = ter.produces[pi];
      var t = TYPE[key];
      if(t && !t.planned && (funds[aiFaction]||0) >= t.price) affordable.push(key);
    }
    // 全体ユニット数 60 を超える場合は生産しない
    if(totalUnitOverflowed){
      if(window.AI_DEBUG) try{ console.log('  → 全体ユニット数上限 ('+totalUnitCount+'/'+TOTAL_UNIT_MAX+') 到達: 生産スキップ'); }catch(e){}
      continue;
    }
    // 個別ユニット種別 4 体以上、または歩兵系合計 8 体以上のタイプを affordable から除外
    var beforeLimitLen = affordable.length;
    affordable = affordable.filter(function(k){
      // 個別上限 4
      if((unitTypeCount[k] || 0) >= PER_TYPE_MAX) return false;
      // 歩兵系合計 8
      if(INFANTRY_TYPES[k] && infantryGroupCount >= INFANTRY_GROUP_MAX) return false;
      return true;
    });
    if(window.AI_DEBUG && beforeLimitLen !== affordable.length){
      try{ console.log('  → 上限到達除外: '+beforeLimitLen+'→'+affordable.length+' (個別4 or 歩兵系合計'+infantryGroupCount+'/'+INFANTRY_GROUP_MAX+')'); }catch(e){}
    }
    // 歩兵オーバーフロー時: 占領できる歩兵系 (INFANTRY/AT_INFANTRY/MOUNTAIN_TROOP/PARATROOPER) を除外
    // 工兵は engineerShort モードで別管理されるので除外しない
    if(infOverflowed){
      var infExclude = { INFANTRY:true, AT_INFANTRY:true, MOUNTAIN_TROOP:true, PARATROOPER:true };
      var beforeLen = affordable.length;
      affordable = affordable.filter(function(k){ return !infExclude[k]; });
      if(window.AI_DEBUG && beforeLen !== affordable.length){
        try{ console.log('  → 歩兵オーバーフロー: affordableから歩兵除外 ('+beforeLen+'→'+affordable.length+')'); }catch(e){}
      }
    }
    // 偵察ユニット上限到達時は affordable から除外
    if(scoutGroundAtMax || scoutAirAtMax){
      var beforeScoutLen = affordable.length;
      affordable = affordable.filter(function(k){
        if(scoutGroundAtMax && k === 'SCOUT') return false;
        if(scoutAirAtMax && (k === 'RECON_PLANE' || k === 'ASW_PLANE')) return false;
        return true;
      });
      if(window.AI_DEBUG && beforeScoutLen !== affordable.length){
        try{ console.log('  → 偵察上限到達: affordableから除外 ('+beforeScoutLen+'→'+affordable.length+', G='+scoutCounts.ground+'/'+SCOUT_GROUND_MAX+' A='+scoutCounts.air+'/'+SCOUT_AIR_MAX+')'); }catch(e){}
      }
    }
    if(affordable.length === 0) continue;

    // ===== 仕様書通りの新ロジック (陸軍/海軍/空軍 すべて) =====
    var useNewLandLogic = (ter.group === 'factory');
    var useNewNavyLogic = (ter.group === 'port');
    var useNewAirLogic  = (ter.group === 'airport');
    if(useNewLandLogic){
      // 上限フィルタ済みの produces を使った仮 facility オブジェクトを作る
      // (元の TER 定義は破壊しない)
      var virtualFacility = {
        level: ter.level || 1,
        produces: affordable.slice()
      };
      // 抽選ごとの counts は最新を反映 (このループで既に生産予約されたものを含む)
      var landCounts = _aiCountLand(aiFaction);
      var landMapInfo = _aiMapInfo();
      var pickKey2 = _aiPickLandUnit(virtualFacility, aiFaction, landCounts, landMapInfo, funds[aiFaction] || 0);
      if(!pickKey2){
        if(window.AI_DEBUG) try{ console.log('  → 新陸軍ロジック: 抽選失敗 '+ter.name+'@('+fx+','+fy+')'); }catch(e){}
        continue;
      }
      var pickT2 = TYPE[pickKey2];
      funds[aiFaction] -= pickT2.price;
      var bonus3 = (ter && ter.prodTurnBonus) ? ter.prodTurnBonus : 0;
      var actualTurns3 = Math.max(1, pickT2.prodTurns + bonus3);
      production.push({
        x: fx, y: fy, type: pickKey2, owner: aiFaction,
        remaining: actualTurns3, ready: false
      });
      // 上限カウントを更新 (次のスロット抽選で正しい値を使うため)
      unitTypeCount[pickKey2] = (unitTypeCount[pickKey2] || 0) + 1;
      totalUnitCount++;
      if(INFANTRY_TYPES[pickKey2]) infantryGroupCount++;
      if(totalUnitCount >= TOTAL_UNIT_MAX) totalUnitOverflowed = true;
      if(infantryGroupCount >= INFANTRY_GROUP_MAX) infOverflowed = true;
      if(window.AI_DEBUG) try{ console.log('  → [新陸軍生産] '+ter.name+'@('+fx+','+fy+') で '+pickT2.name+' ('+pickT2.price+'G, '+actualTurns3+'T) phase='+_aiPhase(aiFaction)+' inf='+landCounts.infantry); }catch(e){}
      continue;
    }
    if(useNewNavyLogic){
      // 港系: 海軍生産ロジック
      var virtualFacilityN = {
        level: ter.level || 1,
        produces: affordable.slice()
      };
      var navyCounts = _aiCountNavy(aiFaction);
      var navyMapInfo = _aiMapInfo();
      var pickKeyN = _aiPickNavyUnit(virtualFacilityN, aiFaction, navyCounts, navyMapInfo, funds[aiFaction] || 0);
      if(!pickKeyN){
        if(window.AI_DEBUG) try{ console.log('  → 新海軍ロジック: 抽選失敗 '+ter.name+'@('+fx+','+fy+')'); }catch(e){}
        continue;
      }
      var pickTN = TYPE[pickKeyN];
      funds[aiFaction] -= pickTN.price;
      var bonusN = (ter && ter.prodTurnBonus) ? ter.prodTurnBonus : 0;
      var actualTurnsN = Math.max(1, pickTN.prodTurns + bonusN);
      production.push({
        x: fx, y: fy, type: pickKeyN, owner: aiFaction,
        remaining: actualTurnsN, ready: false
      });
      unitTypeCount[pickKeyN] = (unitTypeCount[pickKeyN] || 0) + 1;
      totalUnitCount++;
      if(totalUnitCount >= TOTAL_UNIT_MAX) totalUnitOverflowed = true;
      if(window.AI_DEBUG) try{ console.log('  → [新海軍生産] '+ter.name+'@('+fx+','+fy+') で '+pickTN.name+' ('+pickTN.price+'G, '+actualTurnsN+'T) aux='+navyCounts.auxiliary); }catch(e){}
      continue;
    }
    if(useNewAirLogic){
      // 空港系: 空軍生産ロジック
      var virtualFacilityA = {
        level: ter.level || 1,
        produces: affordable.slice()
      };
      var airCounts = _aiCountAir(aiFaction);
      var airMapInfo = _aiMapInfo();
      var pickKeyA = _aiPickAirUnit(virtualFacilityA, aiFaction, airCounts, airMapInfo, funds[aiFaction] || 0);
      if(!pickKeyA){
        if(window.AI_DEBUG) try{ console.log('  → 新空軍ロジック: 抽選失敗 '+ter.name+'@('+fx+','+fy+')'); }catch(e){}
        continue;
      }
      var pickTA = TYPE[pickKeyA];
      funds[aiFaction] -= pickTA.price;
      var bonusA = (ter && ter.prodTurnBonus) ? ter.prodTurnBonus : 0;
      var actualTurnsA = Math.max(1, pickTA.prodTurns + bonusA);
      production.push({
        x: fx, y: fy, type: pickKeyA, owner: aiFaction,
        remaining: actualTurnsA, ready: false
      });
      unitTypeCount[pickKeyA] = (unitTypeCount[pickKeyA] || 0) + 1;
      totalUnitCount++;
      if(totalUnitCount >= TOTAL_UNIT_MAX) totalUnitOverflowed = true;
      if(window.AI_DEBUG) try{
        var ec = airCounts.enemyCounts;
        console.log('  → [新空軍生産] '+ter.name+'@('+fx+','+fy+') で '+pickTA.name+' ('+pickTA.price+'G, '+actualTurnsA+'T) visible='+airCounts.enemyVisible.length+' (INF'+ec.INF+'/UV'+ec.UV+'/AV'+ec.AV+'/US'+ec.US+'/AS'+ec.AS+'/AC'+ec.AC+'/HE'+ec.HE+'/SUB'+ec.SUB+')');
      }catch(e){}
      continue;
    }
    // ===== 既存ロジック (フォールバック、通常は使われない) =====

    // 生産モードに応じてユニットを選ぶ
    var pickKey = null;
    var useThreatMode = (prodMode === 'threat' && Math.random() < 0.8);
    var useScoutMode = (prodMode === 'scout');
    var useEngineerMode = (prodMode === 'engineer');
    var useCaptureMode = (prodMode === 'capture');
    var useAmphibMode = (prodMode === 'amphib');
    var useSupportInfraMode = (prodMode === 'support_infra');
    var useAntiAirMode = (prodMode === 'anti_air');
    var useAirSuperiorityMode = (prodMode === 'air_superiority');
    var useAntiSubMode = (prodMode === 'anti_sub');
    var useAntiArmorMode = (prodMode === 'anti_armor');
    var useArtilleryMode = (prodMode === 'artillery');

    // === カテゴリ特化モード (対空/対潜/対装甲/間接砲) ===
    // 該当の役割を持つユニットの中から、最も価格が高い (= 強い) ものを選ぶ
    // 役割なしの施設では何も選ばずフォールバック (= threat または通常生産へ)
    function _pickByRole(roleKey){
      var candidates = [];
      for(var pi=0; pi<affordable.length; pi++){
        var key = affordable[pi];
        var roles = _aiUnitRoles(key);
        if(roles[roleKey]) candidates.push(key);
      }
      if(candidates.length === 0) return null;
      // 価格でソートして高い方を優先 (戦力強化)
      candidates.sort(function(a, b){ return TYPE[b].price - TYPE[a].price; });
      // 上位2つの中からランダムに選ぶ (ばらつきを少し)
      var topN = Math.min(2, candidates.length);
      return candidates[Math.floor(Math.random() * topN)];
    }
    if(useAntiSubMode){ pickKey = _pickByRole('antiSub'); }
    // 航空優勢: 戦闘機・艦上戦闘機 を優先 (空港・空母系兵器廠で作れる)
    if(useAirSuperiorityMode && !pickKey){
      var fighterOrder = ['FIGHTER', 'CARRIER_FIGHTER'];
      for(var oi=0; oi<fighterOrder.length; oi++){
        for(var pi=0; pi<affordable.length; pi++){
          if(affordable[pi] === fighterOrder[oi]){ pickKey = fighterOrder[oi]; break; }
        }
        if(pickKey) break;
      }
    }
    if(useAntiAirMode && !pickKey){ pickKey = _pickByRole('antiAir'); }
    if(useAntiArmorMode && !pickKey){ pickKey = _pickByRole('antiArmor'); }
    if(useArtilleryMode && !pickKey){ pickKey = _pickByRole('indirect'); }

    if(useEngineerMode && !pickKey){
      // 工兵を優先生産 (この施設が工兵を作れる場合のみ)
      for(var pi=0; pi<affordable.length; pi++){
        if(affordable[pi] === 'ENGINEER'){ pickKey = 'ENGINEER'; break; }
      }
    }
    if(useCaptureMode && !pickKey){
      // 歩兵系(占領可能ユニット)を優先生産: 安価な歩兵を優先 (歩兵→対戦車歩兵)
      var infOrder = ['INFANTRY', 'AT_INFANTRY'];
      for(var oi=0; oi<infOrder.length; oi++){
        for(var pi=0; pi<affordable.length; pi++){
          if(affordable[pi] === infOrder[oi]){ pickKey = infOrder[oi]; break; }
        }
        if(pickKey) break;
      }
    }
    if(useAmphibMode && !pickKey){
      // 渡海作戦: 不足している種別を優先生産
      // transportShortShip / transportShortAir は外側で計算済み
      var transportOrder;
      if(transportShortShip && !transportShortAir){
        // 船のみ不足 → 船最優先 (作れない場合のフォールバックとして空輸も検討)
        transportOrder = ['TRANSPORT_SHIP', 'TRANSPORT_PLANE', 'TRANSPORT_HELI'];
      } else if(transportShortAir && !transportShortShip){
        // 空輸のみ不足 → 空輸最優先 (歩兵運搬は輸送ヘリ最効率)
        transportOrder = ['TRANSPORT_HELI', 'TRANSPORT_PLANE', 'TRANSPORT_SHIP'];
      } else if(transportShortShip && transportShortAir){
        // 両方不足 → 海越え目標があれば船優先 (戦車を運ぶ侵攻初期が重要)
        transportOrder = ['TRANSPORT_SHIP', 'TRANSPORT_HELI', 'TRANSPORT_PLANE'];
      } else {
        // 不足なし (amphibNeeded が false のはずだがガード) → 従来順
        transportOrder = ['TRANSPORT_SHIP', 'TRANSPORT_HELI', 'TRANSPORT_PLANE'];
      }
      // 上限到達の種別を除外 (これ以上作っても無駄)
      transportOrder = transportOrder.filter(function(k){
        if(k === 'TRANSPORT_SHIP'  && transportShipAtMax)  return false;
        if(k === 'TRANSPORT_HELI'  && transportHeliAtMax)  return false;
        if(k === 'TRANSPORT_PLANE' && transportPlaneAtMax) return false;
        return true;
      });
      // この施設が作れる輸送ユニットを採用
      for(var oi=0; oi<transportOrder.length; oi++){
        for(var pi=0; pi<affordable.length; pi++){
          if(affordable[pi] === transportOrder[oi]){ pickKey = transportOrder[oi]; break; }
        }
        if(pickKey) break;
      }
      // 輸送ユニットが作れない施設(陸上工場など)では、フェーズに応じて陸ユニットを生産
      // C: 輸送船が不足している場合、戦車系の生産はセーブ (待機する戦車が増えるのを防ぐ)
      //    待機予定戦車 (= 輸送待ち重車両ユニット数) が輸送可能枠を超えていれば、戦車は作らず歩兵に
      if(!pickKey){
        // 自軍の母島にいる「輸送待ちになりうる」陸ユニット数をカウント
        // (船で運ぶ予定: 戦車系 + 補給車)
        var waitingLandCount = _aiCountWaitingHeavyLand(aiFaction);
        // 輸送船の総積載キャパシティ
        var shipCapacityTotal = 0;
        for(var ti2=0; ti2<units.length; ti2++){
          var tu2 = units[ti2];
          if(tu2.owner !== aiFaction || tu2.hp <= 0) continue;
          if(tu2.type !== 'TRANSPORT_SHIP') continue;
          var ts2T = TYPE[tu2.type];
          var occupied = (tu2.cargo || []).length;
          shipCapacityTotal += Math.max(0, (ts2T.capacity || 0) - occupied);
        }
        // 戦車系を作りすぎてないか判定
        // 「待機戦車 ≥ 輸送可能枠」かつ「海越え目標がある」なら、戦車系は作らない
        var skipHeavy = (unreachableTargets.length > 0)
                     && (waitingLandCount >= shipCapacityTotal);
        var landFallback;
        if(transportShortShip && !skipHeavy){
          // 未上陸&戦車枠あり: 戦車・補給車を作る
          landFallback = ['MEDIUM_TANK', 'LIGHT_TANK', 'SUPPLY_TRUCK', 'HEAVY_TANK', 'TANK_DESTROYER', 'INFANTRY', 'AT_INFANTRY'];
        } else {
          // 上陸済み or 戦車枠フル: 歩兵を作る
          landFallback = ['INFANTRY', 'AT_INFANTRY'];
        }
        if(window.AI_DEBUG) try{ console.log('  → amphib fallback land: waitingHeavy='+waitingLandCount+' shipCap='+shipCapacityTotal+' skipHeavy='+skipHeavy); }catch(e){}
        for(var oi=0; oi<landFallback.length; oi++){
          for(var pi=0; pi<affordable.length; pi++){
            if(affordable[pi] === landFallback[oi]){ pickKey = landFallback[oi]; break; }
          }
          if(pickKey) break;
        }
      }
    }
    // 補給インフラモード: 空中給油機 (上限2) > 給油艦 > 軽空母 > 空母
    if(useSupportInfraMode && !pickKey){
      var infraOrder = [];
      if(supplyInfra.needAirTanker) infraOrder.push('AERIAL_TANKER');
      if(supplyInfra.needCarrier){
        // 安い順 → 軽空母 → 空母 → 装甲空母
        infraOrder.push('LIGHT_CARRIER', 'CARRIER', 'ARMORED_CARRIER');
      }
      // 給油艦も補給に役立つ (海上ユニット向けだが)
      infraOrder.push('OILER');
      for(var oi=0; oi<infraOrder.length; oi++){
        for(var pi=0; pi<affordable.length; pi++){
          if(affordable[pi] === infraOrder[oi]){ pickKey = infraOrder[oi]; break; }
        }
        if(pickKey) break;
      }
      if(window.AI_DEBUG && pickKey) try{ console.log('  → support_infra選択: '+pickKey); }catch(e){}
    }
    if(useThreatMode && !pickKey){
      // 脅威反応: 見える敵への有効ダメージ合計が最大のユニットを選ぶ
      // スコア = 全敵に対して、 候補ユニットの全武器の中で最大火力を合計
      var bestScore = -1;
      for(var pi=0; pi<affordable.length; pi++){
        var key = affordable[pi];
        var t = TYPE[key];
        var score = 0;
        for(var ei=0; ei<visibleEnemies.length; ei++){
          var enemy = visibleEnemies[ei];
          var armorClass = getArmorClass(enemy);
          var maxAtk = 0;
          for(var wi=0; wi<t.weapons.length; wi++){
            var atkVal = t.weapons[wi].atk[armorClass] || 0;
            if(atkVal > maxAtk) maxAtk = atkVal;
          }
          score += maxAtk;
        }
        if(score > bestScore){ bestScore = score; pickKey = key; }
      }
      // スコア0なら通常生産にフォールバック
      if(bestScore <= 0) pickKey = null;
    }
    if(useScoutMode){
      // 索敵生産: 不足している種別を優先
      // 海越え目標が見えてないかつ偵察機0 → RECON_PLANE 優先
      // 地続き目標が見えてないかつ偵察車0 → SCOUT 優先
      // 両方不足なら、施設の特性に応じて選ぶ (空港なら偵察機、工場なら偵察車)
      var scoutOrder = [];
      if(scoutAirUrgent && scoutGroundUrgent){
        // 両方必要: 偵察機を最優先 (航続距離・速度で広範囲をカバーできる)
        scoutOrder = ['RECON_PLANE', 'SCOUT', 'ASW_PLANE'];
      } else if(scoutAirUrgent){
        // 海越えのみ偵察必要 → 偵察機優先
        scoutOrder = ['RECON_PLANE', 'ASW_PLANE', 'SCOUT'];
      } else if(scoutGroundUrgent){
        // 地続きのみ偵察必要 → 偵察車優先
        scoutOrder = ['SCOUT', 'RECON_PLANE', 'ASW_PLANE'];
      } else {
        // 既存条件 (aiUnitCount >= 5 && aiScoutCount === 0): 適当な索敵系
        scoutOrder = ['SCOUT', 'RECON_PLANE', 'ASW_PLANE'];
      }
      for(var oi=0; oi<scoutOrder.length; oi++){
        for(var pi=0; pi<affordable.length; pi++){
          if(affordable[pi] === scoutOrder[oi]){ pickKey = scoutOrder[oi]; break; }
        }
        if(pickKey) break;
      }
    }
    // 通常生産 (フォールバック含む)
    if(!pickKey){
      // C: 海越え目標あり + 重車両系が溢れている → affordable から戦車系・補給車を除外
      var affordableForNormal = affordable;
      if(unreachableTargets.length > 0){
        var waitingLandCountN = _aiCountWaitingHeavyLand(aiFaction);
        // 輸送船キャパシティ集計
        var shipCapTotalN = 0;
        for(var sti=0; sti<units.length; sti++){
          var stu = units[sti];
          if(stu.owner !== aiFaction || stu.hp <= 0) continue;
          if(stu.type !== 'TRANSPORT_SHIP') continue;
          var stuT = TYPE[stu.type];
          var occN = (stu.cargo || []).length;
          shipCapTotalN += Math.max(0, (stuT.capacity || 0) - occN);
        }
        if(waitingLandCountN >= shipCapTotalN){
          // 戦車系・補給車を除外したリストを作る
          var heavyExcl = { LIGHT_TANK:true, MEDIUM_TANK:true, HEAVY_TANK:true,
                            TANK_DESTROYER:true, HEAVY_TD:true, AA_TANK:true,
                            AIRBORNE_TANK:true, AMPHIB_TANK:true,
                            MOBILE_COMBAT:true, SPG:true, MLRS:true,
                            SUPPLY_TRUCK:true, HEAVY_ARTILLERY:true };
          var filtered = affordable.filter(function(k){ return !heavyExcl[k]; });
          if(filtered.length > 0){
            affordableForNormal = filtered;
            if(window.AI_DEBUG) try{ console.log('  → normal生産で重車両セーブ: waitingHeavy='+waitingLandCountN+' shipCap='+shipCapTotalN); }catch(e){}
          }
        }
      }
      affordableForNormal.sort(function(a,b){ return TYPE[b].price - TYPE[a].price; });
      var pickIdx = Math.min(affordableForNormal.length-1, Math.floor(Math.random() * Math.min(3, affordableForNormal.length)));
      pickKey = affordableForNormal[pickIdx];
    }
    var pickT = TYPE[pickKey];
    funds[aiFaction] -= pickT.price;
    // 兵器廠など prodTurnBonus を持つ施設は生産ターン-1 (最低1)
    var prodTer2 = TER[M[fy][fx]];
    var bonus2 = (prodTer2 && prodTer2.prodTurnBonus) ? prodTer2.prodTurnBonus : 0;
    var actualTurns2 = Math.max(1, pickT.prodTurns + bonus2);
    production.push({
      x: fx, y: fy, type: pickKey, owner: aiFaction,
      remaining: actualTurns2, ready: false
    });
    if(window.AI_DEBUG) try{ console.log('  → [生産開始] '+(prodTer2?prodTer2.name:'?')+'@('+fx+','+fy+') で '+pickT.name+' ('+pickT.price+'G, '+actualTurns2+'T) prodMode='+prodMode); }catch(e){}
  }
  // prodMode を返す (アップグレード判断で使用)
  return prodMode;
}

// AI: 施設アップグレードを検討
// 生産より先に実行 (残金で生産)
// - 都市系 (group:'city'): アップグレードコストさえあれば実行 (閾値なし)
// - 生産施設系 (group:'factory'|'airport'|'port'): 資金10000G以上、同group半数制限
var AI_UPGRADE_PRODUCER_THRESHOLD = 10000; // 生産施設アップグレードの資金閾値
function aiUpgrade(aiFaction){
  // === Step 1: 自軍の生産施設をgroup別に集計 (生産系のみ) ===
  // 「生産施設」= ter.slots && ter.produces を持つもの (factory/airport/port系)
  var groupCount = {};              // 自軍の各group保有数 (生産系のみ)
  var groupUpgrading = {};          // 各group のアップグレード中数 (生産系のみ)
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
    var ter = TER[M[fy][fx]];
    if(!ter) continue;
    if(!ter.slots || !ter.produces) continue; // 生産施設のみ
    var g = ter.group || '_other';
    groupCount[g] = (groupCount[g] || 0) + 1;
    if(cap.upgrading){
      groupUpgrading[g] = (groupUpgrading[g] || 0) + 1;
    }
  }

  // === Step 2: アップグレード候補を集める ===
  // 条件:
  //  - 自軍占領済み
  //  - 既にアップグレード中でない
  //  - upgradeTo がある
  //  - HP条件なし
  //  - 都市系: アップグレードコストさえ払えれば候補
  //  - 生産系: 資金10000G以上、同group半数制限
  var candidates = [];
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    if(cap.upgrading) continue;
    var xy = k.split(',');
    var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
    var ter = TER[M[fy][fx]];
    if(!ter || !ter.upgradeTo || ter.upgradeTo.length === 0) continue;
    var cost = UPGRADE_COST[M[fy][fx]] || 0;
    if(cost <= 0) continue;
    var g = ter.group || '_other';
    var isProducer = !!(ter.slots && ter.produces);

    if(isProducer){
      // 生産施設: 資金10000G以上
