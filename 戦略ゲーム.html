  // 陣営チーム所属の初期化
  // 優先順位: 1) _pendingFactionTeams (今回適用) 2) ステージの teams データ 3) persistentFactionTeams (永続設定) 4) デフォルト (全陣営独立)
  if(window._pendingFactionTeams){
    factionTeams = window._pendingFactionTeams;
    persistentFactionTeams = window._pendingFactionTeams; // 永続化も同時に
    window._pendingFactionTeams = null;
  } else if(s.teams){
    // ステージにチーム設定があればそれを使う (マップ作成時に設定された 1vs3 / 2vs2 など)
    factionTeams = {};
    for(var fi=0; fi<activeFactions.length; fi++){
      var fac = activeFactions[fi];
      factionTeams[fac] = s.teams[fac] || ('T' + fac);
    }
  } else if(persistentFactionTeams){
    // 永続設定がある: ただし、現在の activeFactions にない陣営の設定は除き、不足は独立で補う
    factionTeams = {};
    for(var fi=0; fi<activeFactions.length; fi++){
      var fac = activeFactions[fi];
      factionTeams[fac] = persistentFactionTeams[fac] || ('T' + fac);
    }
  } else {
    factionTeams = {};
    for(var fi=0; fi<activeFactions.length; fi++){
      factionTeams[activeFactions[fi]] = 'T' + activeFactions[fi];
    }
  }
  // デバッグ: 今回のチーム編成を表示
  try{
    var teamSummary = activeFactions.map(function(f){ return f+'='+(factionTeams[f]||'?'); }).join(', ');
    console.log('%c[loadStage] factionTeams: ' + teamSummary, 'color:#185FA5; font-weight:bold;');
  }catch(e){}
  turn = activeFactions[0]; // 最初の陣営から (通常 'P')
  selected = null; pendingUnit = null; gameOver = false; attackMode = false;
  setClear(movableSet); setClear(attackableSet);
  hideCommandPanel();
  infoX = null; infoY = null;
  // 資金: 活性陣営すべてに INITIAL_FUNDS
  funds = {};
  for(var i=0; i<activeFactions.length; i++){
    funds[activeFactions[i]] = INITIAL_FUNDS;
  }
  // 脱落陣営をリセット
  eliminatedFactions = {};
  production = [];
  // 索敵範囲システム/昼夜サイクル設定の読み込み
  fowEnabled = (s.fow === true);
  dayNightCycle = (s.dayNightCycle === true);
  dayLength = s.dayLength || 2;
  currentPhase = s.startPhase || 'day';
  phaseTurn = 0;
  roundNumber = 0;
  // 天候レイヤーの読み込み
  initWeather();
  if(s.weather && Array.isArray(s.weather)){
    for(var y=0; y<H; y++){
      var wsrc = s.weather[y] || '';
      for(var x=0; x<W; x++){

  // 天候の流れ方 (デフォルト: random)

  document.getElementById('stage-info').textContent = s.name + ' — ' + s.desc;
  var board = document.getElementById('board');
  board.style.gridTemplateColumns = 'repeat(' + W + ', 42px)';
  board.style.gridTemplateRows = 'repeat(' + H + ', 42px)';
  // 最初の陣営 (通常P) の1ターン目にも収入加算など applyTurnStart を実行
  // (これがないと「Pだけ1ターン目に収入が入らず、AIは自分のターンで収入を貰う」という不公平が出る)
  applyTurnStart(turn);
  // ステータスメッセージは applyTurnStart の後に設定 (補給ログなどで上書きされないように)
  if(isPlayerFaction(turn) && !playerIsAI){
    setStatus('あなたのターン: ユニットを選んでください');
  } else if(isPlayerFaction(turn) && playerIsAI){
    setStatus('🤖 ' + (FACTION_NAMES[turn] || turn) + ' (AI制御中)');
  } else {
    setStatus((FACTION_NAMES[turn] || turn) + 'のターン...');
  }
  render();
  updateStageButtons();
  // ステージ選択はプレイ中は不要なので隠す (上部の「🗺 ステージ変更」ボタンで開く)
  var stageSelEl = document.getElementById('stage-select');
  if(stageSelEl) stageSelEl.style.display = 'none';
  updateInfoPanel();
  // プレイヤーAI化ON、かつターンがP陣営なら、AIを起動
  if(playerIsAI && isPlayerFaction(turn) && !gameOver){
    setTimeout(aiTurn, aiStepDelay(600));
  } else if(!isPlayerFaction(turn) && !gameOver){
    // ステージロードで非P陣営から始まる場合 (まれだが) もAI起動
    setTimeout(aiTurn, aiStepDelay(600));
  }
}

function isAdjacentToEnemy(x, y, owner){
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0; i<dirs.length; i++){
    var u = unitAt(x+dirs[i][0], y+dirs[i][1]);
    if(u && !isAlly(u.owner, owner)) return true;
  }
  return false;
}

function computeMovable(unit){
  var set = {};
  setAdd(set, unit.x+','+unit.y);
  var dist = {};
  dist[unit.x+','+unit.y] = 0;
  var t = TYPE[unit.type];
  var fuelMoveCost = (t.cat === 'AIR') ? 2 : 1; // 1マス移動あたりの燃料消費
  // 燃料制限: fuel が現在残っているなら、それで移動できる最大マス数
  var fuelLimit = unit.fuel !== undefined ? Math.floor(unit.fuel / fuelMoveCost) : t.move;
  var maxMove = Math.min(t.move, fuelLimit);
  var open = [[unit.x, unit.y, 0]];
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while(open.length){
    open.sort(function(a,b){ return a[2]-b[2]; });
    var cur = open.shift();
    var x = cur[0], y = cur[1], d = cur[2];
    var cdkey = x+','+y;
    if(dist[cdkey] !== undefined && d > dist[cdkey]) continue;
    var isStart = (x===unit.x && y===unit.y);
    // ZOC: 見える敵に隣接したら停止 (見えない伏兵には反応しない)
    if(!isStart && _isAdjacentToVisibleEnemy(x, y, unit.owner)) continue;
    for(var i=0; i<dirs.length; i++){
      var nx = x + dirs[i][0], ny = y + dirs[i][1];
      if(!inBounds(nx,ny)) continue;
      var c = moveCost(unit.type, M[ny][nx]);
      if(c === Infinity) continue;
      var blocker = unitAt(nx, ny);
      // 列車は単線なので、味方の上もすり抜けられない (編成が並びを保って進むため)
      if(TYPE[unit.type].cost === 'TRAIN' && blocker && isAlly(blocker.owner, unit.owner)) continue;
      // 見えない敵はブロック対象から外す (プレイヤー視点で空きマス扱い)
      // ただし AI (own) 視点では全部見えてる扱いになるので、ここは viewer の owner に依存
      // 同盟ユニットは通過可能 (ただし着地は別判定)
      if(blocker && !isAlly(blocker.owner, unit.owner)){
        // 見えない敵 = 移動範囲には含める (プレイヤーは知らないので) が、
        // 着地マス判定では別途処理
        if(isUnitVisibleTo(blocker, unit.owner)){
          continue; // 見える敵: ブロック (現状通り)
        }
        // 見えない敵: 経路を続行可能 (実際の移動時にZOC発動して止まる)
      }
      var nd = d + c;
      if(nd > maxMove) continue;
      var ndkey = nx+','+ny;
      var existing = dist[ndkey];
      if(existing === undefined || nd < existing){
        dist[ndkey] = nd;
        // 着地可能性: 障害物なし、自分自身、または自軍の搭載可能な輸送ユニット
        // 同盟ユニットがいるマスは「通過は可、着地は不可」(同マス共存はしない、見やすさのため)
        var canLand = !blocker || blocker.id === unit.id;
        if(!canLand && blocker && blocker.owner === unit.owner && canCarryUnit(blocker, unit)){
          canLand = true; // 搭載目的で同マスへ進入可能
        }
        // 見えない敵がいるマスも、プレイヤー視点では空きマスとして見せる (着地可能)
        if(!canLand && blocker && !isAlly(blocker.owner, unit.owner) && !isUnitVisibleTo(blocker, unit.owner)){
          canLand = true;
        }
        if(canLand) setAdd(set, ndkey);
        open.push([nx, ny, nd]);
      }
    }
  }
  // 移動先ごとの距離も保存しておく(燃料消費計算用)
  unit._lastMoveDist = dist;
  return set;
}

// 既存の isAdjacentToEnemy は AI 用 (全部見えてる前提)。プレイヤー用に「見える敵のみ」版を作成。
function _isAdjacentToVisibleEnemy(x, y, viewerOwner){
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0; i<dirs.length; i++){
    var nx = x + dirs[i][0], ny = y + dirs[i][1];
    if(!inBounds(nx, ny)) continue;
    var u = unitAt(nx, ny);
    if(!u || isAlly(u.owner, viewerOwner) || u.hp <= 0) continue;
    if(isUnitVisibleTo(u, viewerOwner)) return true;
  }
  return false;
}

// findActualMoveEndpoint が同等の機能を提供するため、別実装は不要
// 移動経路に沿って、伏兵を発見して停止する位置を計算
// 戻り値: { x, y, ambushAt: {x, y} | null, hitAmbush: bool }
//   - x, y: 実際に停止する位置
//   - ambushAt: 隣接した伏兵の位置 (発見対象)
//   - hitAmbush: 伏兵マス自体に進入を試みたか (= 奇襲発動)
function findActualMoveEndpoint(unit, targetX, targetY){
  // 経路計算: BFSで距離マップを作って、targetからunit位置に向かって逆方向に経路を再構築
  var t = TYPE[unit.type];
  var fuelMoveCost = (t.cat === 'AIR') ? 2 : 1;
  var fuelLimit = unit.fuel !== undefined ? Math.floor(unit.fuel / fuelMoveCost) : t.move;
  var maxMove = Math.min(t.move, fuelLimit);
  var dist = {}, prev = {};
  // tieBreaker: 同じコストの経路が複数ある時、目標へのマンハッタン距離が小さい経路を優先するための値
  // (経路の各マスで、そのマスから目標までの距離の合計が小さいほど、目標に向かう自然な経路)
  var tieBreaker = {};
  dist[unit.x+','+unit.y] = 0;
  tieBreaker[unit.x+','+unit.y] = manhattan(unit.x, unit.y, targetX, targetY);
  var open = [[unit.x, unit.y, 0]];
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while(open.length){
    open.sort(function(a,b){ return a[2]-b[2]; });
    var cur = open.shift();
    var x = cur[0], y = cur[1], d = cur[2];
    var k = x+','+y;
    if(dist[k] !== undefined && d > dist[k]) continue;
    var isStart = (x===unit.x && y===unit.y);
    if(!isStart && _isAdjacentToVisibleEnemy(x, y, unit.owner)) continue;
    for(var i=0; i<dirs.length; i++){
      var nx = x + dirs[i][0], ny = y + dirs[i][1];
      if(!inBounds(nx,ny)) continue;
      var c = moveCost(unit.type, M[ny][nx]);
      if(c === Infinity) continue;
      var blocker = unitAt(nx, ny);
      // 列車は単線なので、味方の上もすり抜けられない
      if(TYPE[unit.type].cost === 'TRAIN' && blocker && isAlly(blocker.owner, unit.owner)) continue;
      if(blocker && !isAlly(blocker.owner, unit.owner)){
        if(isUnitVisibleTo(blocker, unit.owner)) continue;
      }
      var nd = d + c;
      if(nd > maxMove) continue;
      var nk = nx+','+ny;
      // tieBreaker: このマス (nx,ny) を通る経路の累積マンハッタン距離(目標まで)
      // 親 (x,y) の tieBreaker + このマスから目標への距離
      var parentTie = tieBreaker[k] !== undefined ? tieBreaker[k] : 0;
      var ntb = parentTie + manhattan(nx, ny, targetX, targetY);
      if(dist[nk] === undefined || nd < dist[nk] ||
         (nd === dist[nk] && ntb < (tieBreaker[nk] !== undefined ? tieBreaker[nk] : Infinity))){
        dist[nk] = nd;
        tieBreaker[nk] = ntb;
        prev[nk] = k;
        open.push([nx, ny, nd]);
      }
    }
  }
  // targetへの経路をたどる
  var targetKey = targetX+','+targetY;
  if(dist[targetKey] === undefined){
    // 到達不可: そのまま現在位置で何もしない
    return { x: unit.x, y: unit.y, ambushAt: null, hitAmbush: false };
  }
  // 経路を再構築 (start → target)
  var path = [];
  var k = targetKey;
  while(k){
    var xy = k.split(',');
    path.unshift({ x: parseInt(xy[0]), y: parseInt(xy[1]) });
    k = prev[k];
  }
  // 経路を順にたどり、各マスで「隣接の未発見敵」が居たらそこで停止
  // (出発点では発動しない)
  var endX = unit.x, endY = unit.y;
  var ambushAt = null;
  var hitAmbush = false;
  for(var pi=1; pi<path.length; pi++){
    var p = path[pi];
    // 現在マスでの隣接の未発見敵を検出
    var hidden = _findAdjacentHiddenEnemy(p.x, p.y, unit.owner, unit.id);
    if(hidden){
      // 隣接の未発見敵を発見 → ZOC的に停止
      endX = p.x; endY = p.y;
      ambushAt = { x: hidden.x, y: hidden.y };
      // 「目的地が伏兵マス」かどうかのチェック
      // (path最後のマス === targetX,Y === 伏兵がいるマス) なら hitAmbush
      // ただし上の処理で目的地が伏兵マスだった場合、ZOCで途中停止しているはず
      // 厳密には: 目的地マス自体が未発見敵のマスだった場合も「進入を試みた」=奇襲発動
      break;
    }
    endX = p.x; endY = p.y;
  }
  // 目的地が伏兵マスか? (= 目的地マスに見えない敵がいる)
  var targetBlocker = unitAt(targetX, targetY);
  if(targetBlocker && !isAlly(targetBlocker.owner, unit.owner) && !isUnitVisibleTo(targetBlocker, unit.owner)){
    // 目的地マス自体が伏兵 → 奇襲発動 (隣接で停止した位置のまま)
    hitAmbush = true;
    if(!ambushAt) ambushAt = { x: targetBlocker.x, y: targetBlocker.y };
  }
  return { x: endX, y: endY, ambushAt: ambushAt, hitAmbush: hitAmbush };
}

// 指定マス (x,y) の隣接に「viewer から見えない敵」がいたら、そのユニットを返す
function _findAdjacentHiddenEnemy(x, y, viewerOwner, excluderId){
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0; i<dirs.length; i++){
    var nx = x + dirs[i][0], ny = y + dirs[i][1];
    if(!inBounds(nx, ny)) continue;
    var u = unitAt(nx, ny);
    if(!u || isAlly(u.owner, viewerOwner) || u.hp <= 0) continue;
    if(excluderId !== undefined && u.id === excluderId) continue;
    // viewer の自軍 (自分除く) + 同盟陣営から見えているか
    var visToOthers = isUnitVisibleToExcl(u, viewerOwner, excluderId);
    if(!visToOthers){
      for(var fAlly in factionTeams){
        if(fAlly === viewerOwner) continue;
        if(!isAlly(fAlly, viewerOwner)) continue;
        if(isUnitVisibleToExcl(u, fAlly)){ visToOthers = true; break; }
      }
    }
    if(visToOthers) continue;
    return u;
  }
  return null;
}

// 共通: 移動を実行する。伏兵検知あり。
// unit を (targetX, targetY) に移動させる。経路上で伏兵に隣接したらそのマスで停止。
// 戻り値: { ambushAt, hitAmbush, fromX, fromY, toX, toY, justMoved }
//   呼び出し側で奇襲発動・行動終了等の処理を行う
function executeMoveWithAmbushCheck(unit, targetX, targetY){
  var fromX = unit.x, fromY = unit.y;
  var moveResult = findActualMoveEndpoint(unit, targetX, targetY);
  var actualX = moveResult.x, actualY = moveResult.y;
  // 移動前位置を記録 (移動後の攻撃判定で「移動前から見えていた敵」を識別するため)
  unit.preMoveX = fromX;
  unit.preMoveY = fromY;
  unit.x = actualX; unit.y = actualY;
  unit.moved = true;
  var jm = !(actualX === fromX && actualY === fromY);
  if(jm) consumeFuelForMove(unit, fromX, fromY);
  return {
    ambushAt: moveResult.ambushAt,
    hitAmbush: moveResult.hitAmbush,
    fromX: fromX, fromY: fromY,
    toX: actualX, toY: actualY,
    targetX: targetX, targetY: targetY,
    justMoved: jm,
    stoppedEarly: (actualX !== targetX || actualY !== targetY)
  };
}

function getArmorClass(unitOrType){
  // unit object か type key を受け取る
  if(typeof unitOrType === 'string'){
    return TYPE[unitOrType].armorClass;
  }
  // unit の場合、submerged 状態を考慮
  if(unitOrType.submerged) return 'SUB';
  return TYPE[unitOrType.type].armorClass;
}

// この攻撃ユニットに対して、観測兵ボーナス(観測射撃・効力射)が発動可能か確認
// 攻撃者が間接武器を持ち、観測兵の視界内に攻撃者がいる場合 true
// (標的の判定は実際の攻撃時に行う)
function canUseObserverFire(attacker){
  if(!attacker) return false;
  var t = TYPE[attacker.type];
  // 間接武器を持っているか
  var hasIndirect = false;
  var indirectRangeMax = 0, indirectRangeMin = Infinity;
  for(var i=0; i<t.weapons.length; i++){
    if(t.weapons[i].indirect){
      hasIndirect = true;
      var rng = getEffectiveRange(attacker, t.weapons[i]);
      if(rng[1] > indirectRangeMax) indirectRangeMax = rng[1];
      if(rng[0] < indirectRangeMin) indirectRangeMin = rng[0];
    }
  }
  if(!hasIndirect) return false;
  var atkCat = t.cat;
  if(atkCat !== 'LAND' && atkCat !== 'SEA') return false;
  // 自軍観測兵の中から、攻撃者が視界内に入る観測兵を集める
  var visibleObservers = [];
  for(var i=0; i<units.length; i++){
    var ob = units[i];
    if(!ob || ob.hp <= 0) continue;
    if(ob.owner !== attacker.owner) continue;
    if(ob.type !== 'OBSERVER') continue;
    var obT = TYPE[ob.type];
    var sight = obT.sight || 4;
    var obTer = TER[M[ob.y][ob.x]];
    if(obTer && obTer.sightBoost) sight += obTer.sightBoost;
    var dist = Math.abs(attacker.x - ob.x) + Math.abs(attacker.y - ob.y);
    if(dist <= sight) visibleObservers.push({ ob: ob, sight: sight });
  }
  if(visibleObservers.length === 0) return false;
  // さらに、攻撃者の間接武器射程内に、観測兵の視界内に入る敵(LAND/SEA)が1体以上いる必要がある
  for(var ei=0; ei<units.length; ei++){
    var enemy = units[ei];
    if(!enemy || enemy.hp <= 0) continue;
    if(enemy.owner === attacker.owner || enemy.owner === 'N') continue;
    var defCat = TYPE[enemy.type].cat;
    if(defCat !== 'LAND' && defCat !== 'SEA') continue;
    // 自軍からこの敵が見えていなければスキップ (見えない敵には攻撃不可)
    if(!isUnitVisibleTo(enemy, attacker.owner)) continue;
    // 攻撃者の間接武器射程内?
    var distAE = Math.abs(attacker.x - enemy.x) + Math.abs(attacker.y - enemy.y);
    if(distAE < indirectRangeMin || distAE > indirectRangeMax) continue;
    // この敵が、視界内観測兵のいずれかから見えているか?
    for(var oi=0; oi<visibleObservers.length; oi++){
      var ovo = visibleObservers[oi];
      var distOE = Math.abs(ovo.ob.x - enemy.x) + Math.abs(ovo.ob.y - enemy.y);
      if(distOE <= ovo.sight) return true; // 攻撃者+標的どちらも観測兵視界内 → 観測射撃可能
    }
  }
  return false;
}

// 効力射が使用可能か (弾薬2以上の間接武器が必要)
function canUseFireForEffect(attacker){
  if(!canUseObserverFire(attacker)) return false;
  if(!attacker.ammo) return false;
  var t = TYPE[attacker.type];
  for(var i=0; i<t.weapons.length; i++){
    if(!t.weapons[i].indirect) continue;
    var ammoLeft = (typeof attacker.ammo[i] === 'number') ? attacker.ammo[i] : 0;
    if(ammoLeft >= 2) return true;
  }
  return false;
}

// 観測兵ボーナス: 間接攻撃時、観測兵の視界範囲内に攻撃者と標的が両方含まれる場合
// 各観測兵が ×1.2 の倍率を提供 (重複あり = 観測兵2人なら ×1.2×1.2=×1.44)
// 対象: 陸上・海上ユニットの間接武器、かつ標的も陸上・海上のみ (空中の標的は対象外)
// attackMode: 'normal'(通常射撃・ボーナスなし) / 'observed'(観測射撃・ボーナスあり) / 'fire_for_effect'(効力射・ボーナスあり)
//             未指定の場合は後方互換で 'observed' (常にボーナス発動を試みる) として扱う
function getObserverMultiplier(attacker, weapon, def, attackMode){
  // attackMode が 'normal' なら倍率なし (通常射撃を明示的に選択)
  if(attackMode === 'normal') return 1.0;
  // 間接武器以外は対象外
  if(!weapon || !weapon.indirect) return 1.0;
  // 攻撃者カテゴリチェック (LAND/SEA のみ。AIR は除外)
  var atkCat = TYPE[attacker.type].cat;
  if(atkCat !== 'LAND' && atkCat !== 'SEA') return 1.0;
  // 標的カテゴリチェック (LAND/SEA のみ。AIR への攻撃は対象外 = 対空攻撃には効力射ボーナスなし)
  if(!def || !def.type) return 1.0;
  var defCat = TYPE[def.type].cat;
  if(defCat !== 'LAND' && defCat !== 'SEA') return 1.0;
  // 全自軍観測兵をチェック
  var multiplier = 1.0;
  var defX = def.x, defY = def.y;
  var atkX = attacker.x, atkY = attacker.y;
  for(var i=0; i<units.length; i++){
    var ob = units[i];
    if(!ob || ob.hp <= 0) continue;
    if(ob.owner !== attacker.owner) continue;
    var obT = TYPE[ob.type];
    if(obT.name !== '観測兵') continue;
    // 観測兵自身が観測兵タイプかチェック
    if(ob.type !== 'OBSERVER') continue;
    // 観測兵の視界範囲を取得 (山ボーナス込み)
    var sight = obT.sight || 4;
    var obTer = TER[M[ob.y][ob.x]];
    if(obTer && obTer.sightBoost) sight += obTer.sightBoost;
    // 攻撃者(間接攻撃ユニット)が観測兵の視界内?
    var distA = Math.abs(atkX - ob.x) + Math.abs(atkY - ob.y);
    if(distA > sight) continue;
    // 標的(敵)が観測兵の視界内?
    var distD = Math.abs(defX - ob.x) + Math.abs(defY - ob.y);
    if(distD > sight) continue;
    // 両方の条件を満たす → 倍率 ×1.2 (重複可能)
    multiplier *= 1.2;
  }
  return multiplier;
}

function effectiveAtkW(unit, weapon, def, attackMode){
  // def は unit object または type 文字列(後方互換)
  var cat;
  if(typeof def === 'string'){ cat = TYPE[def].armorClass; }
  else { cat = getArmorClass(def); }
  var baseAtk = weapon.atk[cat] || 0;
  if(baseAtk === 0) return 0;
  // 観測兵ボーナス (効力射): 間接武器かつ陸海ユニットの場合に発動
  // def が unit object のときのみ計算 (type 文字列の場合はシミュ用なのでスキップ)
  if(unit && unit.x !== undefined && unit.y !== undefined && typeof def !== 'string' && def && def.x !== undefined){
    var mult = getObserverMultiplier(unit, weapon, def, attackMode);
    if(mult !== 1.0){
      // 基礎火力に倍率を適用してから切り捨て、その後 HP連動 を計算
      baseAtk = Math.floor(baseAtk * mult);
    }
  }
  return Math.round(baseAtk * unit.hp / HP_MAX);
}
// 守備側ユニットが現在マスから受ける地形防御値を返す
// - 地上ユニット: 全地形・施設の def を享受 (森/山/都市/工場/空港/港 など)
// - 海上ユニット: 港系施設 (group:'port') の def のみ享受
//   (海上ユニットは森や山には進入できないので、海上で def を持つマスは港系のみ。
//    将来的に岩礁など海上隠匿地形を導入する場合は同様に group 単位で許可していく)
// - 航空ユニット: 地形効果一切なし (常に 0)
// + 天候による防御ボーナス (雲: 航空のみ +1, 雨雲: 全カテゴリ +2)
function getTerrainDefFor(defUnit, attacker){
  var ter = TER[M[defUnit.y][defUnit.x]];
  var defCat = TYPE[defUnit.type].cat;
  var base = 0;
  if(ter){
    if(defCat === 'AIR'){
      // ヘリが森・山を遮蔽に使っている場合のみ地形防御を得る。
      // 見下ろして撃つ固定翼機には遮蔽が効かない
      if(heliHidesInTerrain(defUnit) && !(attacker && isFixedWing(attacker))) base = ter.def || 0;
      else base = 0;
    }
    else if(defCat === 'SEA'){
      // 港系: 通常の地形防御
      if(ter.group === 'port') base = ter.def || 0;
      // 深海: 潜航中の潜水艦のみ防御 +3 (浮上中・通常艦は 0)
      else if(M[defUnit.y][defUnit.x] === 'DEEP_SEA' && TYPE[defUnit.type].canSubmerge && defUnit.submerged){
        base = 3;
      }
      // 岩礁: 通行可能な海上ユニットのみ防御 3 (通行不可なユニットは元々入れない)
      else if(M[defUnit.y][defUnit.x] === 'REEF'){
        base = ter.def || 0;
      }
      else base = 0;
    }
    else base = ter.def || 0; // LAND
  }
  // 天候の防御ボーナスを加算
  return base + weatherDefFor(defUnit);
}

// 攻撃ユニットが武器 w を使う際の実効射程を返す [minR, maxR]
// - 雨雲の中にいると間接武器の射程が -1 (最低 1)
// - 直接武器は影響を受けない
// - att は実ユニットでもシミュ用 fakeAtt {type,hp,x,y,ammo} でもよい
function getEffectiveRange(att, w){
  var minR = w.range[0], maxR = w.range[1];
  if(w.indirect){
    var penalty = weatherRangePenaltyFor(att);
    if(penalty > 0){
      maxR = Math.max(1, maxR - penalty);
      // 最低射程は 1 を保証 (元 minR が 1 ならそのまま、間接 [2,4] なら [1,3] に縮む)
      minR = Math.max(1, Math.min(minR, maxR));
    }
  }
  return [minR, maxR];
}

// 包囲ボーナス: 標的(def)の周囲に隣接している攻撃側陣営の直接攻撃ユニット数 - 1
// (最大+3、最小+0)。間接攻撃ユニットはカウントしない。
// 直接攻撃ユニット = 武器のうち少なくとも1つが indirect:false の武器を持つユニット
function _hasDirectWeapon(unit){
  var t = TYPE[unit.type];
  if(!t.weapons || t.weapons.length === 0) return false;
  for(var wi=0; wi<t.weapons.length; wi++){
    if(!t.weapons[wi].indirect) return true;
  }
  return false;
}
function getEncircleBonus(attackerOwner, defX, defY){
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  var count = 0;
  for(var i=0; i<dirs.length; i++){
    var nx = defX + dirs[i][0], ny = defY + dirs[i][1];
    if(!inBounds(nx, ny)) continue;
    var n = unitAt(nx, ny);
    if(!n || n.owner !== attackerOwner || n.hp <= 0) continue;
    if(!_hasDirectWeapon(n)) continue;
    count++;
  }
  return Math.max(0, count - 1); // 1台のみ(自分だけ)で攻撃なら +0、最大+3
}

function bestAttackOn(att, def, fromX, fromY, justMoved, attackMode){
  var t = TYPE[att.type];
  var dist = manhattan(fromX, fromY, def.x, def.y);
  var best = null;
  // 包囲ボーナス: 直接攻撃のみ。攻撃位置(fromX,fromY)も含めて隣接数を計算する必要があるが、
  // 簡略化して標的の周囲に隣接している自軍直接攻撃ユニット数で判定 (移動先=fromも考慮するため特殊処理)
  // 攻撃ユニット att 自身が標的に隣接(dist===1)するなら、att も隣接判定に含める
  var encircleAttack = 0; // 直接攻撃時のみ計算
  if(dist === 1 && _hasDirectWeapon(att)){
    // 標的に隣接している自軍直接攻撃ユニットをカウント (att 自身は含む = 移動先位置で隣接)
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    var cnt = 0;
    for(var di=0; di<dirs.length; di++){
      var nx = def.x + dirs[di][0], ny = def.y + dirs[di][1];
      if(!inBounds(nx, ny)) continue;
      // att 自身の位置 (fromX, fromY) も隣接マスのうちのひとつ
      var nUnit;
      if(fromX === nx && fromY === ny){
        nUnit = att; // 攻撃ユニット自身がここ (移動先含む)
      } else {
        nUnit = unitAt(nx, ny);
      }
      if(!nUnit || nUnit.owner !== att.owner || nUnit.hp <= 0) continue;
      if(!_hasDirectWeapon(nUnit)) continue;
      cnt++;
    }
    encircleAttack = Math.max(0, cnt - 1);
  }
  // 航空ユニット (AIR) は間接武器も移動後使用可能 (航空機運用例外)
  var isAirUnit = (TYPE[att.type].cat === 'AIR');
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(w.indirect && justMoved && !isAirUnit) continue;
    // 実効射程 (雨雲などで間接武器の射程が縮む)
    var rng = getEffectiveRange(att, w);
    if(dist < rng[0] || dist > rng[1]) continue;
    // 弾切れチェック (実ユニットでない場合 (シミュ用) はスキップ)
    if(att.ammo && !hasAmmoForWeapon(att, i)) continue;
    // 効力射のとき、間接武器は弾薬2発消費するので2発以上必要
    if(attackMode === 'fire_for_effect' && w.indirect && att.ammo){
      var ammoLeft = (typeof att.ammo[i] === 'number') ? att.ammo[i] : 0;
      if(ammoLeft < 2) continue;
    }
    var eAtk = effectiveAtkW(att, w, def, attackMode);
    if(eAtk === 0) continue;
    // 包囲ボーナス: 直接攻撃武器のみ加算 (間接武器は対象外)
    var bonus = (!w.indirect) ? encircleAttack : 0;
    // 観測兵ボーナス記録 (表示用)
    var obsMult = getObserverMultiplier(att, w, def, attackMode);
    var armor = TYPE[def.type].armor;
    // 地形防御: 守備側カテゴリで判定 (地上=全効果, 海上=港系のみ, 航空=無し) + 天候
    var terrainDef = getTerrainDefFor(def, att);
    var dmg = eAtk + bonus - armor - terrainDef;
    // 0以下でも攻撃可能 (弾薬は消費するが、ダメージは0になる)
    // ただし負のダメージは0として扱う
    var actualDmg = Math.max(0, dmg);
    if(!best || actualDmg > best.dmg || (actualDmg === best.dmg && bonus > (best.bonus||0))){
      best = { dmg: actualDmg, weapon: w, weaponIdx: i, bonus: bonus, observerMult: obsMult, attackMode: attackMode };
    }
  }
  return best;
}

function computeAttackable(unit, fromX, fromY, justMoved){
  var set = {};
  var t = TYPE[unit.type];
  // 航空ユニット (AIR) は間接武器も移動後使用可能 (航空機運用例外)
  var isAirUnit = (t.cat === 'AIR');
  var maxR = 0, minR = Infinity;
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(w.indirect && justMoved && !isAirUnit) continue;
    // 実効射程 (天候の射程ペナルティ反映)
    var rng = getEffectiveRange(unit, w);
    if(rng[1] > maxR) maxR = rng[1];
    if(rng[0] < minR) minR = rng[0];
  }
  if(maxR === 0) return set;
  for(var dy=-maxR; dy<=maxR; dy++){
    for(var dx=-maxR; dx<=maxR; dx++){
      var md = Math.abs(dx) + Math.abs(dy);
      if(md < minR || md > maxR) continue;
      var nx = fromX + dx, ny = fromY + dy;
      if(!inBounds(nx, ny)) continue;
      var u = unitAt(nx, ny);
      if(!u || isAlly(u.owner, unit.owner)) continue;
      // 攻撃側から見えない敵は対象外
      if(!isUnitVisibleTo(u, unit.owner)) continue;
      // 移動した攻撃側は、自分の探知で初めて発見した敵 (伏兵全般) は同ターン攻撃不可
      // (= 他の自軍ユニットの索敵で既に見えていた敵だけ攻撃可)
      // ただし、移動前の自分の位置からも既に見えていた敵は「伏兵ではなかった」扱いで攻撃可
      // 対象: 潜水艦・ステルス爆撃機・森山隠匿・天候(雲/雨雲)隠匿
      if(justMoved){
        // 他の自軍 (自分自身を除く) または同盟陣営から見えているなら無条件OK
        var visToOthers = isUnitVisibleToExcl(u, unit.owner, unit.id);
        if(!visToOthers){
          // 同盟陣営からも見えているか確認
          for(var fAlly in factionTeams){
            if(fAlly === unit.owner) continue;
            if(!isAlly(fAlly, unit.owner)) continue;
            if(isUnitVisibleToExcl(u, fAlly)){ visToOthers = true; break; }
          }
        }
        if(!visToOthers){
          // 他の自軍からは見えていない場合、移動前の自分の位置からも見えていたかチェック
          // 移動前位置から見えていた = 「動く前から把握していた敵」 = 伏兵ではない
          var seenPreMove = false;
          if(typeof unit.preMoveX === 'number' && typeof unit.preMoveY === 'number'){
            // 移動前位置から、自分以外の自軍 + 移動前位置の自分 で見えていたか判定
            // 簡易: 移動前位置と敵位置の距離が、移動前の有効視界以内 (隠匿地形なら隣接のみ)
            var preDist = manhattan(unit.preMoveX, unit.preMoveY, u.x, u.y);
            var targetTer = TER[M[u.y][u.x]];
            var targetHidden = !!(targetTer && targetTer.sightBlock
              && (TYPE[u.type].cat !== 'AIR' || heliHidesInTerrain(u)));
            // 天候による隠匿
            if(weatherHidesUnit(u)) targetHidden = true;
            var preSight = getEffectiveSight(unit); // 視界は移動前後で変わらない想定 (山にいると+1 等の地形ボーナスは反映)
            if(targetHidden){
              if(preDist <= 1) seenPreMove = true;
            } else {
              if(preDist <= preSight) seenPreMove = true;
            }
          }
          if(!seenPreMove) continue;
        }
      }
      // ステルス中のB-2: 攻撃側がFIGHTER/AA_TANKでrange1の場合のみ攻撃可
      if(TYPE[u.type].canStealth && u.stealth){
        if(unit.type !== 'FIGHTER' && unit.type !== 'AA_TANK') continue;
        if(md !== 1) continue;
      }
      // ammo も引き継ぐ (弾切れ武器を攻撃候補から除外するため)
      var fakeAtt = { type: unit.type, hp: unit.hp, x: fromX, y: fromY, ammo: unit.ammo, owner: unit.owner, id: unit.id };
      var best = bestAttackOn(fakeAtt, u, fromX, fromY, justMoved);
      if(best) setAdd(set, nx+','+ny);
    }
  }
  return set;
}

// 敵・中立拠点の備蓄が見えるか (段階2の情報公開)
// 偵察機・観測機・索敵機が視界に収めている拠点だけ、備蓄の中身が分かる。
// 「どの拠点を叩けば敵の補給が止まるか」を偵察の成果として得られるようにする。
var RECON_STOCK_TYPES = { RECON_PLANE: true, OBSERVER_PLANE: true, SCOUT_PLANE: true };
function facilityStockScouted(x, y, viewerOwner){
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== viewerOwner || u.hp <= 0) continue;
    if(!RECON_STOCK_TYPES[u.type]) continue;
    if(manhattan(u.x, u.y, x, y) <= getEffectiveSight(u)) return true;
  }
  return false;
}

// 情報パネルの施設ボタン (生産・収容 / アップグレード)
// マスをクリックしただけでモーダルが開かないよう、ここから明示的に開く
function facilityPanelButtons(ter, cap, x, y){
  if(!cap || cap.owner !== 'P') return '';
  var style = 'font-size:11px;padding:4px 10px;border:none;border-radius:3px;cursor:pointer;color:white;';
  var btns = [];
  if(ter.slots){
    btns.push('<button onclick="openProductionMenu('+x+','+y+',\'produce\')" style="'+style+'background:#0F6E56;">⚙ 生産・収容</button>');
  }
  if(ter.upgradeTo && ter.upgradeTo.length > 0 && !cap.upgrading){
    btns.push('<button onclick="openProductionMenu('+x+','+y+',\'upgrade\')" style="'+style+'background:#BA7517;">⬆ アップグレード</button>');
  }
  if(cap.upgrading){
    btns.push('<button onclick="openProductionMenu('+x+','+y+')" style="'+style+'background:#BA7517;">⚙ アップグレードの状況</button>');
  }
  if(btns.length === 0) return '';
  return '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">' + btns.join('') + '</div>';
}

// 敵ユニットの脅威範囲を計算
// 戻り値: { threat: 攻撃されうるマスのset, move: 移動可能なマスのset }
// threat = 現在位置からの間接武器射程 + 移動先からの直接武器射程の合体
// (敵がそのターン既に行動済みなら、threat も move も空に近い結果に)
function computeEnemyThreat(enemy){
  var threat = {};
  var moveSet = {};
  if(!enemy || enemy.hp <= 0) return { threat: threat, move: moveSet };
  var t = TYPE[enemy.type];
  if(!t) return { threat: threat, move: moveSet };
  // すでに行動済みなら、現在位置からの攻撃範囲のみ (移動できないので)
  var alreadyActed = !!enemy.acted;
  // 1) 移動可能マスを取得
  if(!alreadyActed){
    moveSet = computeMovable(enemy);
  } else {
    // 行動済みなら移動不可だが、現在位置だけは移動範囲として扱う
    setAdd(moveSet, enemy.x + ',' + enemy.y);
  }
  // 2) 各移動候補マスから、攻撃可能な範囲を集計
  //    - 元位置 (移動なし) からは間接武器+直接武器どちらも撃てる (justMoved=false)
  //    - 移動した先からは直接武器のみ (justMoved=true) - ただし AIR は間接も可
  var weapons = t.weapons || [];
  // 武器ごとの射程レンジを準備
  var weaponInfo = [];
  for(var wi=0; wi<weapons.length; wi++){
    var w = weapons[wi];
    var rng = getEffectiveRange(enemy, w);
    weaponInfo.push({ indirect: !!w.indirect, minR: rng[0], maxR: rng[1] });
  }
  var isAirUnit = (t.cat === 'AIR');
  // 元位置から撃てる範囲 (間接+直接)
  for(var wi=0; wi<weaponInfo.length; wi++){
    var wInfo = weaponInfo[wi];
    for(var dy=-wInfo.maxR; dy<=wInfo.maxR; dy++){
      for(var dx=-wInfo.maxR; dx<=wInfo.maxR; dx++){
        var md = Math.abs(dx) + Math.abs(dy);
        if(md < wInfo.minR || md > wInfo.maxR) continue;
        var nx = enemy.x + dx, ny = enemy.y + dy;
        if(!inBounds(nx, ny)) continue;
        setAdd(threat, nx + ',' + ny);
      }
    }
  }
  // 移動後の攻撃範囲 (直接武器のみ、ただし AIR は間接も可)
  if(!alreadyActed){
    for(var mk in moveSet){
      var mxy = mk.split(',');
      var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
      // 元位置はすでに上で処理済みなのでスキップ
      if(mx === enemy.x && my === enemy.y) continue;
      // 自軍以外のユニットがそのマスにいると敵は移動できない (簡易チェックは省略 = computeMovable に任せる)
      for(var wi=0; wi<weaponInfo.length; wi++){
        var wInfo = weaponInfo[wi];
        // 移動後は間接武器スキップ (AIR は例外)
        if(wInfo.indirect && !isAirUnit) continue;
        for(var dy=-wInfo.maxR; dy<=wInfo.maxR; dy++){
          for(var dx=-wInfo.maxR; dx<=wInfo.maxR; dx++){
            var md = Math.abs(dx) + Math.abs(dy);
            if(md < wInfo.minR || md > wInfo.maxR) continue;
            var nx = mx + dx, ny = my + dy;
            if(!inBounds(nx, ny)) continue;
            setAdd(threat, nx + ',' + ny);
          }
        }
      }
    }
  }
  return { threat: threat, move: moveSet };
}

// 効力射用の攻撃可能マス計算: 間接武器の射程内の全マス (空マスも含む)
// 弾薬2以上の間接武器が必要、justMoved=true の場合は不可
function computeAttackableForFireForEffect(unit, fromX, fromY, justMoved){
  var set = {};
  if(justMoved) return set; // 効力射は移動後不可
  var t = TYPE[unit.type];
  // 弾薬2以上の間接武器の射程を集める
  var maxR = 0, minR = Infinity;
  var hasValidWeapon = false;
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(!w.indirect) continue;
    if(unit.ammo){
      var ammoLeft = (typeof unit.ammo[i] === 'number') ? unit.ammo[i] : 0;
      if(ammoLeft < 2) continue;
    }
    var rng = getEffectiveRange(unit, w);
    if(rng[1] > maxR) maxR = rng[1];
    if(rng[0] < minR) minR = rng[0];
    hasValidWeapon = true;
  }
  if(!hasValidWeapon || maxR === 0) return set;
  for(var dy=-maxR; dy<=maxR; dy++){
    for(var dx=-maxR; dx<=maxR; dx++){
      var md = Math.abs(dx) + Math.abs(dy);
      if(md < minR || md > maxR) continue;
      var nx = fromX + dx, ny = fromY + dy;
      if(!inBounds(nx, ny)) continue;
      // 空マスでも敵ユニットが居ても、間接射程内のマスは全て選択可
      setAdd(set, nx+','+ny);
    }
  }
  return set;
}

// 攻撃実行
// def: ユニット object または座標オブジェクト {x,y} (効力射で空マスを着弾点にする場合)
// attackMode: 'normal'(通常) / 'observed'(観測射撃・弾薬1・×1.2) / 'fire_for_effect'(効力射・弾薬2・×1.2+周囲100%)
function performAttack(att, def, justMoved, attackMode){
  // 効力射の場合: 着弾点 (defX, defY) を決定し、中央のユニット(居れば)に120%、周囲4マスのユニット全員に100%ダメージ
  if(attackMode === 'fire_for_effect'){
    return performFireForEffect(att, def, justMoved);
  }
  // 通常攻撃 / 観測射撃
  var r1 = bestAttackOn(att, def, att.x, att.y, justMoved, attackMode);
  if(!r1) return { r1: null, r2: null };
  // 弾薬消費 (使った武器のidx)
  if(r1.weaponIdx !== undefined) consumeAmmoForAttack(att, r1.weaponIdx);
  def.hp = Math.max(0, def.hp - r1.dmg * 10);
  var r2 = null;
  if(def.hp > 0){
    r2 = bestAttackOn(def, att, def.x, def.y, false);
    if(r2){
      if(r2.weaponIdx !== undefined) consumeAmmoForAttack(def, r2.weaponIdx);
      att.hp = Math.max(0, att.hp - r2.dmg * 10);
    }
  }
  // 撃破時の搭載ユニット全滅
  if(def.hp === 0 && def.cargo && def.cargo.length > 0) def.cargo = [];
  if(att.hp === 0 && att.cargo && att.cargo.length > 0) att.cargo = [];
  return { r1: r1, r2: r2 };
}

// 効力射: 着弾点 (defOrTarget.x, defOrTarget.y) の中央120%+上下左右4マス100%ダメージ
// 弾薬2発を消費。所属不問で巻き込み(友軍・同盟軍も)、空マス着弾も可能。反撃なし。
// 戻り値: { r1: {dmg, weapon, weaponIdx, observerMult, attackMode, fireForEffect:true, hits:[{unit,dmg,role}]}, r2: null }
function performFireForEffect(att, defOrTarget, justMoved){
  var t = TYPE[att.type];
  var defX = defOrTarget.x, defY = defOrTarget.y;
  // 使用する間接武器を選定 (最も強力な間接武器、弾薬2以上)
  var bestW = null, bestIdx = -1;
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(!w.indirect) continue;
    if(justMoved) continue;
    var dist = manhattan(att.x, att.y, defX, defY);
    var rng = getEffectiveRange(att, w);
    if(dist < rng[0] || dist > rng[1]) continue;
    if(att.ammo){
      var ammoLeft = (typeof att.ammo[i] === 'number') ? att.ammo[i] : 0;
      if(ammoLeft < 2) continue;
    }
    if(!bestW || (w.range && w.range[1] > bestW.range[1])){ bestW = w; bestIdx = i; }
  }
  if(!bestW) return { r1: null, r2: null };
  // 弾薬2発消費
  if(bestIdx >= 0){
    consumeAmmoForAttack(att, bestIdx);
    consumeAmmoForAttack(att, bestIdx);
  }
  // 中央のユニット (居れば 120% ダメージ)
  var hits = [];
  var centerUnit = unitAt(defX, defY);
  if(centerUnit && centerUnit.hp > 0){
    var fakeTarget = centerUnit;
    var eAtk = effectiveAtkW(att, bestW, fakeTarget, 'fire_for_effect');
    var armor = TYPE[fakeTarget.type].armor;
    var terrainDef = getTerrainDefFor(fakeTarget, att);
    var dmg = Math.max(0, eAtk - armor - terrainDef);
    fakeTarget.hp = Math.max(0, fakeTarget.hp - dmg * 10);
    hits.push({ unit: fakeTarget, dmg: dmg, role: 'center' });
    if(fakeTarget.hp === 0 && fakeTarget.cargo && fakeTarget.cargo.length > 0) fakeTarget.cargo = [];
  }
  // 周囲4マス (上下左右) のユニット (居れば 100% ダメージ、所属不問)
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var d=0; d<dirs.length; d++){
    var nx = defX + dirs[d][0], ny = defY + dirs[d][1];
    if(!inBounds(nx, ny)) continue;
    var u = unitAt(nx, ny);
    if(!u || u.hp <= 0) continue;
    // 攻撃カテゴリチェック: 効力射の周囲ダメージは陸海ユニット限定 (空中ユニットには当たらない)
    var uCat = TYPE[u.type].cat;
    if(uCat !== 'LAND' && uCat !== 'SEA') continue;
    // 100% ダメージ計算 (観測兵ボーナス含む、HP連動)
    var fakeT = u;
    var eAtk = 0;
    var cat = getArmorClass(fakeT);
    var baseAtk = bestW.atk[cat] || 0;
    if(baseAtk === 0) continue;
    // 観測兵ボーナス (周囲ダメージにも適用)
    var mult = getObserverMultiplier(att, bestW, fakeT, 'observed');
    if(mult !== 1.0) baseAtk = Math.floor(baseAtk * mult);
    eAtk = Math.round(baseAtk * att.hp / HP_MAX);
    var armor = TYPE[fakeT.type].armor;
    var terrainDef = getTerrainDefFor(fakeT, att);
    var dmg = Math.max(0, eAtk - armor - terrainDef);
    fakeT.hp = Math.max(0, fakeT.hp - dmg * 10);
    hits.push({ unit: fakeT, dmg: dmg, role: 'splash' });
    if(fakeT.hp === 0 && fakeT.cargo && fakeT.cargo.length > 0) fakeT.cargo = [];
  }
  // 中央が居なくても効力射は成立 (空マス着弾)
  // 表示用 r1 は中央のヒット情報があれば中央、なければダミー
  var r1Display = { dmg: 0, weapon: bestW, weaponIdx: bestIdx, bonus: 0, observerMult: 1.0, attackMode: 'fire_for_effect', fireForEffect: true, hits: hits, defX: defX, defY: defY };
  if(hits.length > 0 && hits[0].role === 'center'){
    r1Display.dmg = hits[0].dmg;
  }
  // 効力射は反撃なし
  return { r1: r1Display, r2: null };
}

// 演出: ユニットの位置を取得して、ダメージポップとフラッシュを表示
function showAmbushEffect(unit, dmg, callback){
  var board = document.getElementById('board');
  // 該当マスの DOM 要素を取得
  var cells = board.children;
  var idx = unit.y * W + unit.x;
  var cell = cells[idx];
  if(!cell){
    if(callback) callback();
    return;
  }
  // フラッシュ要素
  var flash = document.createElement('div');
  flash.className = 'ambush-flash';
  cell.appendChild(flash);
  // ダメージポップ
  var pop = document.createElement('div');
  pop.className = 'ambush-damage-pop';
  pop.textContent = '-' + dmg;
  cell.appendChild(pop);
  // アニメーション終了後にDOMを掃除しコールバック
  setTimeout(function(){
    if(flash.parentNode) flash.parentNode.removeChild(flash);
    if(pop.parentNode) pop.parentNode.removeChild(pop);
    if(callback) callback();
  }, 700);
}

// ===== 奇襲(伏兵による迎撃) =====
// victim が moveTo マスに到達した瞬間、隣接する未発見の自軍ユニットがいたら
// それを起点に、moveTo マスを射程に収める同陣営の全ユニットから1発ずつ射撃する。
// victim は反撃不可、奇襲後は強制 acted=true。
// 引数 onComplete: 全アニメーション完了後に呼ばれるコールバック (引数: ambushed boolean)
function performAmbush(victim, onComplete){
  // victim と異なる陣営かつ中立でないユニットが伏兵候補
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  // Step 1: 隣接マスに「victim 側から見て未発見」だった敵ユニットを検出 (= 伏兵)
  var hiddenAdjacent = [];
  var ambusherOwner = null; // 同一陣営からの一斉射撃の起点 (最初に見つけた伏兵の陣営)
  for(var i=0; i<dirs.length; i++){
    var nx = victim.x + dirs[i][0], ny = victim.y + dirs[i][1];
    if(!inBounds(nx, ny)) continue;
    var u = unitAt(nx, ny);
    if(!u || isAlly(u.owner, victim.owner) || u.owner === 'N' || u.hp <= 0) continue;
    // 伏兵判定: 森・山にいて、victim 陣営に未発見か (FoW の有無に関係なく動作)
    if(!isAmbushHidden(u, victim.owner, victim.id)) continue;
    // 一回目の伏兵で陣営を確定 (複数陣営の伏兵が混在していたら最初のものを採用)
    if(ambusherOwner === null) ambusherOwner = u.owner;
    // 同一陣営の伏兵だけ参加 (複雑化を避ける)
    if(u.owner === ambusherOwner) hiddenAdjacent.push(u);
  }
  if(hiddenAdjacent.length === 0){
    if(window.AI_DEBUG) try{ console.log('  → ambush check: no hidden ambusher around victim ('+victim.x+','+victim.y+')'); }catch(e){}
    if(onComplete) onComplete(false);
    return false;
  }
  if(window.AI_DEBUG) try{ console.log('  → AMBUSH! '+hiddenAdjacent.length+' hidden unit(s) attacking victim '+TYPE[victim.type].name+' @('+victim.x+','+victim.y+')'); }catch(e){}
  // Step 2: 奇襲射撃メンバーを集める (ambusherOwner と同じ陣営)
  var shooters = [];
  var seen = {};
  for(var i=0; i<hiddenAdjacent.length; i++){
    var u = hiddenAdjacent[i];
    if(!seen[u.id]){ seen[u.id] = true; shooters.push(u); }
  }
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== ambusherOwner || u.hp <= 0) continue;
    if(seen[u.id]) continue;
    var dist = manhattan(u.x, u.y, victim.x, victim.y);
    var t = TYPE[u.type];
    var inRange = false;
    for(var w=0; w<t.weapons.length; w++){
      var weap = t.weapons[w];
      if(dist >= weap.range[0] && dist <= weap.range[1]){
        var atkVal = weap.atk[getArmorClass(victim)] || 0;
        if(atkVal > 0){ inRange = true; break; }
      }
    }
    if(inRange){
      seen[u.id] = true;
      shooters.push(u);
    }
  }
  // Step 3: 各ユニットの射撃計画を作成 (HPはまだ減らさない)
  var plannedHits = [];
  var simHp = victim.hp;
  for(var i=0; i<shooters.length; i++){
    if(simHp <= 0) break;
    var sh = shooters[i];
    var r = bestAttackOn(sh, victim, sh.x, sh.y, false);
    if(!r) continue;
    plannedHits.push({ shooter: sh, dmg: r.dmg, weapon: r.weapon, weaponIdx: r.weaponIdx });
    simHp = Math.max(0, simHp - r.dmg * 10);
  }
  if(plannedHits.length === 0){
    if(onComplete) onComplete(false);
    return false;
  }
  // 全ダメージ合計を先に計算
  var totalDmg = 0;
  for(var i=0; i<plannedHits.length; i++) totalDmg += plannedHits[i].dmg;
  // メッセージを作成
  var partsList = [];
  for(var i=0; i<plannedHits.length; i++){
    partsList.push(TYPE[plannedHits[i].shooter.type].name + ' ' + plannedHits[i].dmg);
  }
  var willKill = (victim.hp - totalDmg * 10) <= 0;
  var msg = '⚡奇襲! ' + TYPE[victim.type].name + 'が伏兵に遭遇 — ' + partsList.join(' / ') + ' = 計' + totalDmg + 'ダメ' + (willKill ? ' (撃破)' : '');
  setStatus(msg);
  // Step 4: 1発ずつ順番にアニメーション
  animationLock = true;
  var idx = 0;
  function processNext(){
    if(idx >= plannedHits.length){
      // 全アニメーション完了: victim を強制行動終了 + 後始末
      victim.acted = true;
      victim.moved = true;
      if(victim.hp === 0 && victim.cargo && victim.cargo.length > 0) victim.cargo = [];
      // 弾薬消費を一括反映 (HPは段階的に反映済み)
      for(var i=0; i<plannedHits.length; i++){
        if(plannedHits[i].weaponIdx !== undefined){
          consumeAmmoForAttack(plannedHits[i].shooter, plannedHits[i].weaponIdx);
        }
      }
      animationLock = false;
      if(onComplete) onComplete(true);
      return;
    }
    var hit = plannedHits[idx];
    idx++;
    // HP を反映してから演出 (描画後にダメージ表示)
    victim.hp = Math.max(0, victim.hp - hit.dmg * 10);
    showAmbushEffect(victim, hit.dmg, function(){
      render(); // HP反映後の盤面更新
      // 射撃間の間
      setTimeout(processNext, 250);
    });
  }
  // 最初の1発までの間
  setTimeout(processNext, 200);
  return true;
}

function performCapture(unit, cap){
  // ガード: 廃墟マスでは占領できない (工兵による再建が先に必要)
  // 工兵自身も廃墟マスでは占領せず、再建処理を別ロジックで行う想定
  var terGuard = TER[M[unit.y][unit.x]];
  if(terGuard && terGuard.isRuins) return;
  var dHP = displayHP(unit.hp);
  cap.captureHp = Math.max(0, (cap.captureHp || CAP_MAX) - dHP);
  // ログ (プレイヤーのみ、AIはログ別)
  if(unit.owner === 'P' && window.plog){
    var ter0 = TER[M[unit.y][unit.x]];
    plog((cap.captureHp === 0 ? '✓ 占領完了 ' : '占領中 ') + (ter0 ? ter0.name : '?') + '@('+unit.x+','+unit.y+') 残占領HP='+cap.captureHp);
  }
  if(cap.captureHp === 0){
    var prevOwner = cap.owner;
    cap.owner = unit.owner;
    // 施設の最大占領HPを取得
    var xy = null;
    for(var k in captures){ if(captures[k] === cap){ xy = k.split(','); break; } }
    var maxCapHp = CAP_MAX;
    if(xy){
      var ter = TER[M[parseInt(xy[1])][parseInt(xy[0])]];
      if(ter.capCaptureHp) maxCapHp = ter.capCaptureHp;
      else if(ter.capHpMax) maxCapHp = ter.capHpMax;
    }
    cap.captureHp = maxCapHp;
    // 占領されたらアップグレード中止
    if(cap.upgrading){
      delete cap.upgrading;
    }
    // 占領されたら生産中ユニットも破棄
    if(xy){
      var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
      production = production.filter(function(p){ return !(p.x === fx && p.y === fy); });
    }
    // 段階2: 備蓄の引き継ぎ
    //   敵陣営から奪った場合 → 半分だけ残って新しい所有者のものになる
    //   中立から占領した場合 → 0 (誰も管理していなかった拠点に物資は無い)
    if(xy){
      var sfx = parseInt(xy[0]), sfy = parseInt(xy[1]);
      var capSt = facilityStock(cap, M[sfy][sfx]);
      if(capSt.spec){
        var fromNeutral = (prevOwner === 'N' || !prevOwner);
        cap.stockFuel = fromNeutral ? 0 : Math.floor(capSt.fuel / 2);
        cap.stockAmmo = fromNeutral ? 0 : Math.floor(capSt.ammo / 2);
        // 何を手に入れたのかが分かるように知らせる (プレイヤーの占領時のみ)
        if(unit.owner === 'P'){
          var terName = (TER[M[sfy][sfx]] ? TER[M[sfy][sfx]].name : '拠点');
          var msg = fromNeutral
            ? ('📦 ' + terName + 'を占領しました (中立のため備蓄は0です)')
            : ('📦 ' + terName + 'を占領し、備蓄を鹵獲しました: 燃料' + cap.stockFuel + ' ・ 弾薬' + cap.stockAmmo);
          try{ setStatus(msg); }catch(e){}
          if(window.plog) try{ plog(msg); }catch(e){}
        }
      }
    }
    // 収容中ユニットも破棄
    cap.cargo = [];
    // 防御スロットの設置物も破棄(占領時にリセット)
    cap.defenseInstalls = [];
    // 首都を占領した場合、地形を大都市に変換 (各陣営の首都は1つだけ)
    if(xy){
      var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
      var capTer = TER[M[fy][fx]];
      if(capTer && capTer.isCapital){
        M[fy][fx] = 'BIG_CITY';
        cap.terKey = 'BIG_CITY';
        var bcTer = TER['BIG_CITY'];
        cap.hp = bcTer.capHpMax || CAP_MAX;
        cap.captureHp = bcTer.capCaptureHp || bcTer.capHpMax || CAP_MAX;
      }
    }
  }
}

function flashAttack(att, def, result){
  var r1 = result.r1, r2 = result.r2;
  if(!r1){ setStatus('攻撃失敗'); return; }
  var w1Name = (r1.weapon && r1.weapon.name) ? r1.weapon.name : '?';
  var attName = (att && TYPE[att.type]) ? TYPE[att.type].name : '?';
  var defName = (def && TYPE[def.type]) ? TYPE[def.type].name : '?';
  var msg = attName + '[' + w1Name + '] → ' + defName + ': ' + r1.dmg + 'ダメ';
  if(r2){
    var w2Name = (r2.weapon && r2.weapon.name) ? r2.weapon.name : '?';
    msg += ' / 反撃[' + w2Name + '] ' + r2.dmg + 'ダメ';
  }
  setStatus(msg);
}

function updateInfoPanel(){
  var tc = document.getElementById('terrain-content');
  var uc = document.getElementById('unit-content');
  if(infoX === null){
    tc.innerHTML = '<span style="color:var(--color-text-secondary);">マスをクリック</span>';
    uc.innerHTML = '<span style="color:var(--color-text-secondary);">ユニットをクリック</span>';
    return;
  }
  var ter = TER[M[infoY][infoX]];
  var cap = captures[infoX+','+infoY];
  var html = '<div style="font-weight:600;margin-bottom:4px;">' + ter.name
    + (ter.level?' <span style="font-size:10px;color:#888;">Lv'+ter.level+'</span>':'')
    + ' <span style="font-size:11px;color:#888;font-weight:400;">(' + infoX + ',' + infoY + ')</span></div>';
  html += '<div>防御補正: +' + ter.def + '</div>';
  // 線路・鉄橋・橋の耐久 (10以上で開通、1〜9は未完成、0で元の地形に戻る)
  if(ter.buildHpMax){
    var rHp = getRailHp(infoX, infoY);
    var rLow = (rHp < RAIL_OK_HP);
    var notice = '';
    if(rLow) notice = ter.isRail ? '　<span style="color:#A32D2D;">（列車は走れません）</span>'
                                 : '　<span style="color:#A32D2D;">（車両は渡れません）</span>';
    html += '<div style="font-size:11px;">🛠 耐久: <b style="color:' + (rLow ? '#A32D2D' : '#222') + ';">'
      + rHp + '</b>/' + RAIL_HP_MAX + notice + '</div>';
  }
  // 天候情報の追加表示
  var weatherKey = getWeatherAt(infoX, infoY);
  if(weatherKey && WEATHER[weatherKey]){
    var W_ = WEATHER[weatherKey];
    var weatherEffects = [];
    if(W_.def) weatherEffects.push('防御+' + W_.def);
    if(W_.sightPenalty) weatherEffects.push('視界-' + W_.sightPenalty);
    if(W_.rangePenalty) weatherEffects.push('間接射程-' + W_.rangePenalty);
    if(W_.hides) weatherEffects.push('隠匿');
    var affectedTo = [];
    if(W_.affectsLand) affectedTo.push('陸');
    if(W_.affectsSea) affectedTo.push('海');
    if(W_.affectsAir) affectedTo.push('空');
    var effectStr = weatherEffects.length > 0 ? '[' + weatherEffects.join('/') + ']' : '';
    var targetStr = affectedTo.length > 0 ? '(' + affectedTo.join('・') + ')' : '';
    html += '<div style="color:#5a4d8a; font-size:11px;">☁ 天候: ' + W_.name + ' ' + effectStr + ' ' + targetStr + '</div>';
  }
  if(ter.heal) html += '<div>HP回復: +' + ter.heal + (ter.healCat ? '(' + catName(ter.healCat) + 'のみ)' : '') + '</div>';
  if(ter.income) html += '<div>収入: +' + ter.income + '/T</div>';
  if(ter.slots) html += '<div>スロット: ' + ter.slots + '</div>';
  if(cap){
    var c = (cap.owner === 'N') ? '#5a554f' : (FACTION_COLORS[cap.owner] || '#5a554f');
    html += '<div style="margin-top:4px;">所有: <b style="color:' + c + ';">' + ownerName(cap.owner) + '</b></div>';
    var maxHp = ter.capHpMax || CAP_MAX;
    var maxCapHp = ter.capCaptureHp || ter.capHpMax || CAP_MAX;
    html += '<div>施設HP: ' + cap.hp + '/' + maxHp + (cap.hp < maxHp ? ' <span style="color:#A32D2D;">[損傷]</span>' : '') + '</div>';
    html += '<div>占領HP: ' + cap.captureHp + '/' + maxCapHp + (cap.captureHp < maxCapHp ? ' <span style="color:#A32D2D;">[占領中]</span>' : '') + '</div>';
    // 防御スロット表示
    if(ter.defenseSlots){
      var installed = (cap.defenseInstalls || []).length;
      html += '<div>🛡 防御スロット: ' + installed + '/' + ter.defenseSlots + '</div>';
    }
    // 備蓄表示 (段階2)
    // 自軍拠点は常に、敵・中立拠点は偵察機・観測機・索敵機の視界内にあるときだけ見える
    var isOwnCap = (cap.owner === 'P');
    var scouted = !isOwnCap && facilityStockScouted(infoX, infoY, 'P');
    if(isOwnCap || scouted){
      var stInfo = facilityStock(cap, M[infoY][infoX]);
      if(stInfo.spec){
        var gainText = (stInfo.spec.fuelGain > 0 || stInfo.spec.ammoGain > 0)
          ? ' <span style="color:#0F6E56;">(毎ターン +' + stInfo.spec.fuelGain + '/+' + stInfo.spec.ammoGain + ')</span>'
          : ' <span style="color:#888;">(生産なし)</span>';
        var lowF = (stInfo.fuel <= stInfo.spec.fuelMax * 0.2), lowA = (stInfo.ammo <= stInfo.spec.ammoMax * 0.2);
        html += '<div style="margin-top:3px;font-size:11px;">📦 備蓄: '
          + '<span style="color:' + (lowF ? '#A32D2D' : '#222') + ';">燃料 ' + stInfo.fuel + '/' + stInfo.spec.fuelMax + '</span>'
          + ' ・ <span style="color:' + (lowA ? '#A32D2D' : '#222') + ';">弾薬 ' + stInfo.ammo + '/' + stInfo.spec.ammoMax + '</span>'
          + gainText + '</div>';
        if(scouted){
          html += '<div style="font-size:10px;color:#185FA5;padding-left:6px;">🔭 偵察情報（占領すると半分が手に入ります）</div>';
        }
      }
    } else if(cap.owner !== 'N' && facilityStockSpec(M[infoY][infoX])){
      html += '<div style="margin-top:3px;font-size:11px;color:#888;">📦 備蓄: 不明（偵察機・観測機・索敵機で視界に収めると分かります）</div>';
    }
    // アップグレード中表示
    if(cap.upgrading){
      var upTer = TER[cap.upgrading.target];
      html += '<div style="margin-top:3px;color:#BA7517;font-size:11px;">⚙️ '+upTer.name+'にアップグレード中 (残'+cap.upgrading.remaining+'T)</div>';
    }
    // 生産中・収容中表示
    if(ter.slots && cap.owner === 'P'){
      var ongoingList = [];
      for(var pi=0; pi<production.length; pi++){
        if(production[pi].x === infoX && production[pi].y === infoY){
          ongoingList.push(production[pi]);
        }
      }
      if(ongoingList.length > 0){
        html += '<div style="margin-top:3px;font-size:11px;color:#666;">生産中:</div>';
        for(var pi=0; pi<ongoingList.length; pi++){
          var p = ongoingList[pi];
          html += '<div style="font-size:11px;padding-left:6px;">' + TYPE[p.type].name + (p.ready?' [完成]':' (残'+p.remaining+'T)') + '</div>';
        }
      }
      if(cap.cargo && cap.cargo.length > 0){
        html += '<div style="margin-top:3px;font-size:11px;color:#666;">収容中:</div>';
        for(var ci=0; ci<cap.cargo.length; ci++){
          var cg = cap.cargo[ci];
          html += '<div style="font-size:11px;padding-left:6px;">' + TYPE[cg.type].name + ' (HP'+displayHP(cg.hp)+')</div>';
        }
      }
      html += facilityPanelButtons(ter, cap, infoX, infoY);
    } else if(ter.upgradeTo && cap.owner === 'P'){
      // 都市はスロット無いがアップグレードあり
      html += facilityPanelButtons(ter, cap, infoX, infoY);
    }
  }
  tc.innerHTML = html;
  var u = unitAt(infoX, infoY);
  if(u && !isUnitVisibleTo(u, 'P')) u = null;
  if(!u){ uc.innerHTML = '<span style="color:var(--color-text-secondary);">ユニット無し</span>'; return; }
  var t = TYPE[u.type];
  var c = FACTION_COLORS[u.owner] || '#A32D2D';
  var dHP = displayHP(u.hp);
  var hpRatio = u.hp / HP_MAX;
  var uhtml = '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">';
  var infoIconSvg;
  if(u.submerged && u.type === 'SUBMARINE') infoIconSvg = ICONS.SUBMARINE_OUTLINE;
  else if(u.stealth && u.type === 'STEALTH_BOMBER') infoIconSvg = ICONS.STEALTH_BOMBER_OUTLINE;
  else infoIconSvg = ICONS[u.type];
  uhtml += '<span style="display:inline-block;width:24px;height:24px;color:' + c + ';">' + infoIconSvg + '</span>';

  uhtml += '<span style="font-size:11px;color:#666;">(' + ownerName(u.owner) + ')</span></div>';
  // 装甲の内訳: 素の装甲 + 地形/施設 + 天候
  // getTerrainDefFor は攻撃側で変わる場合があるので (森・山のヘリは固定翼機に効かない)、
  // ここでは攻撃側なしの値 = 地上/ヘリから撃たれたときの値を出し、必要なら注記する
  var terDefNow = getTerrainDefFor(u);
  var weaDefNow = weatherDefFor(u);
  var terOnlyDef = terDefNow - weaDefNow;
  var armorLine = 'HP: <b>' + dHP + '</b>/10 · 装甲: <b>' + t.armor + '</b>';
  var defParts = [];
  if(terOnlyDef > 0){
    var terHereName = (TER[M[u.y][u.x]] ? TER[M[u.y][u.x]].name : '地形');
    defParts.push('+' + terOnlyDef + ' ' + terHereName);

  if(weaDefNow > 0){
    var wKeyNow = getWeatherAt(u.x, u.y);
    var wNameNow = (wKeyNow && WEATHER[wKeyNow]) ? WEATHER[wKeyNow].name : '天候';
    defParts.push('+' + weaDefNow + ' ' + wNameNow);

  uhtml += '<div>' + armorLine + '</div>';

  if(terOnlyDef > 0 && heliHidesInTerrain(u)){

  }
  uhtml += '<div>移動: ' + t.move + ' · 視界: ' + getEffectiveSight(u) + ((t.sight||2) !== getEffectiveSight(u) ? '<span style="font-size:10px;color:#888;">(基本'+(t.sight||2)+')</span>' : '') + ' · 分類: ' + ARMOR_LABELS[t.armorClass] + '</div>';
  // 燃料表示
  if(u.fuel !== undefined && t.fuelMax !== undefined){

    var fuelColor = fuelPct < 0.25 ? '#A32D2D' : (fuelPct < 0.5 ? '#BA7517' : '#0F6E56');
    uhtml += '<div>燃料: <b style="color:'+fuelColor+';">' + u.fuel + '</b>/' + t.fuelMax + '</div>';

  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];

    var tp = w.indirect ? '間接' : '直接';
    // 弾薬表示
    var ammoStr = '';
    if(u.ammo && u.ammo[i] !== undefined){
      if(u.ammo[i] === -1) ammoStr = ' · <span style="color:#888;">∞</span>';
      else {
        var maxAmmo = w.ammo !== undefined ? w.ammo : 6;

    uhtml += '<div style="margin-top:3px;font-size:11px;"><b>' + w.name + '</b> [' + r + '/' + tp + ']' + ammoStr + '</div>';
    var labels = [['INF','歩'],['UV','非装車'],['AV','装車'],['US','非装艦'],['AS','装艦'],['HE','ヘリ'],['AC','航空'],['SUB','対潜']];
    var parts = [];
    for(var j=0; j<labels.length; j++){

  if(t.isSupply){

    // 補給対象 (配列対応)

    var tgtLabels = (tgts || []).map(function(x){

    uhtml += '<div style="margin-top:3px;color:#185FA5;font-size:11px;">⛽ 補給ユニット (隣接'+tgtLabels+'に'+supplyContent+')</div>';
    // 燃料カウンター表示 (supplyFuelMaxが定義されているユニットのみ)
    if(canFuel && typeof t.supplyFuelMax === 'number'){
      var fcounter = (typeof u.supplyFuelCount === 'number') ? u.supplyFuelCount : t.supplyFuelMax;
      var fpct = fcounter / t.supplyFuelMax;
      var fcolor = (fpct > 0.5) ? '#0F6E56' : (fpct > 0.2 ? '#BA7517' : '#A32D2D');

    }
    // 弾薬カウンター表示
    if(canAmmo && typeof t.supplyAmmoMax === 'number'){
      var counter = (typeof u.supplyAmmoCount === 'number') ? u.supplyAmmoCount : t.supplyAmmoMax;
      var pct = counter / t.supplyAmmoMax;
      var color = (pct > 0.5) ? '#0F6E56' : (pct > 0.2 ? '#BA7517' : '#A32D2D');
      uhtml += '<div style="margin-top:1px;font-size:11px;color:'+color+';padding-left:8px;">📦 弾薬在庫: '+counter+'/'+t.supplyAmmoMax+'</div>';

  // 補給ルートの表示 (段階3)
  if(u.route){
    var rFrom = TER[M[u.route.from.y][u.route.from.x]];
    var isPointRoute = (u.route.toKind === 'point');
    var rToLabel = isPointRoute
      ? ('駐留地点('+u.route.to.x+','+u.route.to.y+')')
      : (TER[M[u.route.to.y][u.route.to.x]].name + '('+u.route.to.x+','+u.route.to.y+')');
    var goingTo;
    if(u.routeTarget === 'from'){
      goingTo = rFrom.name + '('+u.route.from.x+','+u.route.from.y+') へ積みに移動中';
    } else if(isPointRoute){
      var arrivedPt = (manhattan(u.x, u.y, u.route.to.x, u.route.to.y) <= 1);
      goingTo = arrivedPt ? (rToLabel + ' に駐留中 (周りの味方へ補給)') : (rToLabel + ' へ移動中');
    } else {
      goingTo = rToLabel + ' へ降ろしに移動中';
    }
    // 航空補給ユニットは燃料の都合で最寄りの空港・空母へ帰ることがある
    if(TYPE[u.type].cat === 'AIR'){
      var backNow = airRefuelPlan(u);
      if(backNow) goingTo = '⛽ 燃料が少ないため ('+backNow.x+','+backNow.y+') へ帰投中';
    }
    uhtml += '<div style="margin-top:3px;color:#0F6E56;font-size:11px;">🚚 補給ルート: '
      + rFrom.name + '('+u.route.from.x+','+u.route.from.y+') → ' + rToLabel + '</div>';
    uhtml += '<div style="font-size:11px;color:#666;padding-left:8px;">' + goingTo + '</div>';
    if(u.owner === 'P'){
      uhtml += '<div style="margin-top:5px;"><button onclick="clearSupplyRouteAt('+u.x+','+u.y+')" '
        + 'style="font-size:11px;padding:4px 10px;border:none;border-radius:3px;cursor:pointer;color:white;background:#A32D2D;">🚚 ルート解除</button></div>';
    }
  }
  // 空母系の弾薬庫表示 (isSupplyではないが、艦載航空機への補給用に弾薬庫を持つ)
  if(!t.isSupply && t.canCarry === 'AIR'){
    if(t.supplyFuel && typeof t.supplyFuelMax === 'number' || t.supplyAmmo && typeof t.supplyAmmoMax === 'number'){
      uhtml += '<div style="margin-top:3px;color:#185FA5;font-size:11px;">🛬 搭載機補給 (搭載機の燃料/弾薬を補充)</div>';
    }
    if(t.supplyFuel && typeof t.supplyFuelMax === 'number'){
      var carrierFuelCounter = (typeof u.supplyFuelCount === 'number') ? u.supplyFuelCount : t.supplyFuelMax;
      var carrierFuelPct = carrierFuelCounter / t.supplyFuelMax;
      var carrierFuelColor = (carrierFuelPct > 0.5) ? '#0F6E56' : (carrierFuelPct > 0.2 ? '#BA7517' : '#A32D2D');
      uhtml += '<div style="margin-top:1px;font-size:11px;color:'+carrierFuelColor+';padding-left:8px;">⛽ 燃料在庫: '+carrierFuelCounter+'/'+t.supplyFuelMax+'</div>';
    }
    if(t.supplyAmmo && typeof t.supplyAmmoMax === 'number'){
      var carrierCounter = (typeof u.supplyAmmoCount === 'number') ? u.supplyAmmoCount : t.supplyAmmoMax;
      var carrierPct = carrierCounter / t.supplyAmmoMax;
      var carrierColor = (carrierPct > 0.5) ? '#0F6E56' : (carrierPct > 0.2 ? '#BA7517' : '#A32D2D');
      uhtml += '<div style="margin-top:1px;font-size:11px;color:'+carrierColor+';padding-left:8px;">📦 弾薬在庫: '+carrierCounter+'/'+t.supplyAmmoMax+'</div>';
    }
  }
  // 補給状態(自軍ユニットのみ表示)
  if(u.owner === 'P'){
    var src = getSupplySource(u);
    if(src){
      var supplyType = (src.fuel && src.ammo) ? '燃料+弾薬' : (src.fuel ? '燃料のみ' : '弾薬のみ');
      uhtml += '<div style="margin-top:3px;color:#0F6E56;font-size:11px;">⛽ 補給中: '+supplyType+' (' + src.name + ')</div>';
    }
  }
  var infoChain = trainOf(u);
  if(infoChain){
    uhtml += '<div style="margin-top:6px;font-size:11px;color:#666;">🔗 ' + infoChain.length + '両編成' +
             (trainHasLoco(infoChain) ? '' : '（機関車なし・動けません）') + '</div>';
    for(var tci=0; tci<infoChain.length; tci++){
      var tcu = infoChain[tci];
      var tcIcon = ICONS[tcu.type] || '';
      var tcMark = (tcu.id === u.id) ? '▶ ' : '　';
      uhtml += '<div style="display:flex;align-items:center;gap:4px;font-size:11px;padding-left:8px;">';
      uhtml += '<span>' + tcMark + '</span>';
      uhtml += '<span style="display:inline-block;width:14px;height:14px;color:'+c+';">'+tcIcon+'</span>';
      uhtml += '<span>' + TYPE[tcu.type].name + ' (HP'+displayHP(tcu.hp)+')</span>';
      uhtml += '</div>';
    }
  }
  if(t.capacity){
    uhtml += '<div style="margin-top:6px;font-size:11px;color:#666;">搭載 ' + (u.cargo ? u.cargo.length : 0) + '/' + t.capacity + '</div>';
    if(u.cargo && u.cargo.length > 0){
      for(var ci=0; ci<u.cargo.length; ci++){
        var cg = u.cargo[ci];
        var cgIcon = ICONS[cg.type] || '';
        uhtml += '<div style="display:flex;align-items:center;gap:4px;font-size:11px;padding-left:8px;">';
        uhtml += '<span style="display:inline-block;width:14px;height:14px;color:'+c+';">'+cgIcon+'</span>';
        uhtml += '<span>' + TYPE[cg.type].name + ' (HP'+displayHP(cg.hp)+')</span>';
        uhtml += '</div>';
      }
    }
  }
  if(t.canSubmerge){
    if(u.submerged) uhtml += '<div style="margin-top:3px;color:#3a6a8a;font-size:11px;font-weight:600;">⊕ 潜航中(SUB分類)</div>';
    else uhtml += '<div style="margin-top:3px;color:#666;font-size:11px;">○ 浮上中(US分類)</div>';
  }
  if(t.canStealth){
    if(u.stealth) uhtml += '<div style="margin-top:3px;color:#3a3a5a;font-size:11px;font-weight:600;">⊕ ステルスON(戦闘機・対空戦車のみ撃墜可)</div>';
    else uhtml += '<div style="margin-top:3px;color:#666;font-size:11px;">○ ステルスOFF</div>';
  }
  uc.innerHTML = uhtml;
}

// 陣営の脱落・吸収処理
// 直前まで生存していた陣営が脱落判定された時に、ユニット編入・拠点中立化を行う
// 戻り値: 脱落した陣営のリスト
function processFactionElimination(){
  var newlyEliminated = [];
  for(var fi=0; fi<activeFactions.length; fi++){
    var f = activeFactions[fi];
    if(eliminatedFactions[f]) continue; // 既に脱落済み
    if(isFactionEliminated(f)){
      eliminatedFactions[f] = true;
      newlyEliminated.push(f);
    }
  }
  if(newlyEliminated.length === 0) return [];
  // 脱落陣営の処理:
  // 1) 首都を取った陣営 (= 最後にその陣営の首都を奪った陣営) にユニット編入
  // 2) その他の拠点は中立化
  for(var ni=0; ni<newlyEliminated.length; ni++){
    var f = newlyEliminated[ni];
    // 首都を取った陣営 = 元f所有の首都の現owner (複数ある場合は最初に見つけたもの)
    var conqueror = null;
    for(var k in captures){
      var cap = captures[k];
      var xy = k.split(',');
      var ter = TER[M[parseInt(xy[1])][parseInt(xy[0])]];
      if(!ter || !ter.isCapital) continue;
      if(cap.originalOwner === f && cap.owner !== f && cap.owner !== 'N'){
        conqueror = cap.owner;
        break;
      }
    }
    // ユニット処理: conqueror があれば編入、なければ中立化(=その場で消滅扱い)
    for(var i=0; i<units.length; i++){
      var u = units[i];
      if(u.owner !== f) continue;
      if(conqueror){
        u.owner = conqueror;
        u.acted = true; // このターンは行動済み
      } else {
        u.hp = 0; // 撃破扱い
      }
    }
    // 拠点処理:
    //   - 首都はそのまま (取った陣営の所有を維持)
    //   - 元 f 所有でまだ f 所有のままの拠点 → 中立化 (f の領地だった部分は誰のものでもない)
    //   - 元 f 所有だが既に他陣営が占領済みの拠点 → そのまま (既に占領した陣営の所有を維持)
    for(var k in captures){
      var cap = captures[k];
      if(cap.originalOwner !== f) continue;
      var xy = k.split(',');
      var ter = TER[M[parseInt(xy[1])][parseInt(xy[0])]];
      if(ter && ter.isCapital){
        // 首都は取った陣営のまま (originalOwner は変わらず f だが、現 owner は征服者)
        continue;
      }
      // 既に他陣営が占領済みなら、そのまま保持 (プレイヤーが汗水たらして占領した施設を奪わない)
      if(cap.owner !== f && cap.owner !== 'N') continue;
      // f がまだ所有 (または中立) → 中立化
      cap.owner = 'N';
      cap.captureHp = ter.capCaptureHp || ter.capHpMax || CAP_MAX; // 占領HPリセット
    }
    var label = (FACTION_NAMES[f] || f);
    if(conqueror){
      var conqLabel = FACTION_NAMES[conqueror] || conqueror;
      setStatus('💀 ' + label + ' が脱落 — ユニットは ' + conqLabel + ' に編入、拠点は中立化');
    } else {
      setStatus('💀 ' + label + ' が脱落 — 全ユニット撃破、拠点は中立化');
    }
  }
  units = units.filter(function(u){ return u.hp > 0; });
  return newlyEliminated;
}

function checkWin(){
  // 陣営脱落処理を先に実施
  processFactionElimination();
  // プレイヤー陣営 (P) が脱落 → 敗北
  if(eliminatedFactions['P']){
    gameOver = true;
    setStatus('敗北... プレイヤー陣営が脱落しました');
    return true;
  }
  // プレイヤー以外で生存している陣営があるか
  var aliveOthers = 0;
  for(var fi=0; fi<activeFactions.length; fi++){
    var f = activeFactions[fi];
    if(f === 'P') continue;
    if(!eliminatedFactions[f]) aliveOthers++;
  }
  if(aliveOthers === 0){
    gameOver = true;
    setStatus('勝利！全ての敵陣営を打ち破りました');
    return true;
  }
  return false;
}

function applyTurnStart(owner){
  // 0. 航空機の停止燃料消費 (毎ターン -1)
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== owner || u.hp <= 0) continue;
    consumeFuelHover(u);
  }
  // 0a. 潜航中の潜水艦の燃料消費 (毎ターン -1) + 燃料切れ強制浮上
  // 仕様: 潜航中は電池運用で常に燃料を消費する。燃料切れで強制浮上 (沈没はしない)
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== owner || u.hp <= 0) continue;
    if(!TYPE[u.type].canSubmerge || !u.submerged) continue;
    if(u.fuel === undefined) continue;
    u.fuel = Math.max(0, u.fuel - 1);
    // 燃料切れたら強制浮上
    if(u.fuel <= 0){
      u.submerged = false;
      try{ console.log('[強制浮上] '+TYPE[u.type].name+' @('+u.x+','+u.y+') 燃料切れで浮上'); }catch(e){}
      // ステータス通知 (自軍ターンのみ表示)
      if(owner === 'P'){
        try{ setStatus(TYPE[u.type].name+'が燃料切れで強制浮上しました'); }catch(e){}
      }
    }
  }
  // 0b. 空母系 cargo の航空ユニットHP回復 (1/ターン、最大HP_MAXまで)
  // 空母自体は別の補給ロジック (生産施設の上にいるなら回復) で処理される
  for(var ci=0; ci<units.length; ci++){
    var carr = units[ci];
    if(carr.owner !== owner || carr.hp <= 0) continue;
    if(TYPE[carr.type].canCarry !== 'AIR') continue; // 空母系のみ
    if(!carr.cargo || carr.cargo.length === 0) continue;
    for(var cj=0; cj<carr.cargo.length; cj++){
      var cg = carr.cargo[cj];
      if(typeof cg.hp === 'number' && cg.hp < HP_MAX){
        cg.hp = Math.min(HP_MAX, cg.hp + 1);
      }
    }
  }
  // 0c. 補給ユニットのカウンター初期化 (旧データ救済)
  // 補充自体は新仕様のgetSupplySource経由で施設からのrate補給により行われる
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== owner || u.hp <= 0) continue;
    var ut = TYPE[u.type];
    if(ut.supplyAmmo && typeof ut.supplyAmmoMax === 'number'){
      if(typeof u.supplyAmmoCount !== 'number') u.supplyAmmoCount = ut.supplyAmmoMax;
    }
    if(ut.supplyFuel && typeof ut.supplyFuelMax === 'number'){
      if(typeof u.supplyFuelCount !== 'number') u.supplyFuelCount = ut.supplyFuelMax;
    }
  }

  // 0c-2. 施設の備蓄生産 (段階2)
  // 工場系と弾薬工廠だけが毎ターン燃料・弾薬を貯めていく (都市系・首都は生産しない)
  // アップグレード中は生産スロットが止まるのに合わせ、備蓄の生産も止める
  for(var k in captures){
    var scap = captures[k];
    if(scap.owner !== owner) continue;
    var sxy2 = k.split(',');
    var sTerKey = M[parseInt(sxy2[1])][parseInt(sxy2[0])];
    var sst = facilityStock(scap, sTerKey);
    if(!sst.spec) continue;
    if(scap.upgrading) continue;
    if(sst.spec.fuelGain > 0) scap.stockFuel = Math.min(sst.spec.fuelMax, sst.fuel + sst.spec.fuelGain);
    if(sst.spec.ammoGain > 0) scap.stockAmmo = Math.min(sst.spec.ammoMax, sst.ammo + sst.spec.ammoGain);
  }

  // 0d. 補給判定: 補給可能ユニットを補給
  var supplied = [];
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== owner || u.hp <= 0) continue;
    var src = getSupplySource(u);
    if(!src) continue;
    var t = TYPE[u.type];
    // どんな補給が必要か判定
    var needFuel = (u.fuel < (t.fuelMax || 99));
    var needAmmo = false;
    if(u.ammo){
      for(var j=0; j<t.weapons.length; j++){
        var w = t.weapons[j];
        if(w.infiniteAmmo) continue;
        if(u.ammo[j] < (w.ammo !== undefined ? w.ammo : 6)){ needAmmo = true; break; }
      }
    }
    // 補給ユニット自身の弾薬庫(空母・補給車・補給艦)が満タンでなければ、それも補給対象
    if(t.supplyAmmo && typeof t.supplyAmmoMax === 'number'){
      var curCount = (typeof u.supplyAmmoCount === 'number') ? u.supplyAmmoCount : t.supplyAmmoMax;
      if(curCount < t.supplyAmmoMax) needAmmo = true;
    }
    // 補給ユニット自身の燃料庫(空母・補給車・給油艦・空中給油機)が満タンでなければ、それも補給対象
    if(t.supplyFuel && typeof t.supplyFuelMax === 'number'){
      var curFuelCount = (typeof u.supplyFuelCount === 'number') ? u.supplyFuelCount : t.supplyFuelMax;
      if(curFuelCount < t.supplyFuelMax) needFuel = true;
    }
    // ソースが補給できる範囲のみ補給
    var didSupply = false;
    var partial = false;
    if(needFuel && src.fuel){
      var fuelMax = t.fuelMax || 99;
      var curFuel = u.fuel !== undefined ? u.fuel : fuelMax;
      var fuelNeed = fuelMax - curFuel;
      if(src.fuelFromUnit){
        // 補給ユニット (補給車・給油艦・空中給油機・空母) からの補給: 燃料庫(supplyFuelCount)を消費
        var fSupplier = src.fuelFromUnit;
        var fCounter = (typeof fSupplier.supplyFuelCount === 'number') ? fSupplier.supplyFuelCount : 0;
        // ユニット自身の燃料補給
        if(fuelNeed > 0 && fCounter > 0){
          var fGive = Math.min(fuelNeed, fCounter);
          u.fuel = curFuel + fGive;
          fCounter -= fGive;
          didSupply = true;
          if(fGive < fuelNeed) partial = true;
        }
        // 補給先が空母・補給ユニットなどの「燃料庫保有ユニット」なら、その燃料庫も補充
        // (1ポイント = 1ポイント)
        if(fCounter > 0 && t.supplyFuel && typeof t.supplyFuelMax === 'number'){
          var ownFuelCount = (typeof u.supplyFuelCount === 'number') ? u.supplyFuelCount : t.supplyFuelMax;
          var ownFuelNeed = t.supplyFuelMax - ownFuelCount;
          if(ownFuelNeed > 0){
            var fGiveStock = Math.min(ownFuelNeed, fCounter);
            u.supplyFuelCount = ownFuelCount + fGiveStock;
            fCounter -= fGiveStock;
            didSupply = true;
            if(u.supplyFuelCount < t.supplyFuelMax) partial = true;
          }
        }
        fSupplier.supplyFuelCount = fCounter;
      } else {
        // 施設からの補給: rate に応じて部分補給 (弾薬工廠=1.0、生産施設=0.5、都市系=0.2)
        var fRate = (typeof src.fuelRate === 'number') ? src.fuelRate
                  : ((typeof src.rate === 'number') ? src.rate : 1.0);
        // 段階2: 施設の備蓄から引く (必要以上には出さない)
        if(fuelNeed > 0){
          var wantFuel = Math.min(fuelNeed, Math.ceil(fuelMax * fRate));
          var gotFuel = takeFacilityStock(src.fuelFacility, 'fuel', wantFuel);
          if(gotFuel > 0){
            u.fuel = Math.min(fuelMax, curFuel + gotFuel);
            didSupply = true;
          }
          if(u.fuel < fuelMax) partial = true;
        }
        // 補給ユニット自身の燃料庫も rate に応じて補給 (これも施設の備蓄から引く)
        if(t.supplyFuel && typeof t.supplyFuelMax === 'number'){
          var ownFuelCnt = (typeof u.supplyFuelCount === 'number') ? u.supplyFuelCount : t.supplyFuelMax;
          if(ownFuelCnt < t.supplyFuelMax){
            var wantFuelStock = Math.min(t.supplyFuelMax - ownFuelCnt, Math.ceil(t.supplyFuelMax * fRate));
            var gotFuelStock = takeFacilityStock(src.fuelFacility, 'fuel', wantFuelStock);
            if(gotFuelStock > 0){
              u.supplyFuelCount = Math.min(t.supplyFuelMax, ownFuelCnt + gotFuelStock);
              didSupply = true;
            }
            if(u.supplyFuelCount < t.supplyFuelMax) partial = true;
          }
        }
      }
    }
    if(needAmmo && src.ammo){
      if(!u.ammo) u.ammo = [];
      // 弾薬補給: 補給ユニットからの場合、カウンター制限あり
      // ソース施設(弾薬工廠/生産施設)からの場合、無制限
      if(src.ammoFromUnit){
        // 補給ユニット (補給車/補給艦) からの補給: カウンター消費
        var supplier = src.ammoFromUnit;
        var counter = (typeof supplier.supplyAmmoCount === 'number') ? supplier.supplyAmmoCount : 0;
        var totalSupplied = 0;
        for(var j=0; j<t.weapons.length; j++){
          var w = t.weapons[j];
          if(w.infiniteAmmo){ u.ammo[j] = -1; continue; }
          var maxAmmo = (w.ammo !== undefined ? w.ammo : 6);
          var current = (u.ammo[j] !== undefined && u.ammo[j] !== -1) ? u.ammo[j] : maxAmmo;
          var needed = maxAmmo - current;
          if(needed <= 0) continue;
          // カウンターから足りる分だけ補給
          var give = Math.min(needed, counter);
          if(give > 0){
            u.ammo[j] = current + give;
            counter -= give;
            totalSupplied += give;
          }
          if(counter <= 0) break;
        }
        // 残り武器を埋める処理 (補給対象外の武器は ammo を初期化していないと未定義のまま)
        for(var j=0; j<t.weapons.length; j++){
          var w = t.weapons[j];
          if(u.ammo[j] === undefined) u.ammo[j] = w.infiniteAmmo ? -1 : (w.ammo !== undefined ? w.ammo : 6);
        }
        // 補給先が空母・補給ユニットなどの「弾薬庫保有ユニット」なら、その弾薬庫も補充する
        // (1ポイント = 1ポイント、つまり 補給艦の1から空母の1へ)
        if(counter > 0 && t.supplyAmmo && typeof t.supplyAmmoMax === 'number'){
          var ownCount = (typeof u.supplyAmmoCount === 'number') ? u.supplyAmmoCount : t.supplyAmmoMax;
          var ownNeed = t.supplyAmmoMax - ownCount;
          if(ownNeed > 0){
            var giveStock = Math.min(ownNeed, counter);
            u.supplyAmmoCount = ownCount + giveStock;
            counter -= giveStock;
            totalSupplied += giveStock;
          }
        }
        supplier.supplyAmmoCount = counter;
        if(totalSupplied > 0){
          didSupply = true;
          // まだ補給しきれてないか?
          for(var j=0; j<t.weapons.length; j++){
            var w = t.weapons[j];
            if(w.infiniteAmmo) continue;
            var maxA = (w.ammo !== undefined ? w.ammo : 6);
            if(u.ammo[j] < maxA){ partial = true; break; }
          }
          // 弾薬庫もまだ満タンでないなら部分補給フラグ
          if(t.supplyAmmo && typeof t.supplyAmmoMax === 'number'
             && u.supplyAmmoCount < t.supplyAmmoMax) partial = true;
        }
      } else {
        // 施設(生産施設/弾薬工廠)・空母 からの補給
        // 補給率(rate)に応じて部分補給 (弾薬工廠=1.0、生産施設=0.5、都市系=0.2)
        var rate = (typeof src.ammoRate === 'number') ? src.ammoRate
                 : ((typeof src.rate === 'number') ? src.rate : 1.0);
        var stillNeedSomething = false;
        for(var j=0; j<t.weapons.length; j++){
          var w = t.weapons[j];
          if(w.infiniteAmmo){ u.ammo[j] = -1; continue; }
          var maxA = (w.ammo !== undefined ? w.ammo : 6);
          var cur = (u.ammo[j] !== undefined && u.ammo[j] !== -1) ? u.ammo[j] : maxA;
          if(cur >= maxA) continue;
          // 補給量 = 最大値 × rate (切り上げ)。段階2: 施設の備蓄から引く
          var wantA = Math.min(maxA - cur, Math.ceil(maxA * rate));
          var gotA = takeFacilityStock(src.ammoFacility, 'ammo', wantA);
          u.ammo[j] = cur + gotA;
          if(u.ammo[j] < maxA) stillNeedSomething = true;
        }
        // 残り武器を埋める処理 (補給対象外の武器の初期化)
        for(var j=0; j<t.weapons.length; j++){
          var w = t.weapons[j];
          if(u.ammo[j] === undefined) u.ammo[j] = w.infiniteAmmo ? -1 : (w.ammo !== undefined ? w.ammo : 6);
        }
        // 空母・補給ユニット自身の弾薬庫も rate に応じて補給
        if(t.supplyAmmo && typeof t.supplyAmmoMax === 'number'){
          var ownCnt = (typeof u.supplyAmmoCount === 'number') ? u.supplyAmmoCount : t.supplyAmmoMax;
          if(ownCnt < t.supplyAmmoMax){
            var wantStock = Math.min(t.supplyAmmoMax - ownCnt, Math.ceil(t.supplyAmmoMax * rate));
            var gotStock = takeFacilityStock(src.ammoFacility, 'ammo', wantStock);
            u.supplyAmmoCount = Math.min(t.supplyAmmoMax, ownCnt + gotStock);
            if(u.supplyAmmoCount < t.supplyAmmoMax) stillNeedSomething = true;
          }
        }
        if(stillNeedSomething) partial = true;
        didSupply = true;
      }
    }
    if(didSupply){
      // ラベル: 燃料のみ=(燃)、弾薬のみ=(弾)、部分補給=(部分)、両方=無印
      var label = '';
      if(src.fuel && !src.ammo) label = '(燃)';
      else if(!src.fuel && src.ammo) label = partial ? '(弾/部分)' : '(弾)';
      else if(partial) label = '(部分)';
      supplied.push(TYPE[u.type].name + label + '←' + src.name);
    }
  }
  if(supplied.length > 0){
    // 多くなりすぎないようサマリー
    var msg = '⛽ 補給: ' + supplied.slice(0, 3).join('、');
    if(supplied.length > 3) msg += ' 他' + (supplied.length - 3) + '件';
    setStatus(msg);
  }
  // 0b. 燃料切れ航空機を墜落させる (空母上以外)
  var crashed = [];
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== owner || u.hp <= 0) continue;
    if(TYPE[u.type].cat !== 'AIR') continue;
    if(u.fuel !== undefined && u.fuel <= 0){
      // 空母上にいる場合は墜落しない (補給される)
      var onCarrier = false;
      for(var j=0; j<units.length; j++){
        var c = units[j];
        if(c.id === u.id) continue;
        if(c.owner !== u.owner || c.hp <= 0) continue;
        if(TYPE[c.type].canCarry !== 'AIR') continue;
        if(c.x === u.x && c.y === u.y){ onCarrier = true; break; }
      }
      if(!onCarrier){
        u.hp = 0;
        crashed.push(TYPE[u.type].name);
      }
    }
  }
  if(crashed.length > 0){
    setStatus('💥 燃料切れで墜落: ' + crashed.join('、'));
  }
  units = units.filter(function(uu){ return uu.hp > 0; });

  // 0e. 収入(占領済み拠点から)
  // ※ 修理費(下記 1・2・2b)はこの収入から支払う。
  //   以前は収入の加算が修理の「後」だったため、前のターンに資金を使い切っていると
  //   修理が部分回復すらせず丸ごとスキップされていた。
  var income = 0;
  for(var k in captures){
    var capObj = captures[k];
    if(capObj.owner !== owner) continue;
    var xy = k.split(',');
    var ter = TER[M[parseInt(xy[1])][parseInt(xy[0])]];
    if(ter.income) income += ter.income;
  }
  funds[owner] += income;

  // 1. ユニットHP回復(待機修理 +2、施設マス上)
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== owner || u.hp <= 0) continue;
    var ter = TER[M[u.y][u.x]];
    var cap = captures[u.x+','+u.y];
    if(ter.heal && cap && cap.owner === owner){
      if(!ter.healCat || ter.healCat === TYPE[u.type].cat){
        // 待機修理: +2回復、費用は失HP×単価
        var beforeHp = u.hp;
        var afterHp = Math.min(HP_MAX, u.hp + 2 * 10); // +2回復
        var actualRecover = Math.ceil((afterHp - beforeHp) / 10); // 表示HPでの回復量
        if(actualRecover > 0){
          var unitPrice = TYPE[u.type].price || 0;
          var cost = actualRecover * Math.floor(unitPrice / 10 / 2);
          if(funds[owner] >= cost){
            funds[owner] -= cost;
            u.hp = afterHp;
          } else if(funds[owner] > 0){
            // 部分回復
            var maxAffordable = Math.floor(funds[owner] / Math.max(1, Math.floor(unitPrice / 10 / 2)));
            if(maxAffordable > 0){
              var realRecover = Math.min(actualRecover, maxAffordable);
              funds[owner] -= realRecover * Math.floor(unitPrice / 10 / 2);
              u.hp = Math.min(HP_MAX, u.hp + realRecover * 10);
            }
          }
        }
      }
    }
  }

  // 2. 施設収容ユニットの修理(スロット内 +3回復、費用は失HP×単価)
  // ※ アップグレード中の施設はスロット停止
  for(var k in captures){
    var capObj = captures[k];
    if(capObj.owner !== owner) continue;
    if(capObj.upgrading) continue; // アップグレード中はスキップ
    var xy = k.split(',');
    var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
    var ter = TER[M[fy][fx]];
    if(!ter.slots) continue; // 生産可能施設のみ
    if(!capObj.cargo) continue;
    for(var ci=0; ci<capObj.cargo.length; ci++){
      var cg = capObj.cargo[ci];
      // cargo自体と再帰的に中のcargoも回復
      repairCargoRecursive(cg, 3, owner);
    }
  }

  // 2b. 空母系搭載中の航空ユニット修理 (carrierHealプロパティ持ち)
  //  軽空母: +1, 空母: +2, 装甲空母: +2 (有償: 失HP × 単価)
  for(var i=0; i<units.length; i++){
    var carrier = units[i];
    if(carrier.owner !== owner || carrier.hp <= 0) continue;
    var ct = TYPE[carrier.type];
    if(!ct.carrierHeal) continue;
    if(!carrier.cargo || carrier.cargo.length === 0) continue;
    for(var ci=0; ci<carrier.cargo.length; ci++){
      var cg = carrier.cargo[ci];
      repairCargoRecursive(cg, ct.carrierHeal, owner);
    }
  }

  // 4. 生産進行(アップグレード中の施設はスキップ)
  for(var i=0; i<production.length; i++){
    var p = production[i];
    if(p.owner !== owner) continue;
    var pcap = captures[p.x+','+p.y];
    if(pcap && pcap.upgrading) continue; // アップグレード中はスキップ
    if(p.remaining > 0){
      p.remaining--;
      if(p.remaining === 0) p.ready = true;
    }
  }

  // 5. アップグレード進行
  for(var k in captures){
    var capObj = captures[k];
    if(capObj.owner !== owner) continue;
    if(!capObj.upgrading) continue;
    capObj.upgrading.remaining--;
    if(capObj.upgrading.remaining <= 0){
      // アップグレード完了: 地形を変更
      var xy = k.split(',');
      var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
      M[fy][fx] = capObj.upgrading.target;
      capObj.terKey = capObj.upgrading.target;
      // 拠点HPを新仕様の最大に
      var newTer = TER[capObj.upgrading.target];
      if(newTer.capHpMax){
        capObj.hp = newTer.capHpMax;
      }
      // 占領HPも新仕様の最大に (これがバグ修正点)
      capObj.captureHp = newTer.capCaptureHp || newTer.capHpMax || CAP_MAX;
      delete capObj.upgrading;
    }
  }
}

// cargo を再帰的に回復(スロット修理 +3)
function repairCargoRecursive(cg, healAmt, owner){
  var beforeHp = cg.hp;
  var afterHp = Math.min(HP_MAX, cg.hp + healAmt * 10);
  var actualRecover = Math.ceil((afterHp - beforeHp) / 10);
  if(actualRecover > 0){
    var unitPrice = TYPE[cg.type].price || 0;
    var cost = actualRecover * Math.floor(unitPrice / 10 / 2);
    if(funds[owner] >= cost){
      funds[owner] -= cost;
      cg.hp = afterHp;
    } else if(funds[owner] > 0){
      var maxAffordable = Math.floor(funds[owner] / Math.max(1, Math.floor(unitPrice / 10 / 2)));
      if(maxAffordable > 0){
        var realRecover = Math.min(actualRecover, maxAffordable);
        funds[owner] -= realRecover * Math.floor(unitPrice / 10 / 2);
        cg.hp = Math.min(HP_MAX, cg.hp + realRecover * 10);
      }
    }
  }
  // 再帰: cargoの中にcargoがあれば
  if(cg.cargo && cg.cargo.length > 0){
    for(var i=0; i<cg.cargo.length; i++){
      repairCargoRecursive(cg.cargo[i], healAmt, owner);
    }
  }
}

function endTurn(){
  if(checkWin()) return;
  // 敵脅威範囲表示をクリア (前ターンに表示したものを残さない)
  setClear(enemyThreatSet); setClear(enemyMoveSet);
  // 昼夜サイクル進行: 各陣営ターンエンドでカウント
  var phaseChanged = false;
  if(dayNightCycle){
    phaseTurn++;
    if(phaseTurn >= dayLength * activeFactions.length){
      currentPhase = (currentPhase === 'day') ? 'night' : 'day';
      phaseTurn = 0;
      phaseChanged = true;
    }
  }
  // 次の陣営に進む (脱落陣営はスキップ)
  var nextFac = nextFaction(turn);
  if(!nextFac){
    // 全陣営脱落 (理論上ありえない)
    return;
  }
  // 1ラウンド完了判定: 次陣営が活性陣営の先頭 (= P) に戻る = 全陣営が一巡した
  var roundEnded = (nextFac === activeFactions[0]);
  if(roundEnded) roundNumber++;
  turn = nextFac;
  // ターン開始ログ
  if(window.PLAYER_LOG || window.AI_DEBUG){
    try{ console.log('%c=== Round ' + roundNumber + ' Turn: ' + turn + ' ===', 'color:#5a4a30; font-weight:bold; background:#f5e8c4; padding:2px 8px;'); }catch(e){}
  }
  selected = null; pendingUnit = null; attackMode = false; unloadMode = false; setClear(unloadValidSet); unloadStarted = false; coupleMode = false; setClear(coupleValidSet); uncoupleMode = false; setClear(uncoupleValidSet);
  setClear(movableSet); setClear(attackableSet);
  hideCommandPanel();
  // 天候の進行 (1ラウンドごとに各雲が1マス流れる)
  if(roundEnded) advanceWeather();
  applyTurnStart(turn);
  for(var i=0; i<units.length; i++){ if(units[i].owner === turn){ units[i].moved = false; units[i].acted = false; } }
  // 補給ルート (段階3): AI 陣営はルートを自動で組み直してから往復させる
  if(!isPlayerFaction(turn) || playerIsAI) aiAssignSupplyRoutes(turn);
  runSupplyRoutes(turn);
  // ステータスメッセージ
  var phaseMsg = '';
  if(phaseChanged){
    phaseMsg = currentPhase === 'night' ? '🌙 夜になりました — 視界-1(施設マスは光源で打ち消し) / ' : '☀ 朝になりました / ';
  }
  if(isPlayerFaction(turn) && !playerIsAI){
    setStatus(phaseMsg + 'あなたのターン: ユニットを選んでください');
    render();
  } else {
    var label = isPlayerFaction(turn) ? '🤖 ' + (FACTION_NAMES[turn] || turn) + ' (AI制御中)' : (FACTION_NAMES[turn] || turn) + 'のターン...';
    setStatus(phaseMsg + label);
    render();
    setTimeout(aiTurn, aiStepDelay(600));
  }
}

// AI戦略補助: 自陣営の首都(または代替の本拠地)位置を返す
// - originalCapital が立っている自軍占領拠点を最優先
// - なければ自軍占領中の生産施設のうち最初のもの
// - それも無ければ自軍占領中の都市・施設(slots不要、capturableなら何でも)
// - それも無ければ自軍最初のユニット位置
// - 全部無ければ null
function _aiHomeBase(aiFaction){
  // 1) 元首都
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    if(!cap.originalCapital) continue;
