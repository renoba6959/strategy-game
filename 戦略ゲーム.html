    // 燃料不足判定 (fuelMax の 50% 未満)
    if(t.supplyFuel && c.fuel !== undefined){
      var fuelRatio = c.fuel / (cT.fuelMax || 99);
      if(fuelRatio < 0.5) needSupply = true;
    }
    // 有限武器 (主火力) が全て弾切れ → 補給対象 (無限武器の弱い予備しか残っていない)
    // 占領ユニット (歩兵など) は AI では攻撃に使わないので対象外
    if(t.supplyAmmo && cT.weapons && cT.weapons.length > 0 && c.ammo && !cT.canCapture){
      var hasFin = false, hasFinAmmo = false;
      for(var wi=0; wi<cT.weapons.length; wi++){
        if(cT.weapons[wi].infiniteAmmo) continue;
        hasFin = true;
        if((c.ammo[wi] || 0) > 0) hasFinAmmo = true;
      }
      if(hasFin && !hasFinAmmo) needSupply = true;
    }
    if(needSupply){
      candidates.push({ unit: c, price: cT.price || 0 });
    }
  }

  // [2] 補給対象がいる場合: 生産価格高い順に優先
  if(candidates.length > 0){
    candidates.sort(function(a, b){ return b.price - a.price; });

    // [3] 3マスルール: 自軍視界の敵から距離3以上のマスのみ移動可
    // 敵リストを集める (自軍視界内のもの)
    var visEnemies = [];
    for(var ei=0; ei<units.length; ei++){
      var ev = units[ei];
      if(isAlly(ev.owner, aiFaction) || ev.owner === 'N' || ev.hp <= 0) continue;
      if(!isUnitVisibleTo(ev, aiFaction)) continue;
      visEnemies.push(ev);
    }
    // 安全マス判定: マス (x, y) が全ての視認敵からマンハッタン距離3以上か
    function _isSafeMass(mx, my){
      for(var evi=0; evi<visEnemies.length; evi++){
        var ev = visEnemies[evi];
        if(manhattan(mx, my, ev.x, ev.y) < 3) return false;
      }
      return true;
    }

    // 補給対象を順に試す (生産価格高い順)
    for(var ci=0; ci<candidates.length; ci++){
      var tg = candidates[ci].unit;
      // 既に隣接していれば動かない (次ターンに自動補給される)
      if(manhattan(u.x, u.y, tg.x, tg.y) <= 1){
        // ただし現在位置が安全マスでなければ動きたいが、隣接補給優先 → そのまま
        if(window.AI_DEBUG) try{ console.log('  → supply: 既に隣接 '+TYPE[tg.type].name+'@('+tg.x+','+tg.y+') 価格='+candidates[ci].price); }catch(e){}
        u.acted = true;
        return true;
      }
      // 移動先候補: 自分の movable + 補給対象に隣接 + 安全マス (敵から距離3以上)
      var movable = computeMovable(u);
      var bestMove = null, bestMoveD = Infinity;
      for(var mk in movable){
        var mxy = mk.split(',');
        var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
        var blocker = unitAt(mx, my);
        if(blocker && blocker.id !== u.id) continue;
        // 3マスルール: 安全マスでなければスキップ
        if(!_isSafeMass(mx, my)) continue;
        // 補給対象までの距離 (隣接できるなら距離1、それより遠ければ近づく方向)
        var d = manhattan(mx, my, tg.x, tg.y);
        if(d < bestMoveD){ bestMoveD = d; bestMove = { x: mx, y: my }; }
      }
      if(bestMove){
        if(window.AI_DEBUG) try{ console.log('  → supply: '+TYPE[tg.type].name+'@('+tg.x+','+tg.y+') 価格='+candidates[ci].price+' → 移動('+bestMove.x+','+bestMove.y+')'); }catch(e){}
        if(bestMove.x !== u.x || bestMove.y !== u.y){
          executeMoveWithAmbushCheck(u, bestMove.x, bestMove.y);
        }
        u.acted = true;
        return true;
      }
      // この補給対象には安全に到達できない → 次の候補へ
    }
    // 全候補について安全に到達できない → 近くの安全マスで待機 (現在地が安全でなければ動く)
    if(!_isSafeMass(u.x, u.y)){
      // 現在地が危険、最も近い安全マスを探す
      var safeMovable = computeMovable(u);
      var bestSafe = null, bestSafeD = Infinity;
      for(var sk in safeMovable){
        var sxy = sk.split(',');
        var sx = parseInt(sxy[0]), sy = parseInt(sxy[1]);
        var blS = unitAt(sx, sy);
        if(blS && blS.id !== u.id) continue;
        if(!_isSafeMass(sx, sy)) continue;
        var ds = manhattan(sx, sy, u.x, u.y);
        if(ds < bestSafeD){ bestSafeD = ds; bestSafe = { x: sx, y: sy }; }
      }
      if(bestSafe && (bestSafe.x !== u.x || bestSafe.y !== u.y)){
        if(window.AI_DEBUG) try{ console.log('  → supply: 危険回避で安全マス('+bestSafe.x+','+bestSafe.y+')へ移動'); }catch(e){}
        executeMoveWithAmbushCheck(u, bestSafe.x, bestSafe.y);
      }
      u.acted = true;
      return true;
    }
    // 安全マスで動かず待機
    if(window.AI_DEBUG) try{ console.log('  → supply: 安全に到達できる補給対象なし、待機'); }catch(e){}
    u.acted = true;
    return true;
  }

  // [4] 補給対象がいない時: 自軍ユニットの後方に追従
  // 「後方」= 自軍前線ユニット (戦闘ユニット) の集中位置の自軍施設寄り
  // 簡易実装: 補給対応カテゴリの自軍ユニット (敵から距離3以上の場所にいるもの) の重心 + そこへ向かう
  var followCandidates = [];
  for(var fi=0; fi<units.length; fi++){
    var fc = units[fi];
    if(fc.owner !== aiFaction || fc.hp <= 0) continue;
    if(fc.id === u.id) continue;
    if(!_supplyTargetMatches(t, fc)) continue;
    followCandidates.push(fc);
  }
  if(followCandidates.length === 0){
    if(window.AI_DEBUG) try{ console.log('  → supply: 補給対象も追従対象もなし、待機'); }catch(e){}
    return false;
  }
  // 自分から最も近い味方を追従
  var nearestAlly = null, nearestAllyD = Infinity;
  for(var fi2=0; fi2<followCandidates.length; fi2++){
    var fc2 = followCandidates[fi2];
    var fd = manhattan(u.x, u.y, fc2.x, fc2.y);
    if(fd < nearestAllyD){ nearestAllyD = fd; nearestAlly = fc2; }
  }
  if(nearestAlly){
    // 3マスルールを守りつつ追従
    var visEnemies2 = [];
    for(var ei2=0; ei2<units.length; ei2++){
      var ev2 = units[ei2];
      if(isAlly(ev2.owner, aiFaction) || ev2.owner === 'N' || ev2.hp <= 0) continue;
      if(!isUnitVisibleTo(ev2, aiFaction)) continue;
      visEnemies2.push(ev2);
    }
    function _safeForFollow(mx, my){
      for(var evi=0; evi<visEnemies2.length; evi++){
        if(manhattan(mx, my, visEnemies2[evi].x, visEnemies2[evi].y) < 3) return false;
      }
      return true;
    }
    var movableF = computeMovable(u);
    var bestFollow = null, bestFollowD = Infinity;
    for(var fk in movableF){
      var fxy = fk.split(',');
      var fx = parseInt(fxy[0]), fy = parseInt(fxy[1]);
      var blF = unitAt(fx, fy);
      if(blF && blF.id !== u.id) continue;
      if(!_safeForFollow(fx, fy)) continue;
      var dF = manhattan(fx, fy, nearestAlly.x, nearestAlly.y);
      if(dF < bestFollowD){ bestFollowD = dF; bestFollow = { x: fx, y: fy }; }
    }
    if(bestFollow && (bestFollow.x !== u.x || bestFollow.y !== u.y)){
      if(window.AI_DEBUG) try{ console.log('  → supply: 後方追従 '+TYPE[nearestAlly.type].name+'@('+nearestAlly.x+','+nearestAlly.y+') → ('+bestFollow.x+','+bestFollow.y+')'); }catch(e){}
      executeMoveWithAmbushCheck(u, bestFollow.x, bestFollow.y);
    }
    u.acted = true;
    return true;
  }
  return false;
}

function aiTurn(){
  // 現在のターン陣営 (turn) のAIが行動する
  var aiFaction = turn;
  if(window.AI_DEBUG) try{
    var myTeam = factionTeams[aiFaction] || '?';
    var allies = [];
    for(var fA in factionTeams){
      if(fA !== aiFaction && isAlly(fA, aiFaction)) allies.push(fA);
    }
    console.log('%c=== [AI '+aiFaction+'] round '+roundNumber+' start (team='+myTeam+', allies='+(allies.length?allies.join(','):'none')+') ===', 'color:#9F8E80; font-weight:bold;');
  }catch(e){}
  // 仕様書セクション12「最後に生産」:
  //   取り出し (前ターン完成品) は行動の前 (今ターン動かすため)
  //   新規生産 + アップグレード は行動の後 (損傷ユニットの修理スロット確保のため)
  // ここでは取り出し + 空母から発艦 のみ実行
  aiProduceAndTakeOut(aiFaction, 'takeout');

  var aiUnits = [];
  for(var i=0; i<units.length; i++){ if(units[i].owner === aiFaction && units[i].hp > 0) aiUnits.push(units[i]); }
  // 各ユニットについて、最寄り敵首都までの経路距離を事前計算 (前線寄りユニットから先に動かす)
  // 渋滞解消: 前のユニット (前線寄り) が先に動くことで後ろのユニットも進める
  // 敵首都リストを集める
  var enemyCapsForOrder = [];
  for(var ckO in captures){
    var capE = captures[ckO];
    var cxyO = ckO.split(',');
    var cexO = parseInt(cxyO[0]), ceyO = parseInt(cxyO[1]);
    var ceTO = TER[M[ceyO][cexO]];
    if(!ceTO || !ceTO.isCapital) continue;
    if(capE.owner === 'N') continue;
    if(isAlly(capE.owner, aiFaction)) continue;
    enemyCapsForOrder.push({ x: cexO, y: ceyO });
  }
  // 各ユニットの「最寄り敵首都への経路距離」を計算
  var unitFrontDist = {};
  for(var ui=0; ui<aiUnits.length; ui++){
    var au = aiUnits[ui];
    var minD = Infinity;
    if(enemyCapsForOrder.length > 0){
      var apd = bfsPathDistances(au.x, au.y, au);
      for(var eci2=0; eci2<enemyCapsForOrder.length; eci2++){
        var ec2 = enemyCapsForOrder[eci2];
        var d2 = apd[ec2.x+','+ec2.y];
        if(d2 !== undefined && d2 < minD) minD = d2;
      }
    }
    unitFrontDist[au.id] = (minD === Infinity) ? 9999 : minD;
  }
  // 生産施設マスに居座っているユニットを先頭に並び替え (生産口を空けるため早めに移動させる)
  // その次に、敵首都に近いユニット (前線寄り) から先に処理 (渋滞解消)
  aiUnits.sort(function(a, b){
    var aOnFacility = false, bOnFacility = false;
    var capA = captures[a.x+','+a.y];
    if(capA && capA.owner === aiFaction){
      var terA = TER[M[a.y][a.x]];
      if(terA && terA.slots) aOnFacility = true;
    }
    var capB = captures[b.x+','+b.y];
    if(capB && capB.owner === aiFaction){
      var terB = TER[M[b.y][b.x]];
      if(terB && terB.slots) bOnFacility = true;
    }
    if(aOnFacility && !bOnFacility) return -1;
    if(!aOnFacility && bOnFacility) return 1;
    // 敵首都に近い順 (前線寄り先)
    var dA = unitFrontDist[a.id] || 9999;
    var dB = unitFrontDist[b.id] || 9999;
    return dA - dB;
  });
  var shovedIds = {}; // make-way(こじ開け)でどかした味方ID → ループ側で二重行動させないため
  var idx = 0;
  function step(){
    if(idx >= aiUnits.length || gameOver){
      if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] === turn end (idx='+idx+'/'+aiUnits.length+', gameOver='+gameOver+') ==='); }catch(e){}
      // 仕様書セクション12「最後に生産」:
      //   全ユニットの行動が完了したこの時点で、施設アップグレードと新規生産を実行
      //   損傷ユニットは修理のため施設に戻っているはずなので、空きスロットで生産可能
      aiUpgrade(aiFaction);
      aiProduceAndTakeOut(aiFaction, 'produce');
      endTurn(); return;
    }
    var u = aiUnits[idx++];
    if(u.hp <= 0){
      if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] skip dead unit @('+u.x+','+u.y+')'); }catch(e){}
      step(); return;
    }
    if(shovedIds[u.id]){ // make-way で退避ユニットの道を空けるため既に移動済み → 行動スキップ
      if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] skip shoved(make-way) unit @('+u.x+','+u.y+')'); }catch(e){}
      step(); return;
    }
    if(window.AI_DEBUG){ try{ console.log('[AI '+aiFaction+'] unit='+TYPE[u.type].name+' @('+u.x+','+u.y+') hp='+u.hp+' fuel='+u.fuel+' acted='+u.acted); }catch(e){} }
    // 補給ユニット (補給車・給油艦・空中給油機): 補給対象の近くに移動
    if(TYPE[u.type].isSupply){
      if(window.AI_DEBUG) try{ console.log('  → [supply path]'); }catch(e){}
      if(aiSupplyAction(u, aiFaction)){
        render();
        setTimeout(step, aiStepDelay(200));
        return;
      }
      if(window.AI_DEBUG) try{ console.log('  → supply: nothing to do, skip'); }catch(e){}
      step(); return;
    }
    // 施設収容の最優先チェック:
    //   自軍生産施設マス上にいて、修理(HP≤50)または補給(弾薬・燃料が乏しい)が必要なら、
    //   通常フローより先に収容(フル補給)を試みる。
    //   ・HP: _aiNeedsRepair は「施設マス上なら不要」で false を返すため、修理パス内の収容には
    //     到達できない (収容の前提=施設上 と 収容を呼ぶ前提=施設上でない が排他だった)。
    //   ・弾薬/燃料: 施設上は毎ターン50%補給が先に入り _aiNeedsAmmo(全主火力0) が立たないため、
    //     帰投パスの収容にも到達できない。→ _aiWantsFacilityResupply(50%以下)で判定する。
    //   空きスロットがあれば収容 → 翌ラウンド HP/燃料/弾薬 満タンで復帰。
    //   生産でスロットが埋まっている場合は aiStoreInFacilityForService が false を返して通過し、
    //   従来どおり施設上で毎ターン部分補給(HP微回復+50%弾薬/燃料)に流れる。
    if(!TYPE[u.type].isSupply && !isLandTransport(u.type) && (u.hp <= 50 || _aiWantsFacilityResupply(u))){
      var _capHere = captures[u.x+','+u.y];
      var _terHere = TER[M[u.y][u.x]];
      if(_capHere && _capHere.owner === aiFaction && _terHere && _terHere.slots){
        if(window.AI_DEBUG) try{ console.log('  → [STORE-FIRST] hp='+u.hp+'/100 ammo='+JSON.stringify(u.ammo)+' fuel='+u.fuel+' 施設マス上→収容試行'); }catch(e){}
        if(aiStoreInFacilityForService(u, aiFaction)){
          render();
          if(checkWin()) return;
          setTimeout(step, aiStepDelay(200));
          return;
        }
        // 収容不可 (スロット満杯/アップグレード中/healCat不一致) → 通常フローへ続行
      }
    }
    // フェーズ1+2: HP≤50 は有効打を出せず消耗するだけなので、攻撃せず退避を最優先。
    //   修理拠点へ下がる / 無ければ敵から離れる。経路が味方で塞がれていれば味方をどかして道を作る。
    //   退避不要(安全 かつ 修理拠点なし)の場合のみ acted:false を返し、通常フローに委ねる。
    if(!TYPE[u.type].isSupply && !isLandTransport(u.type) && u.hp <= 50){
      var _rr = aiExecuteRetreat(u, aiFaction, shovedIds);
      if(_rr.acted){
        u.acted = true;
        render();
        if(checkWin()) return;
        setTimeout(step, aiStepDelay(200));
        return;
      }
    }
    // 修理判定: HP ≤ 50% なら攻撃をやめて修理可能施設に下がる
    // (輸送ユニット・補給ユニット自身は対象外)
    if(!TYPE[u.type].isSupply && !isLandTransport(u.type)){
      if(_aiNeedsRepair(u, aiFaction)){
        if(window.AI_DEBUG) try{ console.log('  → [REPAIR path] hp='+u.hp+'/100'); }catch(e){}
        // 自軍生産施設マス上で空きスロットがあれば収容修理 (マスを空ける + 取り出し時に燃料弾薬も満タン)
        if(aiStoreInFacilityForService(u, aiFaction)){
          render();
          if(checkWin()) return;
          setTimeout(step, aiStepDelay(200));
          return;
        }
        var repaired = _aiMoveToSupplyPoint(u, aiFaction, 'repair');
        if(repaired){
          u.acted = true;
          render();
          if(checkWin()) return;
          setTimeout(step, aiStepDelay(200));
          return;
        }
        if(window.AI_DEBUG) try{ console.log('  → REPAIR: no path, fallback to normal'); }catch(e){}
      }
    }
    // 帰投判定: 燃料切れ or 弾薬切れの場合、最寄り補給場所に移動
    // (輸送ユニットや補給ユニット自身は対象外、上で処理済み)
    // 工兵は橋建設・占領を継続できるよう除外 (歩兵系は無限弾)
    if(!TYPE[u.type].isSupply && !isLandTransport(u.type)){
      var needRefuelFlag = _aiNeedsRefuel(u, aiFaction);
      var needAmmoFlag = _aiNeedsAmmo(u, aiFaction);
      if(needRefuelFlag || needAmmoFlag){
        var returnReason = needRefuelFlag ? 'fuel' : 'ammo';
        if(window.AI_DEBUG) try{ console.log('  → [RETURN path] reason='+returnReason+' fuel='+u.fuel+'/'+TYPE[u.type].fuelMax+' ammo='+JSON.stringify(u.ammo)); }catch(e){}
        // 自軍生産施設マス上で空きスロットがあれば収容(フル補給)。無ければ施設上で通常補給。
        // 施設上補給は毎ターン部分回復のため、中途半端な補給での再出撃→即弾切れの繰り返しを防ぐ。
        if(aiStoreInFacilityForService(u, aiFaction)){
          render();
          if(checkWin()) return;
          setTimeout(step, aiStepDelay(200));
          return;
        }
        var returned = _aiMoveToSupplyPoint(u, aiFaction, returnReason);
        if(returned){
          u.acted = true;
          render();
          if(checkWin()) return;

    // 仕様: 歩兵・工兵 (canCapture) は敵が見えていても占領が本業 (攻撃しない)

    if(targets.length === 0 || TYPE[u.type].canCapture){

        var engineerSkipSea = TYPE[u.type].isEngineer && _aiBridgePlan(aiFaction).bridgeSpots.length > 0;

        if(capTargets.length > 0){
          // 工兵 → 廃墟優先、普通の歩兵系 → 廃墟以外を優先
          var ruinTargets2 = [], normTargets2 = [];
          for(var ti=0; ti<capTargets.length; ti++){

          // 仕様: 各歩兵は自分の位置から経路距離で最寄りの目標を選ぶ

          var unitPathDist = bfsPathDistances(u.x, u.y, u);
          // 他の占領担当ユニット (まだ acted=false) を集めて、ベストマッチ判定に使う
          var otherCapUnits = [];

            // ただし簡略化のためここでは全 canCapture を対象にする (後で目標が同じか個別判定で対応)
            otherCapUnits.push(ou);
          }
          // 候補目標リストを優先順に組み立て: 工兵=廃墟→通常、歩兵=通常→廃墟
          var primaryList = isEngineer ? ruinTargets2 : normTargets2;

          if(isEngineer){

            var engIsland0 = engHeavyMap0[u.y] && engHeavyMap0[u.y][u.x];
            if(engIsland0){
              var sameIsl0 = function(t){ var ti = engHeavyMap0[t.y] && engHeavyMap0[t.y][t.x]; return ti === engIsland0; };
              primaryList = primaryList.filter(sameIsl0);
              fallbackList = fallbackList.filter(sameIsl0);
            }
          }
          // 各候補に「自分からの経路距離」を計算してソート
          function evaluateTargets(targets, allowYield){
            // allowYield=true ならベストマッチで譲る、false なら譲らずに選ぶ
            var best = null, bestD = Infinity;
            for(var ti=0; ti<targets.length; ti++){
              var tg = targets[ti];
              var k = tg.x+','+tg.y;
              var d = unitPathDist[k];
              if(d === undefined) continue; // 到達不能
              // ベストマッチ: 同じ種別 (工兵/歩兵) の他の味方が自分より近い経路距離で狙っていれば譲る
              if(allowYield){

                  // 廃墟は工兵間、通常は歩兵間でのみ譲り合い

                  var ouPathDist = bfsPathDistances(ou.x, ou.y, ou);
                  var ouD = ouPathDist[k];
                  if(ouD === undefined) continue; // 相手が到達不能
                  if(ouD < d){ yielded = true; break; }
                }
                if(yielded) continue;
              }
              if(d < bestD){ bestD = d; best = tg; }
            }
            return { goal: best, dist: bestD };
          }
          // パス1: primaryList でベストマッチ譲り
          var r1 = evaluateTargets(primaryList, true);
          if(r1.goal){ myGoal2 = r1.goal; myGoalD2 = r1.dist; }
          // パス2: primaryList で譲らず再評価
          if(!myGoal2){
            var r2 = evaluateTargets(primaryList, false);
            if(r2.goal){ myGoal2 = r2.goal; myGoalD2 = r2.dist; }
          }
          // パス3: fallbackList でベストマッチ譲り
          if(!myGoal2){
            var r3 = evaluateTargets(fallbackList, true);
            if(r3.goal){ myGoal2 = r3.goal; myGoalD2 = r3.dist; }

          if(TYPE[u.type].isEngineer){

                  if(amClosest2){
                    // 隣接陸地マスのうち、自分から最も近い場所をゴールに
                    var bDirs2 = [[1,0],[-1,0],[0,1],[0,-1]];
                    var bestAdj2 = null, bestAdjD2 = Infinity;
                    for(var bdi2=0; bdi2<bDirs2.length; bdi2++){
                      var bnx2 = sp2.x + bDirs2[bdi2][0];
                      var bny2 = sp2.y + bDirs2[bdi2][1];
                      if(!inBounds(bnx2, bny2)) continue;
                      var bnk2 = M[bny2][bnx2];
                      var bnc2 = COST.INF && COST.INF[bnk2];
                      if(bnc2 === undefined || bnc2 === Infinity) continue;
                      var bnu2 = unitAt(bnx2, bny2);
                      // 自分以外の味方/敵が居るマスは選べない (停止不可)
                      if(bnu2 && bnu2.id !== u.id) continue;
                      // 川マスは2次候補 (陸地優先、陸地がダメなら川マスで川の中から建設)
                      var isRiver2 = (bnk2 === 'RIVER');
                      var bnd2 = manhattan(u.x, u.y, bnx2, bny2);
                      // 陸地は優先度高 (距離 + 0)、川マスは優先度低 (距離 + 100)
                      var prio2 = bnd2 + (isRiver2 ? 100 : 0);
                      if(prio2 < bestAdjD2){ bestAdjD2 = prio2; bestAdj2 = { x:bnx2, y:bny2 }; }
                    }
                    if(bestAdj2){
                      myGoal2 = { x: bestAdj2.x, y: bestAdj2.y, isRuins: false, owner: 'N', isBridgeApproach: true };
                      myGoalD2 = bestAdjD2;
                      if(window.AI_DEBUG) try{ console.log('  → (no-enemy) bridge approach goal=('+bestAdj2.x+','+bestAdj2.y+')'); }catch(e){}
                    }
                    break;
                  }
                }
              }
            } else {
              if(window.AI_DEBUG) try{ console.log('  → (no-enemy) 橋接近スキップ: 自陣側に未確保の占領対象があるので占領を優先'); }catch(e){}
            }
          }
          // 工兵専用フォールバック (仕様書セクション4 工兵総合行動順 6番目「施設修復」)
          // 占領目標も橋計画もない場合、最寄りの損傷自軍施設へ移動して修復を準備
          if(!myGoal2 && TYPE[u.type].isEngineer){
            var damagedList = _aiDamagedFacilities(aiFaction);
            if(damagedList.length > 0){
              // 工兵から近い順 (仕様書: 工兵から近い順)
              var nearestDmg = null, nearestDmgD = Infinity;
              for(var dgi=0; dgi<damagedList.length; dgi++){
                var dg = damagedList[dgi];
                var dgD = manhattan(u.x, u.y, dg.x, dg.y);
                if(dgD < nearestDmgD){ nearestDmgD = dgD; nearestDmg = dg; }
              }
              if(nearestDmg){
                myGoal2 = { x: nearestDmg.x, y: nearestDmg.y, isRuins: false, owner: aiFaction, isRepairTarget: true };
                myGoalD2 = nearestDmgD;
                if(window.AI_DEBUG) try{ console.log('  → (engineer) 損傷施設修復目標: ('+nearestDmg.x+','+nearestDmg.y+') HP='+nearestDmg.hp+'/'+nearestDmg.maxHp); }catch(e){}
              }
            }
          }
          if(myGoal2){
            if(window.AI_DEBUG) try{ console.log('  → myGoal=('+myGoal2.x+','+myGoal2.y+') ruins='+myGoal2.isRuins+' owner='+myGoal2.owner); }catch(e){}
            var movableC = computeMovable(u);
            if(window.AI_DEBUG) try{ console.log('  → movable count='+Object.keys(movableC).length); }catch(e){}
            // 移動先として、ゴールに最も近づける移動可能マスを選ぶ (経路距離 BFS で評価)
            // 目標マスから各マスへの経路距離を BFS で計算
            var goalPathDist = bfsPathDistances(myGoal2.x, myGoal2.y, u);
            var bestMoveC = null, bestMoveCD = Infinity;
            for(var mk in movableC){
              var mxy = mk.split(',');
              var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
              var blocker = unitAt(mx, my);
              if(blocker && blocker.id !== u.id) continue;
              // 工兵以外は川マスに「停止」しない (橋のない川に居座って前線を塞ぐのを防ぐ。渡る=通過はOK)
              // 橋接近中の工兵は川マスに乗れる (isBridgeApproach) ので除外しない
              if(!TYPE[u.type].isEngineer && M[my][mx] === 'RIVER') continue;
              // 廃墟は工兵以外は乗らない (再建が先)
              if(myGoal2.isRuins && !TYPE[u.type].isEngineer && mx === myGoal2.x && my === myGoal2.y) continue;
              // 自軍生産施設の上には留まらない (ゴールでない限り)
              var capCheck = captures[mx+','+my];
              var terCheck = TER[M[my][mx]];
              if(capCheck && capCheck.owner === aiFaction && terCheck && terCheck.slots
                 && (mx !== myGoal2.x || my !== myGoal2.y)) continue;
              // 経路距離で評価 (海越え分断対応)、到達不能なマスは大きな数値で除外
              var dApp = goalPathDist[mx+','+my];
              if(dApp === undefined) dApp = 9999;
              if(dApp < bestMoveCD){ bestMoveCD = dApp; bestMoveC = { x: mx, y: my }; }
            }
            if(bestMoveC){
              if(window.AI_DEBUG) try{ console.log('  → MOVE to ('+bestMoveC.x+','+bestMoveC.y+')'); }catch(e){}
              var aiMoveRC = executeMoveWithAmbushCheck(u, bestMoveC.x, bestMoveC.y);
              if(window.AI_DEBUG && aiMoveRC.stoppedEarly) try{ console.log('    伏兵察知で早期停止 (戦闘行動 → '+aiMoveRC.toX+','+aiMoveRC.toY+')'); }catch(e){}
              // 目的地が伏兵マスだった場合のみ奇襲発動
              if(aiMoveRC.justMoved && aiMoveRC.hitAmbush){
                var ambushedC = performAmbush(u, function(wasAmbushed){
                  if(wasAmbushed){
                    units = units.filter(function(uu){ return uu.hp > 0; });
                    render();
                    if(checkWin()) return;
                    setTimeout(step, aiStepDelay(600));
                  }
                });
                if(ambushedC){ u.acted = true; return; }
              }
              // 移動先が拠点なら占領開始 (廃墟マスは工兵で再建)
              var capArrivedC = captures[u.x+','+u.y];
              if(capArrivedC && !isAlly(capArrivedC.owner, u.owner)){
                var arrivedTer = TER[M[u.y][u.x]];
                if(arrivedTer && arrivedTer.isRuins){
                  // 廃墟: 工兵なら再建、それ以外は何もしない
                  if(TYPE[u.type].isEngineer){
                    aiRebuild(u);
                  }
                } else if(arrivedTer){
                  // 通常の占領可能マス
                  performCapture(u, capArrivedC);
                }
              }
              u.acted = true;
              render();
              if(checkWin()) return;
              setTimeout(step, aiStepDelay(300));
              return;
            }
          }
        }
      }
      // 占領担当でない、または占領目標も無い場合: 退避すべき状況なら自軍歩兵のために退避
      // 退避条件:
      //  (a) 自軍生産施設の上にいる (生産口を空ける)
      //  (b) 戦闘ユニット (canCapture でない) が、自軍占領完了でない拠点に居る
      //      → 中立拠点や占領途中の拠点を塞いでいる場合、自軍歩兵が占領できないので退避
      //  (c) 輸送船の乗艦地形 (浅瀬・港) または輸送ヘリの乗艦地形 (歩兵が乗れる地形) にいて、
      //      距離6以内に空き輸送ユニットがある → 輸送ユニットの動線を空ける
      var stayMaxCap = stayTer ? (stayTer.capCaptureHp || stayTer.capHpMax || CAP_MAX) : 0;
      var stayIsOwnFinished = stayCap && stayCap.owner === u.owner
                              && (stayCap.captureHp || 0) >= stayMaxCap;
      var shouldEvacFacility = (stayCap && stayCap.owner === u.owner && stayTer && stayTer.slots);
      var shouldEvacCapPoint = (!TYPE[u.type].canCapture && stayCap && stayTer
                                && stayTer.capturable && !stayIsOwnFinished);
      // (c) 輸送動線退避判定
      var shouldEvacForTransport = false;
      if(!shouldEvacFacility && !shouldEvacCapPoint){
        // 現在地が「輸送船の乗艦地形」(浅瀬・港系) または「輸送ヘリの乗艦地形」(歩兵地形) か
        var stayKey = M[u.y][u.x];
        var stayIsShipBoard = false; // 輸送船の乗艦可能マス
        var stayIsAirBoard = false;  // 輸送ヘリ/機の乗艦可能マス
        // SHOAL / PORT 系 = 輸送船が乗艦可能
        if(stayKey === 'SHOAL' || (stayTer && (stayTer.group === 'port' || stayTer.healCat === 'SEA'))){
          stayIsShipBoard = true;
        }
        // 輸送ヘリ着陸 = 歩兵が乗れる陸上地形 (浅瀬や港・海ではない)
        if(stayKey !== 'SEA' && stayKey !== 'RIVER' && stayKey !== 'SHOAL'){
          var infCost = COST.INF && COST.INF[stayKey];
          if(infCost !== undefined && infCost !== Infinity) stayIsAirBoard = true;
        }
        if(stayIsShipBoard || stayIsAirBoard){
          // 距離6以内に空き輸送ユニットがあるか?
          for(var ti4=0; ti4<units.length; ti4++){
            var ts4 = units[ti4];
            if(ts4.id === u.id) continue;
            if(ts4.owner !== aiFaction || ts4.hp <= 0) continue;
            if(!isLandTransport(ts4.type)) continue;
            var ts4T = TYPE[ts4.type];
            if(ts4.cargo && ts4.cargo.length >= ts4T.capacity) continue;
            var d4 = manhattan(u.x, u.y, ts4.x, ts4.y);
            if(d4 > 6) continue;
            // 輸送船の場合: 浅瀬・港にいるユニットが対象
            if(ts4.type === 'TRANSPORT_SHIP' && stayIsShipBoard){
              shouldEvacForTransport = true;
              break;
            }
            // 輸送ヘリ/機の場合: 平地・道路にいるユニットが対象 (歩兵が乗船する場所を塞いでる)
            // ただし自分自身が歩兵で乗船予定の場合は除外したい → ここに来る歩兵は乗船目標がない or 既に動かない場合
            // シンプル化: ここに来てるユニットは退避させる
            if((ts4.type === 'TRANSPORT_HELI' || ts4.type === 'TRANSPORT_PLANE') && stayIsAirBoard){
              shouldEvacForTransport = true;
              break;
            }
          }
        }
      }
      // (d) 橋の岸退避: 計画中の橋スポットの岸(隣接)や橋マス自身に居る工兵以外のユニットは、
      //     工兵が橋を架けられるようどく (橋が無いと車両・護衛が前線へ行けない)
      var shouldEvacBridgeBank = false;
      var bridgeBankSpots = null;
      if(!shouldEvacFacility && !shouldEvacCapPoint && !shouldEvacForTransport && !TYPE[u.type].isEngineer){
        var bridgePlanEvac = _aiBridgePlan(aiFaction);
        if(bridgePlanEvac.bridgeSpots.length > 0){
          bridgeBankSpots = bridgePlanEvac.bridgeSpots;
          for(var bsi=0; bsi<bridgeBankSpots.length; bsi++){
            var bs = bridgeBankSpots[bsi];
            if(Math.abs(u.x - bs.x) + Math.abs(u.y - bs.y) <= 1){ shouldEvacBridgeBank = true; break; }
          }
        }
      }
      if(window.AI_DEBUG && (shouldEvacFacility || shouldEvacCapPoint || shouldEvacForTransport || shouldEvacBridgeBank)){
        try{ console.log('  → evac needed: facility='+shouldEvacFacility+' capPoint='+shouldEvacCapPoint+' transport='+shouldEvacForTransport+' bridgeBank='+shouldEvacBridgeBank); }catch(e){}
      }
      if(shouldEvacFacility || shouldEvacCapPoint || shouldEvacForTransport || shouldEvacBridgeBank){
        // 移動可能マスの中で、退避先として最適なマスを選ぶ
        var movable3 = computeMovable(u);
        var bestEvac = null, bestEvacScore = -Infinity;
        for(var mk in movable3){
          var mxy = mk.split(',');
          var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
          if(mx === u.x && my === u.y) continue; // 留まるのは却下
          var blocker = unitAt(mx, my);
          if(blocker && blocker.id !== u.id) continue;
          var capCheck = captures[mx+','+my];
          var terCheck = TER[M[my][mx]];
          // 自軍生産施設の上は避ける(別の塞ぎになる)
          if(capCheck && capCheck.owner === u.owner && terCheck && terCheck.slots) continue;
          // 戦闘ユニットの場合: 占領可能拠点(中立・敵領)の上も避ける(そこも塞いでしまう)
          if(!TYPE[u.type].canCapture && capCheck && terCheck && terCheck.capturable){
            var mxMaxCap = terCheck.capCaptureHp || terCheck.capHpMax || CAP_MAX;
            var isOwnFin = (capCheck.owner === u.owner && (capCheck.captureHp || 0) >= mxMaxCap);
            if(!isOwnFin) continue;
          }
          // 輸送動線退避なら、退避先も浅瀬・港など輸送船乗艦地形ではない方を選ぶ
          if(shouldEvacForTransport){
            var moveKey = M[my][mx];
            var moveIsShipBoard = (moveKey === 'SHOAL' || (terCheck && (terCheck.group === 'port' || terCheck.healCat === 'SEA')));
            if(moveIsShipBoard) continue;
          }
          // 橋の岸退避なら、退避先も別の橋の岸(橋スポット隣接)や川マスにしない
          if(shouldEvacBridgeBank){
            if(M[my][mx] === 'RIVER') continue;
            if(bridgeBankSpots){
              var stillOnBank = false;
              for(var bsi2=0; bsi2<bridgeBankSpots.length; bsi2++){
                var bs2 = bridgeBankSpots[bsi2];
                if(Math.abs(mx - bs2.x) + Math.abs(my - bs2.y) <= 1){ stillOnBank = true; break; }
              }
              if(stillOnBank) continue;
            }
          }
          // スコア: 退避先として「現在地から離れる」方が良い、ただし森・山の防御マスは加点(伏兵狙い)
          var d3 = manhattan(mx, my, u.x, u.y);
          var score = d3 * 10;
          // 森・山など防御値の高いマスはボーナス
          var defBonus = (terCheck && terCheck.def) ? terCheck.def * 5 : 0;
          score += defBonus;
          if(score > bestEvacScore){ bestEvacScore = score; bestEvac = { x: mx, y: my }; }
        }
        if(bestEvac){
          var aiMoveRE = executeMoveWithAmbushCheck(u, bestEvac.x, bestEvac.y);
          if(window.AI_DEBUG && aiMoveRE.stoppedEarly) try{ console.log('    伏兵察知で早期停止 (回避行動)'); }catch(e){}
          // 目的地が伏兵マスだった場合のみ奇襲発動
          if(aiMoveRE.justMoved && aiMoveRE.hitAmbush){
            var ambushedE = performAmbush(u, function(wasAmbushed){
              if(wasAmbushed){
                units = units.filter(function(uu){ return uu.hp > 0; });
                render();
                if(checkWin()) return;
                setTimeout(step, aiStepDelay(600));
              }
            });
            if(ambushedE){ u.acted = true; return; }
          }
          u.acted = true;
          render();
          setTimeout(step, aiStepDelay(300));
          return;
        }
      }
      // 戦闘ユニット (canCapture でない) も、敵が見えなくても前進する。
      // 仕様: 攻撃ユニットの目標 = 視界内で有効攻撃 (≥2 ダメージ) できる敵ユニット
      //       + 拠点攻撃力 (vsFacility>0) ある場合は拠点も対象
      //       経路距離 (BFS) で最寄り目標を選ぶ
      if(!TYPE[u.type].canCapture){
        var advTargetList = []; // { x, y, kind: 'unit'|'facility', ref: ... }
        // 1) 視界内の敵ユニットで有効攻撃可能なものを目標に
        for(var aei=0; aei<units.length; aei++){
          var aeE = units[aei];
          if(isAlly(aeE.owner, aiFaction) || aeE.owner === 'N' || aeE.hp <= 0) continue;
          if(!isUnitVisibleTo(aeE, aiFaction)) continue;
          if(!_aiUnitCanEffectivelyAttack(u, aeE)) continue;
          advTargetList.push({ x: aeE.x, y: aeE.y, kind:'unit', ref: aeE });
        }
        // 2) 拠点攻撃力ある場合のみ、拠点も対象
        if(_aiUnitCanAttackFacility(u)){
          var capCandidates = _aiCaptureTargets(aiFaction);
          var unitCat = TYPE[u.type].cat;
          for(var ci=0; ci<capCandidates.length; ci++){
            var tg = capCandidates[ci];
            // 海上ユニットは港系のみ (陸地拠点には行けない)
            if(unitCat === 'SEA'){
              var terS = TER[M[tg.y][tg.x]];
              if(!terS || !(terS.healCat === 'SEA' || terS.name === '港' || terS.group === 'port')) continue;
            } else {
              // 地続き目標のみ
              if(!tg.reachable) continue;
            }
            advTargetList.push({ x: tg.x, y: tg.y, kind:'facility', ref: tg });
          }
        }
        if(window.AI_DEBUG) try{ console.log('  → [combat advance] targets='+advTargetList.length+' (units+facilities)'); }catch(e){}
        if(advTargetList.length > 0){
          // 自分から経路距離 (BFS) で最寄り目標を選ぶ
          var unitPathDistAdv = bfsPathDistances(u.x, u.y, u);
          var advGoal = null, advGoalD = Infinity;
          for(var ti=0; ti<advTargetList.length; ti++){
            var tg2 = advTargetList[ti];
            var d2 = unitPathDistAdv[tg2.x+','+tg2.y];
            if(d2 === undefined) continue; // 到達不能
            if(d2 < advGoalD){ advGoalD = d2; advGoal = tg2; }
          }
          if(advGoal){
            if(window.AI_DEBUG) try{ console.log('  → advGoal=('+advGoal.x+','+advGoal.y+') kind='+advGoal.kind+' pathDist='+advGoalD); }catch(e){}
            // 目標マスから各マスへの経路距離を BFS で計算
            var goalPathDistAdv = bfsPathDistances(advGoal.x, advGoal.y, u);
            var movableA = computeMovable(u);
            var bestMoveA = null, bestMoveAD = Infinity;
            for(var mk in movableA){
              var mxy = mk.split(',');
              var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
              var blocker = unitAt(mx, my);
              if(blocker && blocker.id !== u.id) continue;
              // 戦闘ユニットは中立/敵拠点マスには通常乗らない (占領できないので塞ぐだけ)
              var capCheckA = captures[mx+','+my];
              var terCheckA = TER[M[my][mx]];
              if(capCheckA && !isAlly(capCheckA.owner, aiFaction) && terCheckA && terCheckA.capturable) continue;
              // 経路距離で評価 (BFS)、到達不能なマスは Infinity 扱いで除外
              var dApp = goalPathDistAdv[mx+','+my];
              if(dApp === undefined) dApp = 9999;
              if(dApp < bestMoveAD){ bestMoveAD = dApp; bestMoveA = { x: mx, y: my }; }
            }
            // 動いた結果、現在地より近づくなら移動 (現在地が既に最寄りなら待機)
            if(bestMoveA && bestMoveAD < advGoalD){
              if(window.AI_DEBUG) try{ console.log('  → COMBAT MOVE to ('+bestMoveA.x+','+bestMoveA.y+') newDist='+bestMoveAD); }catch(e){}
              var aiMoveRA = executeMoveWithAmbushCheck(u, bestMoveA.x, bestMoveA.y);
              if(window.AI_DEBUG && aiMoveRA.stoppedEarly) try{ console.log('    伏兵察知で早期停止'); }catch(e){}
              // 目的地が伏兵マスだった場合のみ奇襲発動
              if(aiMoveRA.justMoved && aiMoveRA.hitAmbush){
                var ambushedA = performAmbush(u, function(wasAmbushed){
                  if(wasAmbushed){
                    units = units.filter(function(uu){ return uu.hp > 0; });
                    render();
                    if(checkWin()) return;
                    setTimeout(step, aiStepDelay(600));
                  }
                });
                if(ambushedA){ u.acted = true; return; }
              }
              u.acted = true;
              render();
              if(checkWin()) return;
              setTimeout(step, aiStepDelay(300));
              return;
            }
          }
        }
      }
      // === 最後の手段: 集結・前進行動 ===
      // 仕様: 攻撃ユニットは敵が見えなくても最寄り敵首都に向かって前進し続ける
      // 目標: 自分から経路距離 (BFS) で最も近い敵陣営の首都
      // 敵首都が見つからない場合のフォールバック: 自軍重心から見たマップ端 (旧ロジック)
      var rallyGoal = null, rallyGoalD = Infinity;
      // ステップ1: 自分から経路距離で最寄りの敵首都を探す
      // 敵首都 = 敵陣営所有 (P/E/C/D で自軍/同盟でないもの) の元首都地形
      var enemyCapitals = [];
      for(var ck in captures){
        var capE = captures[ck];
        var cxy = ck.split(',');
        var cex = parseInt(cxy[0]), cey = parseInt(cxy[1]);
        var ceT = TER[M[cey][cex]];
        if(!ceT || !ceT.isCapital) continue;
        // 敵陣営の首都 (自軍/同盟は除外、中立も除外)
        if(capE.owner === 'N') continue;
        if(isAlly(capE.owner, aiFaction)) continue;
        enemyCapitals.push({ x: cex, y: cey, owner: capE.owner });
      }
      if(enemyCapitals.length > 0){
        var rallyPathDist = bfsPathDistances(u.x, u.y, u);
        var bestCap = null, bestCapD = Infinity;
        for(var eci=0; eci<enemyCapitals.length; eci++){
          var ec = enemyCapitals[eci];
          var ecKey = ec.x+','+ec.y;
          var ecD = rallyPathDist[ecKey];
          if(ecD === undefined) continue; // 到達不能
          if(ecD < bestCapD){ bestCapD = ecD; bestCap = ec; }
        }
        if(bestCap){
          rallyGoal = { x: bestCap.x, y: bestCap.y };
          rallyGoalD = bestCapD;
        }
      }
      // フォールバック: 敵首都が見つからない (or 全て到達不能) の場合、マップ端を目標に
      if(!rallyGoal){
        var allyXSum = 0, allyYSum = 0, allyCnt = 0;
        for(var ai = 0; ai < units.length; ai++){
          var au = units[ai];
          if(au.owner !== aiFaction || au.hp <= 0) continue;
          allyXSum += au.x; allyYSum += au.y; allyCnt++;
        }
        if(allyCnt > 0){
          var ax = allyXSum / allyCnt, ay = allyYSum / allyCnt;
          var mapW = M[0].length, mapH = M.length;
          var enemySideX = (ax < mapW / 2) ? (mapW - 1) : 0;
          var enemySideY = (ay < mapH / 2) ? (mapH - 1) : 0;
          rallyGoal = { x: enemySideX, y: enemySideY };
          rallyGoalD = manhattan(u.x, u.y, rallyGoal.x, rallyGoal.y);
        }
      }
      if(rallyGoal){
        // 自分の現在位置から rallyGoal に向かって、進入可能な最寄りマスへ動く
        // 移動先選定は経路距離 (BFS) で正しく評価 (海越え分断対応)
        if(window.AI_DEBUG) try{ console.log('  → [rally] goal=('+rallyGoal.x+','+rallyGoal.y+') currentDist='+rallyGoalD); }catch(e){}
        // 陸上間接攻撃ユニット (装甲薄) は前線の 1 歩後ろで停止する
        // = 自軍内で最も敵首都に近い味方ユニットの位置を超えない
        var isAllIndirect = true;
        for(var wi=0; wi<TYPE[u.type].weapons.length; wi++){
          if(!TYPE[u.type].weapons[wi].indirect){ isAllIndirect = false; break; }
        }
        var needFollowFrontline = isAllIndirect && TYPE[u.type].cat === 'LAND';
        // 前線ユニット (自分以外で最も敵首都に近い味方) の経路距離
        var frontlineDist = Infinity;
        if(needFollowFrontline && rallyGoal){
          for(var fi=0; fi<units.length; fi++){
            var fu = units[fi];
            if(fu.id === u.id) continue;
            if(fu.owner !== aiFaction || fu.hp <= 0) continue;
            // 同種の間接攻撃ユニットは前線ではない
            if(TYPE[fu.type].cat !== 'LAND') continue;
            var fuAllIndirect = true;
            for(var fwi=0; fwi<TYPE[fu.type].weapons.length; fwi++){
              if(!TYPE[fu.type].weapons[fwi].indirect){ fuAllIndirect = false; break; }
            }
            if(fuAllIndirect) continue; // 間接攻撃ユニットは前線扱いしない
            // 偵察ユニットも前線扱いしない
            if(_aiIsScoutUnit(fu.type)) continue;
            // 輸送ユニットも前線扱いしない
            if(isLandTransport(fu.type)) continue;
            // この味方の rallyGoal までの経路距離
            var fuPath = bfsPathDistances(rallyGoal.x, rallyGoal.y, fu);
            var fuD = fuPath[fu.x+','+fu.y];
            if(fuD !== undefined && fuD < frontlineDist){
              frontlineDist = fuD;
            }
          }
        }
        if(window.AI_DEBUG && needFollowFrontline) try{ console.log('  → [rally] 間接攻撃前線追従 frontlineDist='+frontlineDist); }catch(e){}
        var rallyPathFromGoal = bfsPathDistances(rallyGoal.x, rallyGoal.y, u);
        var movableR = computeMovable(u);
        var bestMoveR = null, bestMoveRD = Infinity;
        for(var mk in movableR){
          var mxy = mk.split(',');
          var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
          var blocker = unitAt(mx, my);
          if(blocker && blocker.id !== u.id) continue;
          // 中立or敵拠点マスには戦闘ユニットは乗らない (占領担当が来たときに塞いで邪魔)
          // 同盟拠点は通過OK
          if(!TYPE[u.type].canCapture){
            var capCheckR = captures[mx+','+my];
            var terCheckR = TER[M[my][mx]];
            if(capCheckR && !isAlly(capCheckR.owner, aiFaction) && terCheckR && terCheckR.capturable) continue;
          }
          // 経路距離で評価 (BFS)、到達不能なマスは Infinity 扱いで除外
          var pdRallyKey = mx+','+my;
          var dR = rallyPathFromGoal[pdRallyKey];
          if(dR === undefined) dR = 9999;
          // 陸上間接攻撃ユニット: 前線より敵首都に近づきすぎない
          // (前線ユニットの距離より dR が小さい = より敵に近い → 除外)
          // 「1 歩後ろ」= frontlineDist + 1 以上
          if(needFollowFrontline && frontlineDist !== Infinity && dR < frontlineDist + 1) continue;
          if(dR < bestMoveRD){ bestMoveRD = dR; bestMoveR = { x: mx, y: my }; }
        }
        // 動いた結果、現在地より敵側に近づくなら移動
        if(bestMoveR && bestMoveRD < rallyGoalD){
          if(window.AI_DEBUG) try{ console.log('  → RALLY MOVE to ('+bestMoveR.x+','+bestMoveR.y+') newDist='+bestMoveRD); }catch(e){}
          var aiMoveRR = executeMoveWithAmbushCheck(u, bestMoveR.x, bestMoveR.y);
          if(window.AI_DEBUG && aiMoveRR.stoppedEarly) try{ console.log('    伏兵察知で早期停止'); }catch(e){}
          if(aiMoveRR.justMoved && aiMoveRR.hitAmbush){
            var ambushedR = performAmbush(u, function(wasAmbushed){
              if(wasAmbushed){
                units = units.filter(function(uu){ return uu.hp > 0; });
                render();
                if(checkWin()) return;
                setTimeout(step, aiStepDelay(600));
              }
            });
            if(ambushedR){ u.acted = true; return; }
          }
          u.acted = true;
          render();
          if(checkWin()) return;
          setTimeout(step, aiStepDelay(300));
          return;
        }
      }
      if(window.AI_DEBUG) try{ console.log('  → no movement (skip turn for this unit)'); }catch(e){}
      step();
      return;
    }
    var t = TYPE[u.type];
    if(window.AI_DEBUG) try{ console.log('  → [enemy visible path] targets='+targets.length); }catch(e){}
    var allIndirect = true;
    for(var i=0; i<t.weapons.length; i++){ if(!t.weapons[i].indirect){ allIndirect = false; break; } }

    if(allIndirect){
      var atkSet = computeAttackable(u, u.x, u.y, false);
      var bestT = null, bestScoreT = -Infinity;
      for(var k in atkSet){
        var xy = k.split(',');
        var tg = unitAt(parseInt(xy[0]), parseInt(xy[1]));
        if(!tg) continue;
        var r = bestAttackOn(u, tg, u.x, u.y, false);
        if(!r) continue;
        var score = (r.dmg*10 >= tg.hp ? 1000 : 0) + r.dmg*10;
        if(score > bestScoreT){ bestScoreT = score; bestT = tg; }
      }
      if(bestT){
        (function(attUnit, defUnit){
          render();
          setTimeout(function(){
            var rr = performAttack(attUnit, defUnit, false);
            flashAttack(attUnit, defUnit, rr);
            render();
            if(checkWin()) return;
            setTimeout(step, aiStepDelay(500));
          }, 300);
        })(u, bestT);
        return;
      }
    }

    // 対潜装備持ち(駆逐艦・フリゲート・対潜哨戒機)は潜水艦を優先攻撃
    var hasASW = false;
    for(var wi=0; wi<t.weapons.length; wi++){
      if((t.weapons[wi].atk.SUB || 0) >= 4){ hasASW = true; break; }
    }
    // 自軍施設(や中立施設)を占領中の敵を最優先目標にする (駆けつけて排除するため)。
    // ただし「(隣接まで)到達可能」な敵のみ。海などで届かない敵は無視 (無駄足を防ぐ)。
    var uBfsForThreat = bfsPathDistances(u.x, u.y, u);
    function _facilityThreatPri(enemy){
      if(!TYPE[enemy.type].canCapture) return 0;
      var capE = captures[enemy.x+','+enemy.y];
      var terE = TER[M[enemy.y][enemy.x]];
      if(!capE || !terE || !terE.capturable) return 0;
      var maxCapHp = terE.capCaptureHp || terE.capHpMax || 20;
      var threat = 0;
      if(capE.owner === aiFaction && (capE.captureHp || 0) < maxCapHp) threat = 2; // 自軍施設を占領中 = 最優先
      else if(capE.owner === 'N') threat = 1; // 中立施設を占領中
      if(threat === 0) return 0;
      // この敵の隣接マスに到達できるか (攻撃できる見込みがあるか)
      var nd = [[1,0],[-1,0],[0,1],[0,-1]];
      for(var i=0; i<nd.length; i++){
        if(uBfsForThreat[(enemy.x+nd[i][0])+','+(enemy.y+nd[i][1])] !== undefined) return threat;
      }
      return 0;
    }
    targets.sort(function(a,b){
      // 自軍施設を占領中の敵を最優先 (次に中立施設占領中)
      var fa = _facilityThreatPri(a), fb = _facilityThreatPri(b);
      if(fa !== fb) return fb - fa;
      var dA = bestAttackOn(u, a, u.x, u.y, false);
      var dB = bestAttackOn(u, b, u.x, u.y, false);
      var damA = dA ? dA.dmg : 0;
      var damB = dB ? dB.dmg : 0;
      // 対潜装備持ちなら潜水艦を最優先
      if(hasASW){
        var aSub = (a.type === 'SUBMARINE') ? 1 : 0;
        var bSub = (b.type === 'SUBMARINE') ? 1 : 0;
        if(aSub !== bSub) return bSub - aSub;
      }
      if(damA !== damB) return damB - damA;
      return manhattan(a.x,a.y,u.x,u.y) - manhattan(b.x,b.y,u.x,u.y);
    });
    var target = targets[0];

    // 潜水艦の高度な判断
    // 各候補位置で「潜航時/浮上時の安全性」「攻撃機会」を評価
    if(t.canSubmerge){
      var subBest = null;
      var subBestScore = -Infinity;
      var subMovable = computeMovable(u);
      var candidates = [];
      for(var k in subMovable){
        var xy = k.split(',');
        candidates.push({ x: parseInt(xy[0]), y: parseInt(xy[1]) });
      }
      // 各候補位置を評価
      for(var ci=0; ci<candidates.length; ci++){
        var pos = candidates[ci];
        var jm = !(pos.x === u.x && pos.y === u.y);
        // 仮想潜水艦オブジェクト(状態を変えて評価)
        var simSub = { id: u.id, type: u.type, hp: u.hp, owner: u.owner, x: pos.x, y: pos.y, moved: jm, submerged: true };
        var simSurfaced = { id: u.id, type: u.type, hp: u.hp, owner: u.owner, x: pos.x, y: pos.y, moved: jm, submerged: false };

        // 危険判定: 各敵について、その敵がこの潜水艦(状態別)を攻撃可能かチェック
        function dangerScore(simState){
          var totalThreat = 0;
          for(var ei=0; ei<units.length; ei++){
            var en = units[ei];
            if(isAlly(en.owner, u.owner) || en.hp <= 0) continue;
            // 仮にunits配列を一時差し替え (簡易: simStateで判定)
            // 敵が simState を視認できるかを isUnitVisibleTo 風に判定
            // 簡略: 仮想潜水艦を実際の units に差し替えて判定
            var origUnit = u;
            // unitsの中で同IDを simState で参照させるため、posとsubmergedをnumに退避→復元
            var oldX=u.x, oldY=u.y, oldSub=u.submerged, oldMoved=u.moved;
            u.x = simState.x; u.y = simState.y; u.submerged = simState.submerged; u.moved = simState.moved;
            // この状態で敵 en は u を視認できるか?
            var visible = isUnitVisibleTo(u, en.owner);
            // 視認できないなら攻撃されない
            var threat = 0;
            if(visible){
              // 敵 en の射程内に u がいるか?
              var dist = manhattan(en.x, en.y, simState.x, simState.y);
              for(var wi=0; wi<TYPE[en.type].weapons.length; wi++){
                var w = TYPE[en.type].weapons[wi];
                // 間接武器は移動済みでなければOK(敵が次ターン静止していると仮定)
                if(dist < w.range[0] || dist > w.range[1]) continue;
                var cat = simState.submerged ? 'SUB' : 'US';
                var atkVal = w.atk[cat] || 0;
                if(atkVal === 0) continue;
                // この武器でダメージ通るか
                var dmg = atkVal - 0 - 0; // 潜水艦armor=0、海上def=0
                if(dmg >= 1){
                  threat += dmg;
                  break; // 1武器で十分
                }
              }
            }
            // 復元
            u.x = oldX; u.y = oldY; u.submerged = oldSub; u.moved = oldMoved;
            totalThreat += threat;
          }
          return totalThreat;
        }

        var threatSub = dangerScore(simSub);
        var threatSurf = dangerScore(simSurfaced);

        // 攻撃機会: この位置から各状態で攻撃できる敵がいるか
        function attackOpportunity(simState){
          var maxDmg = 0;
          // 仮想的にuをsimStateとして攻撃可能性チェック
          var oldX=u.x, oldY=u.y, oldSub=u.submerged;
          u.x=simState.x; u.y=simState.y; u.submerged=simState.submerged;
          for(var ti=0; ti<units.length; ti++){
            var tg = units[ti];
            if(isAlly(tg.owner, u.owner) || tg.hp <= 0) continue;
            if(!isUnitVisibleTo(tg, u.owner)) continue;
            var dist = manhattan(simState.x, simState.y, tg.x, tg.y);
            // 潜水艦の魚雷は射程1
            if(dist !== 1) continue;
            var pred = bestAttackOn({ type:u.type, hp:u.hp, x:simState.x, y:simState.y, ammo:u.ammo }, tg, simState.x, simState.y, simState.moved);
            if(pred && pred.dmg > maxDmg) maxDmg = pred.dmg;
          }
          u.x=oldX; u.y=oldY; u.submerged=oldSub;
          return maxDmg;
        }

        var atkSub = attackOpportunity(simSub);
        var atkSurf = attackOpportunity(simSurfaced);

        // この位置で潜航 or 浮上の評価
        // スコア = 攻撃機会 - 危険度(被弾予測) - 距離ペナルティ
        var nearestEnemy = null, nearestDist = Infinity;
        for(var ti=0; ti<units.length; ti++){
          var tg = units[ti];
          if(isAlly(tg.owner, u.owner) || tg.hp <= 0) continue;
          if(!isUnitVisibleTo(tg, u.owner)) continue;
          var d = manhattan(pos.x, pos.y, tg.x, tg.y);
          if(d < nearestDist){ nearestDist = d; nearestEnemy = tg; }
        }
        var distPenalty = nearestDist === Infinity ? 0 : nearestDist;

        // 地形ボーナス: 潜水艦の地形優先 (仕様書: 深海は潜航時のみ防御 +3、岩礁は通行可能なら +3)
        var posTerKey = M[pos.y][pos.x];
        var subTerrainBonus = 0;
        var surfTerrainBonus = 0;
        if(posTerKey === 'DEEP_SEA'){
          // 深海は潜航中のみ防御 +3 (浮上中は無効)
          subTerrainBonus = 15; // 防御3相当を高く評価
        }
        if(posTerKey === 'REEF'){
          // 岩礁は潜航・浮上どちらも防御 +3 (奇襲も発動するので尚良し)
          subTerrainBonus += 12;
          surfTerrainBonus += 12;
        }

        // 燃料考慮: 潜航は毎ターン -1 + 移動 -2 で燃料消費が激しい
        // 燃料が少なくなったら潜航を避けて浮上で帰投したい
        var fuelMax = TYPE[u.type].fuelMax || 70;
        var fuelRatio = u.fuel / fuelMax;
        var subFuelPenalty = 0;
        if(u.fuel <= 0){
          subFuelPenalty = 9999; // 潜航不可 (このスコアを取らせない)
        } else if(fuelRatio < 0.1){
          subFuelPenalty = 30; // 10% 未満は強い忌避
        } else if(fuelRatio < 0.3){
          subFuelPenalty = 10; // 30% 未満は中程度忌避
        }

        // 潜航選択肢
        var scoreSub = atkSub * 5 - threatSub * 10 - distPenalty + subTerrainBonus - subFuelPenalty;
        // 浮上選択肢 (ペナルティ大きめ、安全な時のみ選ばれる)
        var scoreSurf = atkSurf * 5 - threatSurf * 15 - distPenalty - 2 + surfTerrainBonus; // 浮上はわずかな抵抗感

        // この位置のベストな状態を選択
        var thisBestScore, thisBestSub;
        if(scoreSub >= scoreSurf){
          thisBestScore = scoreSub;
          thisBestSub = true;
        } else {
          thisBestScore = scoreSurf;
          thisBestSub = false;
        }
        if(thisBestScore > subBestScore){
          subBestScore = thisBestScore;
          subBest = { x: pos.x, y: pos.y, submerged: thisBestSub };
        }
      }

      // 実行
      if(subBest){
        var jm = !(subBest.x === u.x && subBest.y === u.y);
        u.x = subBest.x; u.y = subBest.y;
        u.submerged = subBest.submerged;
        // 攻撃可能なら攻撃
        var atkSet = computeAttackable(u, u.x, u.y, jm);
        var atkTarget = null, bestS = -Infinity;
        for(var k in atkSet){
          var xy = k.split(',');
          var tg = unitAt(parseInt(xy[0]), parseInt(xy[1]));
          if(!tg) continue;
          var r = bestAttackOn(u, tg, u.x, u.y, jm);
          if(!r) continue;
          var sc = (r.dmg*10 >= tg.hp ? 1000 : 0) + r.dmg*10;
          if(sc > bestS){ bestS = sc; atkTarget = tg; }
        }
        render();
        if(atkTarget){
          (function(attUnit, defUnit, jmm){
            setTimeout(function(){
              var rr = performAttack(attUnit, defUnit, jmm);
              flashAttack(attUnit, defUnit, rr);
              render();
              if(checkWin()) return;
              setTimeout(step, aiStepDelay(500));
            }, 300);
          })(u, atkTarget, jm);
        } else {
          setTimeout(step, aiStepDelay(200));
        }
        return; // 潜水艦の処理完了、step()の他のロジックを実行しない
      }
    }

    var movable = computeMovable(u);
    var bestPos = { x: u.x, y: u.y };
    var captureTarget = null;
    // 工兵: 橋建設計画がある場合、最寄りの工兵を橋目標に派遣
    // ただし「足元 (自陣側) を固めてから橋」。自陣島に未確保の中立占領対象が残っていれば橋割り当てしない。
    var bridgeGoal = null; // {x, y} = 橋計画川マス
    if(t.isEngineer && !_aiEngineerHomeObjectivesRemain(u, aiFaction)){
      var planForMove = _aiBridgePlan(aiFaction);
      if(planForMove.bridgeSpots.length > 0){
        // 各橋スポットについて、自軍の工兵 (廃墟マス上にいない・占領中でない) の最寄りを担当に決める
        // 自分がいずれかのスポットの最寄りなら、そのスポットを目標にする
        for(var bi=0; bi<planForMove.bridgeSpots.length; bi++){
          var sp = planForMove.bridgeSpots[bi];
          var myD = manhattan(u.x, u.y, sp.x, sp.y);
          var amClosest = true;
          for(var ej=0; ej<units.length; ej++){
            var other = units[ej];
            if(other.id === u.id) continue;
            if(other.owner !== aiFaction || other.hp <= 0) continue;
            if(!TYPE[other.type].isEngineer) continue;
            // 廃墟マス上の工兵は除外 (再建を優先)
            var otherTer = TER[M[other.y][other.x]];
            if(otherTer && otherTer.isRuins && captures[other.x+','+other.y]) continue;
            var otherD = manhattan(other.x, other.y, sp.x, sp.y);
            if(otherD < myD){ amClosest = false; break; }
          }
          if(amClosest){
            bridgeGoal = { x: sp.x, y: sp.y };
            if(window.AI_DEBUG) try{ console.log('  → engineer assigned to bridge ('+sp.x+','+sp.y+')'); }catch(e){}
            break;
          }
        }
      }
    }
    if(t.canCapture){
      // 占領目標リスト (首都基準・近い順、最大3) から、このユニットが向かうべき拠点を選ぶ
      // - 工兵 → 廃墟マスを優先
      // - 普通の歩兵系 → 廃墟以外を優先
      // - 地続き目標のみ (Phase 1: 海越え目標は将来の輸送船実装で使う)
      var targetsAll = _aiCaptureTargets(aiFaction);
      var targets = targetsAll.filter(function(t){ return t.reachable; });
      var ruinTargets = [], normTargets = [];
      for(var ti=0; ti<targets.length; ti++){
        if(targets[ti].isRuins) ruinTargets.push(targets[ti]);
        else normTargets.push(targets[ti]);
      }
      // 工兵は「今いる重車両島 (=川を渡らずに行ける範囲) の目標」のみ対象にする (川の向こうは橋で通す)
      if(t.isEngineer){
        var engHeavyMapV = _aiComputeHeavyIslands(aiFaction);
        var engIslandV = engHeavyMapV[u.y] && engHeavyMapV[u.y][u.x];
        if(engIslandV){
          var sameIslV = function(tg){ var ti2 = engHeavyMapV[tg.y] && engHeavyMapV[tg.y][tg.x]; return ti2 === engIslandV; };
          ruinTargets = ruinTargets.filter(sameIslV);
          normTargets = normTargets.filter(sameIslV);
        }
      }
      var preferList = t.isEngineer ? ruinTargets.concat(normTargets) : normTargets.concat(ruinTargets);

      // 自分から最も近い目標を選ぶ (preferList 内で)
      var myGoal = null, myGoalD = Infinity;
      for(var ti=0; ti<preferList.length; ti++){
        var tg = preferList[ti];
        var d = manhattan(u.x, u.y, tg.x, tg.y);
        if(d < myGoalD){ myGoalD = d; myGoal = tg; }
      }

      // 工兵: 橋計画地点が割り当てられていれば、それを最優先目標にする
      // (川マスに隣接する陸地で停まれるよう、橋マス位置をゴールとし isRuins=true 風に扱う)
      if(bridgeGoal && t.isEngineer){
        // 隣接陸地マスのうち、自分から最も近い場所を実ゴールに
        var bridgeDirs = [[1,0],[-1,0],[0,1],[0,-1]];
        var bestAdj = null, bestAdjD = Infinity;
        for(var bdi=0; bdi<bridgeDirs.length; bdi++){
          var bnx = bridgeGoal.x + bridgeDirs[bdi][0];
          var bny = bridgeGoal.y + bridgeDirs[bdi][1];
          if(!inBounds(bnx, bny)) continue;
          var bnk = M[bny][bnx];
          // 工兵が乗れる地形 (= INF コストが有限)
          var bnc = COST.INF && COST.INF[bnk];
          if(bnc === undefined || bnc === Infinity) continue;
          // 川・廃墟・敵ユニットがいるマスは除外
          if(bnk === 'RIVER') continue;
          var bnu = unitAt(bnx, bny);
          if(bnu && bnu.id !== u.id && !isAlly(bnu.owner, aiFaction)) continue;
          var bnd = manhattan(u.x, u.y, bnx, bny);
          if(bnd < bestAdjD){ bestAdjD = bnd; bestAdj = { x:bnx, y:bny }; }
        }
        if(bestAdj){
          myGoal = { x: bestAdj.x, y: bestAdj.y, isRuins: false, owner: 'N', isBridgeApproach: true };
          myGoalD = bestAdjD;
          if(window.AI_DEBUG) try{ console.log('  → bridge approach goal=('+bestAdj.x+','+bestAdj.y+')'); }catch(e){}
        }
      }

      if(myGoal){
        // 移動範囲内にゴール自体があれば直接そこへ (占領開始)
        if(setHas(movable, myGoal.x+','+myGoal.y)){
          // ただし廃墟は工兵以外は乗らない (再建が必要)
          if(myGoal.isRuins && !t.isEngineer){
            // 廃墟手前に止まる: 廃墟に最も近い移動可能マスを選ぶ
            var bestApproach = null, bestApproachD = Infinity;
            for(var k in movable){
              var xy = k.split(',');
              var mx = parseInt(xy[0]), my = parseInt(xy[1]);
              if(mx === myGoal.x && my === myGoal.y) continue;
              if(unitAt(mx, my) && !(mx === u.x && my === u.y)) continue;
              // 工兵以外は川マスに停止しない (橋のない川に居座って前線を塞ぐのを防ぐ)
              if(!TYPE[u.type].isEngineer && M[my][mx] === 'RIVER') continue;
              var dApp = manhattan(mx, my, myGoal.x, myGoal.y);
              if(dApp < bestApproachD){ bestApproachD = dApp; bestApproach = { x:mx, y:my }; }
            }
            if(bestApproach){ bestPos = bestApproach; captureTarget = bestApproach; }
          } else {
            bestPos = { x: myGoal.x, y: myGoal.y };
            captureTarget = { x: myGoal.x, y: myGoal.y };
          }
        } else {
          // 範囲外: ゴールに最も近づける移動可能マスを選ぶ
          var bestApproach = null, bestApproachD = Infinity;
          for(var k in movable){
            var xy = k.split(',');
            var mx = parseInt(xy[0]), my = parseInt(xy[1]);
            if(unitAt(mx, my) && !(mx === u.x && my === u.y)) continue;
            // 工兵以外は川マスに停止しない (橋のない川に居座って前線を塞ぐのを防ぐ)
            if(!TYPE[u.type].isEngineer && M[my][mx] === 'RIVER') continue;
            // 自軍生産施設の上には留まらない (邪魔になる)
            var capCheck = captures[mx+','+my];
            var terCheck = TER[M[my][mx]];
            if(capCheck && capCheck.owner === aiFaction && terCheck && terCheck.slots
               && (mx !== myGoal.x || my !== myGoal.y)) continue;
            var dApp = manhattan(mx, my, myGoal.x, myGoal.y);
            if(dApp < bestApproachD){ bestApproachD = dApp; bestApproach = { x:mx, y:my }; }
          }
          if(bestApproach){ bestPos = bestApproach; captureTarget = bestApproach; }
        }
      }
    }

    if(!captureTarget){
      // 現在地が「自軍生産施設」なら、そこに留まるとペナルティ
      // (生産口を塞いで完成ユニットを取り出せなくなるのを防ぐ)
      var startCap = captures[u.x+','+u.y];
      var startTer = TER[M[u.y][u.x]];
      var stayingOnFacility = false;
      var facilityHasProduction = false;
      if(startCap && startCap.owner === u.owner && startTer && startTer.slots){
        stayingOnFacility = true;
        // この施設で生産中/完成済みのユニットがあれば、よりペナルティを強くする
        for(var pi=0; pi<production.length; pi++){
          if(production[pi].x === u.x && production[pi].y === u.y){
            facilityHasProduction = true;
            break;
          }
        }
      }
      // カバー支援対象: 自軍の占領中ユニット (canCapture 持ちで、占領可能拠点上にいる)
      var coverTargets = [];
      for(var ui=0; ui<units.length; ui++){
        var au = units[ui];
        if(au.owner !== aiFaction || au.hp <= 0 || au.id === u.id) continue;
        if(!TYPE[au.type].canCapture) continue;
        var capHere = captures[au.x+','+au.y];
        if(capHere && !isAlly(capHere.owner, aiFaction)){
          // 同盟以外 (中立または敵) の拠点にいる = 占領中 → カバー対象
          coverTargets.push(au);
        }
      }
      // 排除優先敵 (高スコア): 仕様書セクション6 敵排除優先順位
      //   1. 自軍施設占領中の敵歩兵 (最優先・相性閾値無視)
      //   2. 中立施設占領中の敵歩兵 (相性閾値無視)
      //   3. 潜水艦排除 (駆潜艇・対潜哨戒機・駆逐艦・艦上雷撃機 が最優先)
      //   4. その他は通常戦闘ロジック (5+ ダメージ閾値)
      function _eliminatePriority(enemy){
        var capE = captures[enemy.x+','+enemy.y];
        var terE = TER[M[enemy.y][enemy.x]];
        var isEnemyCaptureUnit = TYPE[enemy.type].canCapture;
        // 1. 自軍施設を占領中の敵歩兵 (captureHp が減っている = 占領中)
        if(capE && terE && terE.capturable && isEnemyCaptureUnit && capE.owner === aiFaction){
          var maxCapHp = terE.capCaptureHp || terE.capHpMax || 20;
          if((capE.captureHp || 0) < maxCapHp){
            return 3000; // 自軍施設を占領中の敵歩兵 = 最優先
          }
        }
        // 2. 中立施設を占領中の敵歩兵
        // (中立施設マス上に居る敵歩兵 = その施設を狙っている、または占領中)
        if(capE && terE && terE.capturable && isEnemyCaptureUnit && capE.owner === 'N'){
          return 1500;
        }
        // 3. 潜水艦排除 (自分が対潜専門ユニットの場合のみ最優先)
        // 駆潜艇・対潜哨戒機・駆逐艦・艦上雷撃機・攻撃型潜水艦 は潜水艦 (通常・攻撃型) を最優先
        var ASW_TYPES = { CHASER:true, ASW_PLANE:true, DESTROYER:true, CARRIER_TORPEDO:true, ATTACK_SUBMARINE:true };
        var SUB_TYPES = { SUBMARINE:true, ATTACK_SUBMARINE:true };
        if(ASW_TYPES[u.type] && SUB_TYPES[enemy.type]){
          return 2500; // 対潜専門ユニットによる潜水艦排除
        }
        return 0;
      }
      var bestScore = -Infinity;
      // 目標 (target) までの実経路距離を計算 (海・山などで分断されている場合に対応)
      var targetPathDist = bfsPathDistances(target.x, target.y, u);
      for(var k in movable){
        var xy = k.split(',');
        var mx = parseInt(xy[0]), my = parseInt(xy[1]);
        var jm = !(mx === u.x && my === u.y);
        var fakeAtt = { type: u.type, hp: u.hp, x: mx, y: my, ammo: u.ammo };
        var atkSet = computeAttackable(fakeAtt, mx, my, jm);
        var bestAtk = -Infinity;
        var bestElimBonus = 0;
        for(var ak in atkSet){
          var axy = ak.split(',');
          var tg = unitAt(parseInt(axy[0]), parseInt(axy[1]));
          if(!tg) continue;
          var r = bestAttackOn(fakeAtt, tg, mx, my, jm);
          if(!r) continue;
          var sc = (r.dmg*10 >= tg.hp ? 100 : 0) + r.dmg*5;
          if(sc > bestAtk) bestAtk = sc;
          // 排除優先ボーナス (この敵を攻撃できる位置を取ると大きな加算)
          var elim = _eliminatePriority(tg);
          if(elim > bestElimBonus) bestElimBonus = elim;
        }
        // 距離スコア: 実経路距離が短いほど高評価 (海越え分断に対応)
        // 到達不能 (pathDist 未定義) なら大きな負のスコア (9999*10)
        var pd2 = targetPathDist[mx+','+my];
        var distToTarget = (pd2 === undefined) ? 9999 : pd2;
        var distScore = -distToTarget * 10;
        var score = (bestAtk > -Infinity ? 10000 + bestAtk : 0) + distScore + bestElimBonus;
        // カバー支援: 占領中の味方が近いほどボーナス (距離 1=+200, 2=+100, 3=+50)
        var coverBonus = 0;
        for(var ci=0; ci<coverTargets.length; ci++){
          var dCov = manhattan(mx, my, coverTargets[ci].x, coverTargets[ci].y);
          if(dCov <= 1) coverBonus += 200;
          else if(dCov <= 2) coverBonus += 100;
          else if(dCov <= 3) coverBonus += 50;
        }
        score += coverBonus;
        // 自軍生産施設に居座るペナルティ: 動けるのに留まる選択肢には大きな負のスコア
        if(stayingOnFacility && !jm){
          // 生産中/完成ユニットがあるなら強烈なペナルティ、なければ穏やかなペナルティ
          score -= facilityHasProduction ? 100000 : 5000;
        }
        if(score > bestScore){ bestScore = score; bestPos = { x: mx, y: my }; }
      }
    }

    var justMoved = !(bestPos.x === u.x && bestPos.y === u.y);
    var fromX = u.x, fromY = u.y;
    // 伏兵検知付き移動 (経路上で初めて未発見の敵に隣接したマスで停止)
    var moveRes = executeMoveWithAmbushCheck(u, bestPos.x, bestPos.y);
    justMoved = moveRes.justMoved;
    if(window.AI_DEBUG){
      try{
        if(moveRes.stoppedEarly){
          console.log('  → MOVE ('+fromX+','+fromY+') → ('+u.x+','+u.y+') [伏兵察知で停止、目標=('+bestPos.x+','+bestPos.y+')]');
        } else {
          console.log('  → MOVE ('+fromX+','+fromY+') → ('+u.x+','+u.y+')');
        }
      }catch(e){}
    }

    // 奇襲チェック: AI が伏兵に突っ込んだ場合
    if(justMoved){
      var ambushed = performAmbush(u, function(wasAmbushed){
        if(wasAmbushed){
          units = units.filter(function(uu){ return uu.hp > 0; });
          render();
          if(checkWin()) return;
          setTimeout(step, aiStepDelay(600));
        }
      });
      if(ambushed) return; // 非同期処理に委ねるのでここで戻る
      // 伏兵察知で停止したが奇襲不発の場合: 攻撃機会のみ追加チェック (acted=true で行動終了)
      if(moveRes.stoppedEarly && moveRes.ambushAt){
        // 隣接で停止 + 奇襲不発 → 行動終了 (このユニットはこのターンこれ以上動かない)
        u.acted = true;
        render();
        setTimeout(step, aiStepDelay(200));
        return;
      }
    }

    if(captureTarget){
      var cap = captures[u.x+','+u.y];
      if(cap && !isAlly(cap.owner, u.owner)){
        var terHereCap = TER[M[u.y][u.x]];
        if(terHereCap && terHereCap.isRuins){
          // 廃墟: 工兵なら再建、それ以外は何もしない
          if(TYPE[u.type].isEngineer){
            if(aiRebuild(u)){
              setStatus('敵' + t.name + 'が廃墟再建中');
              render();
              setTimeout(step, aiStepDelay(450));
              return;
            }
          }
          // 廃墟で工兵以外、または再建失敗
        } else if(terHereCap){
          // 通常の占領可能マス
          performCapture(u, cap);
          setStatus('敵' + t.name + 'が拠点占領中 (拠点HP ' + cap.hp + '/' + CAP_MAX + ')');
          render();
          setTimeout(step, aiStepDelay(450));
          return;
        }
      }
      // 占領目的で動いた占領ユニットは、目的地に着いてないか廃墟手前なら、攻撃せずに次へ
      // (敵スルーで占領を最優先する方針)
      // 仕様書セクション3 攻撃判断:
      //   通常: 占領のみ、攻撃しない
      //   例外: 占領目標マス上 or 経路を完全に塞ぐ敵歩兵に 5+ ダメージなら攻撃
      //   対戦車歩兵特例: 敵陸上車両 (UV/AV) にも 5+ ダメージなら攻撃
      // 簡易判定: 隣接マスに敵が居る (= ZOC で経路妨害される) かつ
      //          通常歩兵系なら敵歩兵 (INF) に対して、対戦車歩兵なら歩兵+陸上車両に対して、
      //          5+ ダメージ与えられるなら攻撃する
      if(TYPE[u.type].canCapture){
        // 例外攻撃判定
        var exceptTarget = null;
        var exceptBestDmg = 0;
        var isAT = (u.type === 'AT_INFANTRY');
        // 隣接マスの敵を確認
        var capExceptDirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for(var cedi=0; cedi<capExceptDirs.length; cedi++){
          var enx = u.x + capExceptDirs[cedi][0];
          var eny = u.y + capExceptDirs[cedi][1];
          if(!inBounds(enx, eny)) continue;
          var enU = unitAt(enx, eny);
          if(!enU || enU.hp <= 0) continue;
          if(isAlly(enU.owner, aiFaction) || enU.owner === 'N') continue;
          // 視界判定
          if(!isUnitVisibleTo(enU, aiFaction)) continue;
          // 攻撃対象の妥当性
          var enT = TYPE[enU.type];
          var enArmorCls = enT.armorClass;
          var isInfantryEnemy = (enArmorCls === 'INF');
          // 陸上車両 (UV/AV) かどうか (LAND カテゴリのみ; 艦船の US/AS は除外)
          var isLandVehicle = (enT.cat === 'LAND') && (enArmorCls === 'UV' || enArmorCls === 'AV');
          // 通常歩兵系 → 歩兵のみ攻撃対象
          // 対戦車歩兵 → 歩兵 + 陸上車両を攻撃対象
          if(!isInfantryEnemy && !(isAT && isLandVehicle)) continue;
          // 攻撃可能か (atkSet を作るのは重いので bestAttackOn で直接計算)
          var rExc = bestAttackOn(u, enU, u.x, u.y, justMoved);
          if(!rExc) continue;
          // 5+ ダメージ閾値
          if(rExc.dmg < 5) continue;
          if(rExc.dmg > exceptBestDmg){
            exceptBestDmg = rExc.dmg;
            exceptTarget = enU;
          }
        }
        if(exceptTarget){
          if(window.AI_DEBUG) try{ console.log('  → 占領担当の例外攻撃: '+TYPE[exceptTarget.type].name+'@('+exceptTarget.x+','+exceptTarget.y+') dmg='+exceptBestDmg); }catch(e){}
          (function(attUnit, defUnit, jm){
            setTimeout(function(){
              var rr = performAttack(attUnit, defUnit, jm);
              flashAttack(attUnit, defUnit, rr);
              render();
              if(checkWin()) return;
              setTimeout(step, aiStepDelay(500));
            }, 300);
          })(u, exceptTarget, justMoved);
          return;
        }
        // 例外攻撃対象なし → 攻撃せずに次へ
        render();
        setTimeout(step, aiStepDelay(250));
        return;
      }
    }

    var atkSet = computeAttackable(u, u.x, u.y, justMoved);
    var atkTarget = null, bestS = -Infinity;
    for(var k in atkSet){
      var xy = k.split(',');
      var tg = unitAt(parseInt(xy[0]), parseInt(xy[1]));
      if(!tg) continue;
      var r = bestAttackOn(u, tg, u.x, u.y, justMoved);
      if(!r) continue;
      var sc = (r.dmg*10 >= tg.hp ? 1000 : 0) + r.dmg*10;
      if(sc > bestS){ bestS = sc; atkTarget = tg; }
    }
    render();
    if(atkTarget){
      (function(attUnit, defUnit, jm){
        setTimeout(function(){
          var rr = performAttack(attUnit, defUnit, jm);
          flashAttack(attUnit, defUnit, rr);
          render();
          if(checkWin()) return;
          setTimeout(step, aiStepDelay(500));
        }, 300);
      })(u, atkTarget, justMoved);
    } else {
      setTimeout(step, aiStepDelay(200));
    }
  }
  step();
}

function showCommandPanel(unit, justMoved){
  pendingUnit = unit;
  pendingJustMoved = justMoved;
  attackMode = false;
  unloadMode = false;
  unloadStarted = false;
  var cap = captures[unit.x+','+unit.y];
  // 廃墟マス (施設HP=0) は占領不可。施設HPが満タンになって中立化してから占領する
  var terHere = TER[M[unit.y][unit.x]];
  var isRuinedTile = terHere && terHere.isRuins;
  var canCap = TYPE[unit.type].canCapture && cap && cap.owner !== unit.owner && !isRuinedTile;
  var atk = computeAttackable(unit, unit.x, unit.y, justMoved);
  var hasAtk = setSize(atk) > 0;
  var canSubmerge = TYPE[unit.type].canSubmerge;
  // 仕様: 燃料が1以上ないと潜航できない (ただし浮上は燃料関係なく可能)
  var canSubmergeNow = canSubmerge && (unit.submerged || unit.fuel === undefined || unit.fuel >= 1);
  var canStealth = TYPE[unit.type].canStealth;
  // canUnload: 輸送ユニットが何かを積載していて、かつ現在地から降ろせるか
  // - 通常: canDeployFrom(現在地) が true なら降下可
  // - 輸送機 + 空挺降下兵を積んでいる場合: 海以外なら降下可
  // - 空母系 (canCarry==='AIR'): SEA上にいるのが普通なので自身の地形チェックはスキップ
  var canUnload = false;
  if(TYPE[unit.type].capacity && unit.cargo && unit.cargo.length > 0){
    var isAirTransport2 = (unit.type === 'TRANSPORT_PLANE');
    var isAirCarrier2 = (TYPE[unit.type].canCarry === 'AIR');
    if(isAirCarrier2){
      // 空母系: 隣接マスに降車可能な航空ユニット用地形 (= 全地形コスト1なので必ずどれか可) があれば OK
      // 簡略化: cargo があれば常に降車ボタンを出す (実際の降ろせる場所判定は selectCargoForUnload で行う)
      canUnload = true;
    } else {
      // どれか1個でも降ろせるcargoがあれば canUnload = true
      for(var ci2 = 0; ci2 < unit.cargo.length; ci2++){
        var cgType = unit.cargo[ci2].type;
        if(canDeployFrom(M[unit.y][unit.x], isAirTransport2 ? cgType : null)){
          canUnload = true;
          break;
        }
      }
    }
  }
  // 修理コマンド: 自軍占領済み生産施設マス上にいる、施設に空きスロットあり、ユニットがそのカテゴリの修理対応
  var canRepair = false;
  var repairCap = captures[unit.x+','+unit.y];
  var repairTer = TER[M[unit.y][unit.x]];
  if(repairCap && repairCap.owner === 'P' && repairTer.slots){
    // 施設に空きスロット?
    var ongoing = 0;
    for(var pi=0; pi<production.length; pi++){
      if(production[pi].x === unit.x && production[pi].y === unit.y) ongoing++;
    }
    var stored = (repairCap.cargo || []).length;
    var used = ongoing + stored;
    if(used < repairTer.slots){
      // 修理対応カテゴリの判定: 工場(LAND), 港(SEA), 空港(AIR)で、ユニットのカテゴリと一致
      var unitCat = TYPE[unit.type].cat;
      if(repairTer.healCat === unitCat || (!repairTer.healCat)) canRepair = true;
    }
  }
  // 施設攻撃: vsFacility > 0 の武器を持つユニットが射程内に敵施設を持つ場合
  var canAttackFacility = false;
  // ユニットがvsFacilityを持つ武器を1つでも持っているか?
  var hasVsFacWeapon = false;
  var unitWeapons = TYPE[unit.type].weapons;
  for(var wi=0; wi<unitWeapons.length; wi++){
    if(unitWeapons[wi].vsFacility && unitWeapons[wi].vsFacility > 0){ hasVsFacWeapon = true; break; }
  }
  if(hasVsFacWeapon){
    // 直接武器なら justMoved=true でも撃てる、間接武器なら justMoved=false 必須
    // computeFacilityAttackable 内で射程チェックするため、ここではフラグだけ確認
    // 注: 間接武器が justMoved 後使えない仕様は computeFacilityAttackable でも反映が必要
    canAttackFacility = computeFacilityAttackable(unit, unit.x, unit.y).hasAny;
    // 移動済みの場合、間接武器のみのユニットはコマンド出さない
    if(canAttackFacility && justMoved){
      // 直接武器でvsFacilityを持つものがあるか確認
      var hasDirectVsFac = false;
      for(var wi2=0; wi2<unitWeapons.length; wi2++){
        var ww = unitWeapons[wi2];
        if(ww.vsFacility && ww.vsFacility > 0 && !ww.indirect){ hasDirectVsFac = true; break; }
      }
      if(!hasDirectVsFac) canAttackFacility = false;
    }
  }
  // 工兵の特殊能力
  var canRebuild = false; // 廃墟マス上で再建可
  var canBuildBridge = false; // 川マスに隣接で橋建設
  var canRepairFacility = false; // 自軍施設マス上でHP修復
  if(TYPE[unit.type].isEngineer){
    var curTer = TER[M[unit.y][unit.x]];
    var curCap = captures[unit.x+','+unit.y];
    if(curTer.isRuins){
      canRebuild = true;
    }
    if(curCap && curCap.owner === 'P' && !curTer.isRuins && curCap.hp < (curTer.capHpMax || CAP_MAX)){
      canRepairFacility = true;
    }
    // 川隣接判定
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(var di=0; di<dirs.length; di++){
      var nx = unit.x + dirs[di][0], ny = unit.y + dirs[di][1];
      if(inBounds(nx, ny) && M[ny][nx] === 'RIVER'){
        canBuildBridge = true;
        break;
      }
    }
  }
  // 傷んだ線路・橋の修復 (新規敷設はできない。線路はマップに元からある資産)
  var canRepairRail = false;
  if(TYPE[unit.type].isEngineer){
    var pdirs = [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
    for(var pi2=0; pi2<pdirs.length; pi2++){
      var px = unit.x + pdirs[pi2][0], py = unit.y + pdirs[pi2][1];
      if(!inBounds(px, py)) continue;
      var pt = TER[M[py][px]];
      if(pt && pt.buildHpMax && getRailHp(px, py) < RAIL_HP_MAX){ canRepairRail = true; break; }
    }
  }
  var panel = document.getElementById('command-panel');
  document.getElementById('command-label').textContent = TYPE[unit.type].name + ': コマンドを選択';
  var btnWrap = document.getElementById('command-buttons');
  btnWrap.innerHTML = '';
  function addBtn(text, handler, primary){
    var b = document.createElement('button');
    b.textContent = text;
    if(primary) b.style.fontWeight = '600';
    b.onclick = function(e){ e.stopPropagation(); handler(); };
    btnWrap.appendChild(b);
  }
  if(hasAtk) addBtn('攻撃', enterAttackMode, true);
  if(canAttackFacility) addBtn('施設攻撃', enterFacilityAttackMode, true);
  if(canCap) addBtn('占領', doCapture, true);
  if(canUnload) addBtn('降下', enterUnloadMode, true);
  if(coupleCandidatesAround(unit).length > 0) addBtn('🔗 連結', enterCoupleMode, true);
  var _uncChain = trainOf(unit);
  if(_uncChain && _uncChain.length >= 2) addBtn('🔗 切り離し', enterUncoupleMode, true);
  if(canRepair) addBtn('修理', doRepair);
  if(canRebuild) addBtn('再建', doRebuild, true);
  if(canRepairFacility) addBtn('施設修復', doRepairFacility, true);
  if(canBuildBridge) addBtn('橋建設', enterBridgeMode, true);
  if(canRepairRail) addBtn('🛠 工事', enterRailRepairMode, true);
  // 補給ルート (段階3): 補給ユニットのみ
  // 解除はここには置かない。ルート設定済みのユニットはターン開始時に自動で動いて
  // 行動済みになり、そもそも選択できない = このパネルが出ないため。
  // 解除は右のユニット詳細パネルのボタンで行う。
  if(canCarrySupplyStock(unit)){
    // 自走できないもの (補給貨車) は機関車が運ぶのでルートを持てない
    if(TYPE[unit.type].move > 0) addBtn(unit.route ? '🚚 補給ルートを設定し直す' : '🚚 補給ルート設定', enterRouteSetMode, true);
    // 自軍拠点の上または隣接なら、手動で積み降ろしできる
    // 隣接する拠点が複数あるときは、どこに積み降ろしするかを選ばせる
    var rfs = routeFacilitiesAround(unit);
    if(rfs.length === 1){
      addBtn('📦 積む', function(){ doManualLoad(rfs[0]); });
      addBtn('📦 降ろす', function(){ doManualUnload(rfs[0]); });
    } else if(rfs.length > 1){
      addBtn('📦 積む', function(){ showFacilityChoice('load', rfs); });
      addBtn('📦 降ろす', function(){ showFacilityChoice('unload', rfs); });
    }
  }
  if(canSubmergeNow) addBtn(unit.submerged ? '浮上' : '潜航', doSubmerge);
  if(canStealth) addBtn(unit.stealth ? 'ステルス解除' : 'ステルスON', doStealth);
  addBtn('待機', doWait);
  addBtn('移動キャンセル', cancelMove);
  panel.style.visibility = 'visible';
  setClear(attackableSet);
  setStatus(TYPE[unit.type].name + 'のコマンドを選択してください');
  render();
}
function hideCommandPanel(){
  // 場所は残したまま隠す (出し入れで盤面が上下しないように)
  var p = document.getElementById('command-panel');
  p.style.visibility = 'hidden';
  document.getElementById('command-label').textContent = '';
  document.getElementById('command-buttons').innerHTML = '';
}

// 補給ルートの指定モード (段階3)
// routeSetMode = { unitId, stage:'from'|'to', from:{x,y} }
var routeSetMode = null;

// 補給ユニットの現在地から、積み降ろしできる自軍拠点 (同じマスか隣接) を全部返す
function routeFacilitiesAround(unit){
  var dirs = [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
  var list = [];
  for(var i=0; i<dirs.length; i++){
    var nx = unit.x + dirs[i][0], ny = unit.y + dirs[i][1];
    if(isSupplyRouteFacility(nx, ny, unit.owner, unit)) list.push({ x: nx, y: ny });
  }
  return list;
}

// どの拠点に積み降ろしするかを選ばせる (隣接する自軍拠点が複数あるとき)
function showFacilityChoice(kind, list){
  if(!pendingUnit) return;
  var panel = document.getElementById('command-panel');
  document.getElementById('command-label').textContent =
    (kind === 'load' ? '📦 どの拠点から積みますか？' : '📦 どの拠点へ降ろしますか？');
  var wrap = document.getElementById('command-buttons');
  wrap.innerHTML = '';
  for(var i=0; i<list.length; i++){
    (function(pos){
      var terHere = TER[M[pos.y][pos.x]];
      var capHere = captures[pos.x+','+pos.y];
      var st = facilityStock(capHere, M[pos.y][pos.x]);
      var label = terHere.name + '(' + pos.x + ',' + pos.y + ')';
      if(st.spec) label += ' 燃' + st.fuel + '/' + st.spec.fuelMax + ' 弾' + st.ammo + '/' + st.spec.ammoMax;
      var b = document.createElement('button');
      b.textContent = label;
      b.onclick = function(e){
        e.stopPropagation();
        if(kind === 'load') doManualLoad(pos); else doManualUnload(pos);
      };
      wrap.appendChild(b);
    })(list[i]);
  }
  var back = document.createElement('button');
  back.textContent = '戻る';
  back.onclick = function(e){ e.stopPropagation(); showCommandPanel(pendingUnit, pendingJustMoved); };
  wrap.appendChild(back);
  panel.style.visibility = 'visible';
}

// 指定モード中のパネル (中止ボタンだけを出す)
// ※ 補給車が施設の上に立っていることが多いため、「ユニット自身をクリックで中止」は
//   積み元の選択と衝突する。中止は必ずこのボタンで行う。
function renderRouteSetPanel(msg){
  var panel = document.getElementById('command-panel');
  document.getElementById('command-label').textContent = msg;
  var wrap = document.getElementById('command-buttons');
  wrap.innerHTML = '';
  var b = document.createElement('button');
  b.textContent = '中止';
  b.onclick = function(e){ e.stopPropagation(); cancelRouteSetMode(); };
  wrap.appendChild(b);
  panel.style.visibility = 'visible';
}

function enterRouteSetMode(){
  if(!pendingUnit) return;
  // 中止したときにコマンド選択へ戻せるよう、対象と「移動済みか」を覚えておく
  routeSetMode = { unitId: pendingUnit.id, unit: pendingUnit, justMoved: pendingJustMoved, stage: 'from', from: null };
  setClear(movableSet); setClear(attackableSet);
  renderRouteSetPanel('🚚 積み元の自軍拠点をクリック');
  setStatus('🚚 積み元にする自軍拠点をクリックしてください（補給車が乗っている拠点でもかまいません）');
  render();
}

// 指定モードを抜ける。中止のときはコマンド選択に戻す (ユニットが宙ぶらりんにならないように)
function exitRouteSetMode(backToCommands){
  var mode = routeSetMode;
  routeSetMode = null;
  if(!mode) return;
  var u = null;
  for(var i=0; i<units.length; i++){ if(units[i].id === mode.unitId){ u = units[i]; break; } }
  if(backToCommands && u && u.hp > 0){
    showCommandPanel(u, mode.justMoved);
    return;
  }
  render();
}

function cancelRouteSetMode(){
  setStatus('補給ルートの設定を中止しました');
  exitRouteSetMode(true);
}

// 補給ルートの指定モード中のクリック処理。処理したら true
function handleRouteSetClick(x, y){
  if(!routeSetMode) return false;
  var u = null;
  for(var i=0; i<units.length; i++){ if(units[i].id === routeSetMode.unitId){ u = units[i]; break; } }
  if(!u || u.hp <= 0){ routeSetMode = null; return false; }
  // 積み元は「備蓄のある自軍拠点」に限る
  if(routeSetMode.stage === 'from'){
    if(!isSupplyRouteFacility(x, y, u.owner, u)){
      setStatus(TYPE[u.type].cat === 'AIR'
        ? '🚚 空中給油機の積み元は自軍の空港系拠点のみです'
        : '🚚 積み元は自軍が占領している拠点を選んでください');
      return true;
    }
    routeSetMode.from = { x: x, y: y };
    routeSetMode.stage = 'to';
    renderRouteSetPanel('🚚 降ろし先をクリック（拠点=降ろす / それ以外=駐留）');
    setStatus('🚚 積み元: ' + TER[M[y][x]].name + '('+x+','+y+') → 次に降ろし先をクリック（自軍拠点なら備蓄を降ろし、それ以外のマスならそこに駐留して周りへ補給します）');
    render();
    return true;
  }
  // 降ろし先: 自軍拠点なら「施設へ降ろす」、それ以外のマスなら「そこに駐留する」
  if(routeSetMode.from.x === x && routeSetMode.from.y === y){
    setStatus('🚚 積み元と同じ場所は指定できません。別の場所を選んでください');
    return true;
  }
  var isFac = isSupplyRouteFacility(x, y, u.owner, u);
  if(!isFac){
    // 駐留地点: そのユニットが入れる地形で、到達できる必要がある
    if(moveCost(u.type, M[y][x]) === Infinity){
      setStatus('🚚 そのマスには入れません。別の場所を選んでください');
      return true;
    }
    var reach = bfsPathDistances(x, y, u);
    if(reach[u.x+','+u.y] === undefined && reach[routeSetMode.from.x+','+routeSetMode.from.y] === undefined){
      setStatus('🚚 そこへは到達できません。別の場所を選んでください');
      return true;
    }
  }
  u.route = { from: routeSetMode.from, to: { x: x, y: y }, toKind: isFac ? 'facility' : 'point' };
  u.routeTarget = supplyStockFull(u) ? 'to' : 'from';
  var fTer = TER[M[u.route.from.y][u.route.from.x]];
  var toLabel = isFac ? (TER[M[y][x]].name + '('+x+','+y+')') : ('駐留地点('+x+','+y+')');
  setStatus('🚚 補給ルートを設定しました: ' + fTer.name + '('+u.route.from.x+','+u.route.from.y+') → ' + toLabel + ' (次のターンから自動で往復します)');
  routeSetMode = null;
  // 設定でこのターンの行動を終える (待機と同じ扱い)。宙ぶらりんの状態を残さない
  u.acted = true;
  if(pendingUnit && pendingUnit.id === u.id) pendingUnit = null;
  setClear(attackableSet); setClear(movableSet);
  hideCommandPanel();
  afterAction();
  return true;
}

// 情報パネルからの解除 (コマンド選択に入らずその場で解除できる)
function clearSupplyRouteAt(x, y){
  var u = unitAt(x, y);
  if(!u || u.owner !== 'P' || !u.route) return;
  delete u.route; delete u.routeTarget; delete u.routeStuck;
  setStatus('🚚 ' + TYPE[u.type].name + 'の補給ルートを解除しました');
  render();
  updateInfoPanel();
}
