      if((funds[aiFaction] || 0) < AI_UPGRADE_PRODUCER_THRESHOLD) continue;
      // 同group半数制限: 工場4 → 2つまでアップ中OK
      var maxGroupUpgrading = Math.max(1, Math.floor((groupCount[g] || 0) / 2));
      if((groupUpgrading[g] || 0) >= maxGroupUpgrading) continue;
    }
    // 都市系・その他: 閾値なし (cost が払えれば候補)
    candidates.push({ x: fx, y: fy, cost: cost, ter: ter, capObj: cap, level: ter.level || 1, group: g, isProducer: isProducer });
  }
  if(candidates.length === 0) return;

  // === Step 3: レベル均等化 - 低レベル施設を優先 ===
  candidates.sort(function(){ return Math.random() - 0.5; }); // 同レベル内ランダム
  candidates.sort(function(a, b){ return a.level - b.level; });

  // === Step 4: 順番にアップグレードを試す ===
  for(var i=0; i<candidates.length; i++){
    var c = candidates[i];
    if((funds[aiFaction] || 0) < c.cost) continue; // 資金不足
    if(c.isProducer){
      // 生産系: 同group半数制限を再チェック
      var maxGroupUp = Math.max(1, Math.floor((groupCount[c.group] || 0) / 2));
      if((groupUpgrading[c.group] || 0) >= maxGroupUp) continue;
      // 生産系: 資金閾値も再チェック (前のアップグレードで資金減ったため)
      if((funds[aiFaction] || 0) < AI_UPGRADE_PRODUCER_THRESHOLD) continue;
    }
    // 戦況に応じてアップグレード先を選ぶ
    var target = aiPickUpgradeTarget(c.ter, aiFaction);
    if(!target) continue;
    // 開始
    var turns = UPGRADE_TURNS[M[c.y][c.x]] || 3;
    c.capObj.upgrading = { target: target, remaining: turns, cost: c.cost };
    funds[aiFaction] -= c.cost;
    if(c.isProducer){
      groupUpgrading[c.group] = (groupUpgrading[c.group] || 0) + 1;
    }
    if(window.AI_DEBUG) try{ console.log('  → [アップグレード開始] '+c.ter.name+'@('+c.x+','+c.y+') → '+TYPE_NAME_OR_TER(target)+' (Lv'+c.level+'→Lv'+(c.level+1)+', '+c.cost+'G, '+turns+'T)'); }catch(e){}
  }
}

// アップグレード先の表示名取得用ヘルパー (TYPEには地形がないので、TERから取得)
function TYPE_NAME_OR_TER(key){
  if(TER[key]) return TER[key].name;
  if(TYPE[key]) return TYPE[key].name;
  return key;
}

// AI: アップグレード先を選択 (戦況に応じて)
// 工場の場合: 自軍の海ユニットが多い→装輪工廠 (両用戦車で水路対応)、そうでなければ戦車工廠
// それ以外 (都市・空港・港) は upgradeTo が単一なのでそれをそのまま選ぶ
function aiPickUpgradeTarget(ter, aiFaction){
  if(!ter.upgradeTo || ter.upgradeTo.length === 0) return null;
  if(ter.upgradeTo.length === 1) return ter.upgradeTo[0];
  // 工場の分岐: 自軍の陸ユニット構成を見る
  var seaCount = 0, landCount = 0;
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    var t = TYPE[u.type];
    if(t.cat === 'SEA') seaCount++;
    else if(t.cat === 'LAND') landCount++;
  }
  // 海ユニットが陸ユニットの半分以上いるなら装輪工廠 (両用戦車対応)
  if(seaCount * 2 >= landCount && ter.upgradeTo.indexOf('WHEEL_FACTORY') >= 0){
    return 'WHEEL_FACTORY';
  }
  // それ以外は戦車工廠 (重戦車・駆逐戦車などの強力なユニット)
  if(ter.upgradeTo.indexOf('TRACK_FACTORY') >= 0){
    return 'TRACK_FACTORY';
  }
  // フォールバック: 最初の選択肢
  return ter.upgradeTo[0];
}

// AI: 工兵が廃墟マスで再建を実行 (プレイヤーの doRebuild と同じ動作)
// 工兵の表示HP分だけ施設HPを回復、満タンで中立施設に変化、コストは表示HP×150G
// 資金不足ならできる範囲で部分回復(プレイヤーは資金不足でreturnだが、AIは現実的に「できる分だけ」回復)
// → ただしプレイヤーと挙動を厳密に一致させるため、AIも資金不足なら何もしない
function aiRebuild(unit){
  var u = unit;
  var ter = TER[M[u.y][u.x]];
  if(!ter || !ter.isRuins) return false;
  var capObj = captures[u.x+','+u.y];
  if(!capObj) return false;
  var rebuildMap = {
    RUINS_CITY: 'CITY',
    RUINS_FACTORY: 'FACTORY',
    RUINS_AIRPORT: 'AIRPORT',
    RUINS_PORT: 'PORT'
  };
  var newTerKey = rebuildMap[M[u.y][u.x]];
  if(!newTerKey) return false;
  var dHP = displayHP(u.hp);
  var cost = dHP * 150;
  if((funds[u.owner]||0) < cost){
    // 資金不足: 再建できない (プレイヤーと同じ動作)
    if(window.AI_DEBUG) try{ console.log('  → REBUILD skip (資金不足: 必要'+cost+', 所持'+(funds[u.owner]||0)+')'); }catch(e){}
    return false;
  }
  funds[u.owner] -= cost;
  var maxHp = ter.capHpMax || 20;
  capObj.hp = Math.min(maxHp, capObj.hp + dHP);
  if(window.AI_DEBUG) try{ console.log('  → REBUILD: 施設HP→'+capObj.hp+'/'+maxHp+' (コスト'+cost+')'); }catch(e){}
  // 満タンになったら中立施設に変化 (改めて占領が必要)
  if(capObj.hp >= maxHp){
    M[u.y][u.x] = newTerKey;
    capObj.terKey = newTerKey;
    var newTerObj = TER[newTerKey];
    capObj.hp = newTerObj.capHpMax || CAP_MAX;
    capObj.captureHp = newTerObj.capCaptureHp || newTerObj.capHpMax || CAP_MAX;
    capObj.owner = 'N'; // 中立化 (改めて占領が必要)
    if(window.AI_DEBUG) try{ console.log('  → 再建完了: '+TER[newTerKey].name+' (中立化)'); }catch(e){}
  }
  return true;
}

// AI: 工兵が自軍施設マス上で施設HPを修復 (プレイヤーの doRepairFacility と同じ動作、AI用)
// 仕様書セクション4 施設修復: 1ターンで最大 +5 HP、1HP=50G
// 戻り値: true=修復実行、false=実行不可
function aiRepairFacility(unit, aiFaction){
  var u = unit;
  var capObj = captures[u.x+','+u.y];
  if(!capObj || capObj.owner !== aiFaction) return false;
  var ter = TER[M[u.y][u.x]];
  if(!ter) return false;
  // 廃墟は再建が先 (修復ではない)
  if(ter.isRuins) return false;
  var maxHp = ter.capHpMax || CAP_MAX;
  if(capObj.hp >= maxHp) return false; // すでに満タン
  // 修復可能量と必要コスト
  var heal = Math.min(5, maxHp - capObj.hp);
  var cost = heal * 50;
  // 資金不足なら買える分まで部分回復
  if((funds[aiFaction]||0) < cost){
    heal = Math.floor((funds[aiFaction]||0) / 50);
    cost = heal * 50;
    if(heal <= 0){
      if(window.AI_DEBUG) try{ console.log('  → REPAIR_FACILITY skip (資金不足)'); }catch(e){}
      return false;
    }
  }
  funds[aiFaction] -= cost;
  capObj.hp = Math.min(maxHp, capObj.hp + heal);
  if(window.AI_DEBUG) try{ console.log('  → REPAIR_FACILITY: '+ter.name+'@('+u.x+','+u.y+') HP→'+capObj.hp+'/'+maxHp+' (+'+heal+', コスト'+cost+'G)'); }catch(e){}
  return true;
}

// ============================================================
// AI: 橋建設計画 (進軍経路上の川を橋に変換して重車両を渡らせる)
// ============================================================

// 川マスが「橋にする価値がある」か判定 (両岸が陸地 = 海につながる川ではない)
// 縦方向か横方向のいずれかで、対向する2マスが両方とも陸地の場合 true
function _aiIsBridgeableRiver(x, y){
  if(!inBounds(x, y)) return false;
  if(M[y][x] !== 'RIVER') return false;
  function isLand(nx, ny){
    if(!inBounds(nx, ny)) return false;
    var k = M[ny][nx];
    if(k === 'SEA' || k === 'RIVER' || k === 'SHOAL') return false;
    // INF が通れる地形 (= 陸地系) なら OK
    var c = COST.INF && COST.INF[k];
    return c !== undefined && c !== Infinity;
  }
  // 水平方向 (左右が陸) or 垂直方向 (上下が陸) のどちらかで橋になる
  var horiz = isLand(x-1, y) && isLand(x+1, y);
  var vert  = isLand(x, y-1) && isLand(x, y+1);
  return horiz || vert;
}

// 重車両用の島マップ計算: 川を「通れない」として島判定
// 戻り値: islandMap[y][x] = id (0 は通行不可)
// blockerSet: 敵ユニットがいるマスはブロッカー
function _aiComputeHeavyIslands(aiFaction){
  var islandMap = [];
  for(var y=0; y<H; y++){
    var row = [];
    for(var x=0; x<W; x++) row.push(0);
    islandMap.push(row);
  }
  var enemyBlockers = {};
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.hp <= 0) continue;
    if(!isAlly(u.owner, aiFaction) && u.owner !== 'N') enemyBlockers[u.x+','+u.y] = true;
  }
  // 重車両 (TRACK_L) が通れる地形を基準にする: 川・海・山は不可、橋・道路・平地・施設 OK
  function canHeavyWalk(x, y){
    if(x < 0 || y < 0 || x >= W || y >= H) return false;
    var k = M[y][x];
    var c = COST.TRACK_L && COST.TRACK_L[k];
    if(c === undefined || c === Infinity) return false;
    if(enemyBlockers[x+','+y]) return false;
    return true;
  }
  var nextId = 1;
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      if(islandMap[y][x] !== 0) continue;
      if(!canHeavyWalk(x, y)) continue;
      var queue = [[x, y]];
      islandMap[y][x] = nextId;
      while(queue.length > 0){
        var p = queue.shift();
        var px = p[0], py = p[1];
        var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for(var di=0; di<dirs.length; di++){
          var nx = px + dirs[di][0], ny = py + dirs[di][1];
          if(nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          if(islandMap[ny][nx] !== 0) continue;
          if(!canHeavyWalk(nx, ny)) continue;
          islandMap[ny][nx] = nextId;
          queue.push([nx, ny]);
        }
      }
      nextId++;
    }
  }
  return islandMap;
}

// 自軍の重車両系島 (自軍が拠点を持つ・自軍重車両ユニットがいる) を取得
function _aiOwnHeavyIslands(aiFaction, heavyIslandMap){
  var owned = {};
  // 自軍拠点が含まれる島
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
    var id = heavyIslandMap[cy] && heavyIslandMap[cy][cx];
    if(id) owned[id] = true;
  }
  // 自軍の重車両ユニットがいる島
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    var costTbl = COST[TYPE[u.type].cost];
    if(!costTbl || costTbl.RIVER !== Infinity) continue; // 川を渡れるユニットは無視
    var id2 = heavyIslandMap[u.y] && heavyIslandMap[u.y][u.x];
    if(id2) owned[id2] = true;
  }
  return owned;
}

// 自軍が「重車両を保有 or 重車両系施設で生産可能」かを判定
function _aiHasOrCanProduceHeavyVehicle(aiFaction){
  // 既に重車両を持っているか
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    var costTbl = COST[TYPE[u.type].cost];
    if(costTbl && costTbl.RIVER === Infinity) return true;
  }
  // 重車両系施設を持っているか (普通の工場 + WHEEL/TRACK系の工場/兵器廠)
  // 普通の FACTORY も 軽戦車・偵察車・兵員輸送車・補給車 (いずれも川を渡れない) を生産できるので含める
  var heavyFacilities = { FACTORY:true, WHEEL_FACTORY:true, WHEEL_ARSENAL:true, WHEEL_WORKS:true,
                          TRACK_FACTORY:true, TRACK_ARSENAL:true, TRACK_WORKS:true };
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var ter = TER[M[parseInt(xy[1])][parseInt(xy[0])]];
    if(ter && heavyFacilities[cap.terKey || M[parseInt(xy[1])][parseInt(xy[0])]]) return true;
  }
  return false;
}

// AI: 橋建設計画
// 戻り値: { bridgeSpots: [{x, y, score, targetX, targetY}], urgent: bool }
// urgent: 進軍ブロック状態か (= 地続き目標が川越えでないと届かない)
// セッションキャッシュ (1ターン内で複数回呼ばれる) を考慮し、シンプルに再計算する
function _aiBridgePlan(aiFaction){
  var result = { bridgeSpots: [], urgent: false };
  // 重車両を保有/生産可能でないなら橋不要
  if(!_aiHasOrCanProduceHeavyVehicle(aiFaction)) return result;

  var heavyIslandMap = _aiComputeHeavyIslands(aiFaction);
  var ownHeavyIslands = _aiOwnHeavyIslands(aiFaction, heavyIslandMap);
  // 自軍重車両島がない (例: まだ重車両がいない & 拠点がすべて孤立島) → 拠点があれば拠点島を基準にする
  // _aiOwnHeavyIslands で既に自軍拠点島は登録済みなので、ここで empty なら計画不可
  var hasOwnIsland = false;
  for(var oi in ownHeavyIslands){ hasOwnIsland = true; break; }
  if(!hasOwnIsland) return result;

  var captureTargets = _aiCaptureTargets(aiFaction);
  // 既存橋の位置 (新しい橋は既存橋から離した位置を優先)
  var existingBridges = [];
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      if(M[y][x] === 'BRIDGE') existingBridges.push({x:x, y:y});
    }
  }

  // 各目標について「重車両島で到達不可」かつ「川を1マス渡れば到達可能」を探す
  var bridgeCandidates = {}; // key = "x,y" → {x, y, score, targetX, targetY}
  var urgentFlag = false;
  for(var ti=0; ti<captureTargets.length; ti++){
    var tgt = captureTargets[ti];
    // 海越えの目標は橋では解決できない (輸送船で行く)
    if(!tgt.reachable) continue;
    var tgtIsland = heavyIslandMap[tgt.y] && heavyIslandMap[tgt.y][tgt.x];
    if(!tgtIsland) continue; // 目標が重車両通行不可マスにある (山頂等) は対象外
    // 目標島が自軍重車両島と同一なら橋不要
    if(ownHeavyIslands[tgtIsland]) continue;
    // → 目標は重車両で届かない (= 川か海で隔たれている)
    urgentFlag = true; // 進軍ブロック状態

    // この目標に向かって、橋を架けるべき川マスを探す
    // 戦略: 目標島と自軍重車両島を1マスの川で接続できる位置を探す
    // (目標島の端 ↔ 川 ↔ 自軍重車両島の端)
    for(var y=0; y<H; y++){
      for(var x=0; x<W; x++){
        if(M[y][x] !== 'RIVER') continue;
        if(!_aiIsBridgeableRiver(x, y)) continue;
        // この川の両岸 (4方向の陸地隣接マス) の島IDを集める
        var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        var adjIslands = {};
        var touchesOwn = false, touchesTarget = false;
        // 岸 (自軍側・目標側) が重キャタピラ系 (TRACK_H) の通れる地形かを見る。
        // 森・山は TRACK_H が通れないため、橋を架けても重キャタピラ系が渡れない。
        var ownBankHeavyOK = false, targetBankHeavyOK = false;
        for(var di=0; di<dirs.length; di++){
          var nx = x + dirs[di][0], ny = y + dirs[di][1];
          if(!inBounds(nx, ny)) continue;
          var iid = heavyIslandMap[ny] && heavyIslandMap[ny][nx];
          if(iid){
            adjIslands[iid] = true;
            var bankCostH = COST.TRACK_H && COST.TRACK_H[M[ny][nx]];
            var bankHeavyOK = (bankCostH !== undefined && bankCostH !== Infinity);
            if(ownHeavyIslands[iid]){ touchesOwn = true; if(bankHeavyOK) ownBankHeavyOK = true; }
            if(iid === tgtIsland){ touchesTarget = true; if(bankHeavyOK) targetBankHeavyOK = true; }
          }
        }
        // この川マスが自軍島と目標島の両方に接していれば、1本で繋がる = 最良候補
        if(touchesOwn && touchesTarget){
          // スコア: 目標までの距離が近いほど高い + 既存橋から離れているほどボーナス
          var dToTarget = manhattan(x, y, tgt.x, tgt.y);
          var minBridgeDist = Infinity;
          for(var bi=0; bi<existingBridges.length; bi++){
            var dB = manhattan(x, y, existingBridges[bi].x, existingBridges[bi].y);
            if(dB < minBridgeDist) minBridgeDist = dB;
          }
          var bridgeBonus = minBridgeDist === Infinity ? 0 : Math.min(minBridgeDist, 10);
          // 岸が重キャタピラ系の通れない地形 (森・山) なら大きく減点。
          // 全候補が減点される (他に選択肢が無い) 場合は結局この場所が選ばれる = 仕方なく架ける。
          var heavyBankPenalty = (ownBankHeavyOK && targetBankHeavyOK) ? 0 : 100;
          var score = -dToTarget + bridgeBonus * 0.5 - heavyBankPenalty;
          var key = x+','+y;
          if(!bridgeCandidates[key] || bridgeCandidates[key].score < score){
            bridgeCandidates[key] = { x:x, y:y, score:score, targetX:tgt.x, targetY:tgt.y, heavyOK: (heavyBankPenalty === 0) };
          }
        }
      }
    }
  }

  // 候補をスコア順にソート
  var list = [];
  for(var k in bridgeCandidates) list.push(bridgeCandidates[k]);
  // 重キャタピラが渡れる岸 (heavyOK) の候補が1つでもあれば、それだけに絞る。
  // (森・山にしか着地できない橋は「他に選択肢が無い時だけの最後の手段」にする)
  var heavyOkList = list.filter(function(c){ return c.heavyOK; });
  if(heavyOkList.length > 0) list = heavyOkList;
  list.sort(function(a, b){ return b.score - a.score; });
  result.bridgeSpots = list.slice(0, 3); // 上位3カ所まで (複数ルート用)
  result.urgent = urgentFlag && result.bridgeSpots.length > 0;
  return result;
}

// AI: 工兵の「足元 (今いる重キャタピラ島) に、まだ確保していない中立占領対象が残っているか」
// true = 自陣側にやることが残っている → 橋建設より占領/再建を優先すべき (足元を固めてから前進路を開く)
// false = 自陣島を確保済み → 橋を架けてよい
function _aiEngineerHomeObjectivesRemain(u, aiFaction){
  var heavyIslandMap = _aiComputeHeavyIslands(aiFaction);
  var myIsland = heavyIslandMap[u.y] && heavyIslandMap[u.y][u.x];
  if(!myIsland) return false; // 川マス等に居る場合は判定不可 → 橋を妨げない
  var engPathDist = bfsPathDistances(u.x, u.y, u);
  var caps = _aiCaptureTargets(aiFaction);
  for(var i=0; i<caps.length; i++){
    var t = caps[i];
    if(t.owner !== 'N') continue;                        // 中立 (戦闘なしで確保できる) のみ対象
    if(engPathDist[t.x+','+t.y] === undefined) continue; // 工兵が到達できる
    var tIsland = heavyIslandMap[t.y] && heavyIslandMap[t.y][t.x];
    if(tIsland !== myIsland) continue;                   // 橋なしで届く自陣島にある
    return true;                                         // 未確保の中立占領対象が自陣島にある
  }
  return false;
}

// AI: 工兵が隣接川マスに橋を建設実行 (プレイヤーの executeBridgeBuild と同じ動作)
// 戻り値: 建設した川マスの {x, y}、または null (実施せず)
// AI: 工事中の橋・線路を仕上げる (着手しただけで放置しないため)
// 隣接していれば工事し、離れていれば一番近い工事現場へ向かう。
// 対象は「開通していないもの」だけ (耐久10以上の補強はAIには任せない)
var AI_CONSTRUCTION_RANGE = 6;   // これより遠い工事現場はAIの工兵が向かわない
function aiContinueConstruction(unit){
  if(!TYPE[unit.type].isEngineer) return null;
  var best = null, bestD = Infinity;
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      var t = TER[M[y][x]];
      if(!t || !t.buildHpMax || !t.isIncomplete) continue;
      var d = manhattan(unit.x, unit.y, x, y);
      if(d > AI_CONSTRUCTION_RANGE) continue;   // 遠方の路盤に釣られて占領をやめないように
      if(d < bestD){ bestD = d; best = { x: x, y: y }; }
    }
  }
  if(!best) return null;
  if(bestD <= 1){
    // 隣接 (または足元) なので工事する
    var amount = displayHP(unit.hp);
    var res = repairRailAt(best.x, best.y, amount);
    if(window.AI_DEBUG) try{ console.log('  → 工事 ('+best.x+','+best.y+') +'+amount
      + (res && res.promoted ? ' 開通!' : ' 耐久'+(res?res.hp:'?'))); }catch(e){}
    return { x: best.x, y: best.y, worked: true };
  }
  // 離れているなら向かう
  var mv = aiBestMoveTowards(unit, best.x, best.y, unit.owner);
  if(mv && (mv.x !== unit.x || mv.y !== unit.y)){
    executeMoveWithAmbushCheck(unit, mv.x, mv.y);
    if(window.AI_DEBUG) try{ console.log('  → 工事現場へ移動 ('+mv.x+','+mv.y+') 目標('+best.x+','+best.y+')'); }catch(e){}
    return { x: best.x, y: best.y, worked: false };
  }
  return null;
}

function aiBuildBridge(unit){
  var u = unit;
  if(!TYPE[u.type].isEngineer) return null;
  var cost = 800;
  // 橋計画リストを取得
  var plan = _aiBridgePlan(u.owner);
  if(plan.bridgeSpots.length === 0) return null;
  // 資金判定: urgent なら 800 で OK、そうでなければ 2500 以上の余裕が必要
  var minFunds = plan.urgent ? cost : 2500;
  if((funds[u.owner]||0) < minFunds){
    if(window.AI_DEBUG) try{ console.log('  → BRIDGE skip (資金不足: 必要'+minFunds+'(urgent='+plan.urgent+'), 所持'+(funds[u.owner]||0)+')'); }catch(e){}
    return null;
  }
  // 計画川マスのキー集合
  var planKeys = {};
  for(var i=0; i<plan.bridgeSpots.length; i++){
    var sp = plan.bridgeSpots[i];
    planKeys[sp.x+','+sp.y] = true;
  }
  // 隣接川マスのうち、計画に含まれるものを建設
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var di=0; di<dirs.length; di++){
    var nx = u.x + dirs[di][0], ny = u.y + dirs[di][1];
    if(!inBounds(nx, ny)) continue;
    if(M[ny][nx] !== 'RIVER') continue;
    if(!planKeys[nx+','+ny]) continue;
    // 建設実行
    funds[u.owner] -= cost;
    railBase[nx+','+ny] = 'RIVER';   // 壊されたら川に戻す
    M[ny][nx] = 'BRIDGE';
    railHp[nx+','+ny] = RAIL_BUILD_HP;
    syncRailTerrain(nx, ny);         // 着手なので「木組み」から始まる
    if(window.AI_DEBUG) try{ console.log('  → BRIDGE 着手 at ('+nx+','+ny+') cost='+cost+' urgent='+plan.urgent); }catch(e){}
    return { x: nx, y: ny };
  }
  return null;
}

// 工兵が現在いる位置から、橋計画川マスへの距離 (隣接到達可能距離)
// 戻り値: 0 = 既に隣接、Infinity = 計画なし or 到達不可
function _aiBridgeTargetDistance(unit, plan){
  if(!plan || plan.bridgeSpots.length === 0) return Infinity;
  var minD = Infinity;
  for(var i=0; i<plan.bridgeSpots.length; i++){
    var sp = plan.bridgeSpots[i];
    // 隣接マンハッタン (実際は工兵が辿り着ける島内距離だが、簡易にマンハッタンで判定)
    var d = manhattan(unit.x, unit.y, sp.x, sp.y) - 1; // 隣接で OK なので -1
    if(d < 0) d = 0;
    if(d < minD) minD = d;
  }
  return minD;
}

// ============================================================
// AI: 侵攻フェーズ判定 (海越え目標への上陸状況)
// ============================================================

// 海越え目標 (unreachable な敵島) について、上陸状況を判定する。
// 戻り値: { needShip: bool, needAirTransport: bool, totalUnreachIslands: int, unlandedIslands: int }
//   needShip:          1つでも「未上陸」の島がある → 輸送船を優先生産 (戦車+補給車を運ぶ)
//   needAirTransport:  全島で上陸済み or 海越え目標が空中輸送圏内 → 輸送ヘリ/機を優先 (歩兵を運ぶ)
function _aiInvasionPhase(aiFaction){
  var result = { needShip: false, needAirTransport: false, totalUnreachIslands: 0, unlandedIslands: 0 };
  var capTargetsAll = _aiCaptureTargets(aiFaction);
  var unreachable = capTargetsAll.filter(function(t){ return !t.reachable; });
  if(unreachable.length === 0) return result;

  // 歩兵基準の島マップを作る (歩兵が通れる地形)
  var islandMap = _aiComputeLandIslands(aiFaction);
  // 海越え目標の各島について、自軍ユニットがいるかを判定
  var targetIslands = {};
  for(var i=0; i<unreachable.length; i++){
    var t = unreachable[i];
    var iid = islandMap[t.y] && islandMap[t.y][t.x];
    if(!iid) continue;
    if(!targetIslands[iid]){
      targetIslands[iid] = { hasOwnUnit: false, examples: [] };
    }
    targetIslands[iid].examples.push(t);
  }
  // 自軍ユニットの所在を確認
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(TYPE[u.type].cat !== 'LAND') continue; // 陸ユニットのみ
    var iid = islandMap[u.y] && islandMap[u.y][u.x];
    if(!iid) continue;
    if(targetIslands[iid]) targetIslands[iid].hasOwnUnit = true;
  }
  // 各島について上陸状況を集計
  var unlanded = 0, landed = 0;
  for(var iid in targetIslands){
    result.totalUnreachIslands++;
    if(targetIslands[iid].hasOwnUnit) landed++;
    else unlanded++;
  }
  result.unlandedIslands = unlanded;
  // 判定: 未上陸の島があれば輸送船優先、すべて上陸済みなら空輸優先
  if(unlanded > 0) result.needShip = true;
  if(landed > 0) result.needAirTransport = true;
  if(window.AI_DEBUG) try{ console.log('[AI '+aiFaction+'] invasion phase: total='+result.totalUnreachIslands+' unlanded='+unlanded+' landed='+landed+' needShip='+result.needShip+' needAir='+result.needAirTransport); }catch(e){}
  return result;
}

// 海越え目標が「自軍と同じ島」に属しているか (= 既に上陸済み)
// 戻り値: true なら上陸済み
function _aiIsLandedOnIsland(aiFaction, x, y){
  var islandMap = _aiComputeLandIslands(aiFaction);
  var targetIsland = islandMap[y] && islandMap[y][x];
  if(!targetIsland) return false;
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(TYPE[u.type].cat !== 'LAND') continue;
    var uIsland = islandMap[u.y] && islandMap[u.y][u.x];
    if(uIsland === targetIsland) return true;
  }
  return false;
}

// 自軍の母島 (海越え目標の島ではない側) にいる「輸送船で運ぶ予定の重車両系ユニット」数
// 戦車系 + 補給車 を数える。上陸済み (海越え目標島上) のユニットは除外。
function _aiCountWaitingHeavyLand(aiFaction){
  var heavyLandTypes = {
    LIGHT_TANK:true, MEDIUM_TANK:true, HEAVY_TANK:true,
    TANK_DESTROYER:true, HEAVY_TD:true, AA_TANK:true,
    AIRBORNE_TANK:true, AMPHIB_TANK:true,
    MOBILE_COMBAT:true, SPG:true, MLRS:true,
    SUPPLY_TRUCK:true,
    HEAVY_ARTILLERY:true
  };
  var islandMap = _aiComputeLandIslands(aiFaction);
  // 海越え目標の島ID集合
  var targetIslands = {};
  var capTargetsAll = _aiCaptureTargets(aiFaction);
  for(var ti=0; ti<capTargetsAll.length; ti++){
    var t = capTargetsAll[ti];
    if(t.reachable) continue;
    var iid = islandMap[t.y] && islandMap[t.y][t.x];
    if(iid) targetIslands[iid] = true;
  }
  var count = 0;
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(!heavyLandTypes[u.type]) continue;
    var uIid = islandMap[u.y] && islandMap[u.y][u.x];
    // 上陸済み (海越え目標の島にいる) は除外
    if(uIid && targetIslands[uIid]) continue;
    count++;
  }
  // 生産中の重車両もカウント
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    if(heavyLandTypes[production[pi].type]) count++;
  }
  return count;
}

// 指定マス(x,y) が自軍 (aiFaction) の視界に含まれているか判定
// 自軍ユニットの sight 範囲 + 自軍占領拠点の sight 範囲 のいずれかに入っていれば true
function _aiTileIsVisible(aiFaction, x, y){
  // FoW無効ステージなら全マス可視 (偵察不要)
  if(!fowEnabled) return true;
  for(var i=0; i<units.length; i++){
    var v = units[i];
    if(v.owner !== aiFaction || v.hp <= 0) continue;
    var range = getEffectiveSight(v);
    if(manhattan(v.x, v.y, x, y) <= range) return true;
  }
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
    var capTer = TER[M[cy][cx]];
    if(!capTer || !capTer.sight) continue;
    if(manhattan(cx, cy, x, y) <= capTer.sight) return true;
  }
  return false;
}

// 占領目標周辺の視認状況を集計し、偵察ユニット需要を判定する
// 戻り値: { needGroundScout: bool, needAirScout: bool, unseenLandRatio, unseenSeaRatio }
//   needGroundScout: 地続き目標の周辺が見えていない (偵察車で済む)
//   needAirScout:    海越え目標の周辺が見えていない (偵察機が必要)
// 「目標周辺」 = 目標マスから半径3マス以内 (合計約25マス)
function _aiTargetVisibility(aiFaction){
  var result = { needGroundScout: false, needAirScout: false, unseenLandRatio: 0, unseenSeaRatio: 0 };
  if(!fowEnabled) return result; // FoW無効なら偵察不要
  var captureTargets = _aiCaptureTargets(aiFaction);
  if(captureTargets.length === 0) return result;
  var landUnseen = 0, landTotal = 0;
  var seaUnseen = 0, seaTotal = 0;
  var radius = 3;
  for(var ti=0; ti<captureTargets.length; ti++){
    var tg = captureTargets[ti];
    for(var dy=-radius; dy<=radius; dy++){
      for(var dx=-radius; dx<=radius; dx++){
        if(Math.abs(dx) + Math.abs(dy) > radius) continue;
        var nx = tg.x + dx, ny = tg.y + dy;
        if(!inBounds(nx, ny)) continue;
        var seen = _aiTileIsVisible(aiFaction, nx, ny);
        if(tg.reachable){
          landTotal++;
          if(!seen) landUnseen++;
        } else {
          seaTotal++;
          if(!seen) seaUnseen++;
        }
      }
    }
  }
  result.unseenLandRatio = landTotal > 0 ? landUnseen / landTotal : 0;
  result.unseenSeaRatio  = seaTotal  > 0 ? seaUnseen  / seaTotal  : 0;
  // 閾値: 周辺マスの 40% 以上が未視認なら偵察が必要
  if(result.unseenLandRatio >= 0.4) result.needGroundScout = true;
  if(result.unseenSeaRatio  >= 0.4) result.needAirScout = true;
  return result;
}

// 自軍の偵察ユニット種別カウント
// 戻り値: { ground: int, air: int, asw: int } (生産中も含む)
function _aiCountScouts(aiFaction){
  var result = { ground: 0, air: 0, asw: 0 };
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(u.type === 'SCOUT') result.ground++;
    else if(u.type === 'RECON_PLANE') result.air++;
    else if(u.type === 'ASW_PLANE') result.asw++;
  }
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    var pt = production[pi].type;
    if(pt === 'SCOUT') result.ground++;
    else if(pt === 'RECON_PLANE') result.air++;
    else if(pt === 'ASW_PLANE') result.asw++;
  }
  return result;
}

// ============================================================
// AI: 帰投判断 (燃料切れ・弾薬切れ防止)
// ============================================================

// ユニットが補給可能な地点 (最寄り) を探す。
// 戻り値: { x, y, dist } または null
// fuelCheck=true なら燃料補給可能な地点、ammoCheck=true なら弾薬補給可能な地点を探す
function _aiFindNearestSupplyPoint(unit, aiFaction, fuelCheck, ammoCheck){
  var t = TYPE[unit.type];
  var cat = t.cat;
  var candidates = [];

  // 1. 自軍占領済み生産施設 (healCat が一致 + 都市系 LAND)
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
    var ter = TER[M[cy][cx]];
    if(!ter) continue;
    var canSupply = false;
    // 同カテゴリの生産施設 (空港なら AIR、港なら SEA、工場なら LAND)
    if(ter.healCat === cat) canSupply = true;
    // LAND ユニットは都市・首都でも補給可
    else if(cat === 'LAND' && (ter.group === 'city' || ter.group === 'capital')) canSupply = true;
    // 弾薬工廠は LAND/SEA ユニットの補給可 (AIR は対象外)
    else if(ter.ammoDepot && cat !== 'AIR') canSupply = true;
    if(canSupply){
      candidates.push({ x: cx, y: cy, dist: manhattan(unit.x, unit.y, cx, cy), type: 'facility' });
    }
  }

  // 2. 自軍空母系 (AIR ユニット限定)
  // 空母の隣接マスではなく「空母の上」に乗る必要 (cargo) → 距離 0 で乗艦
  if(cat === 'AIR'){
    for(var i=0; i<units.length; i++){
      var c = units[i];
      if(c.id === unit.id) continue;
      if(c.owner !== aiFaction || c.hp <= 0) continue;
      if(TYPE[c.type].canCarry !== 'AIR') continue;
      // 空母の cargo に空きがあるか
      var carCap = TYPE[c.type].capacity || 0;
      var carUsed = (c.cargo || []).length;
      if(carUsed >= carCap) continue;
      candidates.push({ x: c.x, y: c.y, dist: manhattan(unit.x, unit.y, c.x, c.y), type: 'carrier' });
    }
  }

  // 3. 自軍補給ユニット (補給対象が一致するもの)。隣接 (距離1) で補給される。
  for(var i=0; i<units.length; i++){
    var s = units[i];
    if(s.id === unit.id) continue;
    if(s.owner !== aiFaction || s.hp <= 0) continue;
    var st = TYPE[s.type];
    if(!st.isSupply) continue;
    // 補給ターゲットがこのユニットに当てはまるか
    var targets = st.supplyTarget || [];
    var matches = false;
    if(targets.indexOf(cat) >= 0) matches = true;
    // HELI (ヘリ) はカテゴリ AIR + armorClass HE で判定
    if(targets.indexOf('HELI') >= 0 && cat === 'AIR' && t.armorClass === 'HE') matches = true;
    if(!matches) continue;
    // 燃料補給だけ必要なのに弾薬しか持たない or 逆ならスキップ
    var canFuel = (typeof st.supplyFuel === 'boolean') ? st.supplyFuel : true;
    var canAmmo = !!st.supplyAmmo;
    if(fuelCheck && !ammoCheck && !canFuel) continue;
    if(ammoCheck && !fuelCheck && !canAmmo) continue;
    // 隣接位置に着く必要があるので距離 = マンハッタン距離 - 1 (隣接で補給OK)
    var d = manhattan(unit.x, unit.y, s.x, s.y) - 1;
    if(d < 0) d = 0;
    candidates.push({ x: s.x, y: s.y, dist: d, type: 'supply_unit', adj: true });
  }

  // 最寄り候補を返す
  if(candidates.length === 0) return null;
  // 搭載機は空母 (carrier 型) を最優先
  var isCarrierAircraft = (unit.type === 'CARRIER_FIGHTER' || unit.type === 'CARRIER_BOMBER' || unit.type === 'CARRIER_TORPEDO');
  if(isCarrierAircraft){
    var carrierCandidates = candidates.filter(function(c){ return c.type === 'carrier'; });
    if(carrierCandidates.length > 0){
      carrierCandidates.sort(function(a, b){ return a.dist - b.dist; });
      return carrierCandidates[0];
    }
  }
  candidates.sort(function(a, b){ return a.dist - b.dist; });
  return candidates[0];
}

// 航空機の燃料が「帰投ぎりぎり」か判定。
// 戻り値: true なら帰投すべき
// 必要燃料 = (最寄り補給場所までの距離 × 2) + 10
function _aiNeedsRefuel(unit, aiFaction){
  var t = TYPE[unit.type];
  if(t.cat !== 'AIR') return false; // 航空機限定 (地上ユニットは燃料切れても墜落しない)
  if(unit.fuel === undefined) return false;
  // 既に空母上にいる場合は帰投不要 (補給される)
  for(var i=0; i<units.length; i++){
    var c = units[i];
    if(c.id === unit.id) continue;
    if(c.owner !== aiFaction || c.hp <= 0) continue;
    if(TYPE[c.type].canCarry !== 'AIR') continue;
    if(c.x === unit.x && c.y === unit.y) return false;
  }
  // 既に自軍空港系拠点上にいる場合は不要
  var capHere = captures[unit.x+','+unit.y];
  var terHere = TER[M[unit.y][unit.x]];
  if(capHere && capHere.owner === aiFaction && terHere && terHere.healCat === 'AIR') return false;
  // 空中給油機隣接の場合は不要
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var di=0; di<dirs.length; di++){
    var nx = unit.x + dirs[di][0], ny = unit.y + dirs[di][1];
    if(!inBounds(nx, ny)) continue;
    var n = unitAt(nx, ny);
    if(!n || n.owner !== aiFaction || n.hp <= 0) continue;
    var nt = TYPE[n.type];
    if(!nt.isSupply || !nt.supplyFuel) continue;
    var targets = nt.supplyTarget || [];
    if(targets.indexOf('AIR') >= 0 || (targets.indexOf('HELI') >= 0 && t.armorClass === 'HE')) return false;
  }
  // 最寄り補給場所
  var sp = _aiFindNearestSupplyPoint(unit, aiFaction, true, false);
  if(!sp) return false; // 補給場所がない → 帰る場所がないので帰投しない (戦って燃料切れる)
  // 必要燃料 = 距離 × 2 + 10 (余裕)
  var needFuel = sp.dist * 2 + 10;
  return unit.fuel < needFuel;
}

// 弾薬切れか判定: 有限弾薬武器 (主火力) が「すべて 0」なら帰投すべき。
// 無限弾武器 (機関銃など弱い予備) は「主火力」に数えない。予備しか残っていなければ補給に戻す。
// 戻り値: true なら弾薬切れで帰投すべき
function _aiNeedsAmmo(unit, aiFaction){
  var t = TYPE[unit.type];
  if(!unit.ammo || !t.weapons || t.weapons.length === 0) return false;
  // 占領ユニット (歩兵・工兵など) は AI では攻撃に使わないので対象外 (弾切れでも占領を続ける)
  if(t.canCapture) return false;
  var hasFiniteWithAmmo = false;
  var hasFinite = false;
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(w.infiniteAmmo) continue; // 無限武器 (弱い予備) は弾切れ判定に数えない
    hasFinite = true;
    if(unit.ammo[i] > 0) hasFiniteWithAmmo = true;
  }
  // 有限武器が一つもない → 対象外 (輸送船・機銃のみのユニット等)
  if(!hasFinite) return false;
  // 有限武器 (主火力) がすべて 0 → 弱い予備しか残っていない → 帰投
  return !hasFiniteWithAmmo;
}

// 修理が必要か判定: HP が 50 以下 (表示HP 5/10 以下) なら修理に下がるべき
// 戻り値: true なら修理に下がる
function _aiNeedsRepair(unit, aiFaction){
  var t = TYPE[unit.type];
  // 仕様: 表示HP < 5 で撤退モード (内部HP は表示HP × 10 換算なので 50 が閾値)
  // つまり HP > 50 (内部) なら撤退不要、HP <= 50 (内部) = 表示HP <= 5 で撤退発動
  if(unit.hp > 50) return false;
  // 既に自軍の修理可能施設マス上にいる場合は不要
  var capHere = captures[unit.x+','+unit.y];
  var terHere = TER[M[unit.y][unit.x]];
  if(capHere && capHere.owner === aiFaction && terHere && terHere.heal){
    if(!terHere.healCat || terHere.healCat === t.cat) return false;
  }
  // 空母上にいる場合 (AIR ユニット) は不要 (空母も heal 効果あり)
  if(t.cat === 'AIR'){
    for(var i=0; i<units.length; i++){
      var c = units[i];
      if(c.id === unit.id) continue;
      if(c.owner !== aiFaction || c.hp <= 0) continue;
      if(TYPE[c.type].canCarry !== 'AIR') continue;
      if(c.x === unit.x && c.y === unit.y) return false;
    }
  }
  // 修理可能施設があるか?
  var rp = _aiFindNearestRepairPoint(unit, aiFaction);
  if(!rp) return false;
  return true;
}

// AI: HP は問題なくても「弾薬(または航空機の燃料)が乏しい」ので施設スロットに収容して
// フル補給したいか判定。
// 注意: 自軍生産施設マス上では applyTurnStart で毎ターン50%補給が先に入るため、行動時に
//   弾薬が「完全に0」になることはほぼ無い (_aiNeedsAmmo は全主火力0で判定するため立たない)。
//   そこで「最大弾数の50%以下 = 乏しい」を閾値に判定する。
// 燃料は AIR のみ対象 (地上/艦艇は燃料切れで撃墜されず、施設の50%給油で足りるため収容までは不要)。
function _aiWantsFacilityResupply(u){
  var t = TYPE[u.type];
  if(u.ammo && t.weapons){
    for(var i=0; i<t.weapons.length; i++){
      var w = t.weapons[i];
      if(w.infiniteAmmo) continue; // 無限弾 (弱い予備) は判定に数えない
      var maxA = (w.ammo !== undefined ? w.ammo : 6);
      if(typeof u.ammo[i] === 'number' && u.ammo[i] <= maxA * 0.5) return true;
    }
  }
  if(t.cat === 'AIR' && typeof u.fuel === 'number' && t.fuelMax && u.fuel <= t.fuelMax * 0.5) return true;
  return false;
}

// 最寄りの修理可能施設を探す
// 戻り値: { x, y, dist } または null
// 修理可能 = 自軍占領済み + heal あり + healCat 一致 (or healCat 無し = 全カテゴリ対応)
function _aiFindNearestRepairPoint(unit, aiFaction){
  var t = TYPE[unit.type];
  var candidates = [];
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
    var ter = TER[M[cy][cx]];
    if(!ter || !ter.heal) continue;
    if(ter.healCat && ter.healCat !== t.cat) continue;
    // このユニットがその地形に侵入可能か (=向かえるか)
    var c = moveCost(unit.type, M[cy][cx]);
    if(c === Infinity) continue;
    // 仕様書セクション2: 施設マスが他の自軍ユニットで埋まっていれば候補から除外
    // (自分自身がそのマスに居る場合は除外しない = その場で修理を受ける)
    var occupier = unitAt(cx, cy);
    if(occupier && occupier.id !== unit.id) continue;
    var d = manhattan(unit.x, unit.y, cx, cy);
    candidates.push({ x: cx, y: cy, dist: d });
  }
  // AIR ユニットは空母上も候補に追加 (空母 cargo 空き = 修理スロット空き)
  if(t.cat === 'AIR'){
    for(var i=0; i<units.length; i++){
      var carr = units[i];
      if(carr.id === unit.id) continue;
      if(carr.owner !== aiFaction || carr.hp <= 0) continue;
      if(TYPE[carr.type].canCarry !== 'AIR') continue;
      var carrT = TYPE[carr.type];
      if(carr.cargo && carr.cargo.length >= carrT.capacity) continue;
      var d2 = manhattan(unit.x, unit.y, carr.x, carr.y);
      candidates.push({ x: carr.x, y: carr.y, dist: d2 });
    }
  }
  if(candidates.length === 0) return null;
  candidates.sort(function(a, b){ return a.dist - b.dist; });
  return candidates[0];
}

// 帰投移動: 最寄りの補給場所に向かう移動を実行
// 戻り値: true なら移動実行、false なら帰投不要 or 帰投先なし
// reason: 'fuel' / 'ammo' / 'idle' / 'repair' (ログ用)
function _aiMoveToSupplyPoint(unit, aiFaction, reason){
  var fuelCheck = (reason === 'fuel');
  var ammoCheck = (reason === 'ammo');
  var sp;
  if(reason === 'repair'){
    sp = _aiFindNearestRepairPoint(unit, aiFaction);
    // 修理場所が見つかった場合、type を判定 (空母/施設)
    if(sp){
      // 空母上ならその空母を識別 (CARRIER BOARD のため)
      var carrierUnit = unitAt(sp.x, sp.y);
      if(carrierUnit && carrierUnit.owner === aiFaction && TYPE[carrierUnit.type].canCarry === 'AIR'){
        sp.type = 'carrier';
      } else {
        sp.type = 'facility';
      }
    }
  } else {
    sp = _aiFindNearestSupplyPoint(unit, aiFaction, fuelCheck, ammoCheck);
  }
  if(!sp) return false;
  // 既に十分近い (距離 0 = 上に乗ってる、または adj 補給ユニットに隣接) なら待機
  if(sp.dist === 0){
    if(window.AI_DEBUG) try{ console.log('  → RETURN ('+reason+'): already at supply ('+sp.x+','+sp.y+')'); }catch(e){}
    return true; // 動かないが「帰投済み」扱い (true 返して呼び出し側で acted=true にする)
  }
  // 補給場所に向かって最大限近づく移動
  var movable = computeMovable(unit);
  var bestMove = null, bestMoveD = Infinity;
  var isCarrierBoarding = false; // 空母マスに直接乗れるか
  // 空母マスが移動範囲に含まれているか先にチェック
  if(sp.type === 'carrier'){
    var carrierKey = sp.x + ',' + sp.y;
    if(movable[carrierKey]){
      // 空母上の cargo 空き確認
      var carrier = unitAt(sp.x, sp.y);
      if(carrier && carrier.owner === aiFaction && TYPE[carrier.type].canCarry === 'AIR'){
        var carrierTC = TYPE[carrier.type];
        if(!(carrier.cargo && carrier.cargo.length >= carrierTC.capacity)){
          isCarrierBoarding = true;
          bestMove = { x: sp.x, y: sp.y };
          bestMoveD = 0;
        }
      }
    }
  }
  if(!isCarrierBoarding){
    // 撤退・帰投時のルート選定
    // 仕様書セクション2「敵の真横を避ける (ゲームルール上、隣接で移動が止まるため)」
    // = ZOCマス (敵に隣接するマス) を経路で踏まない
    // 2段階フィルタ:
    //   1パス目: ZOC外のマスのみで最短距離を選ぶ
    //   2パス目: ZOC外に候補なしなら ZOCマスも許可してフォールバック
    function _scanCands(allowZoc){
      var best = null, bestD = Infinity;
      for(var mk in movable){
        var xy = mk.split(',');
        var mx = parseInt(xy[0]), my = parseInt(xy[1]);
        var blocker = unitAt(mx, my);
        if(blocker && blocker.id !== unit.id) continue;
        // ZOC回避 (現在地が既にZOC内ならスキップせず候補に入れる: 動かない選択肢)
        if(!allowZoc && !(mx === unit.x && my === unit.y)){
          if(isAdjacentToEnemy(mx, my, aiFaction)) continue;
        }
        var d = manhattan(mx, my, sp.x, sp.y);
        if(sp.adj){
          if(d === 0) continue; // 補給ユニットの真上には乗らない
          d = d - 1;
        }
        if(d < bestD){ bestD = d; best = { x: mx, y: my }; }
      }
      return { move: best, dist: bestD };
    }
    var scan1 = _scanCands(false);
    if(scan1.move){
      bestMove = scan1.move;
      bestMoveD = scan1.dist;
    } else {
      var scan2 = _scanCands(true);
      bestMove = scan2.move;
      bestMoveD = scan2.dist;
      if(window.AI_DEBUG && bestMove){
        try{ console.log('  → RETURN ('+reason+'): ZOC外に候補なし、ZOCマス('+bestMove.x+','+bestMove.y+')をフォールバック'); }catch(e){}
      }
    }
  }
  if(!bestMove){
    if(window.AI_DEBUG) try{ console.log('  → RETURN ('+reason+'): no movable to supply ('+sp.x+','+sp.y+' dist='+sp.dist+')'); }catch(e){}
    return false;
  }
  // 空母乗艦の場合: cargo に push して unit を units から削除
  if(isCarrierBoarding){
    var carrierForLoad = unitAt(sp.x, sp.y);
    if(carrierForLoad){
      if(window.AI_DEBUG) try{ console.log('  → CARRIER BOARD: '+unit.type+'→空母@('+sp.x+','+sp.y+')'); }catch(e){}
      var fromXc = unit.x, fromYc = unit.y;
      unit.x = sp.x; unit.y = sp.y;
      unit.preMoveX = fromXc; unit.preMoveY = fromYc;
      consumeFuelForMove(unit, fromXc, fromYc);
      var cargoEntryC = {
        type: unit.type, hp: unit.hp, owner: unit.owner, originalId: unit.id,
        fuel: unit.fuel, ammo: unit.ammo ? unit.ammo.slice() : null,
        cargo: unit.cargo ? unit.cargo.slice() : [],
        loadedRound: roundNumber
      };
      var fakeC = { type: cargoEntryC.type, fuel: cargoEntryC.fuel, ammo: cargoEntryC.ammo ? cargoEntryC.ammo.slice() : null };
      carrierResupplyOnLoad(carrierForLoad, fakeC);
      cargoEntryC.fuel = fakeC.fuel; cargoEntryC.ammo = fakeC.ammo;
      carrierForLoad.cargo.push(cargoEntryC);
      units = units.filter(function(uu){ return uu.id !== unit.id; });
      return true;
    }
  }
  // 移動実行
  if(bestMove.x !== unit.x || bestMove.y !== unit.y){
    if(window.AI_DEBUG) try{ console.log('  → RETURN ('+reason+') move to ('+bestMove.x+','+bestMove.y+') → supply ('+sp.x+','+sp.y+' dist='+sp.dist+' fuel='+unit.fuel+')'); }catch(e){}
    var mvR = executeMoveWithAmbushCheck(unit, bestMove.x, bestMove.y);
    return true;
  }
  // 動かない (既に最良位置)
  if(window.AI_DEBUG) try{ console.log('  → RETURN ('+reason+') stay (already near supply)'); }catch(e){}
  return true;
}

// フェーズ1+2: HP≤50 ユニットの退避実行。
//   攻撃力は残HPに比例する (damage = 基礎火力 × hp/HP_MAX) ため、HP≤50 では有効打を出せず
//   殴り合っても消耗するだけ。よって攻撃せず退避を最優先する。
//   ・修理拠点があればそこへ最短で下がる。無ければ敵から最も離れるマスへ退避する。
//   ・経路が味方ユニットで塞がれて一歩も下がれない場合、まだ行動していない健全な味方を脇へ
//     どかして道を空ける (make-way / こじ開け)。どかした味方はそのターン行動済み扱いにする。
//   戻り値: { acted:true }  退避/待機を行い当該ユニットのターンを消費した (攻撃はしない)
//           { acted:false } 退避不要 (敵が近くにおらず修理拠点も無い安全な状況) → 通常フローへ委ねる
//   shovedIds: make-way でどかした味方IDを記録する呼び出し側オブジェクト (二重行動防止)
function aiExecuteRetreat(u, aiFaction, shovedIds){
  function nearestEnemyDist(x, y){
    var best = Infinity;
    for(var i=0; i<units.length; i++){
      var e = units[i];
      if(e.hp <= 0) continue;
      if(e.owner === aiFaction || isAlly(e.owner, aiFaction)) continue;
      var d = manhattan(x, y, e.x, e.y);
      if(d < best) best = d;
    }
    return best;
  }
  var rp = _aiFindNearestRepairPoint(u, aiFaction); // {x,y,dist} or null
  var DANGER = 6;
  var inDanger = (nearestEnemyDist(u.x, u.y) <= DANGER);
  // 安全 かつ 修理拠点なし → 無理に戦線を捨てず通常フローに委ねる
  if(!rp && !inDanger) return { acted:false };
  var toRepair = !!rp;
  // A) 修理拠点がある場合は、既存の帰投ロジックに委譲して下がる。
  //    (空母への乗艦・施設接近・ZOC回避を内包。自作スコアでは乗艦できないため必ずこちらを使う)
  //    停滞 (一歩も下がれない) 時のみ、下の make-way でこじ開けを試みる。
  if(toRepair){
    var beforeX = u.x, beforeY = u.y;
    _aiMoveToSupplyPoint(u, aiFaction, 'repair');
    if(units.indexOf(u) < 0) return { acted:true };    // 空母に乗艦して units から除去された
    if(u.x !== beforeX || u.y !== beforeY) return { acted:true }; // 実際に後退できた
    // 一歩も下がれず停滞 → make-way へ
  }
  // マス評価: 値が大きいほど良い退避先 (make-way の空けマス選定 / rp無し退避 で使用)
  function score(x, y){
    var s;
    if(toRepair){
      s = -manhattan(x, y, rp.x, rp.y) * 10;          // 修理拠点に近いほど良い
    } else {
      var ed = nearestEnemyDist(x, y);
      if(ed === Infinity) ed = 99;
      s = Math.min(ed, 12) * 10;                       // 敵から遠いほど良い (上限12)
    }
    var ter = TER[M[y][x]];
    s += ((ter && ter.def) ? ter.def : 0) * 2;         // 地形防御が高いほど被弾時に有利
    if(isAdjacentToEnemy(x, y, aiFaction)) s -= 15;    // 敵の真横(ZOC/被弾圏)で止まるのは避ける
    return s;
  }
  var curScore = score(u.x, u.y);
  // B) 修理拠点なし(危険回避)の通常退避: 着地可能(空き)マスで最もスコアの高いマスへ
  if(!toRepair){
    var movable = computeMovable(u);
    var best = null, bestS = curScore;
    for(var mk in movable){
      var xy = mk.split(','); var mx = parseInt(xy[0]), my = parseInt(xy[1]);
      if(mx === u.x && my === u.y) continue;
      var occ = unitAt(mx, my);
      if(occ && occ.id !== u.id) continue;             // 着地不可 (誰かいる)
      var s = score(mx, my);
      if(s > bestS){ bestS = s; best = { x:mx, y:my }; }
    }
    if(best){
      if(window.AI_DEBUG) try{ console.log('  → [RETREAT] 敵から離脱 ('+u.x+','+u.y+')→('+best.x+','+best.y+') score '+curScore+'→'+bestS); }catch(e){}
      executeMoveWithAmbushCheck(u, best.x, best.y);
      return { acted:true };
    }
  }
  // C) make-way: 一歩も下がれない → 隣接の「改善するが味方で塞がれたマス」を空ける
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  var shove = null, shoveS = curScore;
  for(var di=0; di<dirs.length; di++){
    var nx = u.x + dirs[di][0], ny = u.y + dirs[di][1];
    if(!inBounds(nx, ny)) continue;
    if(moveCost(u.type, M[ny][nx]) === Infinity) continue; // U が入れない地形
    var s2 = score(nx, ny);
    if(s2 <= shoveS) continue;                          // 改善しないマスは対象外
    var F = unitAt(nx, ny);
    if(!F) continue;                                    // 空きマスは A)/B) で処理済み
    if(F.owner !== aiFaction || F.hp <= 0) continue;    // 敵/死亡はこじ開け対象外 (=フェーズ3)
    if(F.acted || shovedIds[F.id]) continue;            // 既に動いた味方は動かせない
    if(F.hp <= 50) continue;                            // 負傷した味方は犠牲にしない (自身も退避対象)
    // F の退避先 (脇へどく空きマス) を探す
    var fMov = computeMovable(F);
    var aside = null, asideBest = -Infinity;
    for(var fk in fMov){
      var fxy = fk.split(','); var fx = parseInt(fxy[0]), fy = parseInt(fxy[1]);
      if(fx === F.x && fy === F.y) continue;
      if(fx === nx && fy === ny) continue;              // U が入るマスへは退避させない
      if(fx === u.x && fy === u.y) continue;            // U の現在地へも退避させない
      if(unitAt(fx, fy)) continue;                      // 空きのみ
      var a = -manhattan(fx, fy, F.x, F.y);             // なるべく近くへ (移動距離小)
      if(isAdjacentToEnemy(fx, fy, aiFaction)) a -= 5;  // 敵の真横は避ける
      if(a > asideBest){ asideBest = a; aside = { x:fx, y:fy }; }
    }
    if(!aside) continue;
    shoveS = s2; shove = { to:{ x:nx, y:ny }, F:F, aside:aside };
  }
  if(shove){
    if(window.AI_DEBUG) try{ console.log('  → [MAKE-WAY] '+TYPE[shove.F.type].name+' を ('+shove.F.x+','+shove.F.y+')→('+shove.aside.x+','+shove.aside.y+') へどかし、'+TYPE[u.type].name+' が退避 ('+u.x+','+u.y+')→('+shove.to.x+','+shove.to.y+')'); }catch(e){}
    var fOldX = shove.F.x, fOldY = shove.F.y;
    executeMoveWithAmbushCheck(shove.F, shove.aside.x, shove.aside.y);
    if(shove.F.x !== fOldX || shove.F.y !== fOldY){    // F が実際にどいた
      shove.F.acted = true; shovedIds[shove.F.id] = true;
      if(!unitAt(shove.to.x, shove.to.y)){             // 空いたマスへ U が退避
        executeMoveWithAmbushCheck(u, shove.to.x, shove.to.y);
      }
    }
    return { acted:true };
  }
  // D) 完全に囲まれて下がれない → 攻撃せず待機 (無駄打ちで消耗しない)
  if(window.AI_DEBUG) try{ console.log('  → [RETREAT] 退避不能(囲まれ) → 待機 hp='+u.hp); }catch(e){}
  return { acted:true };
}

// AI: ユニットを自軍生産施設の空きスロットに収容する (プレイヤーの doRepair 相当)
// 収容中は毎ターン HP 回復、取り出し時に HP 回復済み + 燃料・弾薬も満タン (フル補給)。
// 施設マスも空くので後続ユニットが補給・修理できる。修理にも補給(弾薬・燃料)にも使う。
// 戻り値: true なら収容実行 (u は units から除去される)。前提: u が自軍生産施設マスの上にいること。
function aiStoreInFacilityForService(u, aiFaction){
  var cap = captures[u.x+','+u.y];
  var ter = TER[M[u.y][u.x]];
  if(!cap || cap.owner !== aiFaction) return false;
  if(!ter || !ter.slots) return false;   // 生産施設 (工場・港・空港系) のみ
  if(cap.upgrading) return false;        // アップグレード中はスロット停止
  // 修理対応カテゴリ (工場=LAND, 港=SEA, 空港=AIR)。healCat 未指定なら何でも可
  if(ter.healCat && ter.healCat !== TYPE[u.type].cat) return false;
  // 空きスロット判定 (生産中 + 収容中 < slots)
  var ongoing = 0;
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner === aiFaction && production[pi].x === u.x && production[pi].y === u.y) ongoing++;
  }
  var stored = (cap.cargo || []).length;
  if(ongoing + stored >= ter.slots) return false; // 空きスロットなし
  // 収容実行
  if(!cap.cargo) cap.cargo = [];
  cap.cargo.push({
    type: u.type, hp: u.hp, owner: u.owner,
    cargo: u.cargo ? u.cargo.slice() : [],
    // 段階2: 取り出し時の補給を施設の備蓄から払うため、収容時の燃料・弾薬を記録する
    fuel: u.fuel,
    ammo: u.ammo ? u.ammo.slice() : null,
    // 補給ユニットの積載庫も記録する (記録しないと取り出し時に満タンで湧いてしまう)
    supplyFuelCount: u.supplyFuelCount,
    supplyAmmoCount: u.supplyAmmoCount,
    storedRound: roundNumber // 同ラウンド中は取り出せない (翌ラウンドから)
  });
  units = units.filter(function(uu){ return uu.id !== u.id; });
  if(window.AI_DEBUG) try{ console.log('  → 施設収容(修理): '+TYPE[u.type].name+' @('+u.x+','+u.y+') slot='+(stored+1)+'/'+ter.slots+' HP'+u.hp); }catch(e){}
  return true;
}

// 航空機が「攻撃目的なし」と判断できるか
// = 見える敵の中で、このユニットが有効ダメージ(≥2)を与えられる相手が一人もいない
// AIRユニット限定。見える敵が0でもtrue。
function _aiAirHasNoAttackTarget(unit, aiFaction, visibleEnemies){
  var t = TYPE[unit.type];
  if(t.cat !== 'AIR') return false;
  if(!visibleEnemies || visibleEnemies.length === 0) return true;
  // このユニットの武器テーブルから、敵の装甲クラスに対して2以上ダメージが出る相手を探す
  if(!t.weapons || t.weapons.length === 0) return true;
  for(var ei=0; ei<visibleEnemies.length; ei++){
    var e = visibleEnemies[ei];
    var eT = TYPE[e.type];
    var eClass = eT.armorClass;
    for(var wi=0; wi<t.weapons.length; wi++){
      var w = t.weapons[wi];
      if(!w.atk || w.atk[eClass] === undefined) continue;
      if(w.atk[eClass] >= 2){
        // 弾薬チェック (弾切れなら攻撃できない)
        if(!w.infiniteAmmo && unit.ammo && unit.ammo[wi] <= 0) continue;
        return false; // 有効な敵がいる
      }
    }
  }
  return true; // どの敵にも有効攻撃できない → 攻撃目的なし
}

// ユニット u が敵 e に「有効ダメージ ≥ 2」を出せる武器を 1 つでも持つか (弾薬あり)
// 汎用版 (cat 制限なし)
function _aiUnitCanEffectivelyAttack(u, e){
  var t = TYPE[u.type];
  var eT = TYPE[e.type];
  if(!t.weapons || t.weapons.length === 0) return false;
  if(!eT) return false;
  var eClass = eT.armorClass;
  for(var wi=0; wi<t.weapons.length; wi++){
    var w = t.weapons[wi];
    if(!w.atk || w.atk[eClass] === undefined) continue;
    if(w.atk[eClass] >= 2){
      // 弾薬チェック (弾切れなら攻撃できない)
      if(!w.infiniteAmmo && u.ammo && u.ammo[wi] <= 0) continue;
      return true;
    }
  }
  return false;
}

// ユニット u が「拠点 (施設) を攻撃できる」か (vsFacility > 0 の武器を 1 つでも持つ)
function _aiUnitCanAttackFacility(u){
  var t = TYPE[u.type];
  if(!t.weapons || t.weapons.length === 0) return false;
  for(var wi=0; wi<t.weapons.length; wi++){
    var w = t.weapons[wi];
    if(w.vsFacility && w.vsFacility > 0){
      if(!w.infiniteAmmo && u.ammo && u.ammo[wi] <= 0) continue;
      return true;
    }
  }
  return false;
}

// 空母系 (canCarry === 'AIR') が「待機すべき」状態か判定
// = 攻撃目的がない (近くの敵に有効ダメージ出せない) かつ、搭載機の搭載や運用に有用な状態
// 戻り値: true なら空母は移動せず待機
function _aiCarrierShouldStay(unit, aiFaction, visibleEnemies){
  var t = TYPE[unit.type];
  if(t.canCarry !== 'AIR' || t.cat !== 'SEA') return false;
  // 近距離 (射程内+1マス) の敵がいれば攻撃可能性ありなので待機しない
  if(visibleEnemies && visibleEnemies.length > 0){
    for(var ei=0; ei<visibleEnemies.length; ei++){
      var e = visibleEnemies[ei];
      var d = manhattan(unit.x, unit.y, e.x, e.y);
      // 空母自体の射程 (機関砲 1 など) または隣接敵 → 待機しない
      if(d <= 2) return false;
    }
  }
  // 攻撃力弱い (空母は基本的に対空ミサイル+機関砲だけ) なので、攻撃目的がない場合は待機
  // 搭載機が乗っているなら、搭載機を発艦させる方が有効
  // ただし「敵射程外で搭載機を撫でる」動作はここでは扱わない → 単純に待機
  if(!t.weapons || t.weapons.length === 0) return true;
  if(!visibleEnemies || visibleEnemies.length === 0) return true;
  for(var ei2=0; ei2<visibleEnemies.length; ei2++){
    var e2 = visibleEnemies[ei2];
    var eT2 = TYPE[e2.type];
    var eClass2 = eT2.armorClass;
    for(var wi=0; wi<t.weapons.length; wi++){
      var w = t.weapons[wi];
      if(!w.atk || w.atk[eClass2] === undefined) continue;
      if(w.atk[eClass2] >= 3){
        if(!w.infiniteAmmo && unit.ammo && unit.ammo[wi] <= 0) continue;
        return false; // 有効な敵がいる → 待機しない
      }
    }
  }
  return true;
}

// 航空機が自軍補給拠点上または隣接にいるか (= 待機すれば燃料補給を受けられる)
function _aiAirIsAtSupplyPoint(unit, aiFaction){
  var t = TYPE[unit.type];
  if(t.cat !== 'AIR') return false;
  // 自軍空港系拠点上
  var capHere = captures[unit.x+','+unit.y];
  var terHere = TER[M[unit.y][unit.x]];
  if(capHere && capHere.owner === aiFaction && terHere && terHere.healCat === 'AIR') return true;
  // 空母上
  for(var i=0; i<units.length; i++){
    var c = units[i];
    if(c.id === unit.id) continue;
    if(c.owner !== aiFaction || c.hp <= 0) continue;
    if(TYPE[c.type].canCarry !== 'AIR') continue;
    if(c.x === unit.x && c.y === unit.y) return true;
  }
  // 空中給油機隣接
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var di=0; di<dirs.length; di++){
    var nx = unit.x + dirs[di][0], ny = unit.y + dirs[di][1];
    if(!inBounds(nx, ny)) continue;
    var n = unitAt(nx, ny);
    if(!n || n.owner !== aiFaction || n.hp <= 0) continue;
    var nt = TYPE[n.type];
    if(!nt.isSupply || !nt.supplyFuel) continue;
    var targets = nt.supplyTarget || [];
    if(targets.indexOf('AIR') >= 0 || (targets.indexOf('HELI') >= 0 && t.armorClass === 'HE')) return true;
  }
  return false;
}

// ユニットが「ほとんど攻撃しない」かを判定
// - 輸送ユニット (capacity あり)
// - 補給ユニット (isSupply)
// - 工兵 (isEngineer)
// - 武器を持たない or 全武器が atk テーブル空 or 最大ダメージが低い
// 戻り値: true なら戦闘力弱い (生産口退避優先対象)
function _aiUnitHasWeakCombat(unit){
  var t = TYPE[unit.type];
  if(t.isSupply) return true;
  if(t.isEngineer) return true;
  // 輸送ユニット (capacity あり + canCarry あり)
  if(t.capacity && t.canCarry) return true;
  // 武器が無い or 攻撃力が低い (どの武器も最大ダメージ < 3)
  if(!t.weapons || t.weapons.length === 0) return true;
  var maxAtk = 0;
  for(var wi=0; wi<t.weapons.length; wi++){
    var w = t.weapons[wi];
    if(!w.atk) continue;
    for(var k in w.atk){
      if(w.atk[k] > maxAtk) maxAtk = w.atk[k];
    }
  }
  return maxAtk < 3;
}

// 補給インフラ判定
function _aiNeedsSupplyInfra(aiFaction){
  var airUnitCount = 0;
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(TYPE[u.type].cat !== 'AIR') continue;
    if(TYPE[u.type].isSupply) continue; // 給油機自身は除外
    if(TYPE[u.type].canCarry === 'AIR') continue; // (将来空母系がAIRに入る場合の保険)
    airUnitCount++;
  }
  // 補給容量
  var airportCount = 0;
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== aiFaction) continue;
    var xy = k.split(',');
    var ter = TER[M[parseInt(xy[1])][parseInt(xy[0])]];
    if(ter && ter.healCat === 'AIR') airportCount++;
  }
  var carrierCount = 0;
  var tankerCount = 0;
  for(var i=0; i<units.length; i++){
    var u = units[i];
    if(u.owner !== aiFaction || u.hp <= 0) continue;
    if(TYPE[u.type].canCarry === 'AIR') carrierCount++;
    else if(u.type === 'AERIAL_TANKER') tankerCount++;
  }
  // 生産中もカウント
  for(var pi=0; pi<production.length; pi++){
    if(production[pi].owner !== aiFaction) continue;
    var pt = production[pi].type;
    if(pt === 'AERIAL_TANKER') tankerCount++;
    else if(pt === 'LIGHT_CARRIER' || pt === 'CARRIER' || pt === 'ARMORED_CARRIER') carrierCount++;
  }
  var supplyCapacity = airportCount * 1 + carrierCount * 4 + tankerCount * 3;
  var ratio = airUnitCount > 0 ? supplyCapacity / airUnitCount : Infinity;
  // 航空機 4機以上 & 補給容量が航空機数を下回る → 補給インフラ不足
  var shortage = (airUnitCount >= 4) && (supplyCapacity < airUnitCount);
  return {
    needAirTanker: shortage && tankerCount < 2, // 空中給油機を作る (上限2機)
    needCarrier: shortage && carrierCount === 0, // 空母を作る (上限1隻、高価なので慎重)
    airUnitCount: airUnitCount,
    supplyCapacity: supplyCapacity,
    ratio: ratio
  };
}

// ===== 輸送系・補給系AIヘルパ =====


// AI: 降下処理 (carrier の cargo[idx] を (x,y) に降ろす)
function aiUnload(carrier, idx, x, y){
  if(!carrier.cargo || !carrier.cargo[idx]) return false;
  if(unitAt(x, y)) return false;
  var cargo = carrier.cargo[idx];
  var carrierT = TYPE[carrier.type];
  var newU = makeUnit(cargo.type, cargo.owner, x, y);
  newU.hp = cargo.hp;
  // 乗艦中に保存していた fuel/ammo を引き継ぐ
  if(typeof cargo.fuel === 'number') newU.fuel = cargo.fuel;
  if(cargo.ammo) newU.ammo = cargo.ammo.slice();
  // 補給ユニット(補給貨車など)の在庫も引き継ぐ
  if(typeof cargo.supplyFuelCount === 'number') newU.supplyFuelCount = cargo.supplyFuelCount;
  if(typeof cargo.supplyAmmoCount === 'number') newU.supplyAmmoCount = cargo.supplyAmmoCount;
  // quickDeploy対応: 同ラウンド乗船は除く
  var loadedThisRound = (cargo.loadedRound === roundNumber);
  if(carrierT.quickDeploy && !loadedThisRound){
    newU.acted = false;
    newU.moved = false;
  } else {
    newU.acted = true;
    newU.moved = true;
  }
  if(cargo.cargo && cargo.cargo.length > 0) newU.cargo = cargo.cargo.slice();
  units.push(newU);
  carrier.cargo.splice(idx, 1);
  return true;
}

// AI: ユニットが歩兵 (canCapture) を含む輸送ユニットか
// 降下準備可能な地形か判定 (輸送ユニットが居る地形)
// 平地・道路・浅瀬・施設(都市/工場/港/空港など) はOK。森・山・川・海はNG。
// cargoTypeを指定した場合、空挺降下兵なら森・山・川の上空からも降下可能 (輸送機特殊)
function canDeployFrom(terKey, cargoType){
  if(!terKey) return false;
  var ter = TER[terKey];
  if(!ter) return false;
  // 空挺降下兵: 輸送機からの場合、森・山・川 でも降下可能 (海はNG)
  if(cargoType && TYPE[cargoType] && TYPE[cargoType].isParatrooper){
    // 海以外はOK (パラシュート降下)
    if(terKey === 'SEA') return false;
    return true;
  }
  // 進入コスト1 = ユニットが安定して立てる地形 (歩兵を基準にチェック)
  var infCost = COST.INF[terKey];
  if(infCost === 1) return true;
  return false;
}

function isLandTransport(t){ return t === 'TRANSPORT_SHIP' || t === 'TRANSPORT_HELI' || t === 'TRANSPORT_PLANE'; }

// 陸上ユニットの「輸送カテゴリ」を判定
// 戻り値: 'track' (キャタピラ), 'wheel' (装輪), 'inf' (歩兵), null (LANDでない or 輸送ユニット自身)
// 輸送優先度: track > wheel > inf の順で大型ユニットを優先輸送 (重火力を敵地へ)
function _aiLandTransportCat(unitType){
  var t = TYPE[unitType];
  if(!t || t.cat !== 'LAND') return null;
  if(isLandTransport(unitType)) return null; // 輸送ユニット自身は除外
  if(t.isTrain) return null;                 // 列車系は船・輸送機で運べない
  var cost = t.cost;
  if(cost === 'TRACK_L' || cost === 'TRACK_H') return 'track';
  if(cost === 'WHEEL') return 'wheel';
  if(cost === 'INF' || cost === 'INF_HEAVY' || cost === 'INF_MNT') return 'inf';
  return null;
}

// AI: ユニット unit がマス (x, y) に居た時の地形防御を返す (実際に移動させずに計算)
// getTerrainDefFor() は unit.x/unit.y を見るので、仮位置での計算に使うヘルパー
// 仕様: 海上ユニットは港系・岩礁で地形防御を得る、潜航中の潜水艦は深海でも +3
function _aiTerrainDefAt(unit, x, y){
  if(!unit || !TYPE[unit.type]) return 0;
  var terKey = M[y][x];
  var ter = TER[terKey];
  if(!ter) return 0;
  var cat = TYPE[unit.type].cat;
  if(cat === 'AIR'){
    // ヘリは森・山を遮蔽に使えるので、そこでは地形防御を得る (固定翼機は0のまま)
    if(isHelicopter(unit) && (terKey === 'FOREST' || terKey === 'MOUNTAIN')) return ter.def || 0;
    return 0;
  }
  if(cat === 'SEA'){
    // 港系: 通常の地形防御
    if(ter.group === 'port') return ter.def || 0;
    // 岩礁: 通行可能な海上ユニットは防御 3
    if(terKey === 'REEF') return ter.def || 0;
    // 深海: 潜航中の潜水艦のみ防御 +3
    // (AI は「ここに移動する」シミュレーションをしているので、現状潜航中なら移動先でも潜航中と仮定)
    if(terKey === 'DEEP_SEA' && TYPE[unit.type].canSubmerge && unit.submerged) return 3;
    return 0;
  }
  return ter.def || 0; // LAND
}

// AI: 指定マス (x, y) で受ける可能性のあるダメージ合計を計算 (危険度スコア)
// 自分から見て視認可能な敵 (faction以外、中立除く) が現在位置から (x, y) を射程に収めているか調べる
// セクション1「防御力優先」: (x, y) の地形防御を引いた「実際に受けるダメージ」を計算
function aiComputeDangerScore(faction, x, y, selfUnit){
  var totalDanger = 0;
  // 移動先 (x, y) でユニットが受ける地形防御 + 自身の装甲
  var terrainDef = selfUnit ? _aiTerrainDefAt(selfUnit, x, y) : 0;
  var armor = (selfUnit && TYPE[selfUnit.type] && TYPE[selfUnit.type].armor) || 0;
  for(var i=0; i<units.length; i++){
    var e = units[i];
    if(isAlly(e.owner, faction) || e.owner === 'N' || e.hp <= 0) continue;
    // 索敵: 自軍視点で見えていない敵は知らないので回避対象外 (現実的)
    if(!isUnitVisibleTo(e, faction)) continue;
    var dist = manhattan(e.x, e.y, x, y);
    var t = TYPE[e.type];
    // この敵が (x, y) を射程に収めているか?
    var maxAtk = 0;
    for(var w=0; w<t.weapons.length; w++){
      var weap = t.weapons[w];
      if(dist < weap.range[0] || dist > weap.range[1]) continue;
      // selfUnit の装甲クラスへの火力
      var armorClass = selfUnit ? getArmorClass(selfUnit) : 'INF';
      var atkVal = weap.atk[armorClass] || 0;
      if(atkVal > maxAtk) maxAtk = atkVal;
    }
    if(maxAtk > 0){
      // 実際に受けるダメージ = max(0, 敵火力 - 装甲 - 地形防御)
      // 戦闘式と同じ計算で「予想実ダメージ」を出す (HP割引・天候等は省略・近似)
      var realDmg = maxAtk - armor - terrainDef;
      if(realDmg > 0) totalDanger += realDmg;
    }
  }
  return totalDanger;
}

// ユニットが指定マスから他マスへの実経路距離を BFS で計算
// 戻り値: { 'x,y': distance } の辞書 (到達不能マスは含まない)
// targetX,targetY: 経路距離を計算したい起点
// unit: 経路を計算する対象ユニット (コストカテゴリで通れる地形が決まる)
// 注: ZOC や敵ユニット占有マスは考慮しない (純粋な地形通行可否のみ)
function bfsPathDistances(targetX, targetY, unit){
  if(!COST[TYPE[unit.type].cost]) return {};
  var visited = {};
  var queue = [{ x: targetX, y: targetY, d: 0 }];
  visited[targetX+','+targetY] = 0;
  while(queue.length > 0){
    var cur = queue.shift();
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(var di=0; di<dirs.length; di++){
      var nx = cur.x + dirs[di][0];
      var ny = cur.y + dirs[di][1];
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      var c = moveCost(unit.type, M[ny][nx]);
      if(c === Infinity) continue;
      var nd = cur.d + c;
      var key = nx+','+ny;
      if(visited[key] !== undefined && visited[key] <= nd) continue;
      visited[key] = nd;
      queue.push({ x: nx, y: ny, d: nd });
    }
  }
  return visited;
}

// AI: 危険を避けつつ目的地に近づく最良の移動先を計算
// 戻り値: {x, y} または null (移動可能マスなし)
function aiBestMoveTowards(u, targetX, targetY, faction){
  // 陸上ユニット (LAND) なら、自軍の空の輸送船が近くにいるとき、
  // 港・浅瀬は輸送船の動線/搭載ポイントなので避ける (動線確保)
  var uCat = TYPE[u.type].cat;
  var avoidShoalPort = (uCat === 'LAND') && _aiHasEmptyTransportShipNearby(faction, u.x, u.y, 5);
  var movable = computeMovable(u);
  // 目標までの実経路距離 (地形通行コストを考慮) を BFS で計算
  // これによりマンハッタン距離では近いが海などで分断されている目標を正しく評価
  var pathDist = bfsPathDistances(targetX, targetY, u);
  var bestMove = null, bestScore = Infinity;
  for(var mk in movable){
    var mxy = mk.split(',');
    var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
    var blocker = unitAt(mx, my);
    if(blocker && blocker.id !== u.id) continue;
    // スコア: 実経路距離 + 危険度 × ペナルティ係数
    // BFS で到達不能なマス (pathDist 未定義) は Infinity 扱い → 自然と除外される
    var pd = pathDist[mx+','+my];
    var dist = (pd === undefined) ? 9999 : pd;
    var danger = aiComputeDangerScore(faction, mx, my, u);
    var score = dist + danger * 3; // 危険1ダメ = 距離3マス分のペナルティ
    // 輸送船動線確保: 浅瀬・港系マスは輸送船のために空けたい (ペナルティ +5 で他マスを優先)
    if(avoidShoalPort){
      var mTer = M[my][mx];
      if(_isShoalOrPortMass(mTer)){
        // 自分の現在地はOK (動かない場合)、移動先として選ぶのを避ける
        if(!(mx === u.x && my === u.y)){
          score += 5;
        }
      }
    }
    if(score < bestScore){ bestScore = score; bestMove = { x: mx, y: my }; }
  }
  return bestMove;
}

// AI動線確保用: 自軍の空の輸送船 (TRANSPORT_SHIP) が距離range以内にいるかを判定
// 輸送船以外 (輸送ヘリ/機) はここでは対象外 (空中なので港・浅瀬の動線とは無関係)
function _aiHasEmptyTransportShipNearby(faction, x, y, range){
  for(var i=0; i<units.length; i++){
    var v = units[i];
    if(v.owner !== faction || v.hp <= 0) continue;
    if(v.type !== 'TRANSPORT_SHIP') continue;
    if(v.cargo && v.cargo.length > 0) continue; // 既に積載中なら動線確保不要
    if(manhattan(x, y, v.x, v.y) <= range) return true;
  }
  return false;
}

// 浅瀬・港系マスの判定 (輸送船が乗り入れ可能で陸上ユニットも入れる)
function _isShoalOrPortMass(terKey){
  if(terKey === 'SHOAL') return true;
  // 港系: PORT, NAVY_BASE, NAVY_ARSENAL, NAVY_WORKS
  if(terKey === 'PORT' || terKey === 'NAVY_BASE' || terKey === 'NAVY_ARSENAL' || terKey === 'NAVY_WORKS') return true;
  return false;
}

// AI: 降下可能マス一覧 (隣接 4方向で、その cargo タイプの cost が有限、かつユニットがいない)
function aiUnloadableTiles(carrier, cargoType){
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  var result = [];
  // 輸送ユニットの現在マスが降下準備可能でなければ、降下不可
  // (海の只中の輸送船、川の上の輸送ヘリ・輸送機からは降ろせない)
  // 空挺降下兵を載せた輸送機なら、森・山・川の上空からも降下可能
  var isAirTransport = (carrier.type === 'TRANSPORT_PLANE');
  if(!canDeployFrom(M[carrier.y][carrier.x], isAirTransport ? cargoType : null)) return result;
  for(var i=0; i<dirs.length; i++){
    var nx = carrier.x + dirs[i][0], ny = carrier.y + dirs[i][1];
    if(!inBounds(nx, ny)) continue;
    if(unitAt(nx, ny)) continue;
    var ter = M[ny][nx];
    var c = moveCost(cargoType, ter);
    if(c === Infinity) continue;
    result.push({ x: nx, y: ny, ter: ter });
  }
  return result;
}

// AI: 占領できる拠点 (敵 or 中立) のうち、 ある陣営から見て最も近いものを探す
function aiNearestCapturable(faction, fromX, fromY){
  var bestK = null, bestD = Infinity;
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner === faction) continue;
    var xy = k.split(',');
    var d = manhattan(fromX, fromY, parseInt(xy[0]), parseInt(xy[1]));
    if(d < bestD){ bestD = d; bestK = { x: parseInt(xy[0]), y: parseInt(xy[1]), d: d }; }
  }
  return bestK;
}

// AI: 輸送ユニットが「運ぶべき」目標 = 海越え目標 (歩いて行けない拠点) の一覧
// 地続きの拠点は歩兵が自分で歩いて行けるので、輸送する意味がない。
function _aiTransportTargets(aiFaction){
  var all = _aiCaptureTargets(aiFaction);
  var sea = [];
  for(var i=0; i<all.length; i++){ if(!all[i].reachable) sea.push(all[i]); }
  return sea;
}

// AI: 積載中の輸送ユニットの「接岸(降下)計画」を立てる
// 海越え目標それぞれについて、
//   ・輸送ユニット自身が航行して到達できる
//   ・そこから降車できる (canDeployFrom)
//   ・隣接マスから cargo が目標まで歩いて行ける
// を満たす海岸マスを探し、(航行距離 + 上陸後の徒歩距離×3) が最小の組を返す。
// 戻り値: { target:{x,y,...}, land:{x,y}, landDist:{"x,y":徒歩距離} } または null
function _aiTransportLandingPlan(u, aiFaction, cargoType){
  var seaTargets = _aiTransportTargets(aiFaction);
  if(seaTargets.length === 0) return null;
  var shipDist = bfsPathDistances(u.x, u.y, u); // 輸送ユニットが到達できる範囲
  var cargoProbe = { type: cargoType };
  var isAirT = (u.type === 'TRANSPORT_PLANE');
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  var best = null;
  for(var ti=0; ti<seaTargets.length; ti++){
    var T = seaTargets[ti];
    // cargo が目標 T まで歩ける範囲 (T からの経路距離)
    var landDist = bfsPathDistances(T.x, T.y, cargoProbe);
    for(var sy=0; sy<H; sy++){
      for(var sx=0; sx<W; sx++){
        var key = sx+','+sy;
        var sd = shipDist[key];
        if(sd === undefined) continue;                                   // 輸送ユニットが行けない
        if(!canDeployFrom(M[sy][sx], isAirT ? cargoType : null)) continue; // ここからは降ろせない
        // 隣接マスのうち「目標まで歩ける」最短のものを探す
        var bestWalk = Infinity;
        for(var di=0; di<dirs.length; di++){
          var nx = sx + dirs[di][0], ny = sy + dirs[di][1];
          if(nx<0||ny<0||nx>=W||ny>=H) continue;
          var wd = landDist[nx+','+ny];
          if(wd === undefined) continue;
          if(wd < bestWalk) bestWalk = wd;
        }
        if(bestWalk === Infinity) continue; // 降ろしても目標へ歩いて行けない岸
        // 航行距離より「上陸後の徒歩距離」を重く見る (目標の近くに上陸させたい)
        var score = sd + bestWalk * 3;
        if(!best || score < best.score){
          best = { score: score, target: T, land: { x: sx, y: sy }, landDist: landDist };
        }
      }
    }
  }
  return best;
}

// AI: 輸送ユニットの行動を試みる。成功したら true (このユニットの行動完了)
function aiTransportAction(u, aiFaction){
  var t = TYPE[u.type];
  if(!t.capacity || !isLandTransport(u.type)) return false;
  // 1. 既に積載中なら、敵拠点近くまで運んで降ろす
  if(u.cargo && u.cargo.length > 0){
    if(window.AI_DEBUG) try{ console.log('  → 輸送 cargo='+u.cargo.length+' 降車地点を探す'); }catch(e){}
    // === 行き先の決定 ===
    // 【修正1】運ぶ先は「海越え目標 (歩いて行けない拠点)」に限定する。
    //   従来は aiNearestCapturable (直線距離で最寄りの未占領拠点) を使っていたため、
    //   歩兵が歩いて行ける自陣側の拠点へ運んでしまい、敵地へ渡らなかった。
    // 【修正2】接岸地点は「占領目標の真隣」に限らず、
    //   「そこから cargo が目標まで歩いて行ける海岸マス」全体から選ぶ。
    var capCargoType = (u.cargo[0] && u.cargo[0].type) ? u.cargo[0].type : 'INFANTRY';
    var landPlan = _aiTransportLandingPlan(u, aiFaction, capCargoType);
    var nearestCap, moveGoal, planLandDist = null;
    if(landPlan){
      nearestCap = landPlan.target;
      moveGoal = landPlan.land;
      planLandDist = landPlan.landDist;
      if(window.AI_DEBUG) try{ console.log('    海越え目標=('+nearestCap.x+','+nearestCap.y+') 接岸地点=('+moveGoal.x+','+moveGoal.y+')'); }catch(e){}
    } else {
      // 海越え目標が無い / 接岸できる海岸が無い → 従来動作 (最寄り拠点へ運ぶ)
      nearestCap = aiNearestCapturable(aiFaction, u.x, u.y);
      if(!nearestCap){ u.acted = true; return true; }
      moveGoal = { x: nearestCap.x, y: nearestCap.y };
      if(window.AI_DEBUG) try{ console.log('    接岸計画なし → 最寄り拠点=('+nearestCap.x+','+nearestCap.y+')'); }catch(e){}
    }

    // 危険を避けつつ目標に近づく
    var bestMove = aiBestMoveTowards(u, moveGoal.x, moveGoal.y, aiFaction);
    if(bestMove){
      if(window.AI_DEBUG) try{ console.log('    輸送船MOVE→('+bestMove.x+','+bestMove.y+')'); }catch(e){}
      var aiMoveR1 = executeMoveWithAmbushCheck(u, bestMove.x, bestMove.y);
      if(window.AI_DEBUG && aiMoveR1.stoppedEarly) try{ console.log('    伏兵察知で早期停止 (target=('+aiMoveR1.targetX+','+aiMoveR1.targetY+'), 実際=('+aiMoveR1.toX+','+aiMoveR1.toY+'))'); }catch(e){}
    }
    // 移動後、降ろせるなら降ろす
    // 仕様書セクション10: 空挺降下兵の降下地点は占領目標 A 隣接の防御値が高いマスを選ぶ
    // 通常歩兵も「占領目標に近い + 防御値高い」マスを優先する (生存性向上)
    var unloaded = false;
    for(var ci = u.cargo.length - 1; ci >= 0; ci--){
      var cg = u.cargo[ci];
      var tiles = aiUnloadableTiles(u, cg.type);
      // 【修正2】途中の自陣側の海岸で降ろしてしまわないようにする。
      //   降車先は「そこから目標まで歩いて行けるマス」だけに限定する。
      //   海越え目標なので、歩いて到達できる = 目的地側の岸に着いている、と判定できる。
      var walkDist = null;
      if(landPlan){
        walkDist = (cg.type === capCargoType) ? planLandDist
                 : bfsPathDistances(nearestCap.x, nearestCap.y, { type: cg.type });
        var reachTiles = [];
        for(var fi=0; fi<tiles.length; fi++){
          if(walkDist[tiles[fi].x+','+tiles[fi].y] !== undefined) reachTiles.push(tiles[fi]);
        }
        tiles = reachTiles;
      }
      // スコア計算: 占領目標までの距離 (近いほど優先) + 防御値 (高いほど優先)
      // 占領担当ユニット系は距離も防御も重要 (生存して占領を完遂するため)
      // 仕様書: 山(def 4) > 森(def 3) > 都市/施設(def 1〜) > 平地(def 0)
      var wd = walkDist;
      tiles.sort(function(a, b){
        var dA = wd ? wd[a.x+','+a.y] : manhattan(a.x, a.y, nearestCap.x, nearestCap.y);
        var dB = wd ? wd[b.x+','+b.y] : manhattan(b.x, b.y, nearestCap.x, nearestCap.y);
        var defA = (TER[a.ter] && TER[a.ter].def) || 0;
        var defB = (TER[b.ter] && TER[b.ter].def) || 0;
        // 川マスは無防備 (def0) で、しかも橋を架けるべき場所を塞ぐので強く避ける。
        // 他に降車先が無ければ最後の手段として選ばれる (大きな加点で最後尾へ)。
        var rivA = (a.ter === 'RIVER') ? 1000 : 0;
        var rivB = (b.ter === 'RIVER') ? 1000 : 0;
        // スコア: 距離 × 10 - 防御値 (+ 川ペナルティ) (小さい方が優先)
        // 距離 1 マス差 = 防御 10 ポイント分の重み
        var scA = dA * 10 - defA + rivA;
        var scB = dB * 10 - defB + rivB;
        return scA - scB;
      });
      if(tiles.length > 0){
        if(window.AI_DEBUG) try{ console.log('    UNLOAD '+cg.type+'→('+tiles[0].x+','+tiles[0].y+') (ter='+tiles[0].ter+' def='+((TER[tiles[0].ter]&&TER[tiles[0].ter].def)||0)+')'); }catch(e){}
        aiUnload(u, ci, tiles[0].x, tiles[0].y);
        unloaded = true;
      }
    }
    u.acted = true;
    return true;
  }
  // 2. 未積載: 自軍領内の運べるユニットを拾いに行く
  // canCarry に基づいてピックアップ対象を選ぶ:
  //  輸送船 (canCarry='LAND'): 全陸ユニット (キャタピラ・装輪・歩兵すべて)
  //  輸送ヘリ (canCarry=Array): 占領可能歩兵系のみ
  //  輸送機 (canCarry=Array): 装輪車両・歩兵・砲兵系・空挺など
  // 仕様書セクション9: 占領担当を持つ歩兵を運ぶのが主体 (海越え目標があれば)
  // 仕様書セクション4(段階A): 工兵も海越え廃墟再建のため輸送対象に含める
  // 優先順位:
  //   第1: 占領担当ユニット (canCapture) - 仕様書「占領目標を持つ歩兵を運ぶ」
  //   第2: 戦闘ユニット (track > wheel > inf) - 上陸戦力として
  var canCarryTypes = Array.isArray(t.canCarry) ? t.canCarry : null;
  var pickupTarget = null, pickupDist = Infinity, pickupMeet = null;
  // 【修正3】海越え目標が無いなら拾いに行かない (運ぶ必要が無いのに積み込むのを防ぐ)
  var wantPickup = (_aiTransportTargets(aiFaction).length > 0);
  // 【修正3】合流可能性の判定用: 輸送ユニット自身が航行して到達できるマス一覧
  var shipReach = wantPickup ? bfsPathDistances(u.x, u.y, u) : {};
  if(!wantPickup && window.AI_DEBUG) try{ console.log('  → 輸送 海越え目標なし: 拾いに行かない'); }catch(e){}
  for(var i=0; wantPickup && i<units.length; i++){
    var c = units[i];
    if(c.owner !== aiFaction || c.hp <= 0) continue;
    if(c.id === u.id) continue;
    // 運べるかチェック
    if(canCarryTypes){
      // 配列指定: 含まれる type のみ
      if(canCarryTypes.indexOf(c.type) < 0) continue;
    } else if(t.canCarry === 'LAND'){
      // 全陸ユニット (LAND cat)
      if(TYPE[c.type].cat !== 'LAND') continue;
      // ただし輸送ユニット自身は除く (輸送船で輸送船を運ばない)
      if(isLandTransport(c.type)) continue;
    } else {
      continue;
    }
    // 優先順位: 占領担当を最優先 (canCapture)、その後 track > wheel > inf
    // 同距離なら占領担当 > 大型重火力 (海越え目標を運ぶ主目的)
    // 【修正3】合流できる相手だけを対象にする。
    //   従来は直線距離で最寄りの味方を選んでいたため、内陸や別の島の味方を選んでしまい、
    //   永久に合流できずその場でうろうろしていた。
    //   輸送ユニットが「相手のマス」か「相手の隣接マス」まで航行できることを条件にする。
    var meet = null, meetD = Infinity;
    if(shipReach[c.x+','+c.y] !== undefined){ meetD = shipReach[c.x+','+c.y]; meet = { x: c.x, y: c.y }; }
    var mdirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(var mi=0; mi<mdirs.length; mi++){
      var mx2 = c.x + mdirs[mi][0], my2 = c.y + mdirs[mi][1];
      if(mx2<0||my2<0||mx2>=W||my2>=H) continue;
      var md = shipReach[mx2+','+my2];
      if(md === undefined) continue;
      if(md < meetD){ meetD = md; meet = { x: mx2, y: my2 }; }
    }
    if(!meet) continue; // 内陸 / 別の島 → 合流できないので対象外
    var d = meetD;
    var landCat = _aiLandTransportCat(c.type);
    var catPriority;
    if(TYPE[c.type].canCapture) catPriority = -1; // 占領担当最優先 (海越え目標を運ぶ役割)
    else if(landCat === 'track') catPriority = 0;  // キャタピラ
    else if(landCat === 'wheel') catPriority = 1;  // 装輪
    else if(landCat === 'inf') catPriority = 2;    // 重歩兵(占領不可)
    else catPriority = 3;                          // それ以外
    var score = d + catPriority * 0.5; // 1カテゴリ差 = 0.5マス分の優先差
    if(score < pickupDist){ pickupDist = score; pickupTarget = c; pickupMeet = meet; }
  }
  if(pickupTarget){
    if(window.AI_DEBUG) try{ console.log('  → 輸送 pickupTarget='+pickupTarget.type+'@('+pickupTarget.x+','+pickupTarget.y+') dist='+pickupDist); }catch(e){}
    // 拾いに行く: 移動先の最有力候補は pickupTarget の位置 (= 同マスに行けば搭載成立)
    var movable = computeMovable(u);
    // pickupTarget マス自体に行けるか?
    var targetKey = pickupTarget.x + ',' + pickupTarget.y;
    if(setHas(movable, targetKey)){
      // 同マスに移動 → 搭載成立
      if(window.AI_DEBUG) try{ console.log('    LOAD: 同マスに移動して搭載'); }catch(e){}
      var fromX = u.x, fromY = u.y;
      u.x = pickupTarget.x; u.y = pickupTarget.y;
      u.preMoveX = fromX; u.preMoveY = fromY;
      consumeFuelForMove(u, fromX, fromY);
      // pickupTarget を u.cargo に追加 (fuel/ammoも保存)
      var cargoEntryT = {
        type: pickupTarget.type,
        hp: pickupTarget.hp,
        owner: pickupTarget.owner,
        originalId: pickupTarget.id,
        fuel: pickupTarget.fuel,
        ammo: pickupTarget.ammo ? pickupTarget.ammo.slice() : null,
        cargo: pickupTarget.cargo ? pickupTarget.cargo.slice() : [],
        loadedRound: roundNumber
      };
      // 空母系なら乗艦時補給
      var fakeT = { type: cargoEntryT.type, fuel: cargoEntryT.fuel, ammo: cargoEntryT.ammo ? cargoEntryT.ammo.slice() : null };
      carrierResupplyOnLoad(u, fakeT);
      cargoEntryT.fuel = fakeT.fuel; cargoEntryT.ammo = fakeT.ammo;
      u.cargo.push(cargoEntryT);
      units = units.filter(function(uu){ return uu.id !== pickupTarget.id; });
      u.acted = true;
      return true;
    }
    // 同マスに行けないなら、危険を避けつつ近づく
    // ただし距離1 (隣接) で対象が canCapture (= 歩兵側が乗りに来る) なら、動かずに待機 (合流させる)
    var isAdjPickup = (manhattan(u.x, u.y, pickupTarget.x, pickupTarget.y) === 1);
    if(isAdjPickup && TYPE[pickupTarget.type].canCapture){
      if(window.AI_DEBUG) try{ console.log('    輸送 隣接歩兵を待機: '+pickupTarget.type+'@('+pickupTarget.x+','+pickupTarget.y+') が乗ってくるのを待つ'); }catch(e){}
      u.acted = true;
      return true;
    }
    // 【修正3】相手のマスではなく「合流点」を目指す (相手が内陸寄りでも岸まで行ける)
    var meetGoal = pickupMeet || { x: pickupTarget.x, y: pickupTarget.y };
    var bestMove = aiBestMoveTowards(u, meetGoal.x, meetGoal.y, aiFaction);
    if(bestMove){
      if(window.AI_DEBUG) try{ console.log('    輸送船 MOVE→('+bestMove.x+','+bestMove.y+') (合流点('+meetGoal.x+','+meetGoal.y+')へ)'); }catch(e){}
      var aiMoveR1 = executeMoveWithAmbushCheck(u, bestMove.x, bestMove.y);
      if(window.AI_DEBUG && aiMoveR1.stoppedEarly) try{ console.log('    伏兵察知で早期停止 (target=('+aiMoveR1.targetX+','+aiMoveR1.targetY+'), 実際=('+aiMoveR1.toX+','+aiMoveR1.toY+'))'); }catch(e){}
    } else {
      if(window.AI_DEBUG) try{ console.log('    輸送船 移動先見つからず'); }catch(e){}
    }
    u.acted = true;
    return true;
  }
  if(window.AI_DEBUG) try{ console.log('  → 輸送 拾う対象なし'); }catch(e){}
  // 拾う対象もない: 自軍の生産施設マスまたは修理可能施設に戻る (詰まり防止)
  // - 既に施設マス上なら待機
  // - そうでないなら最寄り基地に向かう
  var curCap = captures[u.x+','+u.y];
  var curTer = TER[M[u.y][u.x]];
  if(curCap && curCap.owner === aiFaction && curTer && curTer.heal
     && (!curTer.healCat || curTer.healCat === t.cat)){
    // 既に基地上 → 待機
    if(window.AI_DEBUG) try{ console.log('  → 輸送 既に基地上、待機'); }catch(e){}
    u.acted = true;
    return true;
  }
  // 最寄りの基地 (修理可能施設) へ向かう
  var transportBase = _aiFindNearestRepairPoint(u, aiFaction);
  if(transportBase){
    if(window.AI_DEBUG) try{ console.log('  → 輸送 基地へ帰投: ('+transportBase.x+','+transportBase.y+')'); }catch(e){}
    var bestBaseMove = aiBestMoveTowards(u, transportBase.x, transportBase.y, aiFaction);
    if(bestBaseMove && (bestBaseMove.x !== u.x || bestBaseMove.y !== u.y)){
      executeMoveWithAmbushCheck(u, bestBaseMove.x, bestBaseMove.y);
    }
    u.acted = true;
    return true;
  }
  // 基地もない → 待機
  return false;
}

// AI: 偵察ユニットかどうか判定 (仕様書セクション11)
// 対象: 偵察車・偵察機・索敵機・観測機・対潜哨戒機
function _aiIsScoutUnit(unitType){
  var SCOUT_TYPES = {
    SCOUT: true, RECON_PLANE: true, SCOUT_PLANE: true,
    OBSERVER_PLANE: true, ASW_PLANE: true
  };
  return !!SCOUT_TYPES[unitType];
}

// AI: 偵察ユニットの行動 (仕様書セクション11)
// 1. 偵察対象を選ぶ (歩兵の占領目標 > 自軍占領下にない施設)
// 2. 対象が視界範囲内に入る位置を選ぶ
// 3. その範囲内で最も防御力の高いマスへ移動
// 4. 既に対象が視界内なら動かない (燃料節約)
// 5. 戦闘しない
function aiScoutAction(u, aiFaction){
  if(!_aiIsScoutUnit(u.type)) return false;
  var t = TYPE[u.type];
  var sight = t.sight || 2;

  // === [1] 偵察対象の選定 ===
  // 優先1: 歩兵が向かっている占領目標
  // 優先2: 自軍占領下にない施設 (中立・敵施設)
  var scoutTargets = [];

  // 自軍歩兵 (占領担当) の目標を収集
  // 各歩兵について「最も近い占領目標」を求めて、それを偵察対象に追加
  var infantryGoals = [];
  for(var ii=0; ii<units.length; ii++){
    var iu = units[ii];
    if(iu.owner !== aiFaction || iu.hp <= 0) continue;
    if(!TYPE[iu.type].canCapture) continue;
    // 各歩兵について最寄りの占領目標を見つける
    var capTargets = _aiCaptureTargets(aiFaction);
    var nearestGoal = null, nearestGoalD = Infinity;
    for(var ct=0; ct<capTargets.length; ct++){
      var ctg = capTargets[ct];
      // 工兵以外は廃墟をスキップ (占領できない)
      if(ctg.isRuins && !TYPE[iu.type].isEngineer) continue;
      var dG = manhattan(iu.x, iu.y, ctg.x, ctg.y);
      if(dG < nearestGoalD){ nearestGoalD = dG; nearestGoal = ctg; }
    }
    if(nearestGoal){
      infantryGoals.push({ x: nearestGoal.x, y: nearestGoal.y, priority: 1 });
    }
  }

  // 自軍占領下にない施設 (中立・敵)
  var unCapturedFacilities = [];
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner === aiFaction) continue;
    if(isAlly(cap.owner, aiFaction)) continue;
    var xy = k.split(',');
    var fx = parseInt(xy[0]), fy = parseInt(xy[1]);
    var ter = TER[M[fy][fx]];
    if(!ter || !ter.capturable) continue;
    unCapturedFacilities.push({ x: fx, y: fy, priority: 2 });
  }

  scoutTargets = infantryGoals.concat(unCapturedFacilities);
  if(scoutTargets.length === 0){
    if(window.AI_DEBUG) try{ console.log('  → 偵察 対象なし、待機'); }catch(e){}
    u.acted = true;
    return true;
  }

  // === [2] 自分から最も近い偵察対象を選ぶ ===
  var myTarget = null, myTargetD = Infinity;
  var myTargetPriority = 99;
  for(var st=0; st<scoutTargets.length; st++){
    var sg = scoutTargets[st];
    var sd = manhattan(u.x, u.y, sg.x, sg.y);
    // 優先1 > 優先2 (歩兵目標 > 未占領施設)
    var score = sg.priority * 100 + sd;
    if(score < myTargetPriority * 100 + myTargetD){
      myTargetPriority = sg.priority;
      myTargetD = sd;
      myTarget = sg;
    }
  }
  if(!myTarget){
    u.acted = true;
    return true;
  }

  // === [3] 既に視界内なら動かない (燃料節約) ===
  // myTarget が現在地から視界範囲内にあるか
  if(manhattan(u.x, u.y, myTarget.x, myTarget.y) <= sight){
    // 視界内にすでに対象が入っている → 動かない
    if(window.AI_DEBUG) try{ console.log('  → 偵察 既に視界内、待機 target=('+myTarget.x+','+myTarget.y+')'); }catch(e){}
    u.acted = true;
    return true;
  }

  // === [4] 視界端に敵を見つけたら前進停止 ===
  // 現在地で見える敵を探す (前進すると危険な状況か)
  var seesEnemy = false;
  for(var ei=0; ei<units.length; ei++){
    var ev = units[ei];
    if(isAlly(ev.owner, aiFaction) || ev.owner === 'N' || ev.hp <= 0) continue;
    if(!isUnitVisibleTo(ev, aiFaction)) continue;
    var dEv = manhattan(u.x, u.y, ev.x, ev.y);
    // 自分の視界範囲内に敵が見えている = 偵察の役目を果たしている
    if(dEv <= sight){ seesEnemy = true; break; }
  }
  if(seesEnemy){
    if(window.AI_DEBUG) try{ console.log('  → 偵察 視界内に敵発見、前進停止 待機'); }catch(e){}
    u.acted = true;
    return true;
  }

  // === [5] 視界範囲内に対象が入る位置 + 防御値最大のマスへ移動 ===
  // 移動可能なマスのうち、myTarget が視界範囲内に入るマスを選ぶ
  // 同条件なら防御値最大、それも同じなら myTarget に近い順
  var movable = computeMovable(u);
  var bestMove = null, bestScore = -Infinity;
  for(var mk in movable){
    var xy2 = mk.split(',');
    var mx = parseInt(xy2[0]), my = parseInt(xy2[1]);
    var blocker = unitAt(mx, my);
    if(blocker && blocker.id !== u.id) continue;
    // このマスから myTarget が視界内に入るか
    var distToTarget = manhattan(mx, my, myTarget.x, myTarget.y);
    var inSight = (distToTarget <= sight);
    // 地形防御値
    var def = _aiTerrainDefAt(u, mx, my);
    // スコア: 視界内に入るマス + 防御値高い + 対象に近い
    // 視界内に入るマスを最優先 (大ボーナス +1000)
    var score = 0;
    if(inSight) score += 1000;
    score += def * 10;
    // 対象に近いほどボーナス (視界に入らない場合の保険)
    score -= distToTarget;
    if(score > bestScore){ bestScore = score; bestMove = { x: mx, y: my }; }
  }
  if(bestMove && (bestMove.x !== u.x || bestMove.y !== u.y)){
    if(window.AI_DEBUG) try{ console.log('  → 偵察 MOVE→('+bestMove.x+','+bestMove.y+') target=('+myTarget.x+','+myTarget.y+')'); }catch(e){}
    executeMoveWithAmbushCheck(u, bestMove.x, bestMove.y);
  }
  u.acted = true;
  return true;
}

// AI: 補給系ユニットの行動 (補給車・給油艦・空中給油機)
function aiSupplyAction(u, aiFaction){
  var t = TYPE[u.type];
  if(!t.isSupply) return false;

  // === 仕様書セクション8 補給ユニットの行動 ===

  // [0] 自身の補給庫が空 → 自軍施設へ帰投
  // 燃料補給ユニット (supplyFuel:true) は燃料庫 (supplyFuelMax) を消費する
  // 弾薬補給ユニット (supplyAmmo:true) は弾薬庫 (supplyAmmoMax) を消費する
  // ※ 在庫はユニット側の u.supplyFuelCount / u.supplyAmmoCount で管理されている
  //    (makeUnit / applyTurnStart の 0c で初期化。なければ満タン扱い)
  //    以前は存在しない u.supplyFuel / u.supplyAmmo を見ていたため、在庫が空でも
  //    常に「満タン」と判定され、補給ユニットが補充のために帰投しなかった。
  var supplyOut = false;
  if(t.supplyFuel && t.supplyFuelMax){
    var sfNow = (typeof u.supplyFuelCount === 'number') ? u.supplyFuelCount : t.supplyFuelMax;
    if(sfNow <= 0) supplyOut = true;
  }
  if(t.supplyAmmo && t.supplyAmmoMax){
    var saNow = (typeof u.supplyAmmoCount === 'number') ? u.supplyAmmoCount : t.supplyAmmoMax;
    if(saNow <= 0) supplyOut = true;
  }
  if(supplyOut){
    if(window.AI_DEBUG) try{ console.log('  → supply: 補給庫空、自軍施設へ帰投'); }catch(e){}
    var returned = _aiMoveToSupplyPoint(u, aiFaction, 'fuel');
    if(returned){
      u.acted = true;
      return true;
    }
    // 帰投先見つからず → 通常フローへ
  }

  // [1] 補給対象の候補を集める (メイン武器空 or 燃料不足)
  var candidates = [];
  for(var i=0; i<units.length; i++){
    var c = units[i];
    if(c.owner !== aiFaction || c.hp <= 0) continue;
    if(c.id === u.id) continue;
    if(!_supplyTargetMatches(t, c)) continue;
    var cT = TYPE[c.type];
    var needSupply = false;
