function doRepair(){
  if(!pendingUnit) return;
  var u = pendingUnit;
  var capObj = captures[u.x+','+u.y];
  if(!capObj) return;
  if(!capObj.cargo) capObj.cargo = [];
  // ユニットを施設のcargoに収容(cargoの中身も保持)
  capObj.cargo.push({
    type: u.type,
    hp: u.hp,
    owner: u.owner,
    cargo: u.cargo ? u.cargo.slice() : [],
    // 段階2: 取り出し時の補給を施設の備蓄から払うため、収容時の燃料・弾薬を記録する
    fuel: u.fuel,
    ammo: u.ammo ? u.ammo.slice() : null,
    // 補給ユニットの積載庫も記録する (記録しないと取り出し時に満タンで湧いてしまう)
    supplyFuelCount: u.supplyFuelCount,
    supplyAmmoCount: u.supplyAmmoCount,
    storedRound: roundNumber // 格納したラウンドを記録 (このラウンドの間は取り出せない)
  });
  // unitsから削除
  units = units.filter(function(uu){ return uu.id !== u.id; });
  setStatus(TYPE[u.type].name + 'を修理スロットに収容しました (次のターンから取り出し可能)');
  pendingUnit = null;
  hideCommandPanel();
  afterAction();
}

// 施設攻撃可能なマスを計算 (敵施設で射程内、間接武器で弾あり)
function computeFacilityAttackable(unit, fromX, fromY){
  var set = {};
  var hasAny = false;
  var t = TYPE[unit.type];
  // 各武器の射程 (vsFacility > 0 かつ弾薬残のある武器のみ集計、天候の射程ペナルティを反映)
  var maxR = 0, minR = Infinity;
  var hasUsableWeapon = false;
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(!w.vsFacility || w.vsFacility <= 0) continue; // 対施設火力ない武器はスキップ
    if(unit.ammo && !hasAmmoForWeapon(unit, i)) continue; // 弾切れはスキップ
    var rng = getEffectiveRange(unit, w);
    if(rng[1] > maxR) maxR = rng[1];
    if(rng[0] < minR) minR = rng[0];
    hasUsableWeapon = true;
  }
  if(!hasUsableWeapon || maxR === 0) return { set: set, hasAny: false };
  for(var dy=-maxR; dy<=maxR; dy++){
    for(var dx=-maxR; dx<=maxR; dx++){
      var md = Math.abs(dx) + Math.abs(dy);
      if(md < minR || md > maxR) continue;
      var nx = fromX + dx, ny = fromY + dy;
      if(!inBounds(nx, ny)) continue;
      var ter = TER[M[ny][nx]];
      // 線路・鉄橋・橋は所有者が無いので、耐久が残っていれば誰でも叩ける
      if(ter && ter.buildHpMax){
        setAdd(set, nx+','+ny);
        hasAny = true;
        continue;
      }
      var capObj = captures[nx+','+ny];
      if(!capObj) continue;
      if(capObj.owner === unit.owner || capObj.owner === 'N') continue; // 自軍・中立は攻撃しない
      if(ter.isRuins) continue; // 廃墟は攻撃対象外
      setAdd(set, nx+','+ny);
      hasAny = true;
    }
  }
  return { set: set, hasAny: hasAny };
}

function enterFacilityAttackMode(){
  if(!pendingUnit) return;
  facilityAttackMode = true;
  var r = computeFacilityAttackable(pendingUnit, pendingUnit.x, pendingUnit.y);
  facilityAttackableSet = r.set;
  setStatus('施設攻撃: オレンジマスから対象を選んでください');
  var btnWrap = document.getElementById('command-buttons');
  btnWrap.innerHTML = '';
  var b = document.createElement('button');
  b.textContent = 'キャンセル';
  b.style.fontSize = '13px';
  b.onclick = function(e){ e.stopPropagation(); exitFacilityAttackMode(); };
  btnWrap.appendChild(b);
  render();
}

function exitFacilityAttackMode(){
  facilityAttackMode = false;
  facilityAttackableSet = {};
  if(pendingUnit) showCommandPanel(pendingUnit, pendingJustMoved);
}

function executeFacilityAttack(x, y){
  if(!pendingUnit) return;
  var capObj = captures[x+','+y];
  var terHere0 = TER[M[y][x]];
  // 線路・鉄橋・橋は施設HPではなく「耐久」を削る
  if(terHere0 && terHere0.buildHpMax){ executeRailAttack(x, y); return; }
  if(!capObj) return;
  // 主砲(間接)で攻撃。対施設ダメージは「対歩兵」値を流用、ただし施設に対しては防御無視・装甲無視で素のダメージ
  // 適切な武器を選択(間接武器で弾ありで最大ダメージ)
  var t = TYPE[pendingUnit.type];
  var bestW = null, bestDmg = 0, bestIdx = -1;
  // 標的施設の地形防御値 (def 値)
  var targetTer = TER[M[y][x]];
  var targetDef = targetTer.def || 0;
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(!w.vsFacility || w.vsFacility <= 0) continue; // 対施設火力ない武器はスキップ
    if(pendingUnit.ammo && !hasAmmoForWeapon(pendingUnit, i)) continue; // 弾切れはスキップ
    // 距離チェック (射程内か)
    var dist = manhattan(pendingUnit.x, pendingUnit.y, x, y);
    var rng = getEffectiveRange(pendingUnit, w);
    if(dist < rng[0] || dist > rng[1]) continue;
    // 対施設ダメージ = vsFacility × HP/10 - 地形防御 (最低0)
    var eff = Math.round(w.vsFacility * pendingUnit.hp / HP_MAX);
    var dmg = Math.max(0, eff - targetDef);
    if(dmg > bestDmg){ bestDmg = dmg; bestW = w; bestIdx = i; }
  }
  if(!bestW){ exitFacilityAttackMode(); return; }
  // 弾薬消費
  if(bestIdx >= 0) consumeAmmoForAttack(pendingUnit, bestIdx);
  // 施設HPを削る
  capObj.hp = Math.max(0, capObj.hp - bestDmg);
  setStatus(TYPE[pendingUnit.type].name + '['+bestW.name+'] → 施設に '+bestDmg+'ダメ (施設HP '+capObj.hp+')');
  // ログ (プレイヤーのみ)
  if(pendingUnit.owner === 'P' && window.plog){
    var terN = TER[M[y][x]];
    plog('施設攻撃 ' + TYPE[pendingUnit.type].name + '@('+pendingUnit.x+','+pendingUnit.y+') → ' + (terN?terN.name:'?') + '@('+x+','+y+') ['+bestW.name+'] '+bestDmg+'ダメ (施設HP'+capObj.hp+')');
  }
  // 施設HP0でダウングレード
  if(capObj.hp <= 0){
    var oldTer = M[y][x];
    var newTer = DOWNGRADE_MAP[oldTer];
    if(newTer){
      M[y][x] = newTer;
      capObj.terKey = newTer;
      // 廃墟になった場合は所有者中立化、施設HPは0、占領HPは満タン
      var newTerObj = TER[newTer];
      if(newTerObj.isRuins){
        capObj.owner = 'N';
        capObj.cargo = [];
        // 廃墟関連の生産も破棄
        production = production.filter(function(p){ return !(p.x === x && p.y === y); });
        capObj.hp = 0; // 施設HPは0 (再建で回復させる)
        capObj.captureHp = newTerObj.capCaptureHp || newTerObj.capHpMax || CAP_MAX; // 占領HPは満タン
      } else {
        capObj.hp = newTerObj.capHpMax || CAP_MAX;
        capObj.captureHp = newTerObj.capCaptureHp || newTerObj.capHpMax || CAP_MAX;
      }
      setStatus(setStatus_msg = TYPE[pendingUnit.type].name + '[' + bestW.name + '] → 施設破壊!' + (newTerObj.isRuins ? ' (廃墟化)' : ' (' + newTerObj.name + 'にダウングレード)'));
    }
  }
  pendingUnit.acted = true;
  pendingUnit = null;
  facilityAttackMode = false;
  facilityAttackableSet = {};
  hideCommandPanel();
  afterAction();
}

// 工兵: 廃墟再建
// 工兵の表示HP分だけ施設HPを回復。施設HPが20になったら中立施設に変化
// コスト: 表示HP × 150G (例: HP10満タン工兵 → 1500Gで +10回復)
function doRebuild(){
  if(!pendingUnit) return;
  var u = pendingUnit;
  var ter = TER[M[u.y][u.x]];
  if(!ter.isRuins) return;
  var capObj = captures[u.x+','+u.y];
  if(!capObj) return;
  // 廃墟タイプ→中立化後タイプ (段階1施設)
  var rebuildMap = {
    RUINS_CITY: 'CITY',
    RUINS_FACTORY: 'FACTORY',
    RUINS_AIRPORT: 'AIRPORT',
    RUINS_PORT: 'PORT'
  };
  var newTerKey = rebuildMap[M[u.y][u.x]];
  if(!newTerKey) return;
  // 工兵の表示HP分だけ施設HPを回復
  var dHP = displayHP(u.hp); // 1-10
  var cost = dHP * 150;
  if((funds[u.owner]||0) < cost){
    setStatus('再建コスト ' + cost + 'Gが足りません');
    return;
  }
  funds[u.owner] -= cost;
  var maxHp = ter.capHpMax || 20;
  var prevHp = capObj.hp;
  capObj.hp = Math.min(maxHp, capObj.hp + dHP);
  // 満タンになったら中立施設に変化
  if(capObj.hp >= maxHp){
    M[u.y][u.x] = newTerKey;
    capObj.terKey = newTerKey;
    var newTerObj = TER[newTerKey];
    capObj.hp = newTerObj.capHpMax || CAP_MAX;
    capObj.captureHp = newTerObj.capCaptureHp || newTerObj.capHpMax || CAP_MAX;
    capObj.owner = 'N'; // 中立化 (改めて占領が必要)
    setStatus('再建完了: ' + TER[newTerKey].name + ' (中立化、改めて占領必要)');
  } else {
    setStatus(TYPE[u.type].name + 'が再建中: 施設HP ' + capObj.hp + '/' + maxHp + ' (コスト' + cost + ')');
  }
  u.acted = true;
  pendingUnit = null;
  hideCommandPanel();
  afterAction();
}

// 工兵: 施設HP修復(自軍施設マス上で実行)
function doRepairFacility(){
  if(!pendingUnit) return;
  var u = pendingUnit;
  var capObj = captures[u.x+','+u.y];
  var ter = TER[M[u.y][u.x]];
  if(!capObj || capObj.owner !== u.owner) return;
  var maxHp = ter.capHpMax || CAP_MAX;
  if(capObj.hp >= maxHp) return;
  // 修復コスト(仮: 1HP当たり50G)
  var heal = Math.min(5, maxHp - capObj.hp); // 1ターンで最大+5
  var cost = heal * 50;
  if(funds.P < cost){
    // 部分的な回復(資金で買える分)
    heal = Math.floor(funds.P / 50);
    cost = heal * 50;
    if(heal === 0){
      setStatus('修復資金が足りません');
      return;
    }
  }
  funds.P -= cost;
  capObj.hp = Math.min(maxHp, capObj.hp + heal);
  setStatus('施設修復: +' + heal + ' (-'+cost+'G)');
  u.acted = true;
  pendingUnit = null;
  hideCommandPanel();
  afterAction();
}

// 工兵: 橋建設(隣接の川マスを道路に変換)
// ===== 線路の耐久 =====
// 耐久は 0〜30 のひとつの数値で管理する
//   10以上 → 線路・鉄橋 (列車が走れる)
//   1〜9   → 路盤・橋脚 (レールが載っていない状態。列車は走れない)
//   0      → 建設前の地形に戻る (橋のみ。線路は路盤で止まる)
// 工兵の工事は「工兵の表示HP分」だけ耐久を上げるので、HP9以上の工兵なら
// 路盤(1)を一度で線路(10)にできる。
// 橋の建設は着手するだけで耐久1。1ターンで完成するのは不自然なので、
// 工兵が工事を重ねて 10 (通行できる) → 30 (頑丈) と育てていく。
var RAIL_HP_MAX = 30;      // 耐久の上限 (工兵が工事を重ねて積み上げる)
var RAIL_BUILD_HP = 1;     // 建設に着手した直後の耐久 (まだ通行できない)
var RAIL_OK_HP = 10;       // これ以上なら線路として使える
var RAIL_RUINED_HP = 1;    // 線路が壊れて廃線になったときの耐久

// 完成形 ⇔ 未完成形 の対応。線路・鉄橋・橋の3系統が同じ仕組みで育つ／壊れる
var BUILD_STAGE = {
  RAIL:               { done: 'RAIL',        undone: 'RAIL_RUINED' },
  RAIL_RUINED:        { done: 'RAIL',        undone: 'RAIL_RUINED' },
  RAIL_BRIDGE:        { done: 'RAIL_BRIDGE', undone: 'RAIL_BRIDGE_RUINED' },
  RAIL_BRIDGE_RUINED: { done: 'RAIL_BRIDGE', undone: 'RAIL_BRIDGE_RUINED' },
  SEA_RAIL:           { done: 'SEA_RAIL',    undone: 'SEA_RAIL_RUINED' },
  SEA_RAIL_RUINED:    { done: 'SEA_RAIL',    undone: 'SEA_RAIL_RUINED' },
  SEA_RAIL_DRAW:        { done: 'SEA_RAIL_DRAW', undone: 'SEA_RAIL_DRAW_RUINED' },
  SEA_RAIL_DRAW_RUINED: { done: 'SEA_RAIL_DRAW', undone: 'SEA_RAIL_DRAW_RUINED' },
  BRIDGE:             { done: 'BRIDGE',      undone: 'BRIDGE_RUINED' },
  BRIDGE_RUINED:      { done: 'BRIDGE',      undone: 'BRIDGE_RUINED' }
};
function railHpMaxAt(x, y){
  var t = TER[M[y][x]];
  return (t && t.buildHpMax) ? t.buildHpMax : 0;
}
function getRailHp(x, y){
  var t = TER[M[y][x]];
  if(!t || !t.buildHpMax) return 0;
  var k = x+','+y;
  if(typeof railHp[k] !== 'number'){
    // 記録が無い場合 (マップエディタで置いた線路や橋) は見た目どおりの耐久にする
    railHp[k] = t.isIncomplete ? RAIL_RUINED_HP : RAIL_HP_MAX;
  }
  return railHp[k];
}
// 耐久に合わせて地形を完成形／未完成形に切り替える
function syncRailTerrain(x, y){
  var k = x+','+y;
  var st = BUILD_STAGE[M[y][x]];
  if(!st) return false;
  var want = (railHp[k] >= RAIL_OK_HP) ? st.done : st.undone;
  var changed = (want !== M[y][x]);
  M[y][x] = want;
  return changed;
}
// 線路にダメージ。戻り値: { hp, stage } stage = 'damaged' / 'ruined' / 'removed'
function damageRailAt(x, y, dmg){
  var t = TER[M[y][x]];
  if(!t || !t.buildHpMax) return null;
  var k = x+','+y;
  var wasRuined = !!t.isIncomplete;
  var hp = getRailHp(x, y) - dmg;
  if(hp <= 0 && !wasRuined){
    // 線路は一撃で消えず、必ず廃線を挟む
    railHp[k] = RAIL_RUINED_HP;
    syncRailTerrain(x, y);
    return { hp: RAIL_RUINED_HP, stage: 'ruined' };
  }
  if(hp <= 0 && t.isRail){
    // 線路系は路盤・橋脚で止まる。線路は新規敷設できないので、消してしまうと
    // その路線が二度と戻らなくなるため、叩き続けても更地にはしない
    railHp[k] = RAIL_RUINED_HP;
    return { hp: RAIL_RUINED_HP, stage: 'ruined' };
  }
  if(hp <= 0){
    // 未完成の橋をさらに叩くと、架橋前の地形 (川) に戻る
    var back = railBase[k];
    if(!back){
      var mk = M[y][x];
      back = (mk === 'RAIL_BRIDGE_RUINED' || mk === 'BRIDGE_RUINED') ? 'RIVER' : 'PLAIN';
    }
    M[y][x] = back;
    delete railBase[k];
    delete railHp[k];
    return { hp: 0, stage: 'removed' };
  }
  railHp[k] = hp;
  var became = syncRailTerrain(x, y);
  return { hp: hp, stage: became ? 'ruined' : 'damaged' };
}
// 線路を修復。戻り値: { hp, promoted }
function repairRailAt(x, y, amount){
  var t = TER[M[y][x]];
  if(!t || !t.buildHpMax) return null;
  var k = x+','+y;
  railHp[k] = Math.min(RAIL_HP_MAX, getRailHp(x, y) + amount);
  var promoted = syncRailTerrain(x, y);
  return { hp: railHp[k], promoted: promoted };
}

// ===== 線路について =====
// 線路・鉄橋は新規に敷設できない。マップに最初から置かれたインフラを、
// 工兵が直し (路盤→線路)、対施設攻撃を持つユニットが切る (線路→路盤) 形で奪い合う。


function executeRailAttack(x, y){
  if(!pendingUnit) return;
  var u = pendingUnit;
  var t = TYPE[u.type];
  var terName = TER[M[y][x]] ? TER[M[y][x]].name : '線路';
  // 施設攻撃と同じ計算: vsFacility × HP比 − 地形防御 (線路の地形防御は0)
  var bestDmg = 0, bestIdx = -1, bestName = '';
  var dist = manhattan(u.x, u.y, x, y);
  for(var i=0; i<t.weapons.length; i++){
    var w = t.weapons[i];
    if(!w.vsFacility || w.vsFacility <= 0) continue;
    if(w.indirect && pendingJustMoved && t.cat !== 'AIR') continue;
    if(u.ammo && !hasAmmoForWeapon(u, i)) continue;
    var rng = getEffectiveRange(u, w);
    if(dist < rng[0] || dist > rng[1]) continue;
    var eff = Math.round(w.vsFacility * u.hp / HP_MAX) - (TER[M[y][x]].def || 0);
    if(eff > bestDmg){ bestDmg = eff; bestIdx = i; bestName = w.name; }
  }
  if(bestDmg <= 0){
    setStatus('有効な攻撃ができません');
    exitFacilityAttackMode();
    return;
  }
  if(bestIdx >= 0) consumeAmmoForAttack(u, bestIdx);
  var res = damageRailAt(x, y, bestDmg);
  var msg = '🛤 ' + terName + 'に' + bestDmg + 'ダメージ [' + bestName + ']';
  if(res && res.stage === 'ruined') msg += ' → ' + TER[M[y][x]].name + 'になりました';
  else if(res && res.stage === 'removed') msg += ' → ' + TER[M[y][x]].name + 'に戻りました';
  else if(res) msg += '（残り耐久 ' + res.hp + '/' + RAIL_HP_MAX + '）';
  setStatus(msg);
  if(window.plog) try{ plog(msg + ' ('+x+','+y+')'); }catch(e){}
  pendingUnit.acted = true;
  pendingUnit = null;
  facilityAttackMode = false;
  facilityAttackableSet = {};
  hideCommandPanel();
  afterAction();
}

// ===== 線路の修復 (工兵) =====
// 隣接する傷んだ線路を、工兵の表示HP分だけ回復する

// ===== 編成 (列車の連結) =====
// 列車は「積荷」ではなく、線路の上に一列に並んだ実ユニットの集まりとして扱う。
//   ・並び順は変わらない。編成は線路の上を並びのままスライドする
//   ・機関車が編成に1両でもあれば、引く(機関車が先頭)ことも押す(反対の端が先頭)こともできる
//   ・機関車が全滅した編成は二度と動けない (線路の上に取り残される)
//   ・単線なので、味方の上もすり抜けられない
// trains は「編成に属するユニットIDの配列」の配列。並び順は保持せず、隣接関係から
// そのつど計算する (押し引きで順序が入れ替わらないことを構造的に保証するため)。
var trains = [];
var TRAIN_MAX_CARS = 5;   // 1編成の最大両数 (機関車を含む)

function unitById(id){
  for(var i=0; i<units.length; i++){ if(units[i].id === id && units[i].hp > 0) return units[i]; }
  return null;
}

// ids のうち生存しているものを、隣接でつながった塊ごとに分ける
function _trainComponents(ids){
  var us = [];
  for(var i=0; i<ids.length; i++){ var uu = unitById(ids[i]); if(uu) us.push(uu); }
  var comps = [], used = {};
  for(var i=0; i<us.length; i++){
    if(used[us[i].id]) continue;
    used[us[i].id] = true;
    var stack = [us[i]], comp = [];
    while(stack.length){
      var c = stack.pop();
      comp.push(c);
      for(var j=0; j<us.length; j++){
        var o = us[j];
        if(used[o.id]) continue;
        if(manhattan(c.x, c.y, o.x, o.y) === 1){ used[o.id] = true; stack.push(o); }
      }
    }
    comps.push(comp);
  }
  return comps;
}

// 塊を線路沿いの順番に並べる (端から歩く)。一列につながっていなければ null
function _orderTrain(comp){
  if(!comp || comp.length === 0) return null;
  if(comp.length === 1) return comp.slice();
  function nbrs(u){
    var r = [];
    for(var i=0; i<comp.length; i++){
      if(comp[i].id !== u.id && manhattan(u.x, u.y, comp[i].x, comp[i].y) === 1) r.push(comp[i]);
    }
    return r;
  }
  var endU = null;
  for(var i=0; i<comp.length; i++){
    var n = nbrs(comp[i]).length;
    if(n > 2) return null;                 // 分岐している = 一列ではない
    if(n === 1 && !endU) endU = comp[i];
  }
  if(!endU) return null;                   // 環状 = 端がない
  var order = [endU], seen = {};
  seen[endU.id] = true;
  while(true){
    var cur = order[order.length-1];
    var list = nbrs(cur), nx = null;
    for(var i=0; i<list.length; i++){ if(!seen[list[i].id]){ nx = list[i]; break; } }
    if(!nx) break;
    seen[nx.id] = true;
    order.push(nx);
  }
  return (order.length === comp.length) ? order : null;
}

// 撃破などのあとに編成を整える (死んだ車輌を外し、切れた編成を分ける)
function syncTrains(){
  var out = [];
  for(var i=0; i<trains.length; i++){
    var comps = _trainComponents(trains[i]);
    for(var c=0; c<comps.length; c++){
      if(comps[c].length < 2) continue;    // 1両だけになったら編成ではない
      var ids = [];
      for(var k=0; k<comps[c].length; k++) ids.push(comps[c][k].id);
      out.push(ids);
    }
  }
  trains = out;
}

// unit が属する編成を、線路沿いの順番の配列で返す (属していなければ null)
function trainOf(unit){
  if(!unit || !TYPE[unit.type] || !TYPE[unit.type].isTrain) return null;
  for(var i=0; i<trains.length; i++){
    if(trains[i].indexOf(unit.id) < 0) continue;
    var comps = _trainComponents(trains[i]);
    for(var c=0; c<comps.length; c++){
      var has = false;
      for(var k=0; k<comps[c].length; k++){ if(comps[c][k].id === unit.id) has = true; }
      if(!has) continue;
      if(comps[c].length < 2) return null;
      return _orderTrain(comps[c]);
    }
  }
  return null;
}

function trainHasLoco(chain){
  if(!chain) return false;
  for(var i=0; i<chain.length; i++){ if(TYPE[chain[i].type].isCoupler) return true; }
  return false;
}
function trainAllReady(chain){
  if(!chain) return false;
  for(var i=0; i<chain.length; i++){ if(chain[i].acted) return false; }
  return true;
}
// 編成を引く/押す機関車 (選んだ車輌が機関車ならそれ、違えば編成内の機関車)
function trainDriver(chain, prefer){
  if(!chain) return null;
  if(prefer && TYPE[prefer.type].isCoupler && !prefer.acted) return prefer;
  for(var i=0; i<chain.length; i++){ if(TYPE[chain[i].type].isCoupler) return chain[i]; }
  return null;
}
// 編成の並びを「機関車-補給貨車-…」の文字列で返す (情報パネル用)
function trainLabel(chain){
  var names = [];
  for(var i=0; i<chain.length; i++) names.push(TYPE[chain[i].type].name);
  return names.join('－');
}

// 編成の移動範囲。編成の両端それぞれを先頭として BFS する。
// 戻り値: { 'x,y': { lead: 先頭になる車輌のindex, dist, prev, from } }  key = 先頭が止まるマス
function trainMovableInfo(chain, driver){
  var res = {};
  if(!chain || !driver) return res;
  var t = TYPE[driver.type];
  var fuelLimit = (driver.fuel !== undefined) ? Math.floor(driver.fuel) : t.move;
  var maxMove = Math.min(t.move, fuelLimit);
  var ends = (chain.length >= 2) ? [0, chain.length-1] : [0];
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var e=0; e<ends.length; e++){
    var lead = chain[ends[e]];
    var dist = {}, prev = {};
    var sk = lead.x+','+lead.y;
    dist[sk] = 0;
    var open = [[lead.x, lead.y, 0]];
    while(open.length){
      open.sort(function(a,b){ return a[2]-b[2]; });
      var cur = open.shift();
      var x = cur[0], y = cur[1], d = cur[2];
      var ck = x+','+y;
      if(dist[ck] !== undefined && d > dist[ck]) continue;
      var isStart = (x === lead.x && y === lead.y);
      if(!isStart && _isAdjacentToVisibleEnemy(x, y, lead.owner)) continue;
      for(var i=0; i<dirs.length; i++){
        var nx = x + dirs[i][0], ny = y + dirs[i][1];
        if(!inBounds(nx, ny)) continue;
        var c = moveCost(lead.type, M[ny][nx]);
        if(c === Infinity) continue;
        // 単線: 味方も自分の編成も障害になる (見えない敵だけは素通り扱い = 伏兵)
        var blocker = unitAt(nx, ny);
        if(blocker && (isAlly(blocker.owner, lead.owner) || isUnitVisibleTo(blocker, lead.owner))) continue;
        var nd = d + c;
        if(nd > maxMove) continue;
        var nk = nx+','+ny;
        if(dist[nk] === undefined || nd < dist[nk]){
          dist[nk] = nd; prev[nk] = ck;
          open.push([nx, ny, nd]);
        }
      }
    }
    for(var k in dist){
      if(k === sk) continue;
      if(res[k] === undefined || dist[k] < res[k].dist){
        res[k] = { lead: ends[e], dist: dist[k], prev: prev, from: sk };
      }
    }
  }
  return res;
}

// 編成を動かす。(destX,destY) は「先頭が止まるマス」
// 並び順は変えず、各車輌は進行方向で1つ前の車輌がいたマスへ入る。
function executeTrainMove(chain, driver, destX, destY, info){
  var entry = info[destX+','+destY];
  if(!entry) return null;
  // 先頭の出発マス → 目的地 の経路を再構築
  var path = [];
  var k = destX+','+destY;
  while(k){
    var xy = k.split(',');
    path.unshift({ x: parseInt(xy[0]), y: parseInt(xy[1]) });
    k = entry.prev[k];
  }
  // 先頭から見た並び (押すときは逆順に見るだけで、編成の順番自体は変わらない)
  var seq = (entry.lead === 0) ? chain.slice() : chain.slice().reverse();
  var lead = seq[0];
  // 伏兵: 先頭が進みながら、未発見の敵に隣接したらそこで停止
  var stopAt = path.length - 1, ambushAt = null;
  for(var pi=1; pi<path.length; pi++){
    var hidden = _findAdjacentHiddenEnemy(path[pi].x, path[pi].y, lead.owner, lead.id);
    if(hidden){ stopAt = pi; ambushAt = { x: hidden.x, y: hidden.y }; break; }
  }
  var trail = [];
  for(var pi2=stopAt; pi2>=0; pi2--) trail.push(path[pi2]);
  var oldPos = [];
  for(var i=0; i<seq.length; i++) oldPos.push({ x: seq[i].x, y: seq[i].y });
  var full = trail.concat(oldPos.slice(1));
  for(var i=0; i<seq.length; i++){
    var u = seq[i], p = full[i];
    u.preMoveX = u.x; u.preMoveY = u.y;
    u.x = p.x; u.y = p.y;
    u.moved = true;
  }
  var didMove = (stopAt > 0);
  if(didMove) consumeFuelForMove(driver, driver.preMoveX, driver.preMoveY);
  return {
    moved: didMove, lead: lead, ambushAt: ambushAt,
    stoppedEarly: (stopAt < path.length - 1), dist: stopAt
  };
}

// 連結できる相手 (隣接する自軍の列車系ユニット)。編成の端どうしでのみ繋げる。
function coupleCandidatesAround(unit){
  var list = [];
  var t = TYPE[unit.type];
  if(!t || !t.isTrain) return list;
  var myChain = trainOf(unit);
  if(myChain){
    if(myChain[0].id !== unit.id && myChain[myChain.length-1].id !== unit.id) return list; // 中間の車輌からは連結できない
    if(myChain.length >= TRAIN_MAX_CARS) return list;
  }
  var mySize = myChain ? myChain.length : 1;
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0; i<dirs.length; i++){
    var nx = unit.x + dirs[i][0], ny = unit.y + dirs[i][1];
    if(!inBounds(nx, ny)) continue;
    var o = unitAt(nx, ny);
    if(!o || o.owner !== unit.owner || o.id === unit.id) continue;
    if(!TYPE[o.type].isTrain) continue;
    if(myChain){
      var inMine = false;
      for(var k=0; k<myChain.length; k++){ if(myChain[k].id === o.id) inMine = true; }
      if(inMine) continue;
    }
    if(mySize + 1 > TRAIN_MAX_CARS) continue;
    list.push(o);
  }
  return list;
}

function enterCoupleMode(){
  if(!pendingUnit) return;
  var cands = coupleCandidatesAround(pendingUnit);
  if(cands.length === 0) return;
  if(cands.length === 1){ executeCouple(cands[0].x, cands[0].y); return; }
  coupleMode = true;
  coupleValidSet = {};

// 連結: 隣の車輌から線路沿いに続く自軍の列車系ユニットを、上限までまとめて連結する
function executeCouple(x, y){
  if(!pendingUnit) return;
  var loco = pendingUnit;
  var car = unitAt(x, y);
  if(!car) return;
  var ids = [];
  var myChain = trainOf(loco);
  if(myChain){ for(var i=0; i<myChain.length; i++) ids.push(myChain[i].id); }
  else ids.push(loco.id);
  var added = [];
  var curU = car;
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while(curU && ids.length < TRAIN_MAX_CARS){
    ids.push(curU.id);
    added.push(curU);
    var nextU = null;
    for(var i=0; i<dirs.length; i++){
      var o = unitAt(curU.x + dirs[i][0], curU.y + dirs[i][1]);
      if(!o || o.owner !== loco.owner || o.hp <= 0) continue;
      if(!TYPE[o.type].isTrain) continue;
      if(ids.indexOf(o.id) >= 0) continue;
      nextU = o; break;
    }
    curU = nextU;
  }
  // 一列につながっているか確認 (分岐していたら連結しない)
  var comps = _trainComponents(ids);
  if(comps.length !== 1 || !_orderTrain(comps[0]) || comps[0].length !== ids.length){
    setStatus('🔗 一列に並んでいない車輌は連結できません');
    exitCoupleMode();
    return;
  }
  // 既存の編成から、今回まとめた車輌を取り除く
  for(var ti=0; ti<trains.length; ti++){
    trains[ti] = trains[ti].filter(function(id){ return ids.indexOf(id) < 0; });
  }
  trains.push(ids);
  syncTrains();
  var names = [];
  for(var i=0; i<added.length; i++) names.push(TYPE[added[i].type].name);
  setStatus('🔗 ' + names.join('・') + 'を連結しました（' + ids.length + '両編成）');
  if(loco.owner === 'P' && window.plog){
    plog('🔗 ' + TYPE[loco.type].name + '@('+loco.x+','+loco.y+') が ' + names.join('・') + 'を連結（'+ids.length+'両編成）');
  }
  loco.acted = true;
  pendingUnit = null;
  coupleMode = false;
  coupleValidSet = {};
  hideCommandPanel();
  afterAction();
}

function executeUncouple(x, y){
  if(!pendingUnit) return;
  var chain = trainOf(pendingUnit);
  if(!chain) return;
  var target = unitAt(x, y);
  if(!target) return;
  var myIdx = -1, tIdx = -1;
  for(var i=0; i<chain.length; i++){
    if(chain[i].id === pendingUnit.id) myIdx = i;
    if(chain[i].id === target.id) tIdx = i;
  }
  if(myIdx < 0 || tIdx < 0 || myIdx === tIdx) return;
  var keep = [], cut = [];
  if(tIdx > myIdx){
    for(var i=0; i<tIdx; i++) keep.push(chain[i].id);
    for(var i=tIdx; i<chain.length; i++) cut.push(chain[i].id);
  } else {
    for(var i=tIdx; i>=0; i--) cut.push(chain[i].id);
    for(var i=tIdx+1; i<chain.length; i++) keep.push(chain[i].id);
  }
  var allIds = keep.concat(cut);
  for(var ti=0; ti<trains.length; ti++){
    trains[ti] = trains[ti].filter(function(id){ return allIds.indexOf(id) < 0; });
  }
  if(keep.length >= 2) trains.push(keep);
  if(cut.length >= 2) trains.push(cut);
  syncTrains();
  setStatus('🔗 ' + cut.length + '両を切り離しました');
  if(pendingUnit.owner === 'P' && window.plog){
    plog('🔗 ' + TYPE[pendingUnit.type].name + '@('+pendingUnit.x+','+pendingUnit.y+') が '+cut.length+'両を切り離し');
  }
  pendingUnit.acted = true;
  pendingUnit = null;
  uncoupleMode = false;
  uncoupleValidSet = {};
  hideCommandPanel();
  afterAction();
}

function selectCargoForUnload(idx){
  if(!pendingUnit) return;
  unloadMode = true;
  unloadCargoIdx = idx;
  var cargo = pendingUnit.cargo[idx];
  // 輸送ユニットの現在マスが降下準備可能でなければ、降下不可
  // 空挺降下兵を載せた輸送機の場合は森・山・川 でも可
  // 空母系 (canCarry==='AIR') は SEA 上にいるのが普通なので、自身の地形チェックはスキップ
  // (降車先マスのチェックは line 5929 の moveCost で別途行う)
  var carrierT = TYPE[pendingUnit.type];
  var isAirCarrier = (carrierT.canCarry === 'AIR');
  var isAirTransport = (pendingUnit.type === 'TRANSPORT_PLANE');
  if(!isAirCarrier && !canDeployFrom(M[pendingUnit.y][pendingUnit.x], isAirTransport ? cargo.type : null)){
    setStatus(TYPE[pendingUnit.type].name + 'は現在の地形(' + (TER[M[pendingUnit.y][pendingUnit.x]].name) + ')からは降下できません');
    unloadMode = false;
    unloadCargoIdx = -1;
    return;
  }
  // 隣接マスのうち、cargoユニットが進入可能な場所を表示
  unloadValidSet = {};
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0; i<dirs.length; i++){
    var nx = pendingUnit.x + dirs[i][0];
    var ny = pendingUnit.y + dirs[i][1];
    if(!inBounds(nx, ny)) continue;
    if(unitAt(nx, ny)) continue; // 既存ユニットがいる場所は不可
    var c = moveCost(cargo.type, M[ny][nx]);
    if(c === Infinity) continue;
    setAdd(unloadValidSet, nx+','+ny);
  }
  if(setSize(unloadValidSet) === 0){
    setStatus(TYPE[cargo.type].name + 'を降ろせる場所がありません');
    return;
  }
  setStatus(TYPE[cargo.type].name + 'の降下先(緑マス)を選んでください');
  // ボタン: キャンセルだけ残す
  var btnWrap = document.getElementById('command-buttons');
  btnWrap.innerHTML = '';
  var b = document.createElement('button');
  b.textContent = '降下キャンセル';
  b.style.fontSize = '12px';
  b.onclick = function(e){ e.stopPropagation(); exitUnloadMode(); };
  btnWrap.appendChild(b);
  render();
}

  unloadValidSet = {};

function executeUnload(x, y){
  if(!pendingUnit || unloadCargoIdx < 0) return;
  var cargo = pendingUnit.cargo[unloadCargoIdx];
  var carrierT = TYPE[pendingUnit.type];
  // 新規ユニットとして配置
  var newU = makeUnit(cargo.type, cargo.owner, x, y);
  newU.hp = cargo.hp;
  // 乗艦中に保存していた fuel/ammo を引き継ぐ (空母乗艦時は満タン補給済みのはず)
  if(typeof cargo.fuel === 'number') newU.fuel = cargo.fuel;
  if(cargo.ammo) newU.ammo = cargo.ammo.slice();
  // 補給ユニット(補給貨車など)の在庫も引き継ぐ
  if(typeof cargo.supplyFuelCount === 'number') newU.supplyFuelCount = cargo.supplyFuelCount;
  if(typeof cargo.supplyAmmoCount === 'number') newU.supplyAmmoCount = cargo.supplyAmmoCount;
  // quickDeploy: APC/輸送ヘリ/空母系は降車後即行動可能
  // ただし「同ラウンド内で乗船→降車」は禁止 (収容→発艦のループ防止)
  var loadedThisRound = (cargo.loadedRound === roundNumber);
  if(carrierT.quickDeploy && !loadedThisRound){
    newU.acted = false;
    newU.moved = false;
  } else {
    newU.acted = true; // 通常: 降ろされたターンは行動済み
    newU.moved = true;
  }
  // 搭載中ユニットがさらに何かを乗せていた場合、それも復元
  if(cargo.cargo && cargo.cargo.length > 0){
    newU.cargo = cargo.cargo.slice();
  }
  units.push(newU);
  // cargoから削除
  pendingUnit.cargo.splice(unloadCargoIdx, 1);
  // ログ (プレイヤーのみ)
  if(pendingUnit.owner === 'P' && window.plog){
    plog(TYPE[pendingUnit.type].name + '@('+pendingUnit.x+','+pendingUnit.y+') から ' + TYPE[cargo.type].name + 'を('+x+','+y+')に降車');
  }
  setStatus(TYPE[cargo.type].name + 'を降下させました');
  unloadMode = false;
  unloadCargoIdx = -1;
  unloadValidSet = {};
  unloadStarted = true; // 1体以上降ろしたフラグ
  // まだ搭載中ユニットが残っていれば降下メニューに戻る
  if(pendingUnit.cargo && pendingUnit.cargo.length > 0){
    render();
    enterUnloadMode();
  } else {
    // 全員降ろしきった → 行動完了
    pendingUnit.acted = true;
    pendingUnit = null;
    unloadStarted = false;
    hideCommandPanel();
    afterAction();
  }
}

function onCellClick(x, y){
  if(gameOver || turn !== 'P') return;
  if(animationLock) return; // アニメーション中はブロック
  var k = x+','+y;
  var clicked = unitAt(x, y);
  infoX = x; infoY = y; updateInfoPanel();

  if(routeSetMode){
    if(handleRouteSetClick(x, y)) return;
  }
  if(attackMode && pendingUnit && setHas(attackableSet, k)){
    // 効力射の場合は空マスでも着弾点として OK
    var isFFE = (pendingAttackMode === 'fire_for_effect');
    if(isFFE){
      // 効力射: 空マスでも、敵居ても、味方居ても着弾点に出来る (友軍巻き込み警告は省略)
      var target = clicked || { x: x, y: y };
      // ただし自軍ユニットを"狙う"のは事故防止のため警告
      if(clicked && clicked.owner === pendingUnit.owner){
        if(!confirm('着弾点に自軍ユニットがいます。本当に効力射しますか？')) return;
      }
      var r = performAttack(pendingUnit, { x: x, y: y }, pendingJustMoved, 'fire_for_effect');
      flashAttack(pendingUnit, { x: x, y: y }, r);
      if(window.plog && r){
        var atkInfo = TYPE[pendingUnit.type].name + '@('+pendingUnit.x+','+pendingUnit.y+') 効力射 ('+x+','+y+')';
        var hitsInfo = '';
        if(r.r1 && r.r1.hits){
          hitsInfo = r.r1.hits.map(function(h){
            return TYPE[h.unit.type].name+'@('+h.unit.x+','+h.unit.y+')-'+h.dmg+(h.role==='center'?'[中央]':'[周囲]');
          }).join(', ');
        }
        plog('攻撃 ' + atkInfo + ' / ' + hitsInfo);
      }
      // ステータス表示
      if(r && r.r1){
        var hitCount = (r.r1.hits ? r.r1.hits.length : 0);
        if(hitCount > 0){
          var totalDmg = r.r1.hits.reduce(function(s,h){ return s + h.dmg; }, 0);
          setStatus('💥 効力射! '+hitCount+'ユニットに合計 ' + totalDmg + 'ダメ');
        } else {
          setStatus('💥 効力射! 命中なし (空マス)');
        }
      }
      if(pendingUnit.hp > 0) pendingUnit.acted = true;
      pendingUnit = null; attackMode = false; pendingAttackMode = 'normal';
      setClear(attackableSet);
      hideCommandPanel(); afterAction();
      return;
    }
    // 通常攻撃 / 観測射撃: 敵ユニットマスのみ
    if(!clicked || clicked.owner === 'P' || clicked.owner === 'N') return;
    var r = performAttack(pendingUnit, clicked, pendingJustMoved, pendingAttackMode);
    flashAttack(pendingUnit, clicked, r);
    // プレイヤー攻撃ログ
    if(window.plog && r){
      var atkInfo = TYPE[pendingUnit.type].name + '@('+pendingUnit.x+','+pendingUnit.y+') → ' + TYPE[clicked.type].name + '@('+clicked.x+','+clicked.y+')';
      var modeLabel = (pendingAttackMode === 'observed') ? '[観測射撃]' : '';
      var dmgInfo = (r.r1 ? '攻'+r.r1.dmg : '');
      var counterInfo = (r.r2 && r.r2.dmg > 0 ? ' / 反撃-'+r.r2.dmg : '');
      var bonusInfo = '';
      if(r.r1 && r.r1.bonus > 0) bonusInfo += ' [包囲+'+r.r1.bonus+']';
      if(r.r1 && r.r1.observerMult && r.r1.observerMult > 1){
        bonusInfo += ' [効力射x'+r.r1.observerMult.toFixed(2)+']';
      }
      plog('攻撃 ' + modeLabel + ' ' + atkInfo + ' ' + dmgInfo + counterInfo + bonusInfo);
    }
    // 観測射撃発動メッセージ
    if(r && r.r1 && r.r1.observerMult && r.r1.observerMult > 1){
      var pct = Math.round((r.r1.observerMult - 1) * 100);
      var label = (pendingAttackMode === 'observed') ? '観測射撃' : '効力射';
      setStatus('🎯 ' + label + '発動! (+' + pct + '%) ' + TYPE[pendingUnit.type].name + ' → ' + r.r1.dmg + 'ダメ');
    }
    if(pendingUnit.hp > 0) pendingUnit.acted = true;
    pendingUnit = null; attackMode = false; pendingAttackMode = 'normal';
    setClear(attackableSet);
    hideCommandPanel(); afterAction();
    return;
  }
  if(attackMode) return;
  // 施設攻撃モード
  if(facilityAttackMode && pendingUnit && setHas(facilityAttackableSet, k)){
    executeFacilityAttack(x, y);
    return;
  }
  if(facilityAttackMode) return;
  // 橋建設モード
  if(bridgeMode && pendingUnit && setHas(bridgeValidSet, k)){
    executeBridgeBuild(x, y);
    return;
  }
  if(bridgeMode) return;
  // 線路の修復モード
  if(railRepairMode && pendingUnit && setHas(railRepairSet, k)){
    executeRailRepair(x, y);
    return;
  }
  if(railRepairMode) return;
  // 降下モード: 緑マス(unloadValidSet)をクリックすると降下実行
  // 連結モード
  if(coupleMode && pendingUnit && setHas(coupleValidSet, k)){
    executeCouple(x, y);
    return;
  }
  if(coupleMode) return;
  // 切り離しモード
  if(uncoupleMode && pendingUnit && setHas(uncoupleValidSet, k)){
    executeUncouple(x, y);
    return;
  }
  if(uncoupleMode) return;
  if(unloadMode && pendingUnit && setHas(unloadValidSet, k)){
    executeUnload(x, y);
    return;
  }
  if(unloadMode) return;
  // 編成の移動 (列車): 緑マス = 編成の先頭が止まるマス
  if(selected && !pendingUnit && setHas(movableSet, k) && trainOf(selected)){
    var tChain = trainOf(selected);
    // 自分のマスをクリック = その場で待機 (コマンドパネルへ)
    if(x === selected.x && y === selected.y){
      setClear(movableSet); setClear(attackableSet);
      var tStay = selected; selected = null;
      showCommandPanel(tStay, false);
      return;
    }
    var tDrv = trainDriver(tChain, selected);
    if(!tDrv){ setStatus('機関車がいないため、この編成は動かせません'); return; }
    if(!trainAllReady(tChain)){ setStatus('行動済みの車輌があるため、この編成は発車できません'); return; }
    var tInfo = trainMovableInfo(tChain, tDrv);
    var tRes = executeTrainMove(tChain, tDrv, x, y, tInfo);
    if(!tRes) return;
    setClear(movableSet); setClear(attackableSet);
    var tSel = selected; selected = null;
    if(window.plog && tRes.moved){
      plog('🚂 ' + trainLabel(tChain) + ' が (' + tRes.lead.x + ',' + tRes.lead.y + ') へ移動' + (tRes.stoppedEarly ? ' (伏兵察知で停止)' : ''));
    }
    // 操作した車輌以外は行動終了 (編成は1回の移動で全車が動くため)
    for(var tI=0; tI<tChain.length; tI++){ if(tChain[tI].id !== tSel.id) tChain[tI].acted = true; }
    if(tRes.ambushAt){
      tSel.acted = true;
      var tAmb = performAmbush(tRes.lead, function(){
        units = units.filter(function(uu){ return uu.hp > 0; });
        syncTrains();
        hideCommandPanel();
        afterAction();
      });
      if(tAmb) return;
      hideCommandPanel();
      afterAction();
      return;
    }
    showCommandPanel(tSel, tRes.moved);
    return;
  }
  if(selected && !pendingUnit && setHas(movableSet, k)){
    // クリック先のユニット (見えないものは存在しないものとして扱う)
    var clickedVisible = clicked;
    if(clicked && clicked.owner !== selected.owner && !isUnitVisibleTo(clicked, selected.owner)){
      // プレイヤーから見えない伏兵 → 空きマス扱い (移動指定可能)
      clickedVisible = null;
    }
    var canMoveHere = (!clickedVisible || clickedVisible.id === selected.id);
    var willEmbark = false;
    // 自軍の搭載可能輸送ユニットがいるマスへの移動 = 搭載目的
    if(!canMoveHere && clickedVisible && clickedVisible.owner === selected.owner && canCarryUnit(clickedVisible, selected)){
      canMoveHere = true;
      willEmbark = true;
    }
    if(canMoveHere){
      preMoveX = selected.x; preMoveY = selected.y;
      var justMoved = !(x === selected.x && y === selected.y);
      if(willEmbark){
        // 搭載処理: 搭載される側のcargoも含めて保存 (fuel/ammoも保存)
        var carrier = clicked;
        if(window.plog) plog(TYPE[selected.type].name + '@('+selected.x+','+selected.y+') → ' + TYPE[carrier.type].name + '@('+carrier.x+','+carrier.y+')に乗船');
        var cargoEntry = {
          type: selected.type,
          hp: selected.hp,
          owner: selected.owner,
          originalId: selected.id,
          fuel: selected.fuel,
          ammo: selected.ammo ? selected.ammo.slice() : null,
          cargo: selected.cargo ? selected.cargo.slice() : [],
          loadedRound: roundNumber
        };
        // 空母系 (canCarry==='AIR' で supplyFuel/supplyAmmo 持ち) に着艦する航空ユニットには
        // 乗艦時に1回だけ補給 (空母リソース消費)。引数は実ユニット風オブジェクト
        var fakeUnitForSupply = {
          type: cargoEntry.type,
          fuel: cargoEntry.fuel,
          ammo: cargoEntry.ammo ? cargoEntry.ammo.slice() : null
        };
        carrierResupplyOnLoad(carrier, fakeUnitForSupply);
        cargoEntry.fuel = fakeUnitForSupply.fuel;
        cargoEntry.ammo = fakeUnitForSupply.ammo;
        carrier.cargo.push(cargoEntry);
        // 搭載される側はunits配列から削除
        units = units.filter(function(u){ return u.id !== selected.id; });
        // 搭載する側(輸送ユニット): 既に移動済みなら行動完了、未行動なら継続可
        if(carrier.moved){
          carrier.acted = true;
        }
        setStatus(TYPE[selected.type].name + 'を' + TYPE[carrier.type].name + 'に搭載しました');
        selected = null;
        setClear(movableSet); setClear(attackableSet);
        hideCommandPanel();
        afterAction();
        return;
      }
      // 通常の移動
      var fromX = selected.x, fromY = selected.y;
      // 伏兵検知: 経路上で初めて未発見の敵に隣接したマスで停止
      var moveResult = findActualMoveEndpoint(selected, x, y);
      var actualX = moveResult.x, actualY = moveResult.y;
      // 奇襲発動条件: 目的地が伏兵マスだった場合 (hitAmbush=true)
      var willTriggerAmbush = moveResult.hitAmbush;
      // 経路途中で伏兵に隣接して停止した場合 (ambushAt あり、目的地に到達してない)
      var stoppedByAmbush = moveResult.ambushAt && (actualX !== x || actualY !== y);
      if(justMoved && window.plog){
        if(stoppedByAmbush){
          plog(TYPE[selected.type].name + ' ('+fromX+','+fromY+') → ('+actualX+','+actualY+') (伏兵察知で停止、目標=('+x+','+y+'))');
        } else if(willTriggerAmbush){
          plog(TYPE[selected.type].name + ' ('+fromX+','+fromY+') → ('+actualX+','+actualY+') (伏兵マスへ侵入)');
        } else {
          plog(TYPE[selected.type].name + ' ('+fromX+','+fromY+') → ('+actualX+','+actualY+')');
        }
      }
      selected.x = actualX; selected.y = actualY;
      selected.moved = true;
      // 移動前位置をユニットに記録 (移動後の攻撃判定で「移動前から見えていた敵」を識別するため)
      selected.preMoveX = fromX;
      selected.preMoveY = fromY;
      var realJustMoved = !(actualX === fromX && actualY === fromY);
      if(realJustMoved) consumeFuelForMove(selected, fromX, fromY);
      setClear(movableSet); setClear(attackableSet);
      var u = selected; selected = null;
      // 奇襲チェック: 移動した場合のみ。performAmbush は隣接の未発見敵を検知して攻撃
      if(realJustMoved){
        var ambushed = performAmbush(u, function(wasAmbushed){
          if(wasAmbushed){
            // 奇襲発動: コマンドパネル出さず即終了
            units = units.filter(function(uu){ return uu.hp > 0; });
            afterAction();
          } else {
            // 奇襲不発でも、伏兵察知で停止した場合は行動終了
            if(stoppedByAmbush){
              u.acted = true;
              hideCommandPanel();
              afterAction();
            } else {
              showCommandPanel(u, justMoved);
            }
          }
        });
        if(ambushed) return; // 非同期処理 (奇襲アニメ) に委ねる
        // 同期的に進む場合: performAmbush は false (奇襲対象なし) を返している
        if(stoppedByAmbush){
          u.acted = true;
          if(window.plog) plog(TYPE[u.type].name + ' 伏兵察知で行動終了');
          hideCommandPanel();
          afterAction();
          return;
        }
      }
      showCommandPanel(u, justMoved);
      return;
    }
  }
  if(clicked && clicked.owner === 'P' && !clicked.acted && !pendingUnit){
    // 編成に組み込まれている車輌は、単独では動けない (編成ごと動く)
    var selChain = trainOf(clicked);
    if(selChain){
      selected = clicked;
      setClear(enemyThreatSet); setClear(enemyMoveSet);
      movableSet = {};
      setAdd(movableSet, clicked.x+','+clicked.y);
      var selDrv = trainDriver(selChain, clicked);
      var selReady = (selDrv && trainAllReady(selChain));
      if(selReady){
        var selInfo = trainMovableInfo(selChain, selDrv);
        for(var selK in selInfo) setAdd(movableSet, selK);
      }
      // 編成は動くと全車が行動終了になるので、攻撃予告は現在位置からのみ
      attackableSet = computeAttackable(clicked, clicked.x, clicked.y, false);
      setStatus(TYPE[clicked.type].name + '選択中: ' +
        (selReady ? '緑=編成の先頭が止まれるマス' :
         (!selDrv ? '機関車がいないため動けません' : '行動済みの車輌があるため発車できません')) +
        '（' + selChain.length + '両編成: ' + trainLabel(selChain) + '）');
      render();
      return;
    }
    selected = clicked;
    setClear(enemyThreatSet); setClear(enemyMoveSet); // 敵脅威範囲をクリア
    movableSet = computeMovable(clicked);
    var atkPreview = {};
    for(var mk in movableSet){
      var mxy = mk.split(',');
      var mx = parseInt(mxy[0]), my = parseInt(mxy[1]);
      var justM = !(mx === clicked.x && my === clicked.y);
      var fakeAtt = { type: clicked.type, hp: clicked.hp, x: mx, y: my, ammo: clicked.ammo };
      var aSet = computeAttackable(fakeAtt, mx, my, justM);
      for(var ak in aSet){ if(!setHas(movableSet, ak)) setAdd(atkPreview, ak); }
    }
    attackableSet = atkPreview;
    setStatus(TYPE[clicked.type].name + '選択中: 緑=移動可、赤=攻撃可');
    render();
    return;
  }
  if(!pendingUnit){
    // 自軍施設をクリックしただけでは生産メニューを開かない。
    // 備蓄などの状態を見たいだけでモーダルが出てしまうため、右の情報パネルに
    // 「生産・収容」「アップグレード」ボタンを出し、そこから開く形にしている。
    // 敵ユニットクリック: 脅威範囲を表示 (移動可能マス + 攻撃可能マス)
    if(clicked && clicked.owner !== 'P' && clicked.owner !== 'N' && isUnitVisibleTo(clicked, 'P')){
      var threatRes = computeEnemyThreat(clicked);
      enemyThreatSet = threatRes.threat;
      enemyMoveSet = threatRes.move;
      selected = null;
      setClear(movableSet); setClear(attackableSet);
      render();
      return;
    }
    selected = null;
    setClear(movableSet); setClear(attackableSet);
    setClear(enemyThreatSet); setClear(enemyMoveSet);
    render();
  }
}

// 陣営ごとの背景色 (ユニット内側の薄い色)
var FACTION_BG_COLORS = {
  'P': '#E6F1FB',
  'E': '#FCEBEB',
  'C': '#E0F0E8',
  'D': '#FFF1D5',
  'N': '#EEEEEE'
};

function unitHTML(u, size){
  var color = FACTION_COLORS[u.owner] || '#888';
  var bgCol = FACTION_BG_COLORS[u.owner] || '#EEEEEE';
  var isSel = (selected && selected.id === u.id) || (pendingUnit && pendingUnit.id === u.id);
  var acted = u.acted;
  var t = TYPE[u.type];
  var dHP = displayHP(u.hp);
  var hpRatio = u.hp / HP_MAX;
  var hpColor = hpRatio > 0.6 ? '#3B6D11' : hpRatio > 0.3 ? '#BA7517' : '#A32D2D';
  var inner = size - 8;
  // 潜航中はバッジ「潜」で識別、ステルス中は「ス」で識別
  var submergedBadge = u.submerged ? '<div style="position:absolute;left:-2px;bottom:-3px;font-size:9px;background:#3a6a8a;color:white;padding:0 2px;border-radius:2px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.3);">潜</div>' : '';
  var stealthBadge = u.stealth ? '<div style="position:absolute;left:-2px;bottom:-3px;font-size:9px;background:#3a3a5a;color:white;padding:0 2px;border-radius:2px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.3);">ス</div>' : '';
  // 搭載中バッジ
  // 連結中の車輌には🔗の印 (どこまでが1つの編成か盤面で分かるように)
  var trainBadge = '';
  if(t.isTrain && trainOf(u)){
    trainBadge = '<div style="position:absolute;left:-2px;bottom:-3px;font-size:9px;background:#7A5A10;color:white;padding:0 2px;border-radius:2px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.3);">🔗</div>';
  }
  var cargoBadge = '';
  if(t.capacity && u.cargo && u.cargo.length > 0){
    cargoBadge = '<div style="position:absolute;right:-2px;bottom:-3px;font-size:9px;background:#5a4a3a;color:white;padding:0 3px;border-radius:2px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.3);">'+u.cargo.length+'/'+t.capacity+'</div>';
  }
  // 燃料警告バッジ (低燃料時のみ・上に配置)
  var fuelBadge = '';
  if(u.fuel !== undefined && t.fuelMax !== undefined){
    var fuelPct = u.fuel / t.fuelMax;
    if(u.fuel === 0){
      fuelBadge = '<div style="position:absolute;left:-2px;top:-3px;font-size:9px;background:#A32D2D;color:white;padding:0 2px;border-radius:2px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.3);">⛽×</div>';
    } else if(fuelPct < 0.25){
      fuelBadge = '<div style="position:absolute;left:-2px;top:-3px;font-size:9px;background:#BA7517;color:white;padding:0 2px;border-radius:2px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.3);">⛽!</div>';
    }
  }
  // 弾切れバッジ (主兵装が全弾切れの時のみ表示)
  var ammoBadge = '';
  if(u.ammo){
    var hasNonInfWeapon = false;
    var allEmpty = true;
    for(var ai=0; ai<u.ammo.length; ai++){
      if(u.ammo[ai] === -1) continue; // 無限弾
      hasNonInfWeapon = true;
      if(u.ammo[ai] > 0){ allEmpty = false; break; }
    }
    if(hasNonInfWeapon && allEmpty){
      ammoBadge = '<div style="position:absolute;right:-2px;top:-3px;font-size:9px;background:#A32D2D;color:white;padding:0 2px;border-radius:2px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.3);">弾×</div>';
    }
  }
  // 潜航/ステルス中は輪郭のみのアイコン
  var iconSvg;
  if(u.submerged && u.type === 'SUBMARINE') iconSvg = ICONS.SUBMARINE_OUTLINE;
  else if(u.stealth && u.type === 'STEALTH_BOMBER') iconSvg = ICONS.STEALTH_BOMBER_OUTLINE;
  else iconSvg = ICONS[u.type];
  return '<div style="width:'+size+'px;height:'+size+'px;background:'+bgCol+';border:1.5px solid '+color+';border-radius:6px;display:flex;align-items:center;justify-content:center;color:'+color+';opacity:'+(acted?0.55:1)+';'+(isSel?'box-shadow:0 0 0 2px #BA7517;':'')+'position:relative;">'
    + '<div style="width:'+inner+'px;height:'+inner+'px;display:flex;align-items:center;justify-content:center;">' + iconSvg + '</div>'
    + '<div style="position:absolute;left:1px;right:1px;bottom:0;height:3px;background:rgba(0,0,0,0.2);border-radius:1px;overflow:hidden;"><div style="width:'+Math.max(0,hpRatio*100)+'%;height:100%;background:'+hpColor+';"></div></div>'
    + '<div style="position:absolute;top:-2px;right:-2px;font-size:8px;font-weight:600;background:'+color+';color:white;border-radius:50%;width:11px;height:11px;display:flex;align-items:center;justify-content:center;">'+dHP+'</div>'
    + submergedBadge + stealthBadge + cargoBadge + trainBadge + fuelBadge + ammoBadge + '</div>';
}

// 道路接続対象の地形 (隣接時に道路グラフィックが繋がる)
// 全施設(アップグレード系含む) + 廃墟系 + 道路自体
var ROAD_CONNECT_TILES = {
  ROAD: true,
  // 都市系
  CITY: true, BIG_CITY: true, COMMERCE_CITY: true, AMMO_DEPOT: true, CAPITAL: true,
  // 工場系
  FACTORY: true, WHEEL_FACTORY: true, TRACK_FACTORY: true, WHEEL_ARSENAL: true, TRACK_ARSENAL: true, WHEEL_WORKS: true, TRACK_WORKS: true,
  // 空港系
  AIRPORT: true, AIR_BASE: true, AIR_ARSENAL: true, AIR_WORKS: true,
  // 港系
  PORT: true, NAVY_BASE: true, NAVY_ARSENAL: true, NAVY_WORKS: true,
  // 廃墟系
  RUINS_CITY: true, RUINS_FACTORY: true, RUINS_AIRPORT: true, RUINS_PORT: true
};

// 線路の描画 (枕木＋2本のレール)。隣接する線路・鉄橋・施設とつながる
// 線路・鉄橋の描画本体
// n/sN/e/w = つながっている向き、isBridge = 鉄橋なら川面と鋼の桁を下に敷く
function railTilesSVG(n, sN, e, w, isBridge, isRuined, isSea, isDraw){
  if(!n && !sN && !e && !w){ n = true; sN = true; } // 孤立しているときは縦向きで描く
  var tieCol = '#5A4B36', railCol = '#3A3129';
  if(isRuined){ tieCol = '#6E6A5E'; railCol = '#77705F'; } // 廃線: 錆びて色が抜ける
  var parts = [];
  var horiz = (e || w) && !(n || sN);
  if(isBridge){
    // 水面 (海上鉄橋は海なので濃く、波も強めに描く)
    var waterFill = isSea ? '#3F79A6' : '#5a8aaa';
    var waterOp   = isSea ? '0.55' : '0.35';
    var waveCol   = isSea ? '#2A5A82' : '#3a6a8a';
    parts.push('<rect x="0" y="0" width="32" height="32" fill="'+waterFill+'" opacity="'+waterOp+'"/>');
    parts.push('<path d="M0,5 Q8,7 16,5 T32,7" fill="none" stroke="'+waveCol+'" stroke-width="0.6" opacity="0.5"/>');
    parts.push('<path d="M0,27 Q8,29 16,27 T32,29" fill="none" stroke="'+waveCol+'" stroke-width="0.6" opacity="0.5"/>');
    if(isSea){
      parts.push('<path d="M0,16 Q8,18 16,16 T32,18" fill="none" stroke="'+waveCol+'" stroke-width="0.6" opacity="0.35"/>');
    }
    // 鋼の桁 (通っている向きに敷く)
    if(horiz){
      parts.push('<rect x="0" y="9" width="32" height="14" fill="#7A828C" stroke="#4A525C" stroke-width="0.5"/>');
      parts.push('<rect x="0" y="9" width="32" height="1.4" fill="#5A626C"/>');
      parts.push('<rect x="0" y="21.6" width="32" height="1.4" fill="#5A626C"/>');
      parts.push('<rect x="1" y="23" width="3" height="7" fill="#5A626C" opacity="0.8"/>');
      parts.push('<rect x="28" y="23" width="3" height="7" fill="#5A626C" opacity="0.8"/>');
    } else {
      parts.push('<rect x="9" y="0" width="14" height="32" fill="#7A828C" stroke="#4A525C" stroke-width="0.5"/>');
      parts.push('<rect x="9" y="0" width="1.4" height="32" fill="#5A626C"/>');
      parts.push('<rect x="21.6" y="0" width="1.4" height="32" fill="#5A626C"/>');
      parts.push('<rect x="23" y="1" width="7" height="3" fill="#5A626C" opacity="0.8"/>');
      parts.push('<rect x="23" y="28" width="7" height="3" fill="#5A626C" opacity="0.8"/>');
    }
    if(isSea && !isDraw){
      // 海中から立つコンクリートの橋脚 (高架橋であることを見せる)
      if(horiz){
        parts.push('<rect x="5" y="22.6" width="4" height="8" fill="#8C8A82" opacity="0.9"/>');
        parts.push('<rect x="23" y="22.6" width="4" height="8" fill="#8C8A82" opacity="0.9"/>');
      } else {
        parts.push('<rect x="22.6" y="5" width="8" height="4" fill="#8C8A82" opacity="0.9"/>');
        parts.push('<rect x="22.6" y="23" width="8" height="4" fill="#8C8A82" opacity="0.9"/>');
      }
    }
    if(isDraw){
      // 可動橋: 航路を空けるため橋脚を両端に寄せ、中央に旋回台を据える
      if(horiz){
        parts.push('<rect x="0.5" y="22.6" width="4" height="8" fill="#8C8A82" opacity="0.9"/>');
        parts.push('<rect x="27.5" y="22.6" width="4" height="8" fill="#8C8A82" opacity="0.9"/>');
      } else {
        parts.push('<rect x="22.6" y="0.5" width="8" height="4" fill="#8C8A82" opacity="0.9"/>');
        parts.push('<rect x="22.6" y="27.5" width="8" height="4" fill="#8C8A82" opacity="0.9"/>');
      }
      parts.push('<circle cx="16" cy="16" r="7.2" fill="#AEB6BF"/>');
    }
    tieCol = '#4A525C'; // 桁の上なので枕木は暗めの鋼色
  }
  function seg(isH, from, to){
    // 廃線は枕木を間引き、レールを細く途切れさせて「傷んでいる」ように見せる
    var step = isRuined ? 9 : 5;
    for(var i = from + 2; i <= to - 2; i += step){
      if(isH) parts.push('<rect x="'+i+'" y="10" width="2" height="12" fill="'+tieCol+'"/>');
      else    parts.push('<rect x="10" y="'+i+'" width="12" height="2" fill="'+tieCol+'"/>');
    }
    var th = isRuined ? 1.0 : 1.6;
    var op = isRuined ? ' opacity="0.7"' : '';
    if(isRuined){
      // 途切れたレール (前半と後半だけ描く)
      var mid = (from + to) / 2;
      if(isH){
        parts.push('<rect x="'+from+'" y="12.5" width="'+((mid-from)*0.6)+'" height="'+th+'" fill="'+railCol+'"'+op+'/>');
        parts.push('<rect x="'+(mid+ (to-mid)*0.4)+'" y="17.9" width="'+((to-mid)*0.6)+'" height="'+th+'" fill="'+railCol+'"'+op+'/>');
      } else {
        parts.push('<rect x="12.5" y="'+from+'" width="'+th+'" height="'+((mid-from)*0.6)+'" fill="'+railCol+'"'+op+'/>');
        parts.push('<rect x="17.9" y="'+(mid+(to-mid)*0.4)+'" width="'+th+'" height="'+((to-mid)*0.6)+'" fill="'+railCol+'"'+op+'/>');
      }
      return;
    }
    if(isH){
      parts.push('<rect x="'+from+'" y="12.5" width="'+(to-from)+'" height="'+th+'" fill="'+railCol+'"/>');
      parts.push('<rect x="'+from+'" y="17.9" width="'+(to-from)+'" height="'+th+'" fill="'+railCol+'"/>');
    } else {
      parts.push('<rect x="12.5" y="'+from+'" width="'+th+'" height="'+(to-from)+'" fill="'+railCol+'"/>');
      parts.push('<rect x="17.9" y="'+from+'" width="'+th+'" height="'+(to-from)+'" fill="'+railCol+'"/>');
    }
  }
  if(w) seg(true, 0, 16);
  if(e) seg(true, 16, 32);
  if(n) seg(false, 0, 16);
  if(sN) seg(false, 16, 32);
  if(isDraw){
    // 旋回台の輪郭はレールの上に重ねて、可動区間だとひと目で分かるようにする
    parts.push('<circle cx="16" cy="16" r="7.2" fill="none" stroke="#2E3640" stroke-width="1.2"/>');
    parts.push('<circle cx="16" cy="16" r="2.4" fill="#2E3640"/>');
    parts.push('<path d="M11.5,11.5 A6.4,6.4 0 0 1 20.5,11.5" fill="none" stroke="#E2B23C" stroke-width="1.2"/>');
    parts.push('<path d="M20.5,20.5 A6.4,6.4 0 0 1 11.5,20.5" fill="none" stroke="#E2B23C" stroke-width="1.2"/>');
  }
  return '<svg viewBox="0 0 32 32" width="100%" height="100%" style="position:absolute;inset:0;pointer-events:none;">' + parts.join('') + '</svg>';
}

// 線路の描画。隣接する線路・鉄橋・施設とつながる
function railSVG(x, y){
  function isRailish(tx, ty){
    if(tx < 0 || tx >= W || ty < 0 || ty >= H) return false;
    var t = TER[M[ty][tx]];
    return !!(t && (t.isRail || t.slots || t.group === 'city' || t.group === 'capital'));
  }
  var tk = TER[M[y][x]] || {};
  return railTilesSVG(isRailish(x, y-1), isRailish(x, y+1), isRailish(x+1, y), isRailish(x-1, y),
                      (M[y][x] === 'RAIL_BRIDGE' || M[y][x] === 'RAIL_BRIDGE_RUINED' || !!tk.isSeaRail),
                      !!tk.isRailRuined, !!tk.isSeaRail, !!tk.isDrawBridge);
}

function roadSVG(x, y){
  // 隣接マスが道路または都市・施設(道路網に接続している地点)かを判定
  function isRoadOrCity(tx, ty){
    if(tx < 0 || tx >= W || ty < 0 || ty >= H) return false;
    var t = M[ty][tx];
    return !!ROAD_CONNECT_TILES[t];
  }
  var n = isRoadOrCity(x, y-1);
  var s = isRoadOrCity(x, y+1);
  var e = isRoadOrCity(x+1, y);
  var w = isRoadOrCity(x-1, y);

  var parts = [];
  parts.push('<rect x="11" y="11" width="10" height="10" fill="#6e6354" opacity="0.85"/>');
  if(n) parts.push('<rect x="11" y="0" width="10" height="11" fill="#6e6354" opacity="0.85"/>');
  if(s) parts.push('<rect x="11" y="21" width="10" height="11" fill="#6e6354" opacity="0.85"/>');
  if(e) parts.push('<rect x="21" y="11" width="11" height="10" fill="#6e6354" opacity="0.85"/>');
  if(w) parts.push('<rect x="0" y="11" width="11" height="10" fill="#6e6354" opacity="0.85"/>');

  if(n && s){
    parts.push('<line x1="16" y1="0" x2="16" y2="14" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
    parts.push('<line x1="16" y1="18" x2="16" y2="32" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
  } else if(n){
    parts.push('<line x1="16" y1="0" x2="16" y2="14" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
  } else if(s){
    parts.push('<line x1="16" y1="18" x2="16" y2="32" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
  }
  if(e && w){
    parts.push('<line x1="0" y1="16" x2="14" y2="16" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
    parts.push('<line x1="18" y1="16" x2="32" y2="16" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
  } else if(e){
    parts.push('<line x1="18" y1="16" x2="32" y2="16" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
  } else if(w){
    parts.push('<line x1="0" y1="16" x2="14" y2="16" stroke="#e8d8a0" stroke-width="0.8" stroke-dasharray="3,2"/>');
  }
  if(!n && !s && !e && !w){
    parts.push('<line x1="13" y1="16" x2="19" y2="16" stroke="#e8d8a0" stroke-width="0.8"/>');
    parts.push('<line x1="16" y1="13" x2="16" y2="19" stroke="#e8d8a0" stroke-width="0.8"/>');
  }
  return '<svg viewBox="0 0 32 32" width="100%" height="100%" style="position:absolute;inset:0;pointer-events:none;">' + parts.join('') + '</svg>';
}

function captureBadge(x, y){
  var cap = captures[x+','+y];
  if(!cap) return '';
  var own = cap.owner;
  var color = own==='P'?'#185FA5':own==='E'?'#A32D2D':'#5a554f';
  var flag = own !== 'N' ? '<div style="position:absolute;top:1px;left:1px;width:7px;height:9px;background:'+color+';border-radius:1px;"></div>' : '';
  var bar = '';
  // アップグレード中なら拠点HPの代わりにUPGバッジ
  if(cap.upgrading){
    bar = '<div style="position:absolute;top:0px;right:0px;font-size:7px;background:#BA7517;color:white;padding:0 2px;border-radius:0 0 0 2px;font-weight:600;">UP'+cap.upgrading.remaining+'</div>';
  } else {
    var maxHp = CAP_MAX;
    var ter = TER[M[y][x]];
    if(ter && ter.capHpMax) maxHp = ter.capHpMax;
    if(cap.hp < maxHp) bar = '<div style="position:absolute;top:0px;right:0px;font-size:8px;background:'+color+';color:white;padding:0 2px;border-radius:0 0 0 2px;font-weight:600;">'+cap.hp+'</div>';
  }
  // 生産中バッジ
  var prodBadge = '';
  var hasReady = false, hasOngoing = false;
  for(var i=0; i<production.length; i++){
    if(production[i].x === x && production[i].y === y){
      if(production[i].ready) hasReady = true;
      else hasOngoing = true;
    }
  }
  if(hasReady) prodBadge = '<div style="position:absolute;bottom:0;left:0;right:0;font-size:7px;background:#0F6E56;color:white;text-align:center;font-weight:600;">完成</div>';
  else if(hasOngoing) prodBadge = '<div style="position:absolute;bottom:0;left:0;right:0;font-size:7px;background:#BA7517;color:white;text-align:center;font-weight:600;">生産中</div>';
  // 収容中バッジ
  var storeBadge = '';
  if(cap.cargo && cap.cargo.length > 0){
    storeBadge = '<div style="position:absolute;bottom:5px;left:1px;font-size:7px;background:#5a4a3a;color:white;padding:0 2px;border-radius:1px;">🔧'+cap.cargo.length+'</div>';
  }
  return flag + bar + prodBadge + storeBadge;
}

// 各マスの「自軍視界内か」事前計算 (FoWマス暗色化用)
// trueの場合のみ通常表示。false なら少し暗く
function computePlayerVisibleCells(){
  var visSet = {};
  if(!fowEnabled) return null; // null = 全マス可視
  // 1) 自軍ユニットの視界
  for(var i=0; i<units.length; i++){
    var v = units[i];
    if(v.owner !== 'P' || v.hp <= 0) continue;
    var range = getEffectiveSight(v);
    for(var dy=-range; dy<=range; dy++){
      for(var dx=-range; dx<=range; dx++){
        if(Math.abs(dx)+Math.abs(dy) > range) continue;
        var nx = v.x + dx, ny = v.y + dy;
        if(!inBounds(nx, ny)) continue;
        visSet[nx+','+ny] = true;
      }
    }
  }
  // 2) 自軍所有の拠点 (TER.sight が設定されているもの) の視界
  for(var k in captures){
    var cap = captures[k];
    if(cap.owner !== 'P') continue;
    var xy = k.split(',');
    var cx = parseInt(xy[0]), cy = parseInt(xy[1]);
    var ter = TER[M[cy][cx]];
    if(!ter || !ter.sight) continue;
    var crange = ter.sight;
    for(var dy=-crange; dy<=crange; dy++){
      for(var dx=-crange; dx<=crange; dx++){
        if(Math.abs(dx)+Math.abs(dy) > crange) continue;
        var nx = cx + dx, ny = cy + dy;
        if(!inBounds(nx, ny)) continue;
        visSet[nx+','+ny] = true;
      }
    }
  }
  return visSet;
}

function render(){
  syncTrains();   // 撃破などで切れた編成をここで整える
  var board = document.getElementById('board');
  board.innerHTML = '';
  var visSet = computePlayerVisibleCells();
  var isNight = (currentPhase === 'night');
  for(var y=0; y<H; y++){
    for(var x=0; x<W; x++){
      var k = x+','+y;
      var cell = document.createElement('div');
      var terId = M[y][x];
      var ter = TER[terId];
      var bg = ter.color;
      var border = '0.5px solid transparent';
      if(setHas(attackableSet, k)){ bg = '#F5A0A0'; border = '1.5px solid #A32D2D'; }
      if(setHas(facilityAttackableSet, k)){ bg = '#FFD08A'; border = '1.5px solid #BA7517'; }
      if(setHas(bridgeValidSet, k)){ bg = '#A8D8F0'; border = '2px dashed #185FA5'; }
      if(setHas(railRepairSet, k)){ bg = '#BFE3CC'; border = '2px dashed #0F6E56'; }
      if(setHas(unloadValidSet, k)){ bg = '#A8E6C8'; border = '2px dashed #0F6E56'; }
      if(setHas(coupleValidSet, k)){ bg = '#E8D48A'; border = '2px dashed #7A5A10'; }
      if(setHas(uncoupleValidSet, k)){ bg = '#E8D48A'; border = '2px dashed #7A5A10'; }
      if(setHas(movableSet, k)){ bg = '#A8E6C8'; border = '1.5px solid #0F6E56'; }
      // 敵脅威範囲表示 (敵ユニットクリック時)。重なったら赤(脅威)優先
      if(setHas(enemyMoveSet, k)){ bg = '#B8D8F0'; border = '1.5px solid #185FA5'; }
      if(setHas(enemyThreatSet, k)){ bg = '#F5B0B0'; border = '1.5px solid #A32D2D'; }
      // 補給ルートの指定モード中: 指定できる場所を強調 (段階3)
      if(routeSetMode){
        if(isSupplyRouteFacility(x, y, 'P', routeSetMode.unit)){
          bg = '#FFE9B8'; border = '2px dashed #BA7517';
          if(routeSetMode.from && routeSetMode.from.x === x && routeSetMode.from.y === y) border = '2px solid #0F6E56';
        } else if(routeSetMode.stage === 'to'){
          // 降ろし先の選択中は、駐留地点にできるマスも薄く示す
          border = '1px dashed #BA7517';
        }
      }
      if(selected && selected.x === x && selected.y === y) border = '2px solid #BA7517';
      if(pendingUnit && pendingUnit.x === x && pendingUnit.y === y) border = '2px solid #BA7517';
      cell.style.cssText = 'width:42px;height:42px;background:'+bg+';border:'+border+';box-sizing:border-box;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;';
      (function(xx, yy){
        cell.onclick = function(){ onCellClick(xx, yy); };
        // ホバー時にダメージプレビュー(攻撃モード中のみ)
        cell.onmouseenter = function(){ onCellHover(xx, yy); };
        cell.onmouseleave = function(){ onCellLeave(); };
      })(x, y);
      if(terId === 'ROAD') cell.innerHTML += roadSVG(x, y);
      else if(TER[terId] && TER[terId].isRail) cell.innerHTML += railSVG(x, y);
      else if(TERRAIN_DECO[terId]) cell.innerHTML += TERRAIN_DECO[terId];
      // 天候オーバーレイ (地形の上、ユニットの下)
      var wkey = getWeatherAt(x, y);
      if(wkey && WEATHER_DECO[wkey]) cell.innerHTML += WEATHER_DECO[wkey];
      cell.innerHTML += captureBadge(x, y);
      var u = unitAt(x, y);
      // プレイヤー視点で見えないユニット(潜航中の敵潜水艦で探知範囲外)は表示しない
      if(u && !isUnitVisibleTo(u, 'P')) u = null;
      if(u){
        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative;z-index:1;';
        wrap.innerHTML = unitHTML(u, 34);
        cell.appendChild(wrap);
      }
      // 攻撃モード時、攻撃対象マスに予測ダメージを表示
      if(attackMode && pendingUnit && setHas(attackableSet, k) && u && u.owner !== pendingUnit.owner){
        var pred = bestAttackOn(pendingUnit, u, pendingUnit.x, pendingUnit.y, pendingJustMoved);
        if(pred){
          // 予測ダメージ後の被害シミュレーション(反撃計算用)
          var simDef = { type: u.type, hp: Math.max(0, u.hp - pred.dmg * 10), x: u.x, y: u.y };
          var counter = null;
          if(simDef.hp > 0){
            counter = bestAttackOn(simDef, pendingUnit, simDef.x, simDef.y, false);
          }
          var dmgBox = document.createElement('div');
          var counterStr = counter ? '<span style="color:#222; background:rgba(255,235,150,0.95); padding:0 2px; border-radius:2px; font-size:9px; margin-left:1px;">↩'+counter.dmg+'</span>' : '';
          dmgBox.style.cssText = 'position:absolute; top:-4px; left:-4px; z-index:10; pointer-events:none; display:flex; align-items:center;';
          dmgBox.innerHTML = '<span style="color:white; background:#A32D2D; padding:1px 4px; border-radius:3px; font-size:11px; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,0.3);">-'+pred.dmg+'</span>'+counterStr;
          cell.appendChild(dmgBox);
        }
      }
      // 視界外マスの暗化 (FoW + 夜間)
      // - 昼間: 視界外を薄霧 (rgba(40,45,55,0.42))
      // - 夜間: 視界外をより濃い夜霧 (rgba(15,20,40,0.65))
      // - 視界内 (自軍ユニットの索敵範囲) はオーバーレイなしで明るく
      var outsideVision = visSet && !visSet[k];
      if(outsideVision){
        var dim = document.createElement('div');
        var bgRgba = isNight ? 'rgba(15,20,40,0.65)' : 'rgba(40,45,55,0.42)';
        dim.style.cssText = 'position:absolute;inset:0;background:'+bgRgba+';pointer-events:none;z-index:2;';
        cell.appendChild(dim);
      } else if(isNight && !visSet){
        // FoW 無効ステージで夜間: 全マス薄く暗化 (戦場の霧無しでも夜の雰囲気)
        var night = document.createElement('div');
        night.style.cssText = 'position:absolute;inset:0;background:rgba(20,30,60,0.18);pointer-events:none;z-index:1;mix-blend-mode:multiply;';
        cell.appendChild(night);
      }
      board.appendChild(cell);
    }
  }
  renderRouteOverlay();
  renderCaptureCount();
}

// ===== 補給ルートの矢印 (段階3) =====
// ・ルート指定中: 積み元 → いまカーソルがあるマス
// ・ルートを持つ補給ユニットをクリック/選択中: 積み元 → 降ろし先 (現在位置も点で示す)
// 盤面は 42px のマス + 1px の隙間 + 1px の余白なので、マスの中心は 22 + 43*座標
var routeHoverX = null, routeHoverY = null;
function routeCellCenter(x, y){ return { cx: 22 + 43 * x, cy: 22 + 43 * y }; }

function renderRouteOverlay(){
  var board = document.getElementById('board');
  if(!board) return;
  var old = document.getElementById('route-overlay');
  if(old && old.parentNode) old.parentNode.removeChild(old);

  var lines = [];
  if(routeSetMode && routeSetMode.from && routeHoverX !== null){
    // 指定中: 積み元からカーソルまで
    lines.push({ from: routeSetMode.from, to: { x: routeHoverX, y: routeHoverY }, pending: true });
  } else {
    var seen = {};
    var cands = [];
    if(infoX !== null && infoY !== null) cands.push(unitAt(infoX, infoY));
    cands.push(selected);
    cands.push(pendingUnit);
    for(var i=0; i<cands.length; i++){
      var u = cands[i];
      if(!u || u.owner !== 'P' || !u.route || seen[u.id]) continue;
      seen[u.id] = true;
      lines.push({ from: u.route.from, to: u.route.to, unit: u, point: (u.route.toKind === 'point') });
    }
  }
  if(lines.length === 0) return;

  var w = 43 * W + 1, h = 43 * H + 1;
  var svg = '<svg id="route-overlay" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" '
    + 'style="position:absolute;left:0;top:0;pointer-events:none;z-index:5;">'
    + '<defs><marker id="route-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">'
    + '<path d="M0,0 L10,5 L0,10 z" fill="#BA7517"/></marker></defs>';
  for(var li=0; li<lines.length; li++){
    var l = lines[li];
    var a = routeCellCenter(l.from.x, l.from.y);
    var b = routeCellCenter(l.to.x, l.to.y);
    var dx = b.cx - a.cx, dy = b.cy - a.cy;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    // 端の印と重ならないよう、線を少し内側で止める
    var sx = a.cx + dx/len * 12, sy = a.cy + dy/len * 12;
    var ex = b.cx - dx/len * 15, ey = b.cy - dy/len * 15;
    var col = l.pending ? '#BA7517' : '#0F6E56';
    svg += '<line x1="'+sx+'" y1="'+sy+'" x2="'+ex+'" y2="'+ey+'" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.65"/>';
    svg += '<line x1="'+sx+'" y1="'+sy+'" x2="'+ex+'" y2="'+ey+'" stroke="'+col+'" stroke-width="3" '
      + 'stroke-dasharray="8 5" stroke-linecap="round" marker-end="url(#route-arrow)"/>';
    // 積み元 (緑の輪)
    svg += '<circle cx="'+a.cx+'" cy="'+a.cy+'" r="14" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.65"/>';
    svg += '<circle cx="'+a.cx+'" cy="'+a.cy+'" r="14" fill="none" stroke="#0F6E56" stroke-width="2.5"/>';
    // 降ろし先 (拠点=橙の輪 / 駐留地点=破線の四角)
    svg += '<circle cx="'+b.cx+'" cy="'+b.cy+'" r="14" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.65"/>';
    if(l.point){
      svg += '<rect x="'+(b.cx-13)+'" y="'+(b.cy-13)+'" width="26" height="26" fill="none" stroke="#BA7517" stroke-width="2.5" stroke-dasharray="5 4"/>';
    } else {
      svg += '<circle cx="'+b.cx+'" cy="'+b.cy+'" r="14" fill="none" stroke="#BA7517" stroke-width="2.5"/>';
    }
    // いまの位置
    if(l.unit){
      var c = routeCellCenter(l.unit.x, l.unit.y);
      svg += '<circle cx="'+c.cx+'" cy="'+c.cy+'" r="5" fill="#BA7517" stroke="#ffffff" stroke-width="2"/>';
    }
  }
  svg += '</svg>';
  var wrap = document.createElement('div');
  wrap.innerHTML = svg;
  board.appendChild(wrap.firstChild);
}

function onCellHover(x, y){
  // ルート指定中は、積み元からカーソルまでの線を追従させる
  if(routeSetMode && routeSetMode.from){
    routeHoverX = x; routeHoverY = y;
    renderRouteOverlay();
  }
  if(!attackMode || !pendingUnit) return;
  var k = x+','+y;
  if(!setHas(attackableSet, k)) return;
  var u = unitAt(x, y);
  if(!u || u.owner === pendingUnit.owner) return;
  var pred = bestAttackOn(pendingUnit, u, pendingUnit.x, pendingUnit.y, pendingJustMoved);
  if(!pred) return;
  // 反撃シミュレーション
  var simDef = { type: u.type, hp: Math.max(0, u.hp - pred.dmg * 10), x: u.x, y: u.y };
  var counter = null;
  if(simDef.hp > 0){
    counter = bestAttackOn(simDef, pendingUnit, simDef.x, simDef.y, false);
  }
  var msg = TYPE[pendingUnit.type].name + '[' + pred.weapon.name + '] → ' + TYPE[u.type].name + ' に ' + pred.dmg + 'ダメージ';
  if(counter){
    msg += ' / 反撃[' + counter.weapon.name + '] ' + counter.dmg + 'ダメージ';
  } else if(simDef.hp <= 0){
    msg += ' (撃破)';
  } else {
    msg += ' (反撃なし)';
  }
  setStatus(msg);
}
function onCellLeave(){
  if(!attackMode || !pendingUnit) return;
  setStatus('攻撃対象を赤マスから選んでください');
}

function renderCaptureCount(){
  var capList = [];
  for(var k in captures) capList.push(captures[k]);
  var total = capList.length;
  var cc = document.getElementById('cap-counter');
  if(total === 0){ cc.textContent = ''; }
  else {
  // 拠点カウント (各陣営別)
  var capCount = {};
  for(var fi=0; fi<activeFactions.length; fi++) capCount[activeFactions[fi]] = 0;
  capCount['N'] = 0;
  var totalCaps = 0;
  for(var k in captures){
    totalCaps++;
    var ow = captures[k].owner;
    if(capCount[ow] !== undefined) capCount[ow]++;
    else capCount['N']++;
  }
  if(totalCaps > 0){
    var capParts = [];
    for(var fi=0; fi<activeFactions.length; fi++){
      var f = activeFactions[fi];
      var col = FACTION_COLORS[f] || '#888';
      var dim = eliminatedFactions[f] ? 'opacity:0.4;text-decoration:line-through;' : '';
      capParts.push('<b style="color:'+col+';'+dim+'">'+capCount[f]+'</b>');
    }
    if(capCount['N'] > 0) capParts.push('中立 '+capCount['N']);
    cc.innerHTML = '拠点 ' + capParts.join(' / ') + ' (全'+totalCaps+')';
  }
  // 資金表示
  var fc = document.getElementById('funds-counter');
  if(fc){
    var phaseStr = '';
    if(dayNightCycle){
      var icon = currentPhase === 'night' ? '🌙' : '☀';
      var bg = currentPhase === 'night' ? '#1f2a4a' : '#e8c870';
      var col = currentPhase === 'night' ? '#fff' : '#222';
      var rem = (dayLength * activeFactions.length) - phaseTurn;
      phaseStr = ' <span style="margin-left:8px;background:'+bg+';color:'+col+';padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;">'+icon+' '+(currentPhase==='night'?'夜':'昼')+' 残'+rem+'</span>';
    }
    var fundsParts = [];
    for(var fi=0; fi<activeFactions.length; fi++){
      var f = activeFactions[fi];
      var col = FACTION_COLORS[f] || '#888';
      var dim = eliminatedFactions[f] ? 'opacity:0.4;text-decoration:line-through;' : '';
      fundsParts.push('<b style="color:'+col+';'+dim+'">'+(funds[f]||0).toLocaleString()+'</b>');
    }
    fc.innerHTML = '💰 ' + fundsParts.join(' / ') + phaseStr;
  }
  // 風インジケータ (wind モード時のみ表示)
  updateWindIndicator();
  }
}

function updateStageButtons(){
  var wrap = document.getElementById('stage-buttons');
  wrap.innerHTML = '';
  for(var key in STAGES){
    (function(k){
      var s = STAGES[k];
      var btn = document.createElement('button');
      btn.textContent = s.name;
      if(currentStage === k){ btn.style.background = '#E6F1FB'; btn.style.borderColor = '#185FA5'; }
      // FoW/昼夜サイクル付きステージは目立たせる
      if(s.fow || s.dayNightCycle){
        btn.style.background = currentStage === k ? '#FFE08A' : '#FFF1C2';
        btn.style.borderColor = '#BA7517';
        btn.style.fontWeight = '600';
        btn.textContent = '🌙 ' + s.name;
      }
      btn.onclick = function(){ loadStage(k); };
      wrap.appendChild(btn);
    })(key);
  }
}

function getStatusColor(unitKey, field, weaponIdx, atkKey){
  var t = TYPE[unitKey];
  var sm = STATUS_MAP[unitKey];
  // sight は全ユニット確定値 (CONF)
  if(field === 'sight') return STATUS_COLOR.CONF;
  // STATUS_MAPに個別定義があればそれを優先
  if(sm){
    if(field === 'armor' || field === 'move'){
      return STATUS_COLOR[sm[field] || 'CONF'];
    }
    if(field === 'atk' && sm.weapons && sm.weapons[weaponIdx]){
      var status = sm.weapons[weaponIdx].atk[atkKey] || 'CONF';
      return STATUS_COLOR[status];
    }
    return STATUS_COLOR.CONF;
  }
  // 個別定義がなくplannedならPLAN色
  if(t && t.planned) return STATUS_COLOR.PLAN;
  return STATUS_COLOR.CONF;
}
